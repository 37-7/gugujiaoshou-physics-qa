地(0.01秒)留在了木块中，随后两者一起在地面上滑动了一段距离后停下。\n问题： 求子弹刚和木块达到共同速度 v 时的速度大小。\n在这个例子里，子弹要在零点几秒的时间内减速，内力将会非常巨大，大概有几千几万牛。而摩擦力只有几十牛甚至几牛。\n算出摩擦力的冲量，我们就设摩擦力为10N，那么算出来冲量<span class=\"math\">\\(I=0.01\\,\\text{s}\\times10\\,\\text{N}=0.1\\,\\text{N}\\!\\cdot\\!\\text{s}\\)<\/span>。\n而子弹本身的冲量可能有几百Ns了!显然，这个“极小的”外力造成的冲量由于和系统物体的动量不在同一个数量级，因此可以忽略。(如果不忽略的话，算出来的<span class=\"math\">\\(v\\)<\/span>就要写到小数点后几位了，这可太麻烦了)\n另外，朋友你的直觉没错，人船模型仅在<span class=\"math\">\\(x\\)<\/span>方向动量守恒，<span class=\"math\">\\(y\\)<\/span>方向是不守恒的。[俊达萌表情包_诶]", "id": "ep2:292928892417:r0"}, {"uname": "稻萝卜", "face": "_imgs/face_8297eaac510f.jpg", "like": 0, "message": "<span class=\"mention\">回复 @稻萝卜<\/span>  不知道你的书上具体是怎么说的，最好贴个图片给大家看看", "id": "ep2:292928892417:r1"}]}, {"id": "ep2:294771591328", "module": "vibration", "auto": false, "uname": "yz暗痕", "face": "_imgs/face_e34cbcbdc249.jpg", "like": 8, "message": "偶然发现的，欢迎参观，讨论🐶🐶🐶", "raw_message": "偶然发现的，欢迎参观，讨论[doge][doge][doge]", "images": ["_imgs/img_038d7ede9b34.jpg", "_imgs/img_5f00d85e2a82.jpg"], "replies": [{"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 3, "message": "<span class=\"mention\">回复 @yz暗痕<\/span>  其实我没看懂😭竖直面内只受重力的圆周运动是匀速圆周运动吗？如果不是，哪来的周期？[捂眼]", "id": "ep2:294771591328:r0"}, {"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 3, "message": "<span class=\"mention\">回复 @yz暗痕<\/span> 其实但摆的那个公式是小角度的近似，公式里还有个f(角度)，只不过在小角度上趋近于1了🐶，为什么会有这个差异呢？是因为两个情型并不完全相同，一个向心力是重力，一个是绳子的拉力，不过是因为是被动去适应重力的，所以很相似，但不同。但具体为什么是小角度一样我要再想想🐶", "id": "ep2:294771591328:r1"}, {"uname": "哔哩比比比比例", "face": "_imgs/face_12ba96334a9f.jpg", "like": 3, "message": "第一条式子也可以理解为贴地飞行质点的方程。\n第二条来源于单摆势能取二阶近似，如果你不管小角度条件的限制硬是要把它的位移取到整个半径那它做的就是完整圆周了🐶", "id": "ep2:294771591328:r2"}, {"uname": "青苺ちゃん", "face": "_imgs/face_05ad586d3400.jpg", "like": 3, "message": "实际上，我个人觉得没有那么复杂；本质原因是因为向心力力大小为mg，半径为<span class=\"math\">\\(L\\)<\/span>的圆周运动，在某个方向的投影就是<span class=\"math\">\\(k=\\frac{mg}{L}\\)<\/span>的简谐运动，而单摆由于角度小，可以等效为<span class=\"math\">\\(k=\\frac{mg}{L}\\)<\/span>的简谐运动；所以二者周期相等", "id": "ep2:294771591328:r3"}, {"uname": "青苺ちゃん", "face": "_imgs/face_05ad586d3400.jpg", "like": 2, "message": "<span class=\"mention\">回复 @青苺ちゃん<\/span>  此处的某个方向指运动平面内任意确定方向", "id": "ep2:294771591328:r4"}, {"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 1, "message": "<span class=\"mention\">回复 @青苺ちゃん<\/span> 是的，主要就是小角度单摆可以等价为简谐运动，但我一直觉得这逻辑链条有点长😂", "id": "ep2:294771591328:r5"}, {"uname": "一小只狼o", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "感觉物理这门充满奥妙的世界里藏着诸多神奇的地方，这里是大自然在行驶它运行的法则——最小作用量原理吧😏", "id": "ep2:294771591328:r6"}, {"uname": "一小只狼o", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "欢迎指出错误与不足😏😏😏：\n其实①式的公式还可以等效为这样一个情况(即公式一致的情况)，即向心力为mg的圆锥摆🐶那么就有最小作用量原理(哈密顿原理)通过拉格朗日量的变分推导，揭示了单摆与圆锥摆在小角度近似下周期公式形式一致的深层物理根源：二者在该近似下均退化为线性简谐振子，其运动方程具有相同的数学结构。\n单摆系统‌是一维角坐标<span class=\"math\">\\( \\theta \\)<\/span>，而圆锥摆系统‌是二维角坐标<span class=\"math\">\\( \\theta \\)<\/span>，两者在小角度近似下会统一形式(公式)(根本原因：等效线性恢复力)因其等效恢复力矩与转动惯量，运动方程一致，所以二者在小角度下具有相同的拉格朗日量线性化形式‌🐶尽管圆锥摆的物理约束更强(水平圆周运动)，但在小角度近似下，其角位移的恢复机制与单摆完全等价，均源于重力分量对角位移的线性恢复作用。\n单摆与圆锥摆的周期公式形式一致，‌并非因为它们是同一类运动‌，而是因为🤙：\n\n1，二者在‌小角度近似‌下，其拉格朗日量的二次项结构完全相同；\n2，最小作用量原理通过变分导出的欧拉-拉格朗日方程，‌在该近似下退化为相同的线性简谐振子方程‌；\n3，周期公式的一致性是‌数学近似的结果‌，而非物理本质的同一。\n这一现象体现了最小作用量原理的强大统一性：不同约束下的系统，只要在近似下具有相同的动能-势能结构，其动力学行为即趋于一致。😏\n \n\n   \n", "id": "ep2:294771591328:r7"}, {"uname": "许游乀", "face": "_imgs/face_1f4dad53df3a.jpg", "like": 1, "message": "精彩🐶", "id": "ep2:294771591328:r8"}, {"uname": "王之ikun", "face": "_imgs/face_53079b2a589e.jpg", "like": 1, "message": "可以可以，有水平", "id": "ep2:294771591328:r9"}, {"uname": "一小只狼o", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @yz暗痕<\/span> 加油[给心心]", "id": "ep2:294771591328:r10"}]}, {"id": "ep2:292959337921", "module": "vibration", "auto": false, "uname": "宁萌君呀", "face": "_imgs/face_586ed8e5f075.jpg", "like": 0, "message": "'因为胡克定律，可以验证是线性系统 而叠加原理是线性系统独有的' https://www.bilibili.com/video/BV1Rr5xznETB?t=3.3这里我查了下线性系统是什么，是要满足两个法则：比例性和叠加性，但是我要证这个运动可以叠加不是循环论证了吗，这样怎么证明两个简谐运动可以叠加[保卫萝卜_问号]求赐教", "raw_message": "‘因为胡克定律，可以验证是线性系统 而叠加原理是线性系统独有的’ https://www.bilibili.com/video/BV1Rr5xznETB?t=3.3这里我查了下线性系统是什么，是要满足两个法则：比例性和叠加性，但是我要证这个运动可以叠加不是循环论证了吗，这样怎么证明两个简谐运动可以叠加[保卫萝卜_问号]求赐教", "images": [], "replies": []}, {"id": "ep2:295028531264", "module": "esfield", "auto": false, "uname": "雷神行什", "face": "_imgs/face_1eb69a0a7dce.jpg", "like": 3, "message": "关于我对平行板电容器匀强电场(理想状况不考虑边缘效应)的一些看法:\n1.匀强电场的证明:①以垂直板为轴旋转，电场不变可知电场在平行板方向没有分量，即电场方向垂直于板面\n②(我的奇妙小思考😏😏)那在垂直于板面方向电场强度一样吗？如果电场线的规定是合理的，那垂直于板面的平行电场线是无法通过疏密程度表示沿电场线的强度变化的，根据①可知，该电场为匀强电场😄😄😄😄\n2.我们在学习过程中总是会用“就这样规定的”来搪塞、避讳我们的疑问，但是科学家规定也是合理的，并不是凭空产生的，这也许只是为了方便研究而简单规定的，总之，存在即合理\nPS:本人只是高三生，也许推理不是特别严谨，但还是有点有趣的😭😭", "raw_message": "关于我对平行板电容器匀强电场（理想状况不考虑边缘效应）的一些看法:\n1.匀强电场的证明:①以垂直板为轴旋转，电场不变可知电场在平行板方向没有分量，即电场方向垂直于板面\n②（我的奇妙小思考[滑稽][滑稽]）那在垂直于板面方向电场强度一样吗？如果电场线的规定是合理的，那垂直于板面的平行电场线是无法通过疏密程度表示沿电场线的强度变化的，根据①可知，该电场为匀强电场😄😄😄😄\n2.我们在学习过程中总是会用“就这样规定的”来搪塞、避讳我们的疑问，但是科学家规定也是合理的，并不是凭空产生的，这也许只是为了方便研究而简单规定的，总之，存在即合理\nPS:本人只是高三生，也许推理不是特别严谨，但还是有点有趣的[喜极而泣][喜极而泣]", "images": [], "replies": [{"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 0, "message": "事实上很多规定确实是为了方便去规定的，但我认为电场线可不是🐶相反的，我认为他无比精妙的描述了电场的性质，我们将电通量看作不可压缩的流体，你可以类比水管里的水🐶，场强就是单位面积内流过水的数量，如果电场线平行，则以为每份水的轨迹是平行的，单位面积内的水流量是不变的，场强自然不变，如果是用电场线看，电场线平行就意味着单位面积通过的电场线是一样的，即电场线平行意味<span class=\"math\">\\(u\\)<\/span>着场强相等🐶，这样设定也很好描述了性质。这只是个人的拙见，可能有误", "id": "ep2:295028531264:r0"}, {"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 0, "message": "<span class=\"mention\">回复 @雷神行什<\/span> 没回复我身上我无法第一时间看到，可是我那种理解就是匀强和平行是一体的，请问是感觉哪里不本质呢?", "id": "ep2:295028531264:r1"}]}, {"id": "ep2:294849532480", "module": "em", "auto": false, "uname": "佚之森", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 6, "message": "这种计算有关磁通量的时候 面积为什么不是整个大圈的面积作为有效面积 而是小圈加大圈的面积呢？", "raw_message": "这种计算有关磁通量的时候 面积为什么不是整个大圈的面积作为有效面积 而是小圈加大圈的面积呢？", "images": ["_imgs/img_4c0a77d8456b.jpg"], "replies": [{"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @佚之森<\/span> 相当于很多电池串联起来🐶", "id": "ep2:294849532480:r0"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @佚之森<\/span> 不过这样就没法解释你图中的现象了", "id": "ep2:294849532480:r1"}, {"uname": "空下去", "face": "_imgs/face_4537839cb640.jpg", "like": 0, "message": "你指的是磁通量吗？你说的应该是磁通量变化而引起的感应电动势吧，单纯看磁通量这就是单纯的算整个大圆的面积呀🤔", "id": "ep2:294849532480:r2"}, {"uname": "空下去", "face": "_imgs/face_4537839cb640.jpg", "like": 0, "message": "<span class=\"mention\">回复 @佚之森<\/span> 可以发过来看看嘛🤔", "id": "ep2:294849532480:r3"}, {"uname": "aaabcbd", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "你可以类比<span class=\"math\">\\(n\\)<\/span>匝线圈理解，相当于一大匝加四小匝，每一匝都会因磁通量变化而产生电动势", "id": "ep2:294849532480:r4"}, {"uname": "aaabcbd", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"math\">\\(n\\)<\/span>匝线圈也是由一条金属丝绕成的呀，它们也是连在一起的，这道题目只是把线圈错位或收紧了。还是我没理解你的意思?", "id": "ep2:294849532480:r5"}, {"uname": "aaabcbd", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @佚之森<\/span> 不知道你见没见过一种盘状升压器，就是一层层嵌套的同心圆，本质是把摞起来的变压线圈拓扑平了", "id": "ep2:294849532480:r6"}, {"uname": "aaabcbd", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @佚之森<\/span> 确实可以简单地通过电池串联理解，如果<span class=\"math\">\\(n\\)<\/span>匝叠在一起不好理解的话，也可以将线圈摊平成一个一个串联在一起的单匝线圈，每个线圈内的磁通量变化情况与原来相同，每个线圈都产生相同的电动势，叠加起来就是nU，这与原情景是等价的", "id": "ep2:294849532480:r7"}, {"uname": "aaabcbd", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @佚之森<\/span> 这个说法有点奇怪，产生电动势的根源应该是磁通量的变化，电动势描述的是磁通量变化的快慢，而电流是电动势的果，就像先有水压才可能有水流一样", "id": "ep2:294849532480:r8"}]}, {"id": "ep2:294763579888", "module": "em", "auto": false, "uname": "狼行者悉达多", "face": "_imgs/face_53aeb71a2654.jpg", "like": 4, "message": "题源刚刚结束的高三期初考试，我仍然存在的问题已清晰的写在第三页。😊感谢大家的解答", "raw_message": "题源刚刚结束的高三期初考试，我仍然存在的问题已清晰的写在第三页。😊感谢大家的解答", "images": ["_imgs/img_bcf97b122476.jpg", "_imgs/img_a9aade3416f6.jpg", "_imgs/img_f066599c1266.jpg"], "replies": [{"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 1, "message": "那我讲一下我的理解🐶，你的直觉是挺敏锐的，问题一，为什么一个B对应着两个值?是因为式子本质上库仑力和磁场力在<span class=\"math\">\\(x\\)<\/span>轴上的较量，而磁场力是初值为零的线性增长，而库仑力则是有一个初值的越来越快的爆炸增长(刚开始增长比磁场慢)，而整理出来的式子是开口朝上的抛物线，解出来两个vx等于零的点，第一个零点粒子已经返回了，第二个零点是如果粒子能到那个地方，库仑力就再次强于磁场力，再拉过去(事实上不会发生)而最小的B则是让这两点为一个点，只于<span class=\"math\">\\(x\\)<\/span>轴有一个交点。第二个问题，只给出了一个判定方法，但粒子到那里的物理量一无所知，显然信息量是不够的，所以需要用能量守恒去推演那些物理量🐶", "id": "ep2:294763579888:r0"}, {"uname": "MySiddhartha", "face": "_imgs/face_48077d89217a.jpg", "like": 0, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span> 感谢🐶！第二个问题，我能再详细问一下，您是怎么看出信息量不够的？就是因为在我定量的列出这两个力关于<span class=\"math\">\\(x\\)<\/span>的表达式之前，我是不知道在这个我的临界判定之前的物理情形是什么样的吗？", "id": "ep2:294763579888:r1"}]}, {"id": "ep2:292446148017", "module": "em", "auto": false, "uname": "新水老祖", "face": "_imgs/face_8b80e8d38ad0.jpg", "like": 4, "message": "咕咕叫兽您好，在学电磁感应时候讲过一个单杆加电容器的模型，导轨上的单杆初速度为零，受到一个恒力，而运用数学推导就会发现杆作匀速直线运动，要知道安培力本身会变化，而且电容器的电压也并非线性变化，为什么最后单杆的运动会是有规律的匀变速直线运动呢？这是某种巧合吗？如何用一句话把道理讲清楚呢？", "raw_message": "咕咕叫兽您好，在学电磁感应时候讲过一个单杆加电容器的模型，导轨上的单杆初速度为零，受到一个恒力，而运用数学推导就会发现杆作匀速直线运动，要知道安培力本身会变化，而且电容器的电压也并非线性变化，为什么最后单杆的运动会是有规律的匀变速直线运动呢？这是某种巧合吗？如何用一句话把道理讲清楚呢？", "images": ["_imgs/img_bfe059891e22.jpg"], "replies": [{"uname": "aaabcbd", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "这个模型应该是默认单棒和电容间的电阻是一个定值吧。我认为<span class=\"math\">\\(t\\)<\/span>趋于正无穷时，<span class=\"math\">\\(U_c=BLv\\)<\/span>能成立就是因为单棒在匀加速运动，如果单棒速度变化得越来越快，那么其产生电动势与电容电压之差就会越来越大，回路电流变大，产生一个回复力使速度变化变慢，反之，如果速度变化得越来越慢，那么最终导致一个前推力，使速度变化变快，那么当速度变化速率是一个定值时，系统达到平衡，也就是匀加速运动。一句话说就是只有电势差恒定时系统才是平衡的", "id": "ep2:292446148017:r0"}]}, {"id": "ep2:294761980704", "module": "math", "auto": false, "uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 4, "message": "这是一道题里很小的一步，呱呱(希望没认错🐶)在一期视频中讲过(https://b23.tv/BV1ghKMejEAh )但是我有一些另外的思考。\n\n题目在图一，说有一个粒子，从一个等腰直角三角形的一条直角边上的中点垂直射出，轨迹刚好与斜边相切，求轨迹半径。\n\n虽然这个问题偏数学，但是呱呱沿用了假设调整的思想(见视频7:40)，自然地列出了方程。但是看完视频，我自己想的时候，发现：\n\n①在问自己“如果圆很小，为什么不能与斜边相切”的时候，我不能自然地感觉到“圆在伸手，够不到”，我只会说“因为半径太小”(貌似是一句废话😭)；\n\n②在思考“圆是怎么伸手”的时候，想不到“圆心先退后再伸手”(意思见图二)，我只会说“从圆心出发，垂直于斜边伸手”\n……(可能还有别的不自然，暂且不提)\n\n它们导致我不能自然地列出方程。\n\n我认为假设调整里，“感觉”是很关键的。所以我卡住了，是因为我的感觉不够敏锐吗？在学习力学的时候，碰到的都是能运用对日常生活的感觉感受出来的物理情形，比如把一个斜面撤掉，上面的小球会掉下来，这是我能感觉出来的；但是对于上面的几何问题，我就不能很自然地感觉出来，并且一些控制关系比较复杂的题目(比如一些电磁感应大题)，我也感觉不出来。\n\n因此我产生了一些困惑：所有的问题都是容易被感觉出来的吗？感觉不出来的时候怎么办？我怎么训练“感觉”呢？在把握确定性，即“找到一个东西是怎么决定另一个东西”的时候，除了感觉，还有哪些关键的要素？若有悟道者为我指点一二，我将感激不尽[爱心]\n\n(对于我来说，更自然的做法可能是像图三这样，把“圆与斜边相切”翻译成圆心到斜边的距离等于半径，而这个距离的大小由圆心的位置决定，所以我设圆的半径来控制圆心的位置，从而可以用半径表示圆心到斜边距离的大小，再让它等于半径，从而列出方程。)", "raw_message": "这是一道题里很小的一步，呱呱（希望没认错[doge]）在一期视频中讲过（https://b23.tv/BV1ghKMejEAh ）但是我有一些另外的思考。\n\n题目在图一，说有一个粒子，从一个等腰直角三角形的一条直角边上的中点垂直射出，轨迹刚好与斜边相切，求轨迹半径。\n\n虽然这个问题偏数学，但是呱呱沿用了假设调整的思想（见视频7:40），自然地列出了方程。但是看完视频，我自己想的时候，发现：\n\n①在问自己“如果圆很小，为什么不能与斜边相切”的时候，我不能自然地感觉到“圆在伸手，够不到”，我只会说“因为半径太小”（貌似是一句废话[大哭]）；\n\n②在思考“圆是怎么伸手”的时候，想不到“圆心先退后再伸手”（意思见图二），我只会说“从圆心出发，垂直于斜边伸手”\n……（可能还有别的不自然，暂且不提）\n\n它们导致我不能自然地列出方程。\n\n我认为假设调整里，“感觉”是很关键的。所以我卡住了，是因为我的感觉不够敏锐吗？在学习力学的时候，碰到的都是能运用对日常生活的感觉感受出来的物理情形，比如把一个斜面撤掉，上面的小球会掉下来，这是我能感觉出来的；但是对于上面的几何问题，我就不能很自然地感觉出来，并且一些控制关系比较复杂的题目（比如一些电磁感应大题），我也感觉不出来。\n\n因此我产生了一些困惑：所有的问题都是容易被感觉出来的吗？感觉不出来的时候怎么办？我怎么训练“感觉”呢？在把握确定性，即“找到一个东西是怎么决定另一个东西”的时候，除了感觉，还有哪些关键的要素？若有悟道者为我指点一二，我将感激不尽[爱心]\n\n（对于我来说，更自然的做法可能是像图三这样，把“圆与斜边相切”翻译成圆心到斜边的距离等于半径，而这个距离的大小由圆心的位置决定，所以我设圆的半径来控制圆心的位置，从而可以用半径表示圆心到斜边距离的大小，再让它等于半径，从而列出方程。）", "images": ["_imgs/img_f9d066fbb37f.jpg", "_imgs/img_1833c8f3bf07.jpg", "_imgs/img_abf0978e1e1c.jpg"], "replies": [{"uname": "yz暗痕", "face": "_imgs/face_e34cbcbdc249.jpg", "like": 2, "message": "感觉这个东西可能需要一些信息比特的加持，就是当你接触的东西比较多的时候(这里类似于圆变化的各种情形)那么你就有机会自然地(注意是自然地)往那个你想的(在题目要求下)那个方向前行🙌", "id": "ep2:294761980704:r0"}, {"uname": "yz暗痕", "face": "_imgs/face_e34cbcbdc249.jpg", "like": 1, "message": "<span class=\"mention\">回复 @yz暗痕<\/span> 解释“感觉”", "id": "ep2:294761980704:r1"}, {"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 1, "message": "其实我认为这两种相关性很大，物理说到底不就是自然吗🐶自然的思路来源于对自然的思考，解题思路和关键步骤很吃平时的积累，还得是有效的积累，把那些内化成自然的常识🐶", "id": "ep2:294761980704:r2"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 1, "message": "这就说明你没有在对不同情形做公平的比较。我画出来一堆圆，有大有小，有人切得到有人切不到。我现在要做的是，比较成功者和失败者，看看中间什么东西发生了变化，由此定位问题的根源。然而当你把这种差异片面的描述成“从圆心出发往斜边伸手”，你就没有抓住大家圆心不是同一个圆心的问题，你漏掉了这部分的差异。相比之下，正确的说法就抓住了大家的共同起点，也就是圆与直角边的交点是一样的这件事。这叫在不同情形之间做了公平的比较。\n\n上面只是说为什么对的说法更对，你的说法有漏洞。但真正重要的是想清楚，你为什么会漏一半的事情？我猜是因为你没有真正去画圆，只是画了圆弧。我们知道如果认真地画圆，肯定有第一步操作，是找到圆心的位置。其实你再体会一下说出那句正确的、完整的那句话的感觉，是不是只是在描述两步作图过程？所以这是不难的想到的。但是我知道很多同学都没有好好画圆的习惯，因为我注意看过很多学生和老师做题画示意图的动作，往往是盯着纸，脑补了一道弧线就往图上招呼。这就是为什么你只注意到“伸手够”，却没有注意到圆心要先往后退，再从圆心伸手够，因为你的作图过程没有真的去花心思找过那个圆心。如果你找的话，你一边作图就会有这样的疑问了：诶，我半径变大到底有没有希望啊？你看我圆心越退越远了，那不是跟难切到斜边了吗？然后画完圆弧你发现，诶居然是可以的。那你再反思一下怎么回事呢？不是刚刚说圆心跑远了吗？那你就意识到，因为我的半径也越来越长了，半径增加地比圆心后退地快。你看，这是不是就是跟我视频里讲道理一模一样的说法？所以我们说说人话、动态图像，其实这完全是在描写探索过程中自然出现的心里活动。你列下的方程，无非是在描述我刚才内心的起伏，我是怎么摸索的，摸索过程中出现了什么困惑，最终我是怎么样化解心中的困惑的。", "id": "ep2:294761980704:r3"}, {"uname": "yz暗痕", "face": "_imgs/face_e34cbcbdc249.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 练的确是一个提升的不错形式，但我觉得更重要且本质的是——充分想象各种运动变化的情形🤙🙌", "id": "ep2:294761980704:r4"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 0, "message": "我去看了一遍这期视频，讲的应该是以退为进。假设圆心不动的话，那么只需要把这只手给它拉长一下就可以了。但是实际情况是圆心在运动。这样的运动产生的结果就是，它远离了那条斜边。这就意味着，在原来拉长的基础上，我还得要补上那部分因为远离而导致的额外长度。", "id": "ep2:294761980704:r5"}, {"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 0, "message": "我倒是觉得这个只要顺着这个内核去多想几个问题会好很多，先试错，尽情想象情形，可以看看一些极限和特殊例子，然后修正，如果不满足条件，为什么？怎么样调整满足条件？如果满足，又是怎么样满足的?和不满足的区别在哪?想探究两种的关系，其一在于控制变量，要保持其他条件不变，咕咕的的先后退再伸手和你的区别不只是情形更自然，我认为最关键的是先后退包含了在水平边上半径变化的效果，而你的话则忽略了这点🐶而且咕咕的话更模糊，在转化的过程中更促进思考，我认为是比学术用语好不少的🐶", "id": "ep2:294761980704:r6"}]}], "mod_stats": {"mech": {"q": 3, "r": 12, "img": 2}, "energy": {"q": 5, "r": 50, "img": 2}, "momentum": {"q": 1, "r": 2, "img": 0}, "vibration": {"q": 2, "r": 11, "img": 2}, "esfield": {"q": 1, "r": 2, "img": 0}, "em": {"q": 3, "r": 12, "img": 5}, "math": {"q": 1, "r": 7, "img": 3}}, "removed": [["不要伤害我鹅子", "这是上期的一道题，但我想讨论的不是这道题本身，而是由这道题产生的思考：\n", "归档时已排除"]], "ghost_merged": 42, "total_q": 16, "total_r": 96, "total_img": 14, "auto_cnt": 0}, {"key": "ep3", "title": "第3期", "episodeId": "ep1773472304999", "export": "2026-08-25", "comments": [{"id": "ep3:293047102129", "module": "mech", "auto": false, "uname": "钢琴快快跑", "face": "_imgs/face_d8f106d89115.jpg", "like": 3, "message": "各位同志们好，我是钢钢\n本周题目旨在研究A与B的速度或位移关系，欢迎大家分享不同的想法\n(提示：可以从动滑轮或做功或速度分解的元问题视角进行考虑)", "raw_message": "各位同志们好，我是钢钢\n本周题目旨在研究A与B的速度或位移关系，欢迎大家分享不同的想法\n（提示：可以从动滑轮或做功或速度分解的元问题视角进行考虑）", "images": ["_imgs/img_1042a4b84565.jpg"], "replies": [{"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 0, "message": "<span class=\"math\">\\(v_b=2v_a\\sin\\theta\\)<\/span>", "id": "ep3:293047102129:r0"}]}, {"id": "ep3:293027198017", "module": "mech", "auto": false, "uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 2, "message": "下面是我对于物理系咕咕叫兽在【【高中物理·运动学】难题巧解：难，难得好！妙，妙在哪？-哔哩哔哩】 https://b23.tv/0Ui40QP这期视频里提的\"为什么这些难题，用用平均速度好像就足够了？(充分性)\"问题的想法(请多指教, 乐意交流)\n\t我认为难题指的是值得深入思考能挖掘出新的东西的问题, 而不一定是做出来这道题花了你多少的时间\n\t对于呱呱在视频里提的第二个问题, 我目前的想法是: \n\t(我刚才只看了这一期视频, 平均速度习题系列这些问题就是咕咕呱呱给我们展开的平均速度在什么样的场景下会有用的画集)\n\t这一个问题问的应该是: 平均速度在什么样的场景下会\"特别\"的有用\n\t\t在匀加速直线运动中, 由于加速度是一定的, 由各路段速度差的比值可以得出所用时间的比值(而仅靠距离之比是无法得出所用时间的比值的, 因为距离和时间是无关的, 更严谨的原因是在匀加速直线运动中距离与时间之间由平均速度或速度和加速度而不能仅由加速度联系)\n\t\t由平均速度的比值和所用时间的比值可以知道距离的比值<span class=\"math\">\\((\\Delta x=\\bar{v}\\Delta t)\n\t\t\\)<\/span>当然, 还可以由平均速度的比值和所用时间的比值设共用参量表示出贯穿整个运动的<span class=\"math\">\\(a, \\)<\/span>再由加速度算出其他时段的速度, 平均速度  (结合量纲分析)\"https://www.bilibili.com/opus/1178812830229463044", "raw_message": "下面是我对于物理系咕咕叫兽在【【高中物理·运动学】难题巧解：难，难得好！妙，妙在哪？-哔哩哔哩】 https://b23.tv/0Ui40QP这期视频里提的\"为什么这些难题，用用平均速度好像就足够了？（充分性）\"问题的想法(请多指教, 乐意交流)\n\t我认为难题指的是值得深入思考能挖掘出新的东西的问题, 而不一定是做出来这道题花了你多少的时间\n\t对于呱呱在视频里提的第二个问题, 我目前的想法是: \n\t(我刚才只看了这一期视频, 平均速度习题系列这些问题就是咕咕呱呱给我们展开的平均速度在什么样的场景下会有用的画集)\n\t这一个问题问的应该是: 平均速度在什么样的场景下会\"特别\"的有用\n\t\t在匀加速直线运动中, 由于加速度是一定的, 由各路段速度差的比值可以得出所用时间的比值(而仅靠距离之比是无法得出所用时间的比值的, 因为距离和时间是无关的, 更严谨的原因是在匀加速直线运动中距离与时间之间由平均速度或速度和加速度而不能仅由加速度联系)\n\t\t由平均速度的比值和所用时间的比值可以知道距离的比值($\\Delta x=\\bar{v}\\Delta t$)\n\t\t当然, 还可以由平均速度的比值和所用时间的比值设共用参量表示出贯穿整个运动的$a$, 再由加速度算出其他时段的速度, 平均速度  (结合量纲分析)\"https://www.bilibili.com/opus/1178812830229463044", "images": ["_imgs/img_1a4568826781.jpg"], "replies": []}, {"id": "ep3:292998544177", "module": "mech", "auto": false, "uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 0, "message": "分享一个在海边的思考：我和大海都是在地面上，为什么大海在永不停息地运动，而我却可以凭借自己的意志运动？对于现代的人来说，地球在自传，在公转几乎是一个常识。但千年前的人们，又该如何理解这件事呢？他们是否会认为大海也有自己的意志呢？\n\n假设现在我没有这些物理学常识，那我该如何探索这件事呢？我想了一个方法：模拟大海的情形，由于大海太大了，所以我们缩小一点，拿一个水盆在装点水进行模拟(感觉这个模型实在是太简化了，不知道会不会失真，也许可以加一点石子，再涂点什么让水盆底部变得凹凸不平)。怎么做才能模拟出大海运动的情形呢？拿风扇吹一吹？把水盆进行晃动？发现当晃动水盆时，会出现类似的情形，那么是否可以据此得出结论：承托大海的地面在运动？但这又无法解释另一件事：我也站在地面上，为什么我感受不到地面在运动呢？于是为了统一这两件事，我们需要寻找新的解释。其实我感觉我所给出的上面那个模拟的情形有点马后炮的味道，因为我知道地球在运动，所以我会刻意去往这个方向去想，但千年前的人们未必知道这件事。\n\n自然对我们来说就是一个巨大的黑箱，我们无法打开箱子，所以只能去测量一些箱子所表现出来的性质，来推测箱子内部的结构，但这何尝不是一种等效呢？如果有一天我们打开了这个黑箱，我们又如何能确定黑箱里面的东西不是另一种黑箱呢？", "raw_message": "分享一个在海边的思考：我和大海都是在地面上，为什么大海在永不停息地运动，而我却可以凭借自己的意志运动？对于现代的人来说，地球在自传，在公转几乎是一个常识。但千年前的人们，又该如何理解这件事呢？他们是否会认为大海也有自己的意志呢？\n\n假设现在我没有这些物理学常识，那我该如何探索这件事呢？我想了一个方法：模拟大海的情形，由于大海太大了，所以我们缩小一点，拿一个水盆在装点水进行模拟（感觉这个模型实在是太简化了，不知道会不会失真，也许可以加一点石子，再涂点什么让水盆底部变得凹凸不平）。怎么做才能模拟出大海运动的情形呢？拿风扇吹一吹？把水盆进行晃动？发现当晃动水盆时，会出现类似的情形，那么是否可以据此得出结论：承托大海的地面在运动？但这又无法解释另一件事：我也站在地面上，为什么我感受不到地面在运动呢？于是为了统一这两件事，我们需要寻找新的解释。其实我感觉我所给出的上面那个模拟的情形有点马后炮的味道，因为我知道地球在运动，所以我会刻意去往这个方向去想，但千年前的人们未必知道这件事。\n\n自然对我们来说就是一个巨大的黑箱，我们无法打开箱子，所以只能去测量一些箱子所表现出来的性质，来推测箱子内部的结构，但这何尝不是一种等效呢？如果有一天我们打开了这个黑箱，我们又如何能确定黑箱里面的东西不是另一种黑箱呢？", "images": [], "replies": []}, {"id": "ep3:293165436689", "module": "energy", "auto": false, "uname": "某冰不冰梦", "face": "_imgs/face_b085af15dad5.jpg", "like": 3, "message": "在距离质量为<span class=\"math\">\\(M\\)<\/span>的天体为<span class=\"math\">\\(r\\)<\/span>处,有一速度方向垂直于连线的质量为<span class=\"math\">\\(m\\)<\/span>的卫星,速度大小为v0.已知卫星可以以一定速度最终逃离天体的引力场,求最终速度与初速度的夹角余弦值\n来自黑吉辽蒙2025压轴的灵感🐶", "raw_message": "在距离质量为M的天体为r处,有一速度方向垂直于连线的质量为m的卫星,速度大小为v0.已知卫星可以以一定速度最终逃离天体的引力场,求最终速度与初速度的夹角余弦值\n来自黑吉辽蒙2025压轴的灵感[doge]", "images": ["_imgs/img_aca7b4331e52.jpg"], "replies": []}, {"id": "ep3:292998011521", "module": "energy", "auto": false, "uname": "蓝驴", "face": "_imgs/face_f10357ab1604.jpg", "like": 1, "message": "如果以椭圆轨迹运动的卫星，在轨道上喷气加速，能不能在速度发生变化的情况下，保持在原轨道上？🤔", "raw_message": "如果以椭圆轨迹运动的卫星，在轨道上喷气加速，能不能在速度发生变化的情况下，保持在原轨道上？🤔", "images": [], "replies": [{"uname": "傻哭啦是小迷妹", "face": "_imgs/face_3b1ef16107e8.jpg", "like": 0, "message": "一个小球在水平椭圆环轨道里绕圈，随着小球速度的变化，椭圆环会调整施加给小球的力…只要能复制小球受到的椭圆环施加的力(会是一个关于小球位置和速度的函数)，那么就算撤去椭圆环，小球也能维持原先的轨迹…", "id": "ep3:292998011521:r0"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 0, "message": "<span class=\"mention\">回复 @傻哭啦是小迷妹<\/span>  也就是相同的因导致相同的果吗🤔", "id": "ep3:292998011521:r1"}, {"uname": "乱刃影舞", "face": "_imgs/face_abc3929aba34.jpg", "like": 0, "message": "不能吧，因为轨道能", "id": "ep3:292998011521:r2"}]}, {"id": "ep3:292999305025", "module": "energy", "auto": false, "uname": "赤开团时", "face": "_imgs/face_93e6915d2020.jpg", "like": 0, "message": "突然想到以前想过的课本题，喷泉功率，只告诉了<span class=\"math\">\\(h\\)<\/span>，密度，d，<span class=\"math\">\\(g\\)<\/span>。本来用瞬时出喷口的质量流量就可以算，微元法，但是我当时突发奇想，想多此一举，验证一下能不能用整个水柱的能量除以做功总时间，用质心，然后用出喷口动能代替一下任意单位质量的总机械能，然后除以的时间代成了2倍自由落体时间，结果算出来是一半的功率，当时比较忙没再想，今天才发现原来是质量算的时候没算下落的部分，没对应上时间😂，我还以为是流体有啥特殊性质", "raw_message": "突然想到以前想过的课本题，喷泉功率，只告诉了h，密度，d，g。本来用瞬时出喷口的质量流量就可以算，微元法，但是我当时突发奇想，想多此一举，验证一下能不能用整个水柱的能量除以做功总时间，用质心，然后用出喷口动能代替一下任意单位质量的总机械能，然后除以的时间代成了2倍自由落体时间，结果算出来是一半的功率，当时比较忙没再想，今天才发现原来是质量算的时候没算下落的部分，没对应上时间[笑哭]，我还以为是流体有啥特殊性质", "images": [], "replies": []}, {"id": "ep3:295413993280", "module": "momentum", "auto": false, "uname": "西西弗斯的循环", "face": "_imgs/face_3200f74c29c1.jpg", "like": 5, "message": "我是一名物理小白，才接触微元法。题目：水如图流动，以恒定速率<span class=\"math\">\\(v\\)<\/span>流过圆环状弯管，单位时间流向弯管的水的质量<span class=\"math\">\\(Q\\)<\/span>也恒定，水作用于弯管的力大小是。。。？\n      1.我用微元法，很容易但稀里糊涂地算出了答案。最让人不理解的是，<span class=\"math\">\\(t\\)<\/span>被消掉了，这是巧合吗？\n      2.我用所谓的“整体分析”，就更让人不解了。整体分析顾名思义就是看整个系统的变化，但后面又聚焦于“一小部分水”，中间则看作静止，如何解释？\n我的其他问题总结：\n      3.整体分析看上去是个很巧的方法，如何通过直觉自然地想到？能通过微元法蒸馏得出吗？(是脱胎于微元法，还是能直接想到？)能给我们什么直觉上认知的提升以及更普适的思想？\n      4.我对“变化率”这个概念有点不理解。无论是<span class=\"math\">\\(F\\)<\/span>是<span class=\"math\">\\(p\\)<\/span>的变化率，还是<span class=\"math\">\\(Q\\)<\/span>是<span class=\"math\">\\(m\\)<\/span>的变化率。我现在只能把它当做是一个冷冰冰的条件代入方程<span class=\"math\">\\((dm=Qdt)\\)<\/span>，没法从直觉的角度理解。比如说，<span class=\"math\">\\(Q\\)<\/span>只是一个表述一小段水的物理量，为什么能通过与<span class=\"math\">\\(v\\)<\/span>的组合来表达一整段水的受力？也就是说，没有一个明确的动机让我“一定要用这个物理量”，而且“<span class=\"math\">\\(t\\)<\/span>一定能被消掉”。\n      All in all，窝不敏掰(奉化口音)，如何“不动笔算”就知道这个题目是确定的，一定能解，而且只要用这两个物理量？\n\n我隐约觉得，这个问题很有思考价值，能帮我们解决整体与微元的关系，并且能把直觉覆盖到更复杂的物理过程里。", "raw_message": "我是一名物理小白，才接触微元法。题目：水如图流动，以恒定速率v流过圆环状弯管，单位时间流向弯管的水的质量Q也恒定，水作用于弯管的力大小是。。。？\n      1.我用微元法，很容易但稀里糊涂地算出了答案。最让人不理解的是，t被消掉了，这是巧合吗？\n      2.我用所谓的“整体分析”，就更让人不解了。整体分析顾名思义就是看整个系统的变化，但后面又聚焦于“一小部分水”，中间则看作静止，如何解释？\n我的其他问题总结：\n      3.整体分析看上去是个很巧的方法，如何通过直觉自然地想到？能通过微元法蒸馏得出吗？（是脱胎于微元法，还是能直接想到？）能给我们什么直觉上认知的提升以及更普适的思想？\n      4.我对“变化率”这个概念有点不理解。无论是F是p的变化率，还是Q是m的变化率。我现在只能把它当做是一个冷冰冰的条件代入方程（dm=Qdt），没法从直觉的角度理解。比如说，Q只是一个表述一小段水的物理量，为什么能通过与v的组合来表达一整段水的受力？也就是说，没有一个明确的动机让我“一定要用这个物理量”，而且“t一定能被消掉”。\n      All in all，窝不敏掰（奉化口音），如何“不动笔算”就知道这个题目是确定的，一定能解，而且只要用这两个物理量？\n\n我隐约觉得，这个问题很有思考价值，能帮我们解决整体与微元的关系，并且能把直觉覆盖到更复杂的物理过程里。", "images": ["_imgs/img_793a3d9c7b45.jpg"], "replies": [{"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 2, "message": "当你区分了我上面说的两种视角，应该就不难看懂为什么<span class=\"math\">\\(T\\)<\/span>约掉了：因为整个流动上每一位置都是恒定的(眼睛盯着位置看，而不是追着水看)。这样，所有的量，在<span class=\"math\">\\(T\\)<\/span>时间里都是持续积累的，比如各种力积累成冲量，就是直接乘<span class=\"math\">\\(T\\)<\/span>；而水流进流出了多少质量，应该正比于<span class=\"math\">\\(T\\)<\/span>，而在“眼睛盯着位置看”的视角下，水的动量总变化来源于把入口的水“吃掉”，然后在出口处“生出”同样多的水，“吃掉”的和“生出”的水质量一样，正比于<span class=\"math\">\\(T\\)<\/span>，而速度有差，速度差是恒定的。所以水的总动量变了多少，也应该正比于<span class=\"math\">\\(T\\)<\/span>。所以<span class=\"math\">\\(T\\)<\/span>最后必然约掉。", "id": "ep3:295413993280:r0"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 1, "message": "我们应该一句话正面指出这位同学的想错了的地方：同学说“……中间则看作静止，如何解释？”，这里搞错了，正确的推理中没有说过“中间看作静止”。中间的水确实都是在运动的，每一块水的速度、动量每时每刻确实都在变化，只不过你指定好一个位置，始终看每时每刻出现在这个位置上的水，那这个位置上的水的动量都是恒定的，不随时间变化。\n你有困惑，是因为你这里混淆了两种观察视角：眼睛盯着固定的空间位置上看(也就是比较 此时此地的水 和下一时刻此地的水的状态)，和 跟随追踪着水看(后者比较的是 一块水在此时和流到下一时刻的状态的变化)。在你提到的动量的计算里面，实际用到的是“这些位置上”的动量都是不随时间变化的，这和“每一块水的动量在流到这些位置上的瞬时动量变化率为零”是两回事，要区分！后者显然是不对的——盯着一块水看，它全程动量都在变化(这应该就是让你觉得“更不解”的地方，你以为我们是在用这件事)，但其实我没有在说这件事，我们实际用的是前者，而前者毫无疑问是正确的，因为眼睛随便盯着一处看，当地的水流速度都是恒定的(稳定的流动)。", "id": "ep3:295413993280:r1"}, {"uname": "傻哭啦是小迷妹", "face": "_imgs/face_3b1ef16107e8.jpg", "like": 0, "message": "我可以解释一下4.里的“<span class=\"math\">\\(Q\\)<\/span>只是一个表述一小段水的物理量”那个问题…\n\n做个小类比：大家都知道，体积密度<span class=\"math\">\\(\\rho \\)<\/span>，是单位体积所包含的质量…对于均质物体，也就是<span class=\"math\">\\(\\rho \\)<\/span>在整块体积上都恒定的情况下，是可以用<span class=\"math\">\\(\\rho \\)<\/span>和整块体积的乘积，来表示整块质量的，不再局限于很微小的一粒了…\n\n把上一段里的<span class=\"math\">\\(\\rho \\)<\/span>换成<span class=\"math\">\\(Q\\)<\/span>、“体积”换成“时间”，应该就能回答你的问题了…", "id": "ep3:295413993280:r2"}, {"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 0, "message": "那我斗胆回一下问题1，🐶对于弯管里的水，只要 Q和<span class=\"math\">\\(v\\)<\/span>恒定，管子里每一处水的密度、速度大小、方向在空间上都是固定不变的。虽然每一滴水都在飞快运动，整体水的形状是静止的，而且不管哪个时刻去观察，水的情况都是一样的，相同的因相同的果。", "id": "ep3:295413993280:r3"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 0, "message": "我自己在一开始想这一题时也先想到了冲量，但因为认为\\Delta t 求不出来就不再往下尝试了。但其实我还没有带入想象过一遍完整的这一题中的运动情形而只想着怎么解答案就导致忽略了这一题隐藏的信息，所以还是应当先把物理情形搞清楚后再看问题，不然容易为了求解问题把自己的视角变得狭隘\n关于这一题不动笔算的直觉，我们先来看这一道题的物理情形，本题特殊在于这是一个“圆环状”水管   且 水流流速不变，质量也没有变化。水在圆环状弯管里做的是匀速圆周运动，向心力来自于管壁，这便是这一题的简单物理情形。再看问题：水作用于弯管的力的大小是多少？ 更好求的是弯管处管壁总共给了多少作用力让水做匀速圆周运动，即向心力在这一个物理情形中是否是确定的，<span class=\"math\">\\(\\frac{mv^2}{R}\\)<\/span>，质量指的是哪一段质量呢？<span class=\"math\">\\(R\\)<\/span>也不知道，已知的是单位时间流过的水的质量<span class=\"math\">\\(Q\\)<\/span>。那向心力是否确定呢？试着动动圆环半径<span class=\"math\">\\(R\\)<\/span>，圆环半径<span class=\"math\">\\(R\\)<\/span>越大，转速越慢，不过这里有一个问题，质量(到这里我有些卡住了，后面看看能不能让我找到解决卡点的理解或是转换视角方法的确定的转折点)", "id": "ep3:295413993280:r4"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @Light_dreamer探索者<\/span> 应该是整段弯管中的水的质量，随着<span class=\"math\">\\(R\\)<\/span>的增大，整段弯管段的体积随着长度也成与<span class=\"math\">\\(R\\)<\/span>一样倍数的变化。根据<span class=\"math\">\\(\\frac{mv^2}{R}\\)<\/span>可知，向心力是确定的", "id": "ep3:295413993280:r5"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @Light_dreamer探索者<\/span> 那么下面只需要开始动笔用<span class=\"math\">\\(Q\\)<\/span>表示弯管段的<span class=\"math\">\\(m\\)<\/span>的表达式换成带<span class=\"math\">\\(R\\)<\/span>的(从分析中可以看出应该是由圆环弯管段长度和质量的关系代换的)就可以肯定<span class=\"math\">\\(R\\)<\/span>和<span class=\"math\">\\(R\\)<\/span>会消掉，答案就出来了", "id": "ep3:295413993280:r6"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @Light_dreamer探索者<\/span> 这里还缺一个总结，这似乎可以映出一个物理直觉，我还没能很好的说清\n扩展问题：如果是管子的横截面积变大呢？", "id": "ep3:295413993280:r7"}, {"uname": "数学和物理都很有趣", "face": "_imgs/face_71bf55804b7f.jpg", "like": 0, "message": "关于问题2和3，我是这样看的。首先问题肯定是确定的，因为假设管子没有给水力，那么水肯定不会拐弯，也就是说弯道给水的力就是水拐弯的原因，这个力有多大就由水到底“拐”了多少来决定(也就是流入弯道前后相比，水的动量变化了多少，这是知道的)。然后求解，把中间的水和快要进入弯道的一小段水看作研究对象，经过dt时间它变成了中间的谁和快要出弯道的一小段水，由于中间的水的状态是不会随时间推移而改变的，所以初末对比，它的动量变化就只是体现子在那一小段水，而合外力正是弯道对水的合外力，对它用质点系的动量定理就解决了", "id": "ep3:295413993280:r8"}]}, {"id": "ep3:295415894544", "module": "vibration", "auto": false, "uname": "MySiddhartha", "face": "_imgs/face_48077d89217a.jpg", "like": 3, "message": "我这个问题是有关假设调整法的一点补充讨论。感谢大家解决我的疑惑☺️：我在做下面这道小问题，比如说c选项时，我当时直接根据分离时加速度相同，画出了<span class=\"math\">\\(a\\)<\/span>和b各自的受力分析，接着从这个情形\"往后\"分析一点，发现<span class=\"math\">\\(a\\)<\/span>和b确实会分离。然而我却错了，错在这个AB各自分离时的情况，事实上是我假设出来的，也就是说我假设它能分离，那么<span class=\"math\">\\(a\\)<\/span>和b将会在这个点这样受力，此时弹簧给的弹力是向上的<span class=\"math\">\\(\\frac{G}{2}\\)<\/span>。然而，\"往前\"溯，我这个假设时的情形真的能发生吗？所以我又回归弹簧振子的简谐分析，发现这个弹簧振子在最高点时，弹簧给的弹力是向上的<span class=\"math\">\\(G\\)<\/span>，也就是说，AB分离的那种情况的对弹簧振子位置要求比简谐振动的情况的要求还要更往上一点。而这个简谐振动，已经是符合真实物理世界的一种运动情况了，所以我在这两种运动情形中最终敲定这个糸统应该是整体做简谐振动上下反复，而不会发生<span class=\"math\">\\(a\\)<\/span>与b的分离。\n①请问我的这套逻辑在每一个节点是否完善？比如从对分离情况的分析转到分析简谐振动，再通过两种情况的要求大小的比较得出真实物理世界发生的情形。是否有更好的表述？\n②我是否可以认为，假设调整法中的调整不止要看从假设情形，往后看这个情形是否还能保持，而且也要往回溯，看我假设这个情形是否能发生？☺️", "raw_message": "我这个问题是有关假设调整法的一点补充讨论。感谢大家解决我的疑惑☺️：我在做下面这道小问题，比如说c选项时，我当时直接根据分离时加速度相同，画出了a和b各自的受力分析，接着从这个情形\"往后\"分析一点，发现a和b确实会分离。然而我却错了，错在这个AB各自分离时的情况，事实上是我假设出来的，也就是说我假设它能分离，那么a和b将会在这个点这样受力，此时弹簧给的弹力是向上的G/2。然而，\"往前\"溯，我这个假设时的情形真的能发生吗？所以我又回归弹簧振子的简谐分析，发现这个弹簧振子在最高点时，弹簧给的弹力是向上的G，也就是说，AB分离的那种情况的对弹簧振子位置要求比简谐振动的情况的要求还要更往上一点。而这个简谐振动，已经是符合真实物理世界的一种运动情况了，所以我在这两种运动情形中最终敲定这个糸统应该是整体做简谐振动上下反复，而不会发生a与b的分离。\n①请问我的这套逻辑在每一个节点是否完善？比如从对分离情况的分析转到分析简谐振动，再通过两种情况的要求大小的比较得出真实物理世界发生的情形。是否有更好的表述？\n②我是否可以认为，假设调整法中的调整不止要看从假设情形，往后看这个情形是否还能保持，而且也要往回溯，看我假设这个情形是否能发生？☺️", "images": ["_imgs/img_897618a69874.jpg"], "replies": []}, {"id": "ep3:293576995825", "module": "esfield", "auto": false, "uname": "愿你Happy每一天", "face": "_imgs/face_8cc8e44645ef.jpg", "like": 1, "message": "咕咕不知道你有没有想过一个问题，在同一球面上的等量同种电荷的分布在两个是直线，三个时是正三角形，四个时是正四面体，都满足球心与电荷的连线两两夹角相同(180 120 109度28分)，而当放置五个这样的电荷时，它的形状算出来则是三角双锥，并不满足两两夹角相同，而是180 120 90有三种情况，为什么这种“两两夹角相同”的性质在放置第五个以及更多的电荷的时候损失了呢？\n我已经有了一个结论， 一言蔽之，就是自然尽力去追逐最稳定(势能最低)，意味着极致的对称性，而三维空间能找到的最极致对称性的形状只有正四面体，当你放入第五个时 三维空间无法再找到这样的满足“同模性”“矢量和为零”“两两夹角相同”的形状，只能妥协 可以计算在四维空间时的正五胞体势能比三角双锥更低(ai给出的分别是6.325 6.475),换句话说这是我们生活维度的限制。", "raw_message": "咕咕不知道你有没有想过一个问题，在同一球面上的等量同种电荷的分布在两个是直线，三个时是正三角形，四个时是正四面体，都满足球心与电荷的连线两两夹角相同（180 120 109度28分），而当放置五个这样的电荷时，它的形状算出来则是三角双锥，并不满足两两夹角相同，而是180 120 90有三种情况，为什么这种“两两夹角相同”的性质在放置第五个以及更多的电荷的时候损失了呢？\n我已经有了一个结论， 一言蔽之，就是自然尽力去追逐最稳定（势能最低），意味着极致的对称性，而三维空间能找到的最极致对称性的形状只有正四面体，当你放入第五个时 三维空间无法再找到这样的满足“同模性”“矢量和为零”“两两夹角相同”的形状，只能妥协 可以计算在四维空间时的正五胞体势能比三角双锥更低（ai给出的分别是6.325 6.475),换句话说这是我们生活维度的限制。", "images": [], "replies": []}, {"id": "ep3:295415542112", "module": "em", "auto": false, "uname": "万物有长", "face": "_imgs/face_44878e693b92.jpg", "like": 10, "message": "北京的知名命题人王老师的作品\n题目简洁，但难度不小，解法绝妙🤩", "raw_message": "北京的知名命题人王老师的作品\n题目简洁，但难度不小，解法绝妙[星星眼]", "images": ["_imgs/img_5bdbed3c21e2.jpg"], "replies": [{"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 1, "message": "不知道对不对，🐶因为摩擦力对两棒一视同仁，所以它不影响电流的产生，最大时的vN安培力等于摩擦力，这样初末态都知道了，回路焦耳热其实就是相对动能的变化量，按这个思路应该就能解出🐶", "id": "ep3:295415542112:r0"}, {"uname": "咸咸海风吹面哭殇", "face": "_imgs/face_6a1e5e264222.jpg", "like": 1, "message": "<span class=\"mention\">回复 @万物有长<\/span> 应该就是抓住末态安培力等于摩擦力，然后对两棒分别列动量定理吧", "id": "ep3:295415542112:r1"}, {"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 0, "message": "<span class=\"mention\">回复 @万物有长<\/span> 不敢当，还有别的思路吗🐶", "id": "ep3:295415542112:r2"}, {"uname": "咸咸海风吹面哭殇", "face": "_imgs/face_6a1e5e264222.jpg", "like": 0, "message": "有答案吗", "id": "ep3:295415542112:r3"}, {"uname": "长毛杰克", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "可以私发下答案吗？谢谢🙏", "id": "ep3:295415542112:r4"}, {"uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 0, "message": "回路焦耳热为什么是相对动能的变化量？", "id": "ep3:295415542112:r5"}]}, {"id": "ep3:293552162417", "module": "em", "auto": false, "uname": "-Sir-xiao", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 3, "message": "一道磁场边界问题，最近在学这一类问题，总是感觉难以找到目标轨迹，通过这道题我自己进行了一些思考，主要是如何进行试错的，仍然还有很多疑惑，希望能得到解答", "raw_message": "一道磁场边界问题，最近在学这一类问题，总是感觉难以找到目标轨迹，通过这道题我自己进行了一些思考，主要是如何进行试错的，仍然还有很多疑惑，希望能得到解答", "images": ["_imgs/img_de40c37cd181.jpg", "_imgs/img_bee886aab9c7.jpg", "_imgs/img_c9e04271f7f6.jpg", "_imgs/img_6e759754d390.jpg"], "replies": []}, {"id": "ep3:295420696800", "module": "em", "auto": false, "uname": "菊爽星", "face": "_imgs/face_43cbe14b91e0.jpg", "like": 1, "message": "题目会做但不知道原理？这是一道很简单的磁场题，如果知道结论的话。结论很简单：1.同铭磁极相互排斥，异铭磁极相互吸引；2 .小磁针的<span class=\"math\">\\(N\\)<\/span>极方向与磁场方向相同。\n我在写这一道题时“开心”地套结论，根据电流方向很容易判断出通电螺线管的左为<span class=\"math\">\\(S\\)<\/span>右为N(通电螺线管类似条形磁铁)，第一问根据第二个结论很容易写出答案为<span class=\"math\">\\(S\\)<\/span>。然而在第二问却出现了问题：在管内部的小磁针根据结论2(小磁针的<span class=\"math\">\\(N\\)<\/span>极方向与磁场方向相同。)那么右端肯定为<span class=\"math\">\\(N\\)<\/span>极，然而加入套第1个结论(同铭磁极相互排斥，异铭磁极相互吸引)却出现了问题：假如磁针B的右端为<span class=\"math\">\\(N\\)<\/span>极，那通电螺线管右端也为<span class=\"math\">\\(N\\)<\/span>极啊，二者相对不应该相互排斥吗？\n\n解答：我的分析和解决：从最底层来看，小磁针会发生转动就是受到了力的作用。我们只要去分析最底层的受力就好了。我们主要看在通电螺线管内部的小磁针B。因为条形磁体产生的磁场跟通电螺线管产生的磁场类似，我们可以近似小磁针由一圈一圈电流环组成。我们可以用反证法，去假设B的右端为<span class=\"math\">\\(N\\)<\/span>极，如果跟理论分析的情况一样便是答案，如果矛盾的不是答案。我在这里使用了毕奥・萨弗尔定律+圆的对称性去分析受力(图2)得到的结果居然和假设一样，那么B的右端是<span class=\"math\">\\(N\\)<\/span>极。\n\n直观理解与感悟：在通电螺线管内部的小磁针B相当于与管“融为一体”了，在内部两个<span class=\"math\">\\(N\\)<\/span>极所对的方向恰好与在外部<span class=\"math\">\\(S\\)<\/span>与<span class=\"math\">\\(N\\)<\/span>的方向相同。(方向指环形电流的方向)也可以理解为在通电螺线管(类似条形磁体)被切了，重新形成磁极，而新生成的<span class=\"math\">\\(S\\)<\/span>极正好与B的<span class=\"math\">\\(N\\)<\/span>相对，因此吸引(此结论也可用安培分子电流假说+毕奥・萨弗尔定律推出) 。\n我的感悟是在学习过程中不要盲目地记结论，要去直观理解与深度思考，在题目中遇到类似挫折可以用最本质的逻辑去分析解决，深思后豁然开朗的感觉真的很棒。", "raw_message": "题目会做但不知道原理？这是一道很简单的磁场题，如果知道结论的话。结论很简单：1.同铭磁极相互排斥，异铭磁极相互吸引；2 .小磁针的N极方向与磁场方向相同。\n我在写这一道题时“开心”地套结论，根据电流方向很容易判断出通电螺线管的左为S右为N（通电螺线管类似条形磁铁），第一问根据第二个结论很容易写出答案为S。然而在第二问却出现了问题：在管内部的小磁针根据结论2（小磁针的N极方向与磁场方向相同。）那么右端肯定为N极，然而加入套第1个结论（同铭磁极相互排斥，异铭磁极相互吸引）却出现了问题：假如磁针B的右端为N极，那通电螺线管右端也为N极啊，二者相对不应该相互排斥吗？\n\n解答：我的分析和解决：从最底层来看，小磁针会发生转动就是受到了力的作用。我们只要去分析最底层的受力就好了。我们主要看在通电螺线管内部的小磁针B。因为条形磁体产生的磁场跟通电螺线管产生的磁场类似，我们可以近似小磁针由一圈一圈电流环组成。我们可以用反证法，去假设B的右端为N极，如果跟理论分析的情况一样便是答案，如果矛盾的不是答案。我在这里使用了毕奥・萨弗尔定律+圆的对称性去分析受力（图2）得到的结果居然和假设一样，那么B的右端是N极。\n\n直观理解与感悟：在通电螺线管内部的小磁针B相当于与管“融为一体”了，在内部两个N极所对的方向恰好与在外部S与N的方向相同。（方向指环形电流的方向）也可以理解为在通电螺线管（类似条形磁体）被切了，重新形成磁极，而新生成的S极正好与B的N相对，因此吸引（此结论也可用安培分子电流假说+毕奥・萨弗尔定律推出） 。\n我的感悟是在学习过程中不要盲目地记结论，要去直观理解与深度思考，在题目中遇到类似挫折可以用最本质的逻辑去分析解决，深思后豁然开朗的感觉真的很棒。", "images": ["_imgs/img_0e648cca313a.jpg", "_imgs/img_c2dbd79e017b.jpg"], "replies": []}, {"id": "ep3:295911172928", "module": "em", "auto": false, "uname": "Salute_Explorer", "face": "_imgs/face_4899f5bb91be.jpg", "like": 1, "message": "ABC选项都很容易解决，D选项的方法个人认为比较巧妙，比较像电磁学中的轮摆线问题的处理手法，之所以能用相同的方法，是因为都存在着一个和速度方向有关联的变力。", "raw_message": "ABC选项都很容易解决，D选项的方法个人认为比较巧妙，比较像电磁学中的轮摆线问题的处理手法，之所以能用相同的方法，是因为都存在着一个和速度方向有关联的变力。", "images": ["_imgs/img_0b7ed5c378ba.jpg", "_imgs/img_a4fa07c2b84a.jpg"], "replies": [{"uname": "乱刃影舞", "face": "_imgs/face_abc3929aba34.jpg", "like": 0, "message": "这个是典题了", "id": "ep3:295911172928:r0"}]}, {"id": "ep3:295458029408", "module": "em", "auto": false, "uname": "于灰", "face": "_imgs/face_849ef481732d.jpg", "like": 1, "message": "关于评论区@万物有长 发布题目的一种解法", "raw_message": "关于评论区@万物有长 发布题目的一种解法", "images": ["_imgs/img_efde0b51d01d.jpg", "_imgs/img_9ae5b92d338f.jpg"], "replies": [{"uname": "万物有长", "face": "_imgs/face_44878e693b92.jpg", "like": 0, "message": "对的✓", "id": "ep3:295458029408:r0"}, {"uname": "万物有长", "face": "_imgs/face_44878e693b92.jpg", "like": 0, "message": "<span class=\"mention\">回复 @h0122erodb<\/span> 你的思考完全正确，但在这个题里，最后的稳态是有速度差的，而不是像没有摩擦的时候共速", "id": "ep3:295458029408:r1"}, {"uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 0, "message": "摩擦力对两个棒的作用不是一样的吗？大小一样，然后两个棒质量又一样带来的加速度又一样，引起的速度变化也一样，它不影响两棒之间相对速度的差值。而两棒之间相对速度又影响了电动势进而影响了电流，所以在有摩擦和没摩擦情况下，运动开始的每时每刻两个状态的电流都是一样的，那为什么产生的焦耳热不一样呢？@万物有长 ，我看到@于灰 发的解法下面有没有摩擦时的焦耳热", "id": "ep3:295458029408:r2"}, {"uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 0, "message": "<span class=\"mention\">回复 @万物有长<\/span> 摩擦力在这里起到作用就是影响最终的稳态，我明白了💡，谢谢你", "id": "ep3:295458029408:r3"}]}, {"id": "ep3:293737150305", "module": "em", "auto": false, "uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 0, "message": "@万物有长 用柯尼希定理可不可以？", "raw_message": "@万物有长 用柯尼希定理可不可以？", "images": ["_imgs/img_da489de50276.jpg"], "replies": [{"uname": "万物有长", "face": "_imgs/face_44878e693b92.jpg", "like": 0, "message": "结果是对的。摩擦力减小的就是质心动能，而焦耳热的变化则是资用能的变化。\n但我个人不喜欢这样做，总嫌不自然[傲娇]", "id": "ep3:293737150305:r0"}]}, {"id": "ep3:295417096320", "module": "thermal", "auto": false, "uname": "傻哭啦是小迷妹", "face": "_imgs/face_3b1ef16107e8.jpg", "like": 10, "message": "上一期有一道圈圈套圈圈的题目，那这一期我也来一道类似的题目…\n\n大家都知道，如果一团封闭气体的状态，经历一系列变化后，回到了它最初的状态…那么这个过程的体积功，就是<span class=\"math\">\\(p-V\\)<\/span>图上圈圈的面积…\n\n但是🐶如果<span class=\"math\">\\(p-V\\)<\/span>图上的圈圈不止一个，该怎样识别“圈圈的面积”呢…举个栗子，如图所示，封闭气体依次经历了1 → 2 → 3 → 4 → 2 → 5 → 6 → 7 → 8 → 6 → 1这些状态…那么这个过程的体积功是哪个圈圈的面积呢，或者说是哪几个圈圈的面积相加(或者相减)呢…\n\n这道题我实在是做不出来🐶所以我直接看答案了…答案是这样说的：图上的路径由12561、2342、6786这三个圈圈组成…其中，12561和6786沿顺时针，这两个圈圈的面积表示气体对环境做的功；2342沿逆时针，这个圈圈的面积表示环境对气体做的功…所以，整个过程，气体对环境做的功<span class=\"math\">\\( = 12561\\)<\/span>的面积<span class=\"math\">\\( + 6786\\)<\/span>的面积<span class=\"math\">\\( - 2342\\)<\/span>的面积…\n\n看完答案我更懵了…非但原先的疑问没解决，现在又多出2个疑问🐶\n1. 为什么沿顺时针、逆时针的圈圈的面积，分别表示气体对环境做的功、环境对气体做的功，而不是反过来呢…总不至于让我背“顺正逆负”这种口诀吧🐶\n2. 体积功依赖于状态变化的路径，那为什么答案求解体积功时，可以随意(🐶有多随意？)排列组合题目给出的路径呢…题目给出的路径像过山车，答案却把它拆成了3个圈圈…这样能算出正确的体积功咩🐶", "raw_message": "上一期有一道圈圈套圈圈的题目，那这一期我也来一道类似的题目…\n\n大家都知道，如果一团封闭气体的状态，经历一系列变化后，回到了它最初的状态…那么这个过程的体积功，就是p-V图上圈圈的面积…\n\n但是[doge]如果p-V图上的圈圈不止一个，该怎样识别“圈圈的面积”呢…举个栗子，如图所示，封闭气体依次经历了1 → 2 → 3 → 4 → 2 → 5 → 6 → 7 → 8 → 6 → 1这些状态…那么这个过程的体积功是哪个圈圈的面积呢，或者说是哪几个圈圈的面积相加（或者相减）呢…\n\n这道题我实在是做不出来[doge]所以我直接看答案了…答案是这样说的：图上的路径由12561、2342、6786这三个圈圈组成…其中，12561和6786沿顺时针，这两个圈圈的面积表示气体对环境做的功；2342沿逆时针，这个圈圈的面积表示环境对气体做的功…所以，整个过程，气体对环境做的功 = 12561的面积 + 6786的面积 - 2342的面积…\n\n看完答案我更懵了…非但原先的疑问没解决，现在又多出2个疑问[doge]\n1. 为什么沿顺时针、逆时针的圈圈的面积，分别表示气体对环境做的功、环境对气体做的功，而不是反过来呢…总不至于让我背“顺正逆负”这种口诀吧[doge]\n2. 体积功依赖于状态变化的路径，那为什么答案求解体积功时，可以随意（[doge]有多随意？）排列组合题目给出的路径呢…题目给出的路径像过山车，答案却把它拆成了3个圈圈…这样能算出正确的体积功咩[doge]", "images": ["_imgs/img_a0f8506339be.jpg"], "replies": [{"uname": "Yeeelsen", "face": "_imgs/face_0da59923c7bb.jpg", "like": 0, "message": "因为以前没有学过热学所以简单谈谈我的看法🐶首先单个圈的情形似乎就，，不是那么显然？这是一个<span class=\"math\">\\(v\\)<\/span>值到两个<span class=\"math\">\\(p\\)<\/span>值的映射，不是我们通常处理的那种函数，例如速度时间函数v(t)就不可能长这样，你当然就不能一个<span class=\"math\">\\(t\\)<\/span>对映两个<span class=\"math\">\\(v\\)<\/span>，这样会分身\n\n我们先考虑最简单的一个圈的情形。现在我们从圈的最左侧顶点出发顺时针绕行，体积向右增大，<span class=\"math\">\\(p\\)<\/span>随之增大，此时气体对环境做功，做功的大小等于曲线下的面积，记作S1.这个过程一直持续至我们的体积来到圈的最右侧顶点，此后我们继续沿着圈行进，体积向左增大，<span class=\"math\">\\(p\\)<\/span>随之减小，此时应当是环境对气体做功，做功的大小等于曲线下的(负)面积，记作S2.这个负号也可以理解成是v(自变量)在反向进行，或者说在倒放，更fancy的说法就是交换积分上下限得提个负号出来。最后，求两面积之和，显然<span class=\"math\">\\(s_{1}\\)<\/span>大于<span class=\"math\">\\(s_{2}\\)<\/span>，即总的气体对环境做功更大。\n\n那么逆时针呢？当然就是完全相反的物理过程，总的来说环境对气体做功更大。无论取顺时针还是逆时针算出来的结果在数值上总是相等的，这样对第一个问题就有比较好的解释了", "id": "ep3:295417096320:r0"}, {"uname": "Yeeelsen", "face": "_imgs/face_0da59923c7bb.jpg", "like": 0, "message": "至于第二个问题我没太懂，这个选的路径至少要保证能连续一笔画成，并且遍历所有的圈吧。如果你有什么新想法可以说一下🙌🙌", "id": "ep3:295417096320:r1"}]}, {"id": "ep3:295421555552", "module": "thermal", "auto": false, "uname": "绯村染之助", "face": "_imgs/face_904f9dcc8f9b.jpg", "like": 1, "message": "这道题有没有足够简洁、直观的解法？\n我的理解：AB选项的问题可以转化为“固定<span class=\"math\">\\(P\\)<\/span>，比较两侧气体压强的增量大小”，这个简单\n但CD选项怎么理解", "raw_message": "这道题有没有足够简洁、直观的解法？\n我的理解：AB选项的问题可以转化为“固定P，比较两侧气体压强的增量大小”，这个简单\n但CD选项怎么理解", "images": ["_imgs/img_ab930026c143.jpg"], "replies": [{"uname": "傻哭啦是小迷妹", "face": "_imgs/face_3b1ef16107e8.jpg", "like": 0, "message": "关于C、D选项，最终稳定的情景只可能有一个…所以本着条条大路通罗马的想法，我们可以边假设边修正，一步步推算出最终的情景…\n\n假设<span class=\"math\">\\(P\\)<\/span>始终不动，那么<span class=\"math\">\\(M\\)<\/span>、<span class=\"math\">\\(N\\)<\/span>移动到位后，<span class=\"math\">\\(P\\)<\/span>两侧的压强会不一样…这和“<span class=\"math\">\\(P\\)<\/span>不动”是矛盾的，所以修正方案是：<span class=\"math\">\\(P\\)<\/span>朝压强低的那一侧运动，使得压强大的那一侧压强变小、压强小的那一侧压强变大，直到<span class=\"math\">\\(P\\)<\/span>两侧的压强相等…\n\n于是，问题就转变成了：两块不一样的体积<span class=\"math\">\\(V_{1}\\)<\/span>、<span class=\"math\">\\(V_{2}\\)<\/span>，都减少相等的体积量，变为两块新体积<span class=\"math\">\\(V_{1}'\\)<\/span>、<span class=\"math\">\\(V_{2}'\\)<\/span>…新体积占原体积的百分比，<span class=\"math\">\\((V_{1}'/V_{1})\\)<\/span>和<span class=\"math\">\\((V_{2}'/V_{2})\\)<\/span>，谁大谁小…", "id": "ep3:295421555552:r0"}, {"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 0, "message": "在此之上可以加个极限法，将<span class=\"math\">\\(M\\)<\/span>直接推到<span class=\"math\">\\(P\\)<\/span>去🐶", "id": "ep3:295421555552:r1"}]}, {"id": "ep3:292996036593", "module": "math", "auto": false, "uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 9, "message": "那我来分享一个“数学”问题🐶，一个圆环的内表面是圆柱形，外表面是球形，且球心在圆柱的轴线上。求出该圆环的体积。要求：【涉及的计算必须在高中物理范围内，即微元法是允许的，但不允许使用积分硬算面积(禁止使用轮椅)，并且解答越贴近物理越好】我保证有一个优美的解法，只不过空白太小了…🐶如果真没有思路，作弊码就在某位“叫兽”发布的内容之中，不过希望大家想过了再去找。🐶答案是非常简单的，物理的，不需要什么太多的数学，应该初中生的基础就够了。如果可以的话希望大佬别要秒解掉了，🐶给问题一点讨论的时间，也许能收获一些意想不到的解法。期待大家的解答。再多嘴一句，答案比较有趣和反直觉。解法最迟会在两天后放在回复中。🐶", "raw_message": "那我来分享一个“数学”问题[doge]，一个圆环的内表面是圆柱形，外表面是球形，且球心在圆柱的轴线上。求出该圆环的体积。要求：【涉及的计算必须在高中物理范围内，即微元法是允许的，但不允许使用积分硬算面积（禁止使用轮椅），并且解答越贴近物理越好】我保证有一个优美的解法，只不过空白太小了…[doge]如果真没有思路，作弊码就在某位“叫兽”发布的内容之中，不过希望大家想过了再去找。[doge]答案是非常简单的，物理的，不需要什么太多的数学，应该初中生的基础就够了。如果可以的话希望大佬别要秒解掉了，[脱单doge]给问题一点讨论的时间，也许能收获一些意想不到的解法。期待大家的解答。再多嘴一句，答案比较有趣和反直觉。解法最迟会在两天后放在回复中。[脱单doge]", "images": ["_imgs/img_588e8028d81a.jpg"], "replies": [{"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 4, "message": "取一个装满水的水箱，把这个奇怪的柱体放进去，水会溢出来，然后去测量水的体积🤙", "id": "ep3:292996036593:r0"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 4, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span>  我已经算出了表达式，体积等效于一个半径只有圆柱高度一半的球的体积。但是怎么从物理角度理解？这个几何体相当于用一个圆柱去捅一个球，中间那部分扔掉，剩下的就是我要的。如果圆柱半径很小的话，考虑极端情况，就是细到一根线，那么剩下的体积无限趋近于球本身。接下来缓慢扩张圆柱的半径，扩张过程中，中间那个圆柱从“高瘦”逐渐变为“矮胖”，剩下的我就不知道了😭", "id": "ep3:292996036593:r1"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 3, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span>  既然体积只和圆柱高度有关，那我就固定圆柱的高度，缩放一下圆柱的半径，看看到底发生了什么：当圆柱的半径变大的时候，外面那层球皮的厚度在减小，如果体积只与高度有关，那么只需要让半径的增量和球皮厚度的减量抵消就可以了，也就是处于收支平衡的状态。圆柱半径的增量与球半径的增量是反比关系，这样的关系会导致截面环的面积增量为0。也就是说，在半径扩张过程中，截面面积没有发生改变，那么整个体积就只与高度有关了。(我怎么感觉这样解释把问题搞复杂了呢？还是用到了微积分啊😭)", "id": "ep3:292996036593:r2"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 2, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span>  我知道了！中心截面面积刚好就是以<span class=\"math\">\\(\\frac{h}{2}\\)<\/span>为半径的球的大圆面积。非中心截面面积刚好等于用到球心距离为d的截面截出来的圆面积，所有面积刚好与球的每一个截面面积对应，那么总体积就是球的体积🤩", "id": "ep3:292996036593:r3"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 1, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span>  [抓狂][抓狂][抓狂]", "id": "ep3:292996036593:r4"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 1, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span>  我知道，刚才的解法是祖亘原理，但还是不是物理的😭", "id": "ep3:292996036593:r5"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 1, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span>  我又想了一种办法，这回比较物理(但我感觉和刚刚的解释没什么区别😂)。那就是相同的因必然导致相同的果：任意高度的截面面积都和一个球在任意高度的截面面积的表达式有相同的结构，这是“因”。那么这个圆环的体积也必然和一个球的体积相等。(我已经没辙了😭)", "id": "ep3:292996036593:r6"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 1, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span>  所以另一种解释到底是什么😧", "id": "ep3:292996036593:r7"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 1, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span>  还要等几天，太闹心了[灵魂出窍]", "id": "ep3:292996036593:r8"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 1, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span>  我要去赶作业了😭[tv_晕]", "id": "ep3:292996036593:r9"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 1, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span>  我发的也没人看捏😭别走啊[保卫萝卜_哭哭]不过在给答案之前我还是尽力找找。直接看答案好没意思啊[奥比岛_委屈]", "id": "ep3:292996036593:r10"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 1, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span>  好隐蔽", "id": "ep3:292996036593:r11"}]}, {"id": "ep3:293440478113", "module": "math", "auto": false, "uname": "愿你Happy每一天", "face": "_imgs/face_8cc8e44645ef.jpg", "like": 1, "message": "一道向量题引发的思考：关于甲烷的空间构型与正单纯形(我知道跨度很大，我完全不知道正单纯形的概念，但是这个题目可以拓展到<span class=\"math\">\\(n\\)<\/span>维中并且满足题意恰好就是正单纯形)", "raw_message": "一道向量题引发的思考：关于甲烷的空间构型与正单纯形（我知道跨度很大，我完全不知道正单纯形的概念，但是这个题目可以拓展到n维中并且满足题意恰好就是正单纯形）", "images": ["_imgs/img_a24ef0e39eb3.jpg", "_imgs/img_d2bda0dd026c.jpg"], "replies": [{"uname": "四重吹不散", "face": "_imgs/face_dbb0bd97eb2e.jpg", "like": 0, "message": "单谈数学，你不是意识到了对称性吗，推广到<span class=\"math\">\\(n\\)<\/span>维不是很自然吗，利用向量和的平方还是0。化学我觉得没必要强行联系了，首先vsepr本就有一点问题，其次为什么是那种形状也应该从力学去分析，而不是几何对称\n分子构型由能量最低的力学平衡决定，几何对称只是可能的结果之一，而非原因，vsepr杂化理论是经验工具，不能反过来用纯几何去“规定”分子应该长什么样。", "id": "ep3:293440478113:r0"}, {"uname": "四重吹不散", "face": "_imgs/face_dbb0bd97eb2e.jpg", "like": 0, "message": "<span class=\"mention\">回复 @愿你Happy每一天<\/span> 分子的空间构型，本质是体系在三维空间中达到势能最低的力学平衡结果，而非由纯几何对称性预先决定。几何对称只是势能最低构型常常伴随的特征，是结果而非原因，结果和原因当然要分开了\nVSEPR理论与杂化轨道理论都属于经验性模型，它们的作用是对已知分子构型进行归纳与预测，并非从量子力学或经典力学出发的第一性原理。真实分子的结构由电子相互作用、核吸引、轨道重叠、位阻效应等多种物理因素共同决定、不能用高维几何的数学对称性去反向规定分子应有的构型。\n将球面上点电荷的对称分布、高维正则单纯形等纯几何模型，直接等同于化学分子的稳定结构，属于过度类比与强行关联。化学关心的是真实空间中的能量最低态，而非数学上的对称最优态", "id": "ep3:293440478113:r1"}, {"uname": "四重吹不散", "face": "_imgs/face_dbb0bd97eb2e.jpg", "like": 0, "message": "<span class=\"mention\">回复 @愿你Happy每一天<\/span> 而且怎么能把电荷等价于vsepr模型啊，成键方向性，量子效应，还有电负性这是最关键的，里面那么大的原子核你忽略了吗\n高维几何与化学无关我们的世界是三维，化学只关心三维空间的稳定结构，不关心四维里数学上更对称的东西，不要把数学优美当物理真实", "id": "ep3:293440478113:r2"}, {"uname": "四重吹不散", "face": "_imgs/face_dbb0bd97eb2e.jpg", "like": 0, "message": "忽略什么，推导也对不上啊，对称不一定就是能量最低，水和氨气都不是啊，孤电子对斥力更大啊，理想四面体是109.5水实际是104.5氨气是107，没做过那种比较键角大小的题吗", "id": "ep3:293440478113:r3"}, {"uname": "四重吹不散", "face": "_imgs/face_dbb0bd97eb2e.jpg", "like": 0, "message": "<span class=\"mention\">回复 @愿你Happy每一天<\/span> 所以关键不是对称性，你撑死了只能处理甲烷和二氧化碳这种\n理论最重要的是普适性和解释力，牛顿没有考虑相对论也可以解释当时的现象，才能加上细节叫修正，大方向错误了那就是错误的理论了，我还说地心说在他那个时代也能自圆其说，这就是个没意义的问题，vsepr之所以有用或者说能量的观点就是因为他能预测pcl5，而不是过渡数学化的抽象，四维空间有没有这个物质都难说，我理解你的想法，这可能是一个好的数学，但是就像我一开始说的，不要强行联系，等有了对应的数学能力再去联系，最后vsper和电荷模型当然不是一个东西，你哪找的资料", "id": "ep3:293440478113:r4"}, {"uname": "四重吹不散", "face": "_imgs/face_dbb0bd97eb2e.jpg", "like": 0, "message": "<span class=\"mention\">回复 @愿你Happy每一天<\/span> 不要回了，为了反驳而反驳就是抬杠了，我最后说一遍——对称性和能量最低就没有必然的联系，铜离子的配合物就是，按照你这个说法他应该是正八面体，然后说的什么模长相等也不存在，电子云不是静态的数学对象，对于结构的理解不应该停留在球棍模型那样的，只有那样才可以用数学几何其分析解释", "id": "ep3:293440478113:r5"}]}, {"id": "ep3:292998826977", "module": "math", "auto": false, "uname": "维和的青年学生", "face": "_imgs/face_dc8b2dd3b99d.jpg", "like": 0, "message": "我自己正好遇到了排列组合中的隔板法一个难题就是要求三个元素互不相邻，然后再往其中加三个元素，三选二排列之后，最后一个乘4的道理是什么？https://b23.tv/BV1b9wszgEw8 这是我发在B站上的视频", "raw_message": "我自己正好遇到了排列组合中的隔板法一个难题就是要求三个元素互不相邻，然后再往其中加三个元素，三选二排列之后，最后一个乘4的道理是什么？https://b23.tv/BV1b9wszgEw8 这是我发在B站上的视频", "images": [], "replies": []}, {"id": "ep3:293184568593", "module": "other", "auto": false, "uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 0, "message": "2006年的老题，不是很常规，问题在于，如何把握题目中所描述的运动过程的确定性？", "raw_message": "2006年的老题，不是很常规，问题在于，如何把握题目中所描述的运动过程的确定性？", "images": ["_imgs/img_2b2be0498f11.jpg"], "replies": []}], "mod_stats": {"mech": {"q": 3, "r": 1, "img": 2}, "energy": {"q": 3, "r": 3, "img": 1}, "momentum": {"q": 1, "r": 9, "img": 1}, "vibration": {"q": 1, "r": 0, "img": 1}, "esfield": {"q": 1, "r": 0, "img": 0}, "em": {"q": 6, "r": 12, "img": 12}, "thermal": {"q": 2, "r": 4, "img": 2}, "math": {"q": 3, "r": 18, "img": 3}, "other": {"q": 1, "r": 0, "img": 1}}, "removed": [["物理系咕咕叫兽", "忘记说了，想要在线讨论的同学可以加这个群，这是好题分享活动专用的群（群里", "归档时已排除"], ["正切宇弦", "众人拾柴火焰高，分享了！[打call][打call][打call]", "归档时已排除"], ["画沙あ", "太好了是咕咕！[打call][打call][星星眼]", "归档时已排除"], ["08180啊", "谢谢咕咕[打call]", "归档时已排除"]], "ghost_merged": 19, "total_q": 21, "total_r": 47, "total_img": 23, "auto_cnt": 0}, {"key": "ep4", "title": "第4期", "episodeId": "ep1774068069536", "export": "2026-08-25", "comments": [{"id": "ep4:296159687008", "module": "mech", "auto": false, "uname": "傻哭啦是小迷妹", "face": "_imgs/face_3b1ef16107e8.jpg", "like": 9, "message": "第一期有一位昵称是“佚之森”的小滑块，提出的一个问题挺有意思的…那这一期我拿来改装一下…\n\n如图所示，一场抽象艺术展上，有一个静止的装置，它由一根不可伸长的绳子和1、2、3三个重块组成…其中，绳子两端之间的距离等于绳长…\n\n问题来了🐶\n1. 块2静止，是因为它受到绳子的拉力，还是因为它受到块3给的支持力？\n2. 如果以上两种情况都有可能(真的都有可能咩🐶)，那么…“块2受到绳子拉力”的情景，和“块2受到块3给的支持力”的情景，就是两种不同的情景了对吧(分别记为情景1、情景2)…毕竟同一个情景，应该是只允许有一种受力情况的…如果真的是这样，又该怎样区分情景1和情景2这两种情景呢…这两种情景并排摆放在艺术展上的话，看起来一模一样诶，好像没有什么区别🐶", "raw_message": "第一期有一位昵称是“佚之森”的小滑块，提出的一个问题挺有意思的…那这一期我拿来改装一下…\n\n如图所示，一场抽象艺术展上，有一个静止的装置，它由一根不可伸长的绳子和1、2、3三个重块组成…其中，绳子两端之间的距离等于绳长…\n\n问题来了[doge]\n1. 块2静止，是因为它受到绳子的拉力，还是因为它受到块3给的支持力？\n2. 如果以上两种情况都有可能（真的都有可能咩[doge]），那么…“块2受到绳子拉力”的情景，和“块2受到块3给的支持力”的情景，就是两种不同的情景了对吧（分别记为情景1、情景2）…毕竟同一个情景，应该是只允许有一种受力情况的…如果真的是这样，又该怎样区分情景1和情景2这两种情景呢…这两种情景并排摆放在艺术展上的话，看起来一模一样诶，好像没有什么区别[doge]", "images": ["_imgs/img_8bf959cdb42d.jpg"], "replies": [{"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 3, "message": "类似的抽象艺术例子有：一张桌子四个脚，每个脚上的弹力是唯一的吗？", "id": "ep4:296159687008:r0"}, {"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 0, "message": "很有意思的问题啊🐶，斗胆回复一下，我觉得两种情况都有可能。情景一二的区别不在于运动上的不同，而是内部受力的不同，那我觉得肉眼是无法分辨的，只能去检查受力，我能想到的一个方法是去改变受力环境，比如剪断绳子…或者开个挂，看看那位抽象艺术家是先系绳子还是先放物块3🐶", "id": "ep4:296159687008:r1"}, {"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 0, "message": "<span class=\"mention\">回复 @数学和物理都很有趣<\/span> 现实中很有可能，毕竟现实中也没有完全不能伸长的绳子🐶", "id": "ep4:296159687008:r2"}, {"uname": "数学和物理都很有趣", "face": "_imgs/face_71bf55804b7f.jpg", "like": 0, "message": "有意思，感觉两种情况都有可能？而且现实中有没有可能既受绳子拉力，又受支持力？(雾)", "id": "ep4:296159687008:r3"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @傻哭啦是小迷妹<\/span> 嗯，我是史学家，所以活动的网页叫openSHIT.", "id": "ep4:296159687008:r4"}, {"uname": "佚之森", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "🐶灵感来源来了(问题那么长居然真的有人看完😂) 我觉得这两种力的产生原因是同等地位的 都是发生了形变 所以得看是哪个物体先发生了微小形变吧", "id": "ep4:296159687008:r5"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 0, "message": "我还没有看评论区的回复，我的想法是看你是按什么顺序放的，如果是先用绳子把2拴上去，那3被推过去的时候，3与2之间没有挤压2也就不能给它压力；如果是先把2放到3上，再栓绳子的话，因为2不过往下拽绳子，所以绳子没有受到2给它的力，也不需要给2施加力来维持长度", "id": "ep4:296159687008:r6"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @数学和物理都很有趣<\/span> 这么说同时拉着绳子以及让2压着3，再把绳子拴到天花板上似乎也有可能", "id": "ep4:296159687008:r7"}]}, {"id": "ep4:296862340144", "module": "mech", "auto": false, "uname": "MySiddhartha", "face": "_imgs/face_48077d89217a.jpg", "like": 1, "message": "您好亲爱的咕呱，今天有事从寄宿制学校回家了，在补之前的视频。也感谢大家的解答😳。在起初看到这个问题的第二个解法时，看到小球在不同位置的处境一样，我的第一想法是换位到小球的感受，结果是，我作为小球，不仅感受到了眼前的几何物理世界，还感受到了拽在我身上的一根绳子的力。所以我就想去分析怎么证明我处在斜面上不同位置，这个力也是一样的。但事实上，这个力的层面的分析好像是没有必要的。所以我在想这是否反映的是两个不同层面的分析：其中一个层面是我眼睛可以直接看到的，纯几何外观约束，而另一个层面则是深入的体察它的受力，并且前一个层面其实完全可以决定后一个层面。所以只考虑前一个层面即可。", "raw_message": "您好亲爱的咕呱，今天有事从寄宿制学校回家了，在补之前的视频。也感谢大家的解答[脸红]。在起初看到这个问题的第二个解法时，看到小球在不同位置的处境一样，我的第一想法是换位到小球的感受，结果是，我作为小球，不仅感受到了眼前的几何物理世界，还感受到了拽在我身上的一根绳子的力。所以我就想去分析怎么证明我处在斜面上不同位置，这个力也是一样的。但事实上，这个力的层面的分析好像是没有必要的。所以我在想这是否反映的是两个不同层面的分析：其中一个层面是我眼睛可以直接看到的，纯几何外观约束，而另一个层面则是深入的体察它的受力，并且前一个层面其实完全可以决定后一个层面。所以只考虑前一个层面即可。", "images": ["_imgs/img_f808238f291d.jpg"], "replies": []}, {"id": "ep4:294028157329", "module": "mech", "auto": false, "uname": "咸咸海风吹面哭殇", "face": "_imgs/face_6a1e5e264222.jpg", "like": 1, "message": "这是我这次模考的错题，我对\nD选项有些疑问\n对于这个D选项，他这个小球在往下跑的时候应该是有一个向下的加速度吧，然后会导致这个物块也有一个沿着斜面向上的加速度，如果以鞋面为参考系的话，那么这个物块应该受到一个斜面上向下的惯性力，对应的，这个惯性力会影响沿着斜面方向的摩擦力大小，那么也就会引起这个物快的受力情况发生改变，那么，也就是说摩擦力与支持力就不一定是始终保持恒定的，如果看见希望能答疑一下，谢谢🙌", "raw_message": "这是我这次模考的错题，我对\nD选项有些疑问\n对于这个D选项，他这个小球在往下跑的时候应该是有一个向下的加速度吧，然后会导致这个物块也有一个沿着斜面向上的加速度，如果以鞋面为参考系的话，那么这个物块应该受到一个斜面上向下的惯性力，对应的，这个惯性力会影响沿着斜面方向的摩擦力大小，那么也就会引起这个物快的受力情况发生改变，那么，也就是说摩擦力与支持力就不一定是始终保持恒定的，如果看见希望能答疑一下，谢谢[打call]", "images": ["_imgs/img_30eed8071062.jpg"], "replies": []}, {"id": "ep4:296180034240", "module": "energy", "auto": false, "uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 5, "message": "【帮帮孩子😭】一直没有想通怎么直观地分析能量。怎么找全一个情形中涉及的能量？怎么找到能量之间的关系？所谓的“输入”和“输出”到底是什么意思？怎么找全哪些是输入哪些是输出？\n\n(比如一个传送带把放在它上面的物块加速到共速，这个过程相比没有东西放在它上面，多消耗的电能怎么看？🙂我以前尝试分析：没有东西在传送带上面的时候，电能转化为内能和传送带的动能；有物块在上面的时候，电能除了转化为内能和传送带的动能，还多出一部分用于将物块提升到与传送带共速，进而得出多做的功就是物块增加的动能(不知道这个分析有没有问题🐶)。但我这样想的时候总会感觉有些奇怪：你怎么知道物块的动能增加就是因为多消耗了电能？——能量是通过什么神奇的路子传过去了吗？还是因为电能是“输入”？但凭什么它是“输入”呢？)", "raw_message": "【帮帮孩子[大哭]】一直没有想通怎么直观地分析能量。怎么找全一个情形中涉及的能量？怎么找到能量之间的关系？所谓的“输入”和“输出”到底是什么意思？怎么找全哪些是输入哪些是输出？\n\n（比如一个传送带把放在它上面的物块加速到共速，这个过程相比没有东西放在它上面，多消耗的电能怎么看？[微笑]我以前尝试分析：没有东西在传送带上面的时候，电能转化为内能和传送带的动能；有物块在上面的时候，电能除了转化为内能和传送带的动能，还多出一部分用于将物块提升到与传送带共速，进而得出多做的功就是物块增加的动能（不知道这个分析有没有问题[脱单doge]）。但我这样想的时候总会感觉有些奇怪：你怎么知道物块的动能增加就是因为多消耗了电能？——能量是通过什么神奇的路子传过去了吗？还是因为电能是“输入”？但凭什么它是“输入”呢？）", "images": [], "replies": [{"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 4, "message": "1. 看能量最终去处：能量只能流进传送带、物块或者两者间的摩擦损耗。三个去处。其中传送带放不放物块都是一样的，所以区别就在于流进物块的和 摩擦损耗的。\n2. 换一种看法，看微观的传递过程(就是看什么力对谁做多少功)：放不放物块，对传送带来说，受力的唯一区别是传送带多给了一个摩擦力(我就无视弹力了因为它不做功)，传送带自己移动了<span class=\"math\">\\(x\\)<\/span>那么传送带通过摩擦力对外界做了总功fx(输出的总能量)，这份功就是驱动传送带的点击必须多提供给传送带的那份功，不然传送带要被榨干了。\n两种看法是否自洽？摩擦力对物块做的功，就等于物块获得的能量+浪费掉的能量(损耗)。写出来也是，物块获得的能量，就应该是f*物块位移，损耗的能量<span class=\"math\">\\(=f*\\)<\/span>相对位移。加起来就是<span class=\"math\">\\(f\\cdot x(x\\)<\/span>是前面定义的传送带位移)，这就是传送带通过摩擦力这个“排水管道”对外界输出的总能量(也叫传送带克服摩擦力做的功)，也就是外界总共通过摩擦力这个“抽水口”从传送带里抽出多少能量(也叫摩擦力对传送带做了多少负功，“抽水”，所以是负的)，传送带输出的总功只有一些输入进了物块里，成为了物块获得的能量，传送输出的另一些功耗散损失掉了。\n总之，单看能量的流动，你只能获得部分信息，你只能知道几个去向的总和是多少。但是你要想知道到底每条路上流进过去了多少能量，就要看微观机制(什么力对谁做了多少功)，两种看法最终是自洽的。", "id": "ep4:296180034240:r0"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 4, "message": "如果你的问题是，“电机又'看'不到外面的世界，那么电是怎么能像有意识一样，知道要去提供更多能量给传送带？”这也是一样的，光看能量本身是看不全的，要看清楚就要看微观的过程，看受力。分析传送带的受力，里面有电机的驱动力。然后看驱动力做功。这样看了会发现，之所以电机的输出功率会根据“有没有物块”自动调整，是因为在整个装置里，我们假设了传送带速度是不变的，而这实际上是在规定，用一台会根据自动调节输出功率以维持转速恒定的电机。所以电机自发调节功率就一点不奇怪了。", "id": "ep4:296180034240:r1"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 1, "message": "<span class=\"mention\">回复 @不知称何妙<\/span>  是的，我猜到了你是搞不清楚这些语言，所以前面才颠来倒去换不同的语言讲同一件事情。是的，我克服xx里做功，就是我损失了(花费了)能量用来对抗xx力，也可以说是xx力对我做了负功，抽走了我的能量。能量抽走了去了哪里呢？去了给我施加这个力的东西(反作用力对施力物体做正功)，或者以发热或者什么其他方式耗散掉(如果施力物体位移和我的位移不一样)。你说的重力做功的情形里，要注意能量的划分：重力势能是谁具有的？我们先用比较高的观点来讲通，一会儿再讲初级一些的观点。1. 高的观点：重力势能可以看作是重力场具有的。重力做功的过程，是重力场在施力，施力物体是“场”，我在受力。这是比较新奇的视角。于是，按照刚才的说法，我克服重力做功，是我损失能量，没有损耗，能量全都送给了重力场。注意啊，这里说的“我损失能量”，这里的能量还有没有重力势能mgH？没有了！因为前面已经约定好的，现在重力势能mgH在现在的视角下不属于我了，属于重力场。所以我的能量就只有动能。所以就是我损失动能，转化成了重力场的能量，也就是转化成重力势能。这符合你的预期。2. 如果我一定要用初级的观点，把重力势能看作是我具有的，行不行呢？也行。但是你要看清楚谁是施力物体，谁是受力物体。由于重力势能也被看作是我的一部分，实际上此时的“我”已经不再是一般意义上的“我”的样子了，而是“我”+我周围的重力场的样子。所以这种视角下，施力物体也是我自己的一部分，受力物体也是我自己的一部分，重力做功，相当于我的左手对右手通过拉力做功。能量是在左右手之间交换的(也就是在动能、重力势能之间转换)，所以我的总能量没有变化，只不过左右的能量怎么分配发生了变化。这也是符合你的预期的。", "id": "ep4:296180034240:r2"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span>  下期接着问的话要理理清楚，讲到别人不看你这一期的问题依然能直接在下一期里理解你的疑问。", "id": "ep4:296180034240:r3"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "发表一下我的理解吧🐶电能带动着传送带匀速运动在传送带上放上物块后传送带会被摩擦力给“阻碍”然后这个摩擦力作用在物块上就是动能变化而到传送带上就是让传送带动能降低但是电能补充了这个少的能量🐶", "id": "ep4:296180034240:r4"}, {"uname": "E_l_e_n_a_", "face": "_imgs/face_f72504bd8ca7.jpg", "like": 0, "message": "可以这样想：电能驱动传送带转动，传送带的摩擦力带动物块，物块速度变大，导致物块动能增加。不知道这样对理解你的问题是否有一点帮助", "id": "ep4:296180034240:r5"}, {"uname": "佚之森", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "我也想过类似的问题^O^！我觉得 可以对比一下放物块前后的不同情形。放了物块之后传送带也受到了摩擦力 也就是物块对传送带做功了 做的功是<span class=\"math\">\\(f\\)<\/span>乘以传送带的位移 那么为了保持传送带和原来的速度一样 电机就要做功嘞。或者是整个来看 无非就是多了个物块嘛 而且这个物块还有速度了 注意到是<span class=\"math\">\\(f\\)<\/span>在做功 而且摩擦力做工的时候是会有能量耗散的 变成内能 追溯到一切动力的源头电机 那就是电机多做的功了[大笑]", "id": "ep4:296180034240:r6"}]}, {"id": "ep4:293716261281", "module": "vibration", "auto": false, "uname": "秃头少女最后de倔强", "face": "_imgs/face_97fe501a4ddb.jpg", "like": 19, "message": "大家好，想请问一个关于运动叠加的问题。请问这道题目的第三问，在“补偿法”的想法下，单看完整的地球和挖掉的小球，物块在其中的运动都是简谐运动，那么此时是否可视为物块的运动是两个简谐运动的叠加呢？但是直接计算受力得知它做匀加速运动，和想象中的简谐运动不同，这是为什么？那么什么情况下可以将运动分解或叠加呢？这样做对于所受的力的类型有怎样的要求？请指教，谢谢。", "raw_message": "大家好，想请问一个关于运动叠加的问题。请问这道题目的第三问，在“补偿法”的想法下，单看完整的地球和挖掉的小球，物块在其中的运动都是简谐运动，那么此时是否可视为物块的运动是两个简谐运动的叠加呢？但是直接计算受力得知它做匀加速运动，和想象中的简谐运动不同，这是为什么？那么什么情况下可以将运动分解或叠加呢？这样做对于所受的力的类型有怎样的要求？请指教，谢谢。", "images": ["_imgs/img_dc870b155535.jpg"], "replies": [{"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 4, "message": "提问的同学 @秃头少女最后de倔强 和我在前面的描述中有个错误，挖空的是排斥，所以这个分运动不是一个简谐，也不是局限的运动，而是一个快速发散的运动。感谢 @道格拉斯-路西恩 和另一位因过于傲慢和反复的攻击性评论被拉黑的同学 指出。不过这不是本质的问题，我也相信提问的同学并不会在这件事情上有疑问。就像后面有位同学 @xyz179(感谢[保佑])帮忙解释的那样，匀速直线运动仍不可能等价于 简谐+“反简谐”运动，所以矛盾仍然存在。错的地方在分解的过程。请看评论区里同学的解释", "id": "ep4:293716261281:r0"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 3, "message": "<span class=\"mention\">回复 @傻哭啦是小迷妹<\/span> 你们应该没理解她的困惑。她肯定知道“如果<span class=\"math\">\\(F_{1}F_{2}\\)<\/span>关于<span class=\"math\">\\(x\\)<\/span>都是线性的，那么合力也是线性的。”在这个问题里，刚好是斜率抵消了，所以合力是常数，所以匀速直线。这些她都知道。她困惑的点是这样的：\n不是说力关于位移线性的时候就可以运动分解然后两个运动互不干涉、各司其职吗(想想教过的简谐运动里面的分解、配速法 都是这么做的)？所以她现在开始分解了：只有<span class=\"math\">\\(F_{1}\\)<\/span>的时候的运动位移记为<span class=\"math\">\\(x_{1}\\)<\/span>，这个运动是简谐的。只有<span class=\"math\">\\(F_{2}\\)<\/span>的时候的运动位移记为<span class=\"math\">\\(x_{2}\\)<\/span>，这个运动是简谐的。所以现在<span class=\"math\">\\(F_{1}F_{2}\\)<\/span>一起加上，那么物体应该是原本两个分运动的叠加咯，<span class=\"math\">\\(x=x_{1}+x_{2}\\)<\/span>。那就奇怪了，我知道<span class=\"math\">\\(x_{1}x_{2}\\)<\/span>都是简谐振动，也就是会被限制在一个区域内的往复运动，而<span class=\"math\">\\(x\\)<\/span>我也知道，前面普通的做法做出来了，是匀速直线，那是一路跑下去的。两个限制在一定区域内的往复运动怎么可能加起来变成一个一路跑出去的运动呢？这不是有鬼了吗🐶", "id": "ep4:293716261281:r1"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 2, "message": "又是一个非常好的问题，却无人问津。我赌50块这个问题会后来居上获得本期大奖。", "id": "ep4:293716261281:r2"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 2, "message": "<span class=\"mention\">回复 @秃头少女最后de倔强<\/span> 提示：“线性的受力规律下，运动可以分解成两个互不干涉的运动”这里的分解真的是像你这里这么做的吗？你可以对比你可能熟悉的配速法的例子：磁场里有一个电荷，受到重力和洛伦兹力。我们是怎么分解的？我们是分解成两个运动，其中一个受到重力和洛伦兹力，另一个只收到洛伦兹力。\n为什么是这样分解？为什么两个分运动都受洛伦兹力？是不是我们重复算了，其中一个已经受到了洛伦兹力，另一个就不该再受一遍了？哦洛伦兹力要算两份的，那重力怎么又是只有算一份就够了？\n在你这里，你说分成两个运动，你说分运动1仿佛只看到弹簧1，分运动2仿佛只看到弹簧2。这暗含的意思是，“弹簧1已经加在运动1上了，因此弹簧1的效果已经记入了，就不该再加到2上再算一遍了”。所以是不是相当于我上面“配速法里洛伦兹力效果为什么算了两份”这个疑问？\n所以啊，我在教“力关于运动线性的系统里可以这样分解”的时候强调过几次，“请自己去写一写，看看清楚为什么是这样拆分的。写一写看看“线性”到底在这里面是怎么起作用的。”这个事情我估计没人按照我要求的做，评论区里现有的回答也都还是在“猜”的阶段，有没有人去写一下到底怎么拆成两个运动的，“线性”到底能给出什么、不能给出什么呢？不自己写一遍那是很难看得清的。", "id": "ep4:293716261281:r3"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 2, "message": "线性力里面，正比例的部分叫<span class=\"math\">\\(F\\)<\/span>，那么正比例给出的唯一条件是<span class=\"math\">\\( F(x_{1}+x_{2}) =F(x_{1})+F(x_{2})\\)<\/span>。没有别的了。题目里<span class=\"math\">\\(F\\)<\/span>有两部分组成<span class=\"math\">\\( F=F_{1}+F_{2}\\)<\/span>。所以正确的分解时<span class=\"math\">\\( F(x)=F_{1}(x)+F_{2}(x)=F_{1}(x_{1}+x_{2})+F_{2}(x_{1}+x_{2})= F_{1}(x_{1})+F_{1}(x_{2})+F_{2}(x_{1})+F_{2}(x_{2}). \\)<\/span>这就是我说的“分运动<span class=\"math\">\\(x_{1}\\)<\/span>和<span class=\"math\">\\(x_{2}\\)<\/span>要同时看见<span class=\"math\">\\(F_{1}\\)<\/span>和<span class=\"math\">\\(F_{2}\\)<\/span>”所指的意思。而题主犯的错误实际上是，没有好好写，直接凭感觉猜，<span class=\"math\">\\(F(x)=F_{1}(x_{1})+F_{2}(x_{2})\\)<\/span>，再放进<span class=\"math\">\\(F=ma\\)<\/span>里，于是她才得出错误结论 “<span class=\"math\">\\(x_{1}\\)<\/span>是只看到力1的时候的运动，<span class=\"math\">\\(x_{2}\\)<\/span>是只看到<span class=\"math\">\\(x_{2}\\)<\/span>的时候的运动，<span class=\"math\">\\(x\\)<\/span>是两分运动的叠加”。这样她其实是漏了交叉项", "id": "ep4:293716261281:r4"}, {"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 0, "message": "<span class=\"mention\">回复 @物理系咕咕叫兽<\/span> 我不理解🤔，我的想法是运动可以看做地球导致的简谐运动和小球导致的运动，但小球导致的运动就根本不是简谐运动啊🤔因为补偿在这里可以将小球看做一个“负质量”的小球，所提供的根本就不是回复力而是排斥力啊🤔那所做的不应该是一个“反简谐运动”吗。", "id": "ep4:293716261281:r5"}, {"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 0, "message": "<span class=\"mention\">回复 @秃头少女最后de倔强<\/span> 顺便能发下图吗🐶", "id": "ep4:293716261281:r6"}, {"uname": "傻哭啦是小迷妹", "face": "_imgs/face_3b1ef16107e8.jpg", "like": 0, "message": "你是问…为什么两个简谐运动的叠加，并不是简谐运动，是嘛？\n\n那等于是在问：如果<span class=\"math\">\\(F_{1} = k_{1}(x - x_{01})\\)<\/span>、<span class=\"math\">\\(F_{2} = k_{2}(x - x_{02})\\)<\/span>，那么<span class=\"math\">\\((F_{1} + F_{2})\\)<\/span>是否与<span class=\"math\">\\(x\\)<\/span>成正比…对吧？\n\n或者换个角度…如果<span class=\"math\">\\(x_{1} = \\sin (\\omega 1x + \\varphi_{1}) + x_{01}\\)<\/span>、<span class=\"math\">\\(x_{2} = \\sin (\\omega 2x + \\varphi_{2})) + x_{02}\\)<\/span>，那么<span class=\"math\">\\((x_{1} + x_{2})\\)<\/span>也不一定能化成<span class=\"math\">\\(\\sin (\\omega x + \\varphi ) + x_{0}\\)<\/span>的形式，对吧？", "id": "ep4:293716261281:r7"}, {"uname": "傻哭啦是小迷妹", "face": "_imgs/face_3b1ef16107e8.jpg", "like": 0, "message": "<span class=\"mention\">回复 @物理系咕咕叫兽<\/span> 你这么一解读，我得给原问题点个赞了…顺便救一下你的50块钱…", "id": "ep4:293716261281:r8"}, {"uname": "Mr饼先森", "face": "_imgs/face_0607120b4eb0.jpg", "like": 0, "message": "<span class=\"mention\">回复 @物理系咕咕叫兽<\/span>  我猜分解时，没有考虑运动的互不干涉，就像遛狗模型那样，不能像数学那样矢量分解，物理上有自己的牵制。\n这个问题很有意思，想学好物理还是得多思考啊", "id": "ep4:293716261281:r9"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 0, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span>  所以两个叠加，一推一拉，刚好抵消了？", "id": "ep4:293716261281:r10"}, {"uname": "爱国牢大", "face": "_imgs/face_d938240c9f10.jpg", "like": 0, "message": "- 力永远可以矢量叠加，但运动形式的叠加有严格条件，只有合力仍满足原运动形式的线性关系时才成立。\n\n- 本题中两个简谐运动的受力叠加后，线性回复项抵消，得到恒力，因此运动变为匀加速直线运动，而非简谐运动。\n\n- 运动分解/叠加的核心要求：力的叠加必须满足线性关系，且叠加后合力的形式要对应目标运动形式。", "id": "ep4:293716261281:r11"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @初见成效-<\/span>  你应该是没看懂提问的同学和咕咕后来帮他解释的“分解”是怎么个意思。这题目本身的结论是显然的，提问的人也知道该是什么样，也正是因为结论显然不可撼动，才导致提问的同学非常清楚她的“分解”的论述给出的结论是错的。然而知道错却又看不出错在了哪，所以才提的问。", "id": "ep4:293716261281:r12"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @初见成效-<\/span> 排斥 不用简谐 也是不对的呀。你参加竞赛的人这点不会看不明白吧？势能是倒扣的碗，是可以去无穷远的，可是它偏离的越远加速越快。这个运动去和一个正放的碗里的简谐运动一叠加，怎么会叠加出来匀速直线？你没看到她错在哪。错在咕咕指出的：线性叠加做错了", "id": "ep4:293716261281:r13"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @初见成效-<\/span> 能叠加，但她叠加的方式是错的：分运动1只看见第1个线性力，分运动2只看见第2个线性力。这是错的。正确的是，分运动1同时看见1、2两个线性力，分运动2也同时看见两个线性力。", "id": "ep4:293716261281:r14"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @xyz179<\/span> 我说的不严谨，上面说的是正比的部分，是那样叠加的。常数的部分是只需要算一份就够了。", "id": "ep4:293716261281:r15"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @初见成效-<\/span> 配速法就是这么分解的 简谐振动里面也是这么分解的", "id": "ep4:293716261281:r16"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @初见成效-<\/span> 线性力里面，正比例的部分叫<span class=\"math\">\\(F\\)<\/span>，那么正比例给出的唯一条件是<span class=\"math\">\\( F(x_{1}+x_{2}) =F(x_{1})+F(x_{2})\\)<\/span>。没有别的了。题目里<span class=\"math\">\\(F\\)<\/span>有两部分组成<span class=\"math\">\\( F=F_{1}+F_{2}\\)<\/span>。所以正确的分解时<span class=\"math\">\\( F(x)=F_{1}(x)+F_{2}(x)=F_{1}(x_{1}+x_{2})+F_{2}(x_{1}+x_{2})= F_{1}(x_{1})+F_{1}(x_{2})+F_{2}(x_{1})+F_{2}(x_{2}). \\)<\/span>这就是我说的“分运动<span class=\"math\">\\(x_{1}\\)<\/span>和<span class=\"math\">\\(x_{2}\\)<\/span>要同时看见<span class=\"math\">\\(F_{1}\\)<\/span>和<span class=\"math\">\\(F_{2}\\)<\/span>”所指的意思。而题主犯的错误实际上是，没有好好写，直接凭感觉猜，<span class=\"math\">\\(F(x)=F_{1}(x_{1})+F_{2}(x_{2})\\)<\/span>，再放进<span class=\"math\">\\(F=ma\\)<\/span>里，于是她才得出错误结论 “<span class=\"math\">\\(x_{1}\\)<\/span>是只看到力1的时候的运动，<span class=\"math\">\\(x_{2}\\)<\/span>是只看到<span class=\"math\">\\(x_{2}\\)<\/span>的时候的运动，<span class=\"math\">\\(x\\)<\/span>是两分运动的叠加”。这样她其实是漏了交叉项", "id": "ep4:293716261281:r17"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @初见成效-<\/span> 你怎么还在这跟排斥吸引过不去呢。我前面最开始已经说了，这个问题不在于排斥吸引。我知道是排斥，题主说简谐是不对的，可是线性是没错的，只要你按题主线性叠加的做法做下去，即使你知道是排斥，结果也是矛盾的，悖论仍然存在。因为一个倒扣的碗里的运动(速度随时间高次发散)叠加上一个正立的碗里的运动(简谐，局域)仍然不会叠加出匀速直线(速度0次)。这可是我很早就跟你解释的哈", "id": "ep4:293716261281:r18"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @初见成效-<\/span> 这求解你以为谁不会啊，连题主自己都说了答案了，问题这是在回答人家的疑惑啊，人家的疑惑恰恰是基于人家会求解的基础上才有的，在这儿反复说你会求有什么意义呢。人家说错一个点，妨碍了你理解，ok那我也替人家解释了，我也指出了，那并不影响人家的悖论产生的根源。怎么就不愿意去直面根源呢", "id": "ep4:293716261281:r19"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @初见成效-<\/span> 你知道“唯象模型”什么意思嘛，好像用在这里并不符合它的意思哦…你在说什么…", "id": "ep4:293716261281:r20"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @初见成效-<\/span> 你怎么听不懂呢，一个倒扣一个正扣的碗受力当然抵消，这谁不知道啊 但是你看她题主描述的理解方法呀，她是这么算的吗，她是拿一个碗算运动 拿另一个碗算另一个运动，叠加起来。她就是在问，为什么这样叠积起来和正确的答案(匀速)不一样了，你怎么get不到呢", "id": "ep4:293716261281:r21"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @初见成效-<\/span> 按题主的做法，是一个速度随时间高次发散的运动，叠加上一个局域的振动，这是绝对不可能加出来匀速直线的(常数)。", "id": "ep4:293716261281:r22"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @初见成效-<\/span> 问题就是在这里呀，她会传统的做，知道是匀速，知道力加起来只剩常数了，但她故意不传统的做，想试试她线性叠加的想法，但是她做错了，想当然的一份力给出一个分运动，然后把分运动直接加起来，这里面漏掉了交叉项，第一个分运动也应该受制于第二个“弹簧”，第二个分运动也应该受制于第一根“负弹簧”。才是她错的地方。", "id": "ep4:293716261281:r23"}]}, {"id": "ep4:296173134192", "module": "vibration", "auto": false, "uname": "MySiddhartha", "face": "_imgs/face_48077d89217a.jpg", "like": 10, "message": "上一次发送没有什么回应啊，不知道是不是我这个问题不够好，或者我有一些视频还没有看，所以理解不到位的原因导致的。我是高三生，再发一下😁。\n我这个问题是有关假设调整法的一点补充讨论。感谢大家解决我的疑惑☺️：我在做下面这道小问题，比如说c选项时，我当时直接根据分离时加速度相同，画出了<span class=\"math\">\\(a\\)<\/span>和b各自的受力分析，接着从这个情形\"往后\"分析一点，发现<span class=\"math\">\\(a\\)<\/span>和b确实会分离。然而我却错了，错在这个AB各自分离时的情况，事实上是我假设出来的，也就是说我假设它能分离，那么<span class=\"math\">\\(a\\)<\/span>和b将会在这个点这样受力，此时弹簧给的弹力是向上的<span class=\"math\">\\(\\frac{G}{2}\\)<\/span>。然而，\"往前\"溯，我这个假设时的情形真的能发生吗？所以我又回归弹簧振子的简谐分析，发现这个弹簧振子在最高点时，弹簧给的弹力是向上的<span class=\"math\">\\(G\\)<\/span>，也就是说，AB分离的那种情况的对弹簧振子位置要求比简谐振动的情况的要求还要更往上一点。而这个简谐振动，已经是符合真实物理世界的一种运动情况了，所以我在这两种运动情形中最终敲定这个糸统应该是整体做简谐振动上下反复，而不会发生<span class=\"math\">\\(a\\)<\/span>与b的分离。\n①请问我的这套逻辑在每一个节点是否完善？比如从对分离情况的分析转到分析简谐振动，再通过两种情况的要求大小的比较得出真实物理世界发生的情形。是否有更好的表述？\n②我是否可以认为，假设调整法中的调整不止要看从假设情形，往后看这个情形是否还能保持，而且也要往回溯，看我假设这个情形是否能发生？☺️", "raw_message": "上一次发送没有什么回应啊，不知道是不是我这个问题不够好，或者我有一些视频还没有看，所以理解不到位的原因导致的。我是高三生，再发一下[呲牙]。\n我这个问题是有关假设调整法的一点补充讨论。感谢大家解决我的疑惑☺️：我在做下面这道小问题，比如说c选项时，我当时直接根据分离时加速度相同，画出了a和b各自的受力分析，接着从这个情形\"往后\"分析一点，发现a和b确实会分离。然而我却错了，错在这个AB各自分离时的情况，事实上是我假设出来的，也就是说我假设它能分离，那么a和b将会在这个点这样受力，此时弹簧给的弹力是向上的G/2。然而，\"往前\"溯，我这个假设时的情形真的能发生吗？所以我又回归弹簧振子的简谐分析，发现这个弹簧振子在最高点时，弹簧给的弹力是向上的G，也就是说，AB分离的那种情况的对弹簧振子位置要求比简谐振动的情况的要求还要更往上一点。而这个简谐振动，已经是符合真实物理世界的一种运动情况了，所以我在这两种运动情形中最终敲定这个糸统应该是整体做简谐振动上下反复，而不会发生a与b的分离。\n①请问我的这套逻辑在每一个节点是否完善？比如从对分离情况的分析转到分析简谐振动，再通过两种情况的要求大小的比较得出真实物理世界发生的情形。是否有更好的表述？\n②我是否可以认为，假设调整法中的调整不止要看从假设情形，往后看这个情形是否还能保持，而且也要往回溯，看我假设这个情形是否能发生？☺️", "images": ["_imgs/img_1037074bc492.jpg"], "replies": [{"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 5, "message": "你分析的很好啊，问题描述的也很清楚。你可能要想清楚，“假如刚好分离”这里得出的结论到底是什么？这得出的结论应该是，如果此时刚刚分离，那么此时的弹簧伸长必须是“它产生的弹力<span class=\"math\">\\(=\\frac{G}{2}\\)<\/span>”的位置 (这样下面这个物块才会是<span class=\"math\">\\( \\frac{g}{2} \\)<\/span>向下加速，和上面的物块加速度匹配)。但是这并不意味着就弹簧就“真的能”伸长到“它产生的弹力<span class=\"math\">\\(=\\frac{G}{2}\\)<\/span>”的位置。一根弹簧到底能不能伸到某个特定的位置，这就是在问运动的幅度，这当然是分离前的这段过程确定的了，而这段过程刚好是简谐振动，容易判断幅度，所以你才去做你第二段的分析。\n所以你总结到的经验，不应该是“我们以后记住，弹簧分离题型里，要分析一下分开之后的情况，同时还要回过头分析一下分开前的”。不总是这样的。我们这道题里需要回头来分析分离前的，只是因为发现分离后的分析给出的只是个必要非充分条件，充分与否，这里刚好是由前一段过程确定下来的。", "id": "ep4:296173134192:r0"}]}, {"id": "ep4:293692728881", "module": "esfield", "auto": false, "uname": "愿你Happy每一天", "face": "_imgs/face_8cc8e44645ef.jpg", "like": 8, "message": "咕咕不知道你有没有想过一个问题，在同一球面上的等量同种电荷的分布在两个是直线，三个时是正三角形，四个时是正四面体，都满足球心与电荷的连线两两夹角相同(180 120 109度28分)，而当放置五个这样的电荷时，它的形状算出来则是三角双锥，并不满足两两夹角相同，而是180 120 90有三种情况，为什么这种“两两夹角相同”的性质在放置第五个以及更多的电荷的时候不见了呢？\n我的结论是与对称性有关", "raw_message": "咕咕不知道你有没有想过一个问题，在同一球面上的等量同种电荷的分布在两个是直线，三个时是正三角形，四个时是正四面体，都满足球心与电荷的连线两两夹角相同（180 120 109度28分），而当放置五个这样的电荷时，它的形状算出来则是三角双锥，并不满足两两夹角相同，而是180 120 90有三种情况，为什么这种“两两夹角相同”的性质在放置第五个以及更多的电荷的时候不见了呢？\n我的结论是与对称性有关", "images": [], "replies": [{"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 2, "message": "不太理解🐶，我的想法是分布要能量最低，根据电场的分布关系，与其他电荷离得远的收益远小于和另一个电荷离得近，所以电荷间的距离要两两相等。而三维空间内最多只有四个点满足，在这里可以提出一个猜想<span class=\"math\">\\(n\\)<\/span>对n+1🐶。那五个点找不到就需要在关系和形状上做妥协🐶", "id": "ep4:293692728881:r0"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 2, "message": "有趣。相当于是在问为什么只有这么几种正多面体，是吧。嗯确实是个群论的问题……", "id": "ep4:293692728881:r1"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 2, "message": "<span class=\"mention\">回复 @愿你Happy每一天<\/span>  这个问题的本质应该不在于势能的具体形式。不管你用什么样的排斥相互作用，用电荷用弹簧，都会出现这样一种对称破缺的情况。这个现象反映的是对称性本身的性质。", "id": "ep4:293692728881:r2"}, {"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 0, "message": "<span class=\"mention\">回复 @愿你Happy每一天<\/span> 我的问题在于，我们如何从高维的对称性得当三维的妥协，就是能不能找一个方法，从高维的对称性得多在低维的妥协是怎么样的，等下我考虑一下二三维的情况", "id": "ep4:293692728881:r3"}, {"uname": "赤开团时", "face": "_imgs/face_93e6915d2020.jpg", "like": 0, "message": "高中生瑟瑟发抖", "id": "ep4:293692728881:r4"}]}, {"id": "ep4:296250066192", "module": "esfield", "auto": false, "uname": "lambdark", "face": "_imgs/face_49f797dafdb7.jpg", "like": 8, "message": "一个看似简单却值得细想的问题", "raw_message": "一个看似简单却值得细想的问题", "images": ["_imgs/img_285a6c1cad91.jpg", "_imgs/img_290325cfd616.jpg"], "replies": [{"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 1, "message": "事实上，小球不可能往下滑🐶当<span class=\"math\">\\(h\\)<\/span>大于临界值时在这个区间，<span class=\"math\">\\(h\\)<\/span>越小，库仑力的竖直分量反而越大(因为距离减小带来的增益超过了角度变差带来的损失)。球因为漏电往下掉<span class=\"math\">\\(h\\)<\/span>减小，库仑力的竖直分量变大，重新托住重力。区间2，当<span class=\"math\">\\(h\\)<\/span>小于临界值时在这个区间，<span class=\"math\">\\(h\\)<\/span>越小，库仑力的竖直分量越小(因为角度变差得太快，距离缩短也救不回来)。球因为漏电往下掉<span class=\"math\">\\(h\\)<\/span>减小，库仑力的竖直分量进一步减小，更加托不住重力，小球加速坠落。", "id": "ep4:296250066192:r0"}, {"uname": "sakuraknd", "face": "_imgs/face_fee54cf45fed.jpg", "like": 1, "message": "你是不是把你给的式子理解为描述<span class=\"math\">\\(a\\)<\/span>初始电荷量不同时，<span class=\"math\">\\(a\\)<\/span>的电荷量和<span class=\"math\">\\(h\\)<\/span>会如何变化了？但是你这个式子的作用不是描述当<span class=\"math\">\\(a\\)<\/span>的电荷量和<span class=\"math\">\\(h\\)<\/span>是多少时，<span class=\"math\">\\(a\\)<\/span>受力平衡吗，不能仅凭它就推出 h 和电荷量如何随初始条件变化。", "id": "ep4:296250066192:r1"}, {"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 0, "message": "<span class=\"mention\">回复 @lambdark<\/span> 其实考虑了🐶因为在这里库仑力变小基本就是一个下降趋势。而且其实无论是在临界值以上或是以下加大电荷量，应该都不会平衡在一点，而是上下运动🐶", "id": "ep4:296250066192:r2"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "可以想到往上和往下的可能性但是还是没有想到在二分之根号二<span class=\"math\">\\(l\\)<\/span>处漏电的情况，是题目设置的问题还是哪方面少了呢？", "id": "ep4:296250066192:r3"}, {"uname": "sakuraknd", "face": "_imgs/face_fee54cf45fed.jpg", "like": 0, "message": "<span class=\"mention\">回复 @sakuraknd<\/span>  你把'平衡条件'和'变化规律'搞混了\n🐶", "id": "ep4:296250066192:r4"}, {"uname": "伊始志伊", "face": "_imgs/face_1890861f97f2.jpg", "like": 0, "message": "哥 nb我一模单选压轴考到了 但是是个球 它问<span class=\"math\">\\(\\frac{q}{r}\\)<\/span>将怎么变🤩谢谢哥 我秒了", "id": "ep4:296250066192:r5"}]}, {"id": "ep4:293682010705", "module": "em", "auto": false, "uname": "黑白物理", "face": "_imgs/face_1db03fe6301c.jpg", "like": 6, "message": "感谢咕咕之前对高考题的答疑。这次想问一个关于法拉第电磁感应定律的问题。在高中物理中，由于数学工具的缺乏，我们只能用回路的磁通量变化率计算回路的总感应电动势，以及通过构造回路的方法计算一些非闭合的形状上的感应电动势。\n这一公式在解释一些情况时显得有些捉襟见肘，比如在磁电式电流表的辐向磁场中，线框的磁通量始终为0，但转动时回路却显然有感应电动势(可以从切割磁感线的角度得到两条边上的动生电动势)，怎么解释这一情况呢？\n顺便想了解下，计算感应电动势的更通用的方法，应该是怎样的数学形式呢？", "raw_message": "感谢咕咕之前对高考题的答疑。这次想问一个关于法拉第电磁感应定律的问题。在高中物理中，由于数学工具的缺乏，我们只能用回路的磁通量变化率计算回路的总感应电动势，以及通过构造回路的方法计算一些非闭合的形状上的感应电动势。\n这一公式在解释一些情况时显得有些捉襟见肘，比如在磁电式电流表的辐向磁场中，线框的磁通量始终为0，但转动时回路却显然有感应电动势（可以从切割磁感线的角度得到两条边上的动生电动势），怎么解释这一情况呢？\n顺便想了解下，计算感应电动势的更通用的方法，应该是怎样的数学形式呢？", "images": ["_imgs/img_7720fc04960e.jpg"], "replies": [{"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 4, "message": "你最前面的描述里似乎说的是一个不闭合的电路里的感应电动势，这是个很好的问题，我没有看到任何人理清楚这些，我打算攒着以后再讲(上一期评论区其实有问题可以延伸到，但是学生们没有深入研究，无人发觉)。\n但是你下面举的这个具体的例子我觉得是另外一个问题：其实是关于磁感线自己有没有闭合的。我直接回答你给的这个例子：你看这个图，它只画了幅条部分，但是磁感线是不可以到此为止的，必须闭合，有进就有出。所以右边钻进去的磁感线是要一路连到左边出来的。脑补上这些藏起来的磁感线，就不会再说“磁通量始终为零”了。图中的情况倒是刚好为0的，因为上下对称，磁感线不能从上往下穿，也不能从下往上穿。但这是特殊情况。看一般的情况，比如看线圈竖起来的状态，其实线框里是穿过了所有的磁通(也就是刚才脑补出来的那些)，所以磁通在旋转过程中始终是变化的。这样就解决了矛盾。", "id": "ep4:293682010705:r0"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 2, "message": "<span class=\"mention\">回复 @黑白物理<\/span>  不需要知道铁芯内部的具体分布。只需要铭记“磁感线进来多少就出去多少”就够了。比如，现在你比较位形1和位形2的磁通变了多少，你只需要把1、2两个面夹着的那块空间(大概是两个扇形的样子，像两块对顶的“蛋糕”)切出来看，这一整块“蛋糕”上，磁场都是从蛋糕的侧面和1、2两个平面穿入穿出的，“蛋糕”的上下表面(也就是图中的里外方向)没有磁场穿入。因此，1和2比相差的磁通就是从蛋糕侧面穿出的磁通。所以刺痛的变化率确实是正比于“蛋糕侧面”的B、蛋糕高度(线框深度L)、“蛋糕周长增长速率”(即线框扫的速度v)的。<span class=\"math\">\\(B\\,L\\,v\\)<\/span>。", "id": "ep4:293682010705:r1"}]}, {"id": "ep4:293797120641", "module": "em", "auto": false, "uname": "-Sir-xiao", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 5, "message": "一道洛伦兹力冲量的习题，在学校学习这个方法的时候，我感觉在使用洛伦兹力冲量(列出它是水平 竖直方向动量定理与整个的能量守恒)的时候总是事先感觉不知道能用这三个式子求出些什么，感觉完全是数学解方程的感觉。只是模糊地觉得当初末状态知道的比较多的时候可以用这个方法。这样子来解题心里总有不踏实的感觉。\n此外在这道题中我觉得整个运动的情形是确定的，所以应该可以求出例子的水平位移(虽然题目没问)，但是我列出来这几个方程不知道该如何来求，希望能得到解答", "raw_message": "一道洛伦兹力冲量的习题，在学校学习这个方法的时候，我感觉在使用洛伦兹力冲量（列出它是水平 竖直方向动量定理与整个的能量守恒）的时候总是事先感觉不知道能用这三个式子求出些什么，感觉完全是数学解方程的感觉。只是模糊地觉得当初末状态知道的比较多的时候可以用这个方法。这样子来解题心里总有不踏实的感觉。\n此外在这道题中我觉得整个运动的情形是确定的，所以应该可以求出例子的水平位移（虽然题目没问），但是我列出来这几个方程不知道该如何来求，希望能得到解答", "images": ["_imgs/img_3ccf9fa6bf53.jpg"], "replies": [{"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 1, "message": "确实是确定的，只不过并不是所有唯一确定的东西都能在我们高中生已经掌握的数学方法下计算出来。物理上这条轨迹的确定的方式是，一点的状态确定了，加速度就确定了，那么下一点的状态也就跟着确定了，这样“一点推下一点”确定下的整条轨迹，但是求解这样的确定方式求解起来一般是需要微积分的，我们高中生不掌握这种一般的求解技术，只有一些特殊设计的情形才是高中生能计算的，比如匀加速，或者一些能过通过守恒量绕过计算中间过程，直接确定下末状态的情况。你给的这个磁场是不均匀的，这情况已经比普通的情况更“一般”了，其实它题目问的问题已经相当于用到微积分了，只不过是最简单的微积分，相当于匀加速运动算位移的复杂程度，我们刚好是会的。但如果你要随便问一个其他的量，比如你问的位移，虽然也是确定的，但不能保证高中生可以求解。", "id": "ep4:293797120641:r0"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "求出水平位移是可以的，因为整个情景已经确定下来了，按照经典物理学来说肯定上可以求出来的，但是只不过像是导数中的隐零点问题一样，你在高中的代数方法不能支持你去解出它🐶", "id": "ep4:293797120641:r1"}, {"uname": "雷苇航", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "哦，好的。那这个问题可以用高中范围内的方式求解吗", "id": "ep4:293797120641:r2"}]}, {"id": "ep4:296283691440", "module": "em", "auto": false, "uname": "Tanga_Ibuki", "face": "_imgs/face_fd8b67741918.jpg", "like": 4, "message": "这里想借着这道题来谈谈感生的事，就比如图(b)当中，当金属框全部进入磁场区域时，我们老师讲的是可以等效为两个电源并联，但是我对两个带内阻的电源并联不太会处理，于是我去看整个回路，发现：金属框内的磁通量没有改变，而框左侧的回路的磁通量一直增大，那么根据感生理论，框左侧会产生感应电动势——而问题是，这个电动势到底体现在哪一部分？只是左边的回路？还是导轨加整个金属框构成的回路？\n我同时还观察到整个回路的磁通量也一直在增大，速率和左侧回路的磁通量变化速率相同，这是否说明“只看左侧回路”和“只看整个回路”得到的电动势体现的形式是相同的？我十分困惑", "raw_message": "这里想借着这道题来谈谈感生的事，就比如图(b)当中，当金属框全部进入磁场区域时，我们老师讲的是可以等效为两个电源并联，但是我对两个带内阻的电源并联不太会处理，于是我去看整个回路，发现：金属框内的磁通量没有改变，而框左侧的回路的磁通量一直增大，那么根据感生理论，框左侧会产生感应电动势——而问题是，这个电动势到底体现在哪一部分？只是左边的回路？还是导轨加整个金属框构成的回路？\n我同时还观察到整个回路的磁通量也一直在增大，速率和左侧回路的磁通量变化速率相同，这是否说明“只看左侧回路”和“只看整个回路”得到的电动势体现的形式是相同的？我十分困惑", "images": ["_imgs/img_cd2284d16971.jpg"], "replies": [{"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "带电阻的电源其实还是好分析的，更别说这两个杆产生的电动势一样了，在两个端点处的电动势都相同，把内阻给合并就行了。左侧会产生感应电动势，在左边的杆上会有感应电动势，在右侧相框内的磁通量不会变，也就是只有左侧的磁通量改变，所以说右侧的感应电动势应该是0吗？肯定不是。因为相框中磁通量没有变化所以说应该是这两个杆之间没有电流也就是两个杆都会产生感应电动势并且还是一样的因为要抵消掉。所以说实际上改变的磁通量从而产生的电动势还是分到了两个杆上并且还是相同的。电动势体现的形式上不一样的，电流会产生磁场所以说还是少分析了在两个杆之间的电路关系🐶", "id": "ep4:296283691440:r0"}]}, {"id": "ep4:293697033457", "module": "em", "auto": false, "uname": "E_l_e_n_a_", "face": "_imgs/face_f72504bd8ca7.jpg", "like": 2, "message": "正在学电磁学的大学生也想请教各位老滑块一个问题[给心心]，当电场穿过不同材料时，平行方向<span class=\"math\">\\(E\\)<\/span>连续，垂直方向D连续；磁场穿过不同材料时，平行方向分量<span class=\"math\">\\(H\\)<\/span>连续，垂直方向分量B连续，虽然我们知道可以用高斯定律等证明，但理解起来还是觉得好奇怪呀…", "raw_message": "正在学电磁学的大学生也想请教各位老滑块一个问题[给心心]，当电场穿过不同材料时，平行方向E连续，垂直方向D连续；磁场穿过不同材料时，平行方向分量H连续，垂直方向分量B连续，虽然我们知道可以用高斯定律等证明，但理解起来还是觉得好奇怪呀…", "images": [], "replies": [{"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 4, "message": "<span class=\"mention\">回复 @E_l_e_n_a_<\/span>  刚才的一长段回复好像搞错了问题，没答到你问的。下面重新答：\n我知道你预期中的那种对应(E对B，D对H)其实是基于以下想法 “<span class=\"math\">\\(E\\)<\/span>、B是真空中的电、磁，D、<span class=\"math\">\\(H\\)<\/span>是介质中的电、磁，所以让人觉得真空中的电对应真空中的磁，介质中的电对应介质中的磁。” 但这样的想法是错的。并没有人允诺过电磁之间是这样对应起来的。<span class=\"math\">\\(E\\)<\/span>和B的地位本来就很不一样，它们不是简单的“相似”，这你可以从很多角度可以看出，比如从对称性上，<span class=\"math\">\\(E\\)<\/span>是极矢量，B是赝矢量，行为并不一样。比如在静态的maxwell方程里，你也看到了，<span class=\"math\">\\(E\\)<\/span>是旋度<span class=\"math\">\\(=0(\\)<\/span>界面上切向分量连续)，B是散度<span class=\"math\">\\(=0(\\)<\/span>界面上法向分量连续)。所以EB确实不是在简单的复刻彼此的行为，它们之间更像是一种“互补”的关系，你做一件事，我就做另一件事。从电磁场的能动张量也可以看到这种感觉。这些都是非常表面的说说，如果你还没学到都可以搜一下，看看形式就一目了然。\n正确的相似关系你从你举的界面的例子里看到了，是<span class=\"math\">\\(E\\)<\/span>对<span class=\"math\">\\(H\\)<\/span>，D对B(只在没有自由电荷的时候成立)。也就是<span class=\"math\">\\(E\\)<\/span>和<span class=\"math\">\\(H\\)<\/span>倒是在模仿彼此的行为。至于为什么是这样对应呢？我觉得也不是什么高深的事情，单纯是电荷、电流进入maxwell方程的方式：maxwell方程一个四个，<span class=\"math\">\\(E\\)<\/span>和B的旋度式、散度式。电荷、电流只进入电场的散度和磁场的旋度。为了吸收掉这些电荷、电流(也就是介质内的极化电荷、极化电流)的效果，我们才去定义了D和<span class=\"math\">\\(H\\)<\/span>，这就导致B的旋度式被<span class=\"math\">\\(H\\)<\/span>冒名顶替了，<span class=\"math\">\\(E\\)<\/span>的散度式被D冒名顶替了。所以如果不是因为这些电荷、不是因为重新命名，我们本来会说 E和B的旋度都<span class=\"math\">\\(=0\\)<\/span>，所以EB是对应的，这样就符合你朴素的愿望了。但现在B的旋度<span class=\"math\">\\(=0\\)<\/span>被<span class=\"math\">\\(H\\)<\/span>冒名顶替了之后，只好说<span class=\"math\">\\(E\\)<\/span>和<span class=\"math\">\\(H\\)<\/span>对应了。所以整个故事单纯是由于电荷、电流以一种对<span class=\"math\">\\(E\\)<\/span>对B不公平的方式进入了maxwell方程，导致了如果你还是在朴素地把“对应”认为是“遵循一样类型的约束(同为散度约束或同为旋度约束)”的话，就看到是扭曲的“对应”了。但如果你打开思路，把前面说的“互补”看作一种新概念的“对应”的话，<span class=\"math\">\\(E\\)<\/span>的旋度就应该和B的散度“对应”，D的散度就应该和<span class=\"math\">\\(H\\)<\/span>的旋度“对应”。", "id": "ep4:293697033457:r0"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 1, "message": "哪儿奇怪了 是觉得<span class=\"math\">\\(E\\)<\/span>、D之间的地位和B、<span class=\"math\">\\(H\\)<\/span>之间的地位怎么倒了一下吗", "id": "ep4:293697033457:r1"}]}, {"id": "ep4:293694418449", "module": "math", "auto": false, "uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 15, "message": "在这里给出上一期的答案，类似咕咕在2022年5月29日的动态来给出解法，问题是，一个圆环的内表面是圆柱形，外表面是球形，且球心在圆柱的轴线上。求出该圆环的体积。\n考虑一个“与内圆柱相切的平面”，该平面与外球面相交形成一个圆盘，圆盘的直径位于圆柱的一条母线上。将其沿圆柱表面滑动，同时保持与圆柱相切。这个运动的半圆盘将扫过整个圆环的体积。\n \n半圆盘的运动由两部分组成：(1)沿自身平面的滑动——这部分运动不贡献扫过的体积；(2)绕直径的旋转——这部分运动是扫过体积的核心。因此，若减去滑动运动，半圆盘的运动简化为“绕直径的旋转”扫过的体积即为“直径为<span class=\"math\">\\(H\\)<\/span>的球体的体积”\n因此，圆环的体积等于“直径为<span class=\"math\">\\(H\\)<\/span>的球体的体积”，仅与<span class=\"math\">\\(H\\)<\/span>有关。", "raw_message": "在这里给出上一期的答案，类似咕咕在2022年5月29日的动态来给出解法，问题是，一个圆环的内表面是圆柱形，外表面是球形，且球心在圆柱的轴线上。求出该圆环的体积。\n考虑一个“与内圆柱相切的平面”，该平面与外球面相交形成一个圆盘，圆盘的直径位于圆柱的一条母线上。将其沿圆柱表面滑动，同时保持与圆柱相切。这个运动的半圆盘将扫过整个圆环的体积。\n \n半圆盘的运动由两部分组成：（1）沿自身平面的滑动——这部分运动不贡献扫过的体积；（2）绕直径的旋转——这部分运动是扫过体积的核心。因此，若减去滑动运动，半圆盘的运动简化为“绕直径的旋转”扫过的体积即为“直径为H的球体的体积”\n因此，圆环的体积等于“直径为H的球体的体积”，仅与H有关。", "images": ["_imgs/img_faaecf590c74.jpg", "_imgs/img_b0138a4172c8.jpg"], "replies": [{"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 7, "message": "这个很优美了，特别是后半段的分解。厉害，不过我是卡在了前半段，我一下还没看出来这么沿切面放置的小圆饼这样扫出来就是个球面了。我刚想了想一会儿，用“尖尖固定在圆心处的圆锥扫一圈扫出来的肯定是球面(因为圆锥各方向的母线都一样长)”，这才说服了自己。你是怎么一眼就看出来的？我特别好奇的是，你是怎么“反向”看出来的？也就是怎么从“球+圆柱”反过来看出这块小圆饼的？", "id": "ep4:293694418449:r0"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @Physuki<\/span> 并不需要底面无限小，因为扫出的体积完全取决于“＇手臂'最远能伸到多远”，母线就是伸得最远的那条手臂。你再想想？", "id": "ep4:293694418449:r1"}, {"uname": "Physuki", "face": "_imgs/face_017d1a038065.jpg", "like": 0, "message": "<span class=\"mention\">回复 @物理系咕咕叫兽<\/span> 圆锥扫出来的一圈儿是球面前提是“ 圆锥的底面无限小”， 因为这样母线长才能逼近球面本身半径；但是这个情景的小圆片不必然是无穷小的微元…", "id": "ep4:293694418449:r2"}, {"uname": "Physuki", "face": "_imgs/face_017d1a038065.jpg", "like": 0, "message": "<span class=\"mention\">回复 @物理系咕咕叫兽<\/span> 我通了，我思考的时候把“母线”想成“圆锥尖尖到底面的高”[怪我咯]", "id": "ep4:293694418449:r3"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 0, "message": "<span class=\"mention\">回复 @物理系咕咕叫兽<\/span>  看完这个答案之后，我又想到了另一种求法(但是本质其实和楼主的解法是一样的)。我们可以把这个圆环切开，切面平行于圆柱母线且过圆心。这样不管怎么切，截面都是一个半圆饼，于是这个图形就可以看成是有半圆饼绕轴线旋转得到的，现在把所有的半圆饼都聚拢起来，就是一个球了。这个想法是受匀速圆周运动线速度的启发，线速度时刻贴着圆周旋转，把端点都聚在一起，那么末端的轨迹就是圆了😳", "id": "ep4:293694418449:r4"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "可以详细讲讲吗？，比如这个圆心是那个位置的圆...", "id": "ep4:293694418449:r5"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "额，小半圆的弧度和球的弧度一样吗？，还是说是因为有一定倾斜的原因是这脸恰好适配", "id": "ep4:293694418449:r6"}]}, {"id": "ep4:293687266449", "module": "math", "auto": false, "uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 8, "message": "既然见没什么人，那我发分享一个昨天看的好像是悖论的东西，不严格是物理，主要是对于数学物理中都经常出现的对无穷和极限的思考🐶，我也无法理解这个现象\n想象一下，我手里有个空罐子，现在是上午 11:59。\n第一步：我往里丢进编号 1到10 的球，然后瞬间精准地夹出 1号球。\n第二步：我丢进 11到20 的球，夹出 2号球。\n第三步：我丢进 21到30 的球，夹出 3号球。\n我的手速无限变快。每次我都净增 9 个球。\n那当正午 12:00 的钟声响起时，罐子里有几个球？\n按直觉，每次多 9 个，操作了无穷多次，罐子应该被塞爆了🐶\n但我们问一个问题，“请告诉我，剩下的球里，哪一个是几号？就会发现罐子里没球了🐶每次净整的9个球消失了，怎么量还能凭空消失啊🐶，就像一个水箱以10的速度加水，以1的速度漏水，无穷多的时间后发现水漏完了🐶，怎么量凭空消失了。我无法理解这两种视角下的割裂🐶", "raw_message": "既然见没什么人，那我发分享一个昨天看的好像是悖论的东西，不严格是物理，主要是对于数学物理中都经常出现的对无穷和极限的思考[doge]，我也无法理解这个现象\n想象一下，我手里有个空罐子，现在是上午 11:59。\n第一步：我往里丢进编号 1到10 的球，然后瞬间精准地夹出 1号球。\n第二步：我丢进 11到20 的球，夹出 2号球。\n第三步：我丢进 21到30 的球，夹出 3号球。\n我的手速无限变快。每次我都净增 9 个球。\n那当正午 12:00 的钟声响起时，罐子里有几个球？\n按直觉，每次多 9 个，操作了无穷多次，罐子应该被塞爆了[doge]\n但我们问一个问题，“请告诉我，剩下的球里，哪一个是几号？就会发现罐子里没球了[doge]每次净整的9个球消失了，怎么量还能凭空消失啊[doge]，就像一个水箱以10的速度加水，以1的速度漏水，无穷多的时间后发现水漏完了[doge]，怎么量凭空消失了。我无法理解这两种视角下的割裂[doge]", "images": [], "replies": [{"uname": "sakuraknd", "face": "_imgs/face_fee54cf45fed.jpg", "like": 4, "message": "我基本只学过普通高中生学过的东西，大学的基本没学过，回答可能有很多缺陷。去掉'我的手速无限变快，截止到正午 12:00 '这两个条件'，将丢球和夹球的时间设立为无穷大，来看看场景会变成什么样——根据经验，丢球和夹球需要的时间是非无穷小的(大于0)，无数个非无穷小(大于0)的量(这个量是什么作用/东西我也没看懂，这里就看做数学中的数字吧)也加起来是无穷大的，时间应该也与'量'类似，那么无穷个非无穷小的(大于0)时间加起来是无穷大的。这时候像问题中'那当正午 12:00 的钟声响起时，罐子里有几个球？'一样确定一个任意的确定的时刻(如7256年3月21日12:00)，那么丢球和夹球的次数和花费的时间都变为了有限的，也就是说我们不能在现实中进行无限次投球，并在无限次投球后查看球的数量(在'无限时间'这个词的后面不能加'后'这个词，这是语言的错误组合)你提的问题本身以'丢球和夹球'这两个现实中的变化来表现，'丢球和夹球'让你认为这是现实中的场景，但这个问题的是数学上的的规则(无穷个正数和无穷个负数的相加)给出的运算上套了层'丢球和夹球'的皮。就是这层“丢球和夹球”的皮，让你觉得割裂。因为它表面上把你带进了现实场景里，但最后又要求你接受一个纯数学的解释。也就是说，让你困惑的不是单纯的计算过程，而是它一开始给你的理解方向和它最后使用的解释规则，其
