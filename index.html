实不是同一套东西。", "id": "ep4:293687266449:r0"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 3, "message": "看了下时间，还没到11:59，所以我无法开始“想象”。", "id": "ep4:293687266449:r1"}, {"uname": "sakuraknd", "face": "_imgs/face_fee54cf45fed.jpg", "like": 3, "message": "之前回答好像讲的有问题，我之前的理解是：在数学上，无穷个非无穷小的正数加无穷个非无穷小的负数和为零，我觉得这是这个问题的实质。在现实中，我们不可能在有限的时间内进行无穷次丢球夹球，也就不可能见过放进去的每个球都在无穷次后被取出，所以用“无穷个非无穷小的正数加无穷个非无穷小的负数和为零”来解释，比用“放球取球”更不容易与日常的直觉相悖。“用“放球取球”这个例子，这是不符合直觉的原因”这有点本末倒置了。原因应该改为：你根据日常经验认为每次都会加九个，而没见过在这个设定下任意一个球都会在某一时刻被取出，所以最后没有任何一个球能留下来。你见过的情景中，没出现过“任意一个球都会在某一时刻被取出”这种情况。", "id": "ep4:293687266449:r2"}, {"uname": "愿你Happy每一天", "face": "_imgs/face_8cc8e44645ef.jpg", "like": 1, "message": "【【毕导】击溃你的常识！无穷之后的世界是什么样？-哔哩哔哩】 https://b23.tv/4SAT8II", "id": "ep4:293687266449:r3"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 1, "message": "<span class=\"mention\">回复 @sakuraknd<\/span> 我就是举了一个好像跟他的问题有点像的例子。我没学过什么极限的知识呀，可能表述得不严谨，都是一些朴素的感觉qwq", "id": "ep4:293687266449:r4"}, {"uname": "sakuraknd", "face": "_imgs/face_fee54cf45fed.jpg", "like": 1, "message": "我试着从我的角度理解一下你为什么觉得割裂，说得不对的地方别介意", "id": "ep4:293687266449:r5"}, {"uname": "数学和物理都很有趣", "face": "_imgs/face_71bf55804b7f.jpg", "like": 0, "message": "我觉得我们之所以有每次操作等于加9个这种“等效”，是因为我们生活中这种直觉是成立的，但是无限这个概念实际上是很可能违背我们这种直觉的，因为我们实际上没有人真的见过无穷次操作以后的世界。ps我感觉很多和极限有关的的问题初次接触都会觉得反直觉，比如级数和收敛…", "id": "ep4:293687266449:r6"}, {"uname": "愿你Happy每一天", "face": "_imgs/face_8cc8e44645ef.jpg", "like": 0, "message": "<span class=\"mention\">回复 @物理系咕咕叫兽<\/span> 两个无限一样大，我记得毕导有做过这样一期视频", "id": "ep4:293687266449:r7"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "无穷是无法用常规数学方法计算的🐶借用一到无穷大这本书的一个例子，在一个能容纳无数人的宾馆住满了人，然后又来了无数个人，老板让住一号方的去二号，二号去四号，以此类推，然后就可以发现又多了无穷个房间🐶", "id": "ep4:293687266449:r8"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"math\">\\(y=x\\)<\/span>和<span class=\"math\">\\(y=2x\\)<\/span>在<span class=\"math\">\\(x\\)<\/span>很大很大的时候，不都无限大吗？这时难道它们的图像是一样高的吗？🐶", "id": "ep4:293687266449:r9"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "感觉有点像追击，前面修路，后面拆路，修路的速度是拆路的十倍，设速度无限大，问路过了一定时间后有多长....", "id": "ep4:293687266449:r10"}, {"uname": "Tieues", "face": "_imgs/face_6e215bdb192d.jpg", "like": 0, "message": "<span class=\"mention\">回复 @物理系咕咕叫兽<\/span> hh", "id": "ep4:293687266449:r11"}, {"uname": "hhhmdh", "face": "_imgs/face_030839e5bda0.jpg", "like": 0, "message": "<span class=\"mention\">回复 @物理系咕咕叫兽<\/span>  现在可以了", "id": "ep4:293687266449:r12"}, {"uname": "sakuraknd", "face": "_imgs/face_fee54cf45fed.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span>  x很大很大的时候，<span class=\"math\">\\(y\\)<\/span>不等于无限大。很大很大不等于无限大。你这句话想表达什么我也没看明白(=・ω・=)", "id": "ep4:293687266449:r13"}, {"uname": "sakuraknd", "face": "_imgs/face_fee54cf45fed.jpg", "like": 0, "message": "<span class=\"mention\">回复 @sakuraknd<\/span>  水平有限，望指正[给心心]", "id": "ep4:293687266449:r14"}, {"uname": "sakuraknd", "face": "_imgs/face_fee54cf45fed.jpg", "like": 0, "message": "<span class=\"mention\">回复 @sakuraknd<\/span>  “无穷个非无穷小的正数加无穷个非无穷小的负数和为零”我这句话好像有问题，有没有大佬指正下", "id": "ep4:293687266449:r15"}, {"uname": "sakuraknd", "face": "_imgs/face_fee54cf45fed.jpg", "like": 0, "message": "<span class=\"mention\">回复 @sakuraknd<\/span>  无穷个非无穷小的负数感觉听起来有问题，'无穷个非无穷小的正数加无穷个非无穷小的负数和为零'我想用来描述'无数次放球和取球后罐内没球'", "id": "ep4:293687266449:r16"}, {"uname": "四重吹不散", "face": "_imgs/face_dbb0bd97eb2e.jpg", "like": 0, "message": "割裂是由于:在“有限”下，放进去的比拿出来的多9个，而在“无限”下，放进去的是“无限”个，拿出来的也是“无限”个，两个无限怎么比较大小，是需要我们去审视“极限”作为数学存在，这个概念的", "id": "ep4:293687266449:r17"}]}, {"id": "ep4:293696546257", "module": "other", "auto": false, "uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 3, "message": "小龙老师自编卷上的题目🐶想到了就很简单，欢迎讨论🙌", "raw_message": "小龙老师自编卷上的题目[doge_金箍]想到了就很简单，欢迎讨论[打call]", "images": ["_imgs/img_1553fe22bff6.jpg"], "replies": [{"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 1, "message": "这题应该是视频里做到过的哦。距离是不变的哦。假设调整：假设没变 -&gt; 发现不用调整就已经平衡了-&gt; 所以确实不变。", "id": "ep4:293696546257:r0"}]}, {"id": "ep4:293743621793", "module": "other", "auto": false, "uname": "钢琴快快跑", "face": "_imgs/face_d8f106d89115.jpg", "like": 2, "message": "这是我们的一模题第3题，考察基本原理，答案不一定局限在选项中😏", "raw_message": "这是我们的一模题第3题，考察基本原理，答案不一定局限在选项中[滑稽]", "images": ["_imgs/img_9ca84f27ccc6.jpg"], "replies": []}, {"id": "ep4:296425219456", "module": "other", "auto": false, "uname": "清子木", "face": "_imgs/face_00e4a2cf935d.jpg", "like": 1, "message": "hello", "raw_message": "hello", "images": ["_imgs/img_ea8279f42b38.jpg", "_imgs/img_052713e7e305.jpg", "_imgs/img_b63a8fbe9bd7.jpg"], "replies": []}], "mod_stats": {"mech": {"q": 3, "r": 8, "img": 3}, "energy": {"q": 1, "r": 7, "img": 0}, "vibration": {"q": 2, "r": 25, "img": 2}, "esfield": {"q": 2, "r": 11, "img": 2}, "em": {"q": 4, "r": 8, "img": 3}, "math": {"q": 2, "r": 25, "img": 2}, "other": {"q": 3, "r": 1, "img": 5}}, "removed": [["数学和物理都很有趣", "来投一个刚学大物的飞舞大一学生刚想清楚的问题吧，如图，把车内的沙子和车看", "归档时已排除"], ["物理系咕咕叫兽", "刚视频传错了，已重新上传。", "人工判定噪音"], ["黑白物理", "因为评论回复无法发图片，只能再发一条评论补充自己对辐向磁场问题的思考。如", "归档时已排除"], ["普朗克的光子", "up主博士毕业后是要去高中教书吗？还是做辅导机构？", "归档时已排除"], ["kangkang爱讲数学", "ai风格", "归档时已排除"], ["Physuki", "@道格拉斯-路西恩 评论区关于求体积的问题，可以直接计算，只要提前知道球", "归档时已排除"]], "ghost_merged": 40, "total_q": 17, "total_r": 85, "total_img": 17, "auto_cnt": 0}, {"key": "ep5", "title": "第5期", "episodeId": "ep1774677279463", "export": "2026-08-25", "comments": [{"id": "ep5:296944032416", "module": "mech", "auto": false, "uname": "8589869056", "face": "_imgs/face_312f2ee08559.jpg", "like": 11, "message": "分享一道改编原创题。这道题基于常考的经典的物块圆盘模型，但做这类问题时我们常常会用一些二级结论比如质心法来跳过中间过程的分析。尽管做题速度上来了，我们可能并没有对这里面的底层机制有深刻的理解。另一个分享动机源于，这类题目之所以中间过程烧脑，摩擦力变来变去难以分析，是因为它和将一根木棍斜靠在墙面，地面和墙面均粗糙这个模型具有一定的共同点，如果我们挑出一个时刻来列力平衡方程，我们会发现未知数的个数超过了方程的个数，这就让那种一上来就套公式的思路遇到了困难。", "raw_message": "分享一道改编原创题。这道题基于常考的经典的物块圆盘模型，但做这类问题时我们常常会用一些二级结论比如质心法来跳过中间过程的分析。尽管做题速度上来了，我们可能并没有对这里面的底层机制有深刻的理解。另一个分享动机源于，这类题目之所以中间过程烧脑，摩擦力变来变去难以分析，是因为它和将一根木棍斜靠在墙面，地面和墙面均粗糙这个模型具有一定的共同点，如果我们挑出一个时刻来列力平衡方程，我们会发现未知数的个数超过了方程的个数，这就让那种一上来就套公式的思路遇到了困难。", "images": ["_imgs/img_3c474c0f4a16.jpg"], "replies": []}, {"id": "ep5:294395871137", "module": "mech", "auto": false, "uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 11, "message": "假设雨滴从2000米高空中落下，忽略空气阻力，速度将达到200米每秒。但事实上雨滴并不会对我们造成什么伤害🐶。当我们试图把蚂蚁从高处吹下去的时候，落地的蚂蚁毫发无损。除了蚂蚁自身的结构，还有没有其他的原因?能否考虑从重力和空气阻力的影响去出发，结合一些猜测，能否从高中物理的基础得出解答?🐶", "raw_message": "假设雨滴从2000米高空中落下，忽略空气阻力，速度将达到200米每秒。但事实上雨滴并不会对我们造成什么伤害[doge]。当我们试图把蚂蚁从高处吹下去的时候，落地的蚂蚁毫发无损。除了蚂蚁自身的结构，还有没有其他的原因?能否考虑从重力和空气阻力的影响去出发，结合一些猜测，能否从高中物理的基础得出解答?[doge]", "images": [], "replies": [{"uname": "8589869056", "face": "_imgs/face_312f2ee08559.jpg", "like": 2, "message": "要搞清楚这个问题，就不能记空气阻力和速度或者速度平方成正比的结论，得从产生空气阻力的基本原理出发。\n为什么会有空气阻力？因为气体分子会与物体的表面发生碰撞，产生作用力。当物体没有发生运动的时候，物体表面受到的气体分子的冲击力相互抵消了，如果不考虑不同高度压强不相等的话。\n在没有风的地面静止系，气体分子的平均速度矢量是0，这就是为什么物体静止时受到的力是各向同性的。而当物体运动起来后，在物体系下，气体分子的速度不是各向同性的了，物体迎面撞击的气体产生的力要比物体背面撞击的气体产生的力大，这样就产生了一个与运动方向相反的力。\n在速度一定的时候，这个阻力和什么有关呢？这个问题和这个评论区中那个关于压强的问题的原理是一样的。阻力和物体的垂直于运动方向的面积成正比。\n现在回到蚂蚁下落的场景，蚂蚁达到最大速度时，重力和空气阻力平衡(严格来讲永远不会达到最大速度，但那是数学问题，物理上是可以认为达到的)。我们做一个合理的假设，即蚂蚁的密度和人的密度是同一个数量级的，不会相差太大。那么从人体缩小到蚂蚁大小，体积是按照长度的三次方收缩的，质量是长度三次方减少的，而表面积是长度二次方减少的。这就意味着，质量减少的速率远远快于表面积减少的速率，随着体型的变小，空气阻力的主导地位更强了，那么最大速度也会更小。\n我们可以做一个粗略的估算，人的高度1.7m，蚂蚁的长度4mm，那么线度比大概是400，阻力与速率平方成正比的话，那么速率比大概是20(事实上低速时应该是和速率成正比，这个比值要更大)。质量比是线度比的3次方关系，那么动量比大概是3.5次方关系，假设接触地面时间差不多，那么冲击力大概是3.5次方关系，分摊到面积上，压强比大概是1.5次方关系。这样，人落地和蚂蚁落地，碳基材料承受的应力是几百倍的关系，自然蚂蚁不会摔死，更何况蚂蚁还有结构buff加持", "id": "ep5:294395871137:r0"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 1, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span>  所以是在问空气阻力为什么与速度平方有关吗？如果把猪当成正方体的话，在某个状态时，单个空气分子给猪的阻力正比于猪的速度，而在很短的时间内，猪所撞到的总空气分子数也与速度成正比，两个因素叠加，空气阻力就正比于速度平方。是这样嘛", "id": "ep5:294395871137:r1"}, {"uname": "川島亞美-", "face": "_imgs/face_34b5b094b0b3.jpg", "like": 1, "message": "另外空气阻力这方面也已经不是高中教材所教的高中知识了，只是有些高中题目经常会给你一个<span class=\"math\">\\(f=kv\\)<\/span>，你并不知道这个<span class=\"math\">\\(k\\)<\/span>到底和什么物理量有关，而真实情况主要是和空气密度，阻力系数，迎风面积和速度的平方有关。这个明显不是高中的知识，看到是属于大学甚至以上的知识，而如果要给你讲解这个现象肯定要引入空气阻力的概念及其影响因素，如果你这可以接受，那是否可以引入其他的专业知识？如果以上同学的发言就可以解除你的疑惑的话，那我有几个疑问，蚂蚁和人的阻力系数一样吗？蚂蚁和人二者的表面积与迎风面积的比值大致相同吗？长度和体积比表面积比确实是三次二次的关系，但二者的身材比例大致相同吗？对应长度的增加所造成的体积与表面积的变化是一样的吗？\n如果你觉得我在攻击你的话，可能我的情绪有点激动了，在评论的开篇就说了一下偏激的言论，我向你道歉🙏\n我希望你能更加专注于现在所学习的知识范畴内的问题", "id": "ep5:294395871137:r2"}, {"uname": "sakuraknd", "face": "_imgs/face_fee54cf45fed.jpg", "like": 1, "message": "前面搞错了，空气阻力的大小好像是和速度的平方成正比的，而重力加速度是均匀增加的。蚂蚁的速度应该是增加得越来越慢的，蚂蚁最大速度应该是有一个近似值的", "id": "ep5:294395871137:r3"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "空气阻力感觉和体积，表面积，质量，速度都有关🐶如果真的是定量计算的话好像有点无从下手🐶", "id": "ep5:294395871137:r4"}, {"uname": "四顾托孤--Aqours", "face": "_imgs/face_b071d72f6b33.jpg", "like": 0, "message": "冷知识两米左右蚂蚁就会也会受伤", "id": "ep5:294395871137:r5"}, {"uname": "以书止戈", "face": "_imgs/face_8640c30636fe.jpg", "like": 0, "message": "蚂蚁从高空落下，随着速度增加，向上的空气阻力增大与重力方向相反，合力越来越小，根据牛二<span class=\"math\">\\(F=am\\)<\/span>，可得加速度也越来越小，蚂蚁的速度会趋近于一个值，因为蚂蚁重力非常小，所以并不需要特别大的空气阻力使得它达到平衡，也就不会达到特别大的速度，速度小了，对于地板的冲击力就小，就不会对蚂蚁造成伤害", "id": "ep5:294395871137:r6"}, {"uname": "以书止戈", "face": "_imgs/face_8640c30636fe.jpg", "like": 0, "message": "当<span class=\"math\">\\(v\\)<\/span>很小的时候，假设在真空中，<span class=\"math\">\\(v=\\sqrt{2gh}\\)<\/span>，所以这个<span class=\"math\">\\(h\\)<\/span>非常小", "id": "ep5:294395871137:r7"}, {"uname": "牛顿和安培", "face": "_imgs/face_de53c981de9e.jpg", "like": 0, "message": "若不考虑<span class=\"math\">\\(g\\)<\/span>变化，<span class=\"math\">\\(f=Kv\\)<\/span>可以利用动量定理进行微元吧但<span class=\"math\">\\(f\\)<\/span>先为Kv再<span class=\"math\">\\(kv^2\\)<\/span>，最后还会是立方，那就要解微分方程了🐶", "id": "ep5:294395871137:r8"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 0, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span>  你是想问为什么能达到最大速度吗？还是啥？\n如果是从两千米的高空扔一头猪下去，还会达到平衡状态吗？是这个问题吗？🐶", "id": "ep5:294395871137:r9"}, {"uname": "川島亞美-", "face": "_imgs/face_34b5b094b0b3.jpg", "like": 0, "message": "你有时间问这种问题，不如自己去好好深入学一下物理。一边要用高中基础解答，一边想要更为严谨深入的解释，属于既要又要了。\n只有高中基础什么都分析不了，只能定性分析，那里面各种因素的影响程度的大小呢？你总是能拿出另一个影响因素来反驳一个解释，终其原因就是不可能以高中基础，什么数据都没有，只能靠自己臆想的各种大致数据和不合理的定性分析还有知识水平的不足导致的", "id": "ep5:294395871137:r10"}, {"uname": "川島亞美-", "face": "_imgs/face_34b5b094b0b3.jpg", "like": 0, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span> 如果以上b友的回答已经可以解决你的问题了，那我实在是不理解你想要的更深入是什么意思，如果你说的蚂蚁为什么不会摔死的原因的深入理解只是蚂蚁的质量与蚂蚁的表面积的比值比人类的小，从而导致蚂蚁的收尾速度以及地面对它的力远小于蚂蚁的身体所能承受的力，那我觉得这并不会过于深入，只是把大部分人所说的解释换成一个看起来比较专业的说法，要定性分析很容易，可是凭什么认为你所定的性离真实的情况偏差不大呢？这背后还是要有较为真实的数据支撑。\n再者我并没有说定性分析是不对的，至少要去查一下一个蚂蚁到底多重，空气阻力与速度的比值到底多少，诸如此类的才可开始定性分析吧。\n我觉得现在在这里这个问题问的实在是没有意义，我说的不是这个问题没有意义，有这样的问题固然是好的，但是这个问题已经有一些历史了，在任何一个视频平台应该都可以找到相应的视频。", "id": "ep5:294395871137:r11"}, {"uname": "椭派", "face": "_imgs/face_81f69036f781.jpg", "like": 0, "message": "关键关键是空气阻力存在的情况下，当速度达到一定值时，物体会进入平衡状态，它的速度不会再改变[tv_白眼][tv_doge]", "id": "ep5:294395871137:r12"}, {"uname": "椭派", "face": "_imgs/face_81f69036f781.jpg", "like": 0, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span> [tv_白眼]我也不太会，不过阻力应该与速度呈现关系的。\n不过是线性的还是非线性的就不太确定了\n这涉及变力高中不太够处理感觉[tv_白眼]\n如果雨珠质量为m 重量加速度为<span class=\"math\">\\(g\\)<\/span>，初始高度为2000，初速度为0\n假如阻力<span class=\"math\">\\(F=mf(v)\\)<\/span>方向与<span class=\"math\">\\(v\\)<\/span>相反\n则加速度<span class=\"math\">\\(a=g-f(v)\n\\)<\/span>由<span class=\"math\">\\(\\frac{dv}{dt}=a\n\\)<\/span>故<span class=\"math\">\\(1/(g-f(v))dv=dt\n\\int 1/(g-f(v))dv=\\int dt(\\)<\/span>两个变限积分左边积分下限为0上限是<span class=\"math\">\\(v\\)<\/span>，右边积分下限是0上限是<span class=\"math\">\\(t)\n\\int 1/(g-f(v))dv=t\n\\)<\/span>所以至少我们知道时间关于速度的函数是有显性表达的。\n别的额我真不知道了。\n根据常识我只能确定<span class=\"math\">\\(t→+\\infty \\)<\/span>时v→u(u是常数)\n也就是<span class=\"math\">\\(v=f(t)\\)<\/span>单调递增且有上界。[tv_doge]", "id": "ep5:294395871137:r13"}, {"uname": "sakuraknd", "face": "_imgs/face_fee54cf45fed.jpg", "like": 0, "message": "我觉得没办法抛开结构讨论。🐶\n忽略空气阻力，假设蚂蚁和人的结构强度相同\n人和蚂蚁从距离水平面10m高的地方同时坠向水平面，ta们到达水平面时的速度、时间一致，但是由于质量不同，ta们的动能和动量也不同。\n在接触地面后，由于质量相差极大，地面对蚂蚁的力和对人的力相差极大，ta们的结构强度相同。综上，可以看出，结构强度相同时，质量越小，摔落时越不容易受伤。\n质量小就是影响蚂蚁摔落时毫发无损的原因之一", "id": "ep5:294395871137:r14"}, {"uname": "sakuraknd", "face": "_imgs/face_fee54cf45fed.jpg", "like": 0, "message": "我不知道他们的结构强度是否一致，我把结构强度理解为一个结构承受自身不同地方的不同加速度的能力", "id": "ep5:294395871137:r15"}, {"uname": "sakuraknd", "face": "_imgs/face_fee54cf45fed.jpg", "like": 0, "message": "速度指的是有空气阻力时蚂蚁下落的最大速度吗？\n蚂蚁是在不断下落的\n只有地球拉蚂蚁的加速度和空气推蚂蚁的加速度大小相等时，蚂蚁才能受力平衡\n球对蚂蚁拉的加速度，在蚂蚁的下落过程中是在不断增加的\n这意味着蚂蚁的速度是在不断增加的，只要下落距离足够长，他的速度就能无限高，即使有空气阻力\n我刚才只在经典力学的范围内讨论。", "id": "ep5:294395871137:r16"}]}, {"id": "ep5:297027886528", "module": "mech", "auto": false, "uname": "椎名博士在邮箱", "face": "_imgs/face_6f6f41c52497.jpg", "like": 10, "message": "在运动学中，我们常常用“倒放”这个操作，来帮助理解一些问题。我的问题是，①倒放为什么是可行的，②在倒放中，为什么速度方向反向了，但加速度方向不变,其实还可以推广到加加速度…(例如在处理匀减速问题中,我们喜欢倒着看将其看成匀加速,进而来使用<span class=\"math\">\\(v_{1}^2-v_{2}^2=2ax\\)<\/span>。再例如下图问题中，如果用倒放的思想，很容易就判断出d选项,但倒放的情形是我们假想出来的,将其放到现实中为什么也是成立的?我本人也还没有完全弄清楚这个问题,但可以分享一下我自己的一点看法：倘若在b点以<span class=\"math\">\\(-v_{2}\\)<\/span>释放这个粒子，那么在这一小瞬间，它一定会走到先前那个轨迹上，其实这就有一点“一步走对，步步走对”的感觉了——咕呱以前讲过)。马上要去学校了，如果有精彩回答，未能及时点赞，请见谅，回来后我再补上🐶", "raw_message": "在运动学中，我们常常用“倒放”这个操作，来帮助理解一些问题。我的问题是，①倒放为什么是可行的，②在倒放中，为什么速度方向反向了，但加速度方向不变,其实还可以推广到加加速度…（例如在处理匀减速问题中,我们喜欢倒着看将其看成匀加速,进而来使用v1方-v2方=2ax。再例如下图问题中，如果用倒放的思想，很容易就判断出d选项,但倒放的情形是我们假想出来的,将其放到现实中为什么也是成立的?我本人也还没有完全弄清楚这个问题,但可以分享一下我自己的一点看法：倘若在b点以-v2释放这个粒子，那么在这一小瞬间，它一定会走到先前那个轨迹上，其实这就有一点“一步走对，步步走对”的感觉了——咕呱以前讲过）。马上要去学校了，如果有精彩回答，未能及时点赞，请见谅，回来后我再补上[doge]", "images": ["_imgs/img_80f9c9d0a472.jpg"], "replies": [{"uname": "继欣", "face": "_imgs/face_b4b1b3c81417.jpg", "like": 4, "message": "先说加速度为什么不变，倒放会改变两个东西，一个是速度方向，一个是速度变换方向，这两个一叠加就负负得正了，比如说，一开始是是向右加速，倒过来就是向左减速，加速度就不变。\n再说这一个倒放，倒放其实并不是所有时候都可以的，他只在力学情况中可行，在这一个热学情况下就不行了。因为在力学它的是时间对称的，也就是你把方程里面的<span class=\"math\">\\(t\\)<\/span>改成负<span class=\"math\">\\(t\\)<\/span>，这个方程的形式依然不变，依然满足这一个力学定律。当时在热学之中，就不满足这个规律了，因为这个过程它会有熵增，嗯解释起来就稍微有一些复杂了，涉及到热力学第二定律，给一个简单的例子，你可以感受一下，用一个火去烧一块冰，冰会慢慢的融化成水，正放很正常，但是你倒放过来，你看这一个火再烧一盆水，然后那一个水变成了冰，那这就很诡异。", "id": "ep5:297027886528:r0"}, {"uname": "叽里咕噜yyy-zzz", "face": "_imgs/face_cdd7535fe617.jpg", "like": 2, "message": "倒放的可行性在于倒放后是否有什么根本改变了，在这个例子中，<span class=\"math\">\\(a\\)<\/span>是已知、根本，确定性的，初末已知(包括初速末速、位置)，当时间倒回的时候本质是运动状态的回溯，而决定根本的<span class=\"math\">\\(a\\)<\/span>不会随时间改变，于是运动状态没有改变，是可行的。而<span class=\"math\">\\(V\\)<\/span>方向改变的原因是时间反向导致的时间坐标轴变化导致的。", "id": "ep5:297027886528:r1"}, {"uname": "叽里咕噜yyy-zzz", "face": "_imgs/face_cdd7535fe617.jpg", "like": 2, "message": "<span class=\"mention\">回复 @叽里咕噜yyy-zzz<\/span> 在现实物理基础之上，v a x能通过微积分关系互相确定的前提必须是<span class=\"math\">\\(a\\)<\/span>的确定性，即<span class=\"math\">\\(a\\)<\/span>不会是由<span class=\"math\">\\(a\\)<\/span>的变化率、<span class=\"math\">\\(a\\)<\/span>的变化率的变化率……确定的，也就是说这个例子中，<span class=\"math\">\\(a\\)<\/span>的根本性不在于与<span class=\"math\">\\(x\\)<\/span>和<span class=\"math\">\\(v\\)<\/span>的相关，而是由<span class=\"math\">\\(F=ma\\)<\/span>确定，这也是牛二成立的现实物理基础。这个想法是从咕咕一个关于世界运动的一个视频里面产生的，不知道对不对？对的话就很好解释了<span class=\"math\">\\(a\\)<\/span>的根本性在哪里", "id": "ep5:297027886528:r2"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 2, "message": "倒放就是“时间回溯”🐶。很多游戏里的角色都有这个技能的，从哪来的就回哪去，怎么来的就怎么回去🐶。究其根本的话，应该是原因与结果是一一对应的🐶", "id": "ep5:297027886528:r3"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 1, "message": "我设想的是更简单的一个物理情形：在光滑桌面上放置一个方块于点A，这个方块上有一个地方可以挂钩子，我用一个棍子勾着这个方块施加恒力使其向右边移动，中途经过点B，速度记为<span class=\"math\">\\(v_{2}\\)<\/span>。另外放置质量形状等都相同的方块，使其以<span class=\"math\">\\(-v_{2}\\)<\/span>的速度向左边运动，如果想要回到A点的状态，我就要减速，来时加速，回程时减速，那回到一开始的问题，为什么力的方向和大小在同一位置还是相同的呢？速度的相反是因为回程时位置变化的相反，速度的改变相对于它们(指的是回放前和回放后)分别其实也是相反的，但表现出来在同一参考下，那个作用就是相同的了。(感觉我这个回答还差一些，这个问题确实很好[支持])", "id": "ep5:297027886528:r4"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 1, "message": "<span class=\"mention\">回复 @Light_dreamer探索者<\/span> 倒放不是回放😂", "id": "ep5:297027886528:r5"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 1, "message": "<span class=\"mention\">回复 @Light_dreamer探索者<\/span> 关键是倒放前后速度和速度的“改变效果”在它们各自内在视角来看就是相反的这一直觉是正确的，只是在一个视角下看就会发现力的方向是相同的", "id": "ep5:297027886528:r6"}, {"uname": "叽里咕噜yyy-zzz", "face": "_imgs/face_cdd7535fe617.jpg", "like": 0, "message": "<span class=\"mention\">回复 @魀魅<\/span> 感觉可以这样解释", "id": "ep5:297027886528:r7"}, {"uname": "清子木", "face": "_imgs/face_00e4a2cf935d.jpg", "like": 0, "message": "<span class=\"mention\">回复 @叽里咕噜yyy-zzz<\/span>  我认为你说的很有道理！！！在质量不变的经典物体运动中，力直接决定加速度 a，a 是运动链条中第一个被外界确定的量，v 和 x 只是积分结果。这就是 a 的根本性。", "id": "ep5:297027886528:r8"}, {"uname": "清子木", "face": "_imgs/face_00e4a2cf935d.jpg", "like": 0, "message": "<span class=\"mention\">回复 @清子木<\/span> https://b23.tv/AAlE2h8", "id": "ep5:297027886528:r9"}, {"uname": "拼命上520", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "物理本来就是从物理现象中总结出来的，你再放一个小球，让它自由下落，得到一个末速度，跟他以相同的这个速度，给它丢回去是一样的呀", "id": "ep5:297027886528:r10"}]}, {"id": "ep5:297426642576", "module": "mech", "auto": false, "uname": "皮卡丘--------丘", "face": "_imgs/face_9b7d8d4e7f29.jpg", "like": 8, "message": "大家好，我有一个问题是。在高速行驶的轿车中，有小飞虫，而这个小飞虫。和在静止的房间中飞翔的姿态和速度都是一样的。但是呢如果按成地面来看。这个小飞虫的速度是非常大的。那为什么他会跟着轿车行驶呢？轿车高速行驶，他在车内，犹如在室内飞行一样。这个可以理解为，地球是在自转，那么我们的建筑物也是在跟着地球高速旋转，那么就可以类比成在轿车中飞翔，只不过是缩小了而已。那如果把所有的车窗都砸碎，那这一个小飞虫就不能够再轿车内平稳的飞行了，本人未成年勿喷🙂🙂🙂", "raw_message": "大家好，我有一个问题是。在高速行驶的轿车中，有小飞虫，而这个小飞虫。和在静止的房间中飞翔的姿态和速度都是一样的。但是呢如果按成地面来看。这个小飞虫的速度是非常大的。那为什么他会跟着轿车行驶呢？轿车高速行驶，他在车内，犹如在室内飞行一样。这个可以理解为，地球是在自转，那么我们的建筑物也是在跟着地球高速旋转，那么就可以类比成在轿车中飞翔，只不过是缩小了而已。那如果把所有的车窗都砸碎，那这一个小飞虫就不能够再轿车内平稳的飞行了，本人未成年勿喷[微笑][微笑][微笑]", "images": [], "replies": [{"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 5, "message": "飞，是通过扇动空气获得升力。因此小飞虫只在意周围的空气，而不在意下方的那块地板怎么动(它飞的时候根本接触不到地板)。“轿车高速行驶，他在车内，犹如在室内飞行一样。” 这是因为车里的空气一直是跟随车一起动的。而如果你在车外想赶上车，那就需要相对于车外的空气有一份额外的速度。这就和在车内赶上车(也就是在车内相对于车悬停)的情况不同了。本质是因为车内的空气和车外的空气速度不同。同样的，砸碎玻璃这个行为不会影响坐在车上的人的观察(这就是为什么你直觉上觉得结果不应该影响)，但在这里，我们在讨论飞行，需要看空气的行为，砸碎玻璃的后果是车内的空气不再跟随车了，而是倾向于和车外空气同步了(对地静止)，因此飞行受到影响并不奇怪，此时不管你在车里飞还是在车外飞，要想赶上车，那都是一样辛苦的，就是因为车里车外空气速度一样了。\n总结“反直觉”的地方：砸碎玻璃看到的现象确实会变。但这里的变化并不是因为砸碎玻璃影响了观测，而是有东西实质性的变了，只不过变的这个东西是平常不太重要的空气，你的注意力却还集中在看得见的地板上，导致你忽视了它。", "id": "ep5:297426642576:r0"}, {"uname": "所有的入", "face": "_imgs/face_017bc74a0757.jpg", "like": 1, "message": "解释确实很清晰明白了🤩🤩🤩", "id": "ep5:297426642576:r1"}, {"uname": "所有的入", "face": "_imgs/face_017bc74a0757.jpg", "like": 1, "message": "是的，和地球上所有的运动都是一样的，那边是正确的V●ᴥ●V🙂🙂🙂", "id": "ep5:297426642576:r2"}]}, {"id": "ep5:296935078912", "module": "mech", "auto": false, "uname": "MySiddhartha", "face": "_imgs/face_48077d89217a.jpg", "like": 8, "message": "您好呀亲爱的咕呱，在补之前的视频，有个小问题，感谢大家的解答：①在起初看到这个问题的第二个解法时，看到小球在不同位置的处境一样，我的第一想法是换位到小球的感受，结果是，我作为小球，不仅感受到了眼前的几何物理世界，还感受到了拽在我身上的一根绳子的力。所以我就想去分析怎么证明我处在斜面上不同位置，这个力也是一样的。但事实上，这个力的层面的分析好像是没有必要的。所以我在想这是否反映的是两个不同层面的分析：其中一个层面是我眼睛可以直接看到的，纯几何外观约束，而另一个层面则是深入的体察它的受力，并且前一个层面其实完全可以决定后一个层面。这当然是正确的了，毕竟本来就是外在的硬约束决定了物体的运动。感觉深入的去考察它的受力，反而是一种人为的刻意的行为。所以只考虑前一个层面即可。\n②不过，在这道题目中，对于一个小球的微环境来讲，斜面的约束始终不变，是很好想的，但绳子的约束始终不变，这个事想要准确描述出来，还并不是非常容易。", "raw_message": "您好呀亲爱的咕呱，在补之前的视频，有个小问题，感谢大家的解答：①在起初看到这个问题的第二个解法时，看到小球在不同位置的处境一样，我的第一想法是换位到小球的感受，结果是，我作为小球，不仅感受到了眼前的几何物理世界，还感受到了拽在我身上的一根绳子的力。所以我就想去分析怎么证明我处在斜面上不同位置，这个力也是一样的。但事实上，这个力的层面的分析好像是没有必要的。所以我在想这是否反映的是两个不同层面的分析：其中一个层面是我眼睛可以直接看到的，纯几何外观约束，而另一个层面则是深入的体察它的受力，并且前一个层面其实完全可以决定后一个层面。这当然是正确的了，毕竟本来就是外在的硬约束决定了物体的运动。感觉深入的去考察它的受力，反而是一种人为的刻意的行为。所以只考虑前一个层面即可。\n②不过，在这道题目中，对于一个小球的微环境来讲，斜面的约束始终不变，是很好想的，但绳子的约束始终不变，这个事想要准确描述出来，还并不是非常容易。", "images": ["_imgs/img_1acf5330b729.jpg"], "replies": [{"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 5, "message": "<span class=\"mention\">回复 @MySiddhartha<\/span>  粗略的讲法：想象你是小球，不管拉到哪里，你的处境(周围的情况、所有东西的角度)是不是完全一样？\n仔细的讲法：小球的运动一共就受两个约束，绳子、斜面。1. 绳子：约束是“绳子长度不变”，仔细说就是“小球相对斜面的速度沿斜面分量要等于<span class=\"math\">\\(v\\)<\/span>”。这句话会随小球移动变化吗？不会，不管小球在哪都有这句话。2.斜面：约束是“小球不能脱离斜面”，仔细说就是“小球相对斜面速度沿垂直斜面分量<span class=\"math\">\\(=0\\)<\/span>”。这句话会随小球移动变化吗？不会，不管小球在哪都有这句话。这两个约束都不随小球位置变化，而这两个约束又唯一确定了小球的运动。所以不管小球在哪儿速度都必须一样，所以匀速。", "id": "ep5:296935078912:r0"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 4, "message": "这个问题没有关心“多大的力去推斜面才能这样动”、“这样动时生子的拉力时多少”这样的问题。相反，它开头就直接规定了斜面就是这样动的。而从图中容易看出，斜面任何一个位置就直接定死了小球的位置。所以斜面的运动就直接定死了小球的运动。这段基本的确定性分析表明，这个问题时单纯的运动关联(或者叫几何)问题，不涉及受力分析。注意，我这里不是通过问题的形式来告诉你“这个问题属于某一类'题型'所以不用受力分析”，我是通过确定性的判断(是严格的分析)得出的结论。", "id": "ep5:296935078912:r1"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 2, "message": "①你是想问分析小球的受力有没有必要吗？这个我个人认为是有必要的(当然不一定对)，因为你想要证明小球是做匀速直线运动的话，你就要证明环境的约束导致它的加速度为零，那就必然要分析受力(另外，我知道你应该是认认真真分析了，不过我还是想提醒一下叫兽一直强调的东西，就是在感觉完之后，要老老实实地分析，不要单纯凭感觉。当然如果说你提炼出了更精简的道理，修剪了思维链条，分析得快一点也是没问题的)\n\n②这个问题我也不明白。虽然我在①里面说了要分析，实际上我自己不知道怎么分析。我看到的环境的约束有两个。首先斜面向左以<span class=\"math\">\\(v_{0}\\)<\/span>运动。其次绳子以<span class=\"math\">\\(v_{0}\\)<\/span>拉着小球(斜面参考系中)，然后我就不知道怎么分析才能得出小球受力为零了。\n\n欢迎大佬讨论🙌", "id": "ep5:296935078912:r2"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 2, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 我发现我分析的好像不太对，因为环境在每一刻的位置关系也能决定小球的运动，所以确实不需要考虑它的受力", "id": "ep5:296935078912:r3"}]}, {"id": "ep5:297624553184", "module": "mech", "auto": false, "uname": "J-x3Seven", "face": "_imgs/face_05fe31020cdb.jpg", "like": 1, "message": "此处为什么只要约束t'&gt;0,不需要约束A先落地呢?下面是我自己的想法,不知道对不对,望指点,谢谢(已经理解了确定性直接图像解放，但是一般换参考系解法中这一点还没能完全理解)", "raw_message": "此处为什么只要约束t'＞0,不需要约束A先落地呢?下面是我自己的想法,不知道对不对,望指点,谢谢（已经理解了确定性直接图像解放，但是一般换参考系解法中这一点还没能完全理解）", "images": ["_imgs/img_bd34b1bb2b89.jpg", "_imgs/img_dad760c9b2f1.jpg"], "replies": []}, {"id": "ep5:294760642561", "module": "mech", "auto": false, "uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 1, "message": "考虑自重的弹簧：下面坠一个重物的时候，可以证明，等效为再加一个质量为<span class=\"math\">\\(\\frac{1}{2}\\)<\/span>弹簧自重的重物\n但是要注意：画力-形变量图像求劲度系数的时候，自重并不影响", "raw_message": "考虑自重的弹簧：下面坠一个重物的时候，可以证明，等效为再加一个质量为1/2弹簧自重的重物\n但是要注意：画力-形变量图像求劲度系数的时候，自重并不影响", "images": [], "replies": []}, {"id": "ep5:295054425569", "module": "mech", "auto": false, "uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 0, "message": "为什么刚体平行平面运动存在瞬心？什么道理？", "raw_message": "为什么刚体平行平面运动存在瞬心？什么道理？", "images": [], "replies": []}, {"id": "ep5:296930335184", "module": "energy", "auto": false, "uname": "鹤鸽鹤鸽", "face": "_imgs/face_712017ed6c31.jpg", "like": 7, "message": "动能定理是通过功的定义式  牛顿第二定律  速度位移公式推出来的，但是物体不做匀加速直线运动的时候，速度位移公式不成立了，但动能定理一样成立。高中课本上就是微元一笔带过，我想切实感受一下这个累加的过程，有没有高中生能看懂的计算过程[保卫萝卜_哭哭][保卫萝卜_哭哭]", "raw_message": "动能定理是通过功的定义式  牛顿第二定律  速度位移公式推出来的，但是物体不做匀加速直线运动的时候，速度位移公式不成立了，但动能定理一样成立。高中课本上就是微元一笔带过，我想切实感受一下这个累加的过程，有没有高中生能看懂的计算过程[保卫萝卜_哭哭][保卫萝卜_哭哭]", "images": [], "replies": [{"uname": "MySiddhartha", "face": "_imgs/face_48077d89217a.jpg", "like": 4, "message": "感觉要是微元法弄明白了，你自己就可以写式子累加呀，其实也就不用真的写式子了。我们考虑物体在一小段位移<span class=\"math\">\\(  \\Delta x  \\)<\/span>上的运动。只要这段位移<span class=\"math\">\\(  \\Delta x  \\)<\/span>取得足够小(无穷小)，那么在这段位移内物体受到的力  F  可以近似看作恒定不变，加速度  a  也可以看作恒定不变，在这个“微元过程”中，物体的运动就可以被看作是匀加速直线运动，因此适用于匀加速运动的规律在这个微元内完全成立，你这一套式子推导就在这一小段上完全成立，你再把每一小段加起来不就得了", "id": "ep5:296930335184:r0"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 2, "message": "这个问题我刚好想过。累加的过程和数学里的数列裂项相消很像。你把物体的运动切割成无穷多段，每一段的初始状态都是上一段的末状态，这样进行累加的时候，中间是正负交替排列的情形，再结合前面的状态关联，刚好全部消掉了，这样就只剩下了终末状态和初始状态这两个量，中间切割出来的量全部抵消了。", "id": "ep5:296930335184:r1"}]}, {"id": "ep5:294437374817", "module": "energy", "auto": false, "uname": "Zuawluv", "face": "_imgs/face_98988add0de4.jpg", "like": 4, "message": "共面但不共线的三个天体A、B、C绕平面ABC内某点O做角速度为<span class=\"math\">\\(\\omega (\\)<\/span>已知)的匀速圆周运动，三个天体的质量已知，引力常量<span class=\"math\">\\(G\\)<\/span>已知，求OA、OB、OC、AB、BC、CA(仅考虑三个天体的相互作用)", "raw_message": "共面但不共线的三个天体A、B、C绕平面ABC内某点O做角速度为ω（已知）的匀速圆周运动，三个天体的质量已知，引力常量G已知，求OA、OB、OC、AB、BC、CA（仅考虑三个天体的相互作用）", "images": [], "replies": [{"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 3, "message": "我看了你的解答，感觉弄麻烦了。其实不需要把矢量写成直角坐标的形式，因为这个系统所做的运动是旋转，最明显的特征就是周期性，直角坐标系反而没有描述出这个最主要的特性。直接使用位置矢量就可以了，也就是一根从质心长出来的箭头，这就很好地描述了这个运动。另外，从计算的角度来看，这个图形并没有很好的直角特征，要想描述两个相互垂直的分量其实很困难，这时候使用矢量运算反而更方便。而且，求解的是三角形三条边以及(…)，分解成坐标式，反而把原来集中的问题拆散了。", "id": "ep5:294437374817:r0"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 2, "message": "<span class=\"mention\">回复 @不要伤害我鹅子<\/span>  直接用位置矢量列出两个矢量方程：质心方程和受力方程后，直接用平面向量基本定理就可以得到，这个图形是等边三角形了", "id": "ep5:294437374817:r1"}, {"uname": "清子木", "face": "_imgs/face_00e4a2cf935d.jpg", "like": 1, "message": "<span class=\"mention\">回复 @不要伤害我鹅子<\/span>  权重的概念我刚学，质心还没学到。对这个问题理解的比较粗浅。请多指教！我记录一下我动笔前的想法：\n         首先要考虑各质点对系统的综合效果，整体分析。<span class=\"math\">\\(\n·why\\)<\/span>质心方程里用到加权？\n权重就是这个数值对系统平均数的影响，质量越大，越会想要拉着质心越靠近自己。<span class=\"math\">\\(\n·whyo\\)<\/span>点显然是质心？\n把质心理解为等效重心吧，因为没有外力，没有哦米噶时质心没动，所以转起来后质心也不能动，它们整体绕 O 点匀速旋转，整个旋转里只有 O 点不动，所以：O 点必须就是质心。于是可以写出质心方程，对情景进行根本约束。\n           其次要考虑质点间的作用力，个体效果。选择其中一个质点进行受力分析，由于最终效果必须全部 “对准同一个中心 O”，而且不能互相乱扯，必须一起绕 O 平稳旋转，所以必然等边！", "id": "ep5:294437374817:r2"}, {"uname": "清子木", "face": "_imgs/face_00e4a2cf935d.jpg", "like": 0, "message": "<span class=\"mention\">回复 @Zuawluv<\/span>  😅", "id": "ep5:294437374817:r3"}]}, {"id": "ep5:294455410465", "module": "energy", "auto": false, "uname": "shjbabsgh", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 4, "message": "问一下从平轨道进入圆轨道的临界点为什么按圆周运动算支持力，感觉真实物体今在进入临界点下一刻挤压才有力，但因为物体硬的不能压，如果临界点没力，下一时刻再产生力会有形变但因没有形变不得不在临界点受力。", "raw_message": "问一下从平轨道进入圆轨道的临界点为什么按圆周运动算支持力，感觉真实物体今在进入临界点下一刻挤压才有力，但因为物体硬的不能压，如果临界点没力，下一时刻再产生力会有形变但因没有形变不得不在临界点受力。", "images": [], "replies": [{"uname": "MySiddhartha", "face": "_imgs/face_48077d89217a.jpg", "like": 4, "message": "懂你。感觉这个\"不得不\"的说法还是听起来不太好，毕竟是真实物理约束是他究极的因，这一块“有力必有形变” 事实上在微观上是成立的。在临界点附近物体的前端尝试沿直线运动，会瞬间微幅挤压圆轨道的侧壁，正是那个极小形变产生了力，但他的时间非常短，在《理想》模型中，我们忽略了这个形变建立的时间和大小，直接认为在临界点力发生了突变。", "id": "ep5:294455410465:r0"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 1, "message": "如果刚进入圆轨道时不受向心力的话，它紧接着的速度是否还能发生变化？", "id": "ep5:294455410465:r1"}, {"uname": "Atomphysics", "face": "_imgs/face_19704788688b.jpg", "like": 1, "message": "世界是连续的", "id": "ep5:294455410465:r2"}, {"uname": "Atomphysics", "face": "_imgs/face_19704788688b.jpg", "like": 1, "message": "所谓临界 取前一帧还没有开始做圆周运动 取下一帧就开始做圆周运动了 那么我们到底要取哪一帧？当然取那一帧更合题意的", "id": "ep5:294455410465:r3"}]}, {"id": "ep5:296936028432", "module": "energy", "auto": false, "uname": "天影地光", "face": "_imgs/face_44bd5f0f7346.jpg", "like": 4, "message": "这个题考非匀速圆周运动中的切向加速度非常不错🍉", "raw_message": "这个题考非匀速圆周运动中的切向加速度非常不错[吃瓜]", "images": ["_imgs/img_0b9a8bf22bf6.jpg"], "replies": [{"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 2, "message": "我发表一下我的看法，没做过题目的同学不要看\n\n这题难点就在于①意识到静摩擦力提供径向和切向两个方向的摩擦力②分析出角速度是如何决定切向加速度的。对于②，可以想想加速度的定义就是速度的变化率，要求切向加速度，那就要看切向速度的变化。变化是<span class=\"math\">\\(\\Delta (w)*r\\)<\/span>。那加速度自然就是速度的变化率<span class=\"math\">\\(\\frac{\\Delta (w)r}{\\Delta (t)}\\)<\/span>，即角速度的变化率乘半径，看图像就可以知道了。接下来就简单了。", "id": "ep5:296936028432:r0"}, {"uname": "只吃方便面面饼", "face": "_imgs/face_569c9a388fef.jpg", "like": 1, "message": "青岛一模", "id": "ep5:296936028432:r1"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "同学给自己的问题、回复点个赞吧，因为up主要防止大家赞自己导致不公平🐶(我这个没有回答问题，不算)", "id": "ep5:296936028432:r2"}]}, {"id": "ep5:297586583040", "module": "energy", "auto": false, "uname": "J-x3Seven", "face": "_imgs/face_05fe31020cdb.jpg", "like": 3, "message": "分享一个内容，关于时间积累量的正方与道放的理解(关于能量角度，理解还是不够，望指正，谢谢)", "raw_message": "分享一个内容，关于时间积累量的正方与道放的理解（关于能量角度，理解还是不够，望指正，谢谢）", "images": ["_imgs/img_9fc257b7d805.jpg"], "replies": []}, {"id": "ep5:294500149745", "module": "energy", "auto": false, "uname": "日月0505", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 3, "message": "想请问 老师 或者明白的同学 这个题 B和C是不是一个问题啊。因为算出来是4派。所以B错了 但我问豆包 说B选项是2派。还有D这个说法 对不对呢", "raw_message": "想请问 老师 或者明白的同学 这个题 B和C是不是一个问题啊。因为算出来是4派。所以B错了 但我问豆包 说B选项是2派。还有D这个说法 对不对呢", "images": ["_imgs/img_0fe7e5545eb6.jpg"], "replies": [{"uname": "MySiddhartha", "face": "_imgs/face_48077d89217a.jpg", "like": 2, "message": "我产生了一个疑问，想问一下其他来解答这道题的朋友，对于甲和乙相距最近，甲比乙多转整数倍圈是充要条件还是必要条件？我的问题根本在于，轨道的几何倾斜，是否会对甲和乙相对最近这件事儿有额外更严格的限制，除了甲和乙在各自圆周运动轨道的同一个位置之外，还要让地心在甲乙的连线上？", "id": "ep5:294500149745:r0"}, {"uname": "沈夏期", "face": "_imgs/face_dcf5bbcf137d.jpg", "like": 1, "message": "<span class=\"mention\">回复 @MySiddhartha<\/span> 没有，<span class=\"math\">\\(4\\pi \\)<\/span>就是按这个规律算出来的最小值，如果你是<span class=\"math\">\\(2\\pi \\)<\/span>或<span class=\"math\">\\(6\\pi \\)<\/span>都是不成立的，只有<span class=\"math\">\\(4n\\pi \\)<\/span>才满足再次相距最远", "id": "ep5:294500149745:r1"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "其实bc就是简单的追击相遇只不过是在天体里面变形了一下，可以先想象一下一个平面内两个卫星绕着地球转动可以发现肯定是地球球心与两个卫星共线并且在同一边上时距离最近。这个时候就可以列出方程去解了(当然解方程肯定是最基础的，主要还是找到关系)🐶", "id": "ep5:294500149745:r2"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "d的话就是看它周期的变化来算出线速度的变化还是比较基础的🐶", "id": "ep5:294500149745:r3"}, {"uname": "MySiddhartha", "face": "_imgs/face_48077d89217a.jpg", "like": 0, "message": "咦同学，如果我的想法对的话，那这道题BC求相距最近是不是还要卡一下？除了甲比乙多转整数倍圈，还需要让乙自己相对于题干的原情况转的是整数倍圈呢，要不然他俩相距其实也不是最近呀，难道是这道题做了简化处理，并没有考的这么细致？", "id": "ep5:294500149745:r4"}, {"uname": "MySiddhartha", "face": "_imgs/face_48077d89217a.jpg", "like": 0, "message": "<span class=\"mention\">回复 @沈夏期<\/span> 昨晚发评论之后才意识到你应该是已经算了，没动笔算，真不好意思😂", "id": "ep5:294500149745:r5"}, {"uname": "沈夏期", "face": "_imgs/face_dcf5bbcf137d.jpg", "like": 0, "message": "<span class=\"mention\">回复 @MySiddhartha<\/span> 只是必要条件，倾斜会额外加上限制，你的想法是正确的，只有当甲乙均在水平面上才可能最近或最远", "id": "ep5:294500149745:r6"}, {"uname": "沈夏期", "face": "_imgs/face_dcf5bbcf137d.jpg", "like": 0, "message": "B选项答案应该是<span class=\"math\">\\(4\\pi \\)<\/span>，b c问题准确来说不是完全等价的，b问的是下一次相距最近，而c中可以包含之后任意一次相距最近那个，比如我把c中改成<span class=\"math\">\\(8\\pi \\)<\/span>，c也对\n此外对于d选项是对的，因为本来甲周期小于<span class=\"math\">\\(T\\)<\/span>，加速后做离心运动，轨道半径增大，周期增大有可能实现\n望有帮助", "id": "ep5:294500149745:r7"}]}, {"id": "ep5:294665018305", "module": "energy", "auto": false, "uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 2, "message": "我想问一下这个第7题，我是这么分析的，但我计算算不出来选项，确定这个运动只需要知道速度的大小和方向，因为受力都已知了，根据牛顿第二定律，可以把加速度给确定出来，也就是速度如何变化是知道的，走出来的位移就可以确定。我是如何确定这个速度最小值的，我是设了一个速度以及一个角度。一个运动唯一需要满足的不等条件就是在水平方向走了1.2米的时间竖直方向走过的高度一定要大于0.9米。但我算不出来呢", "raw_message": "我想问一下这个第7题，我是这么分析的，但我计算算不出来选项，确定这个运动只需要知道速度的大小和方向，因为受力都已知了，根据牛顿第二定律，可以把加速度给确定出来，也就是速度如何变化是知道的，走出来的位移就可以确定。我是如何确定这个速度最小值的，我是设了一个速度以及一个角度。一个运动唯一需要满足的不等条件就是在水平方向走了1.2米的时间竖直方向走过的高度一定要大于0.9米。但我算不出来呢", "images": ["_imgs/img_dc2c86fdc3e4.jpg"], "replies": [{"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 7, "message": "这题的常规做法比较不划算，但是如果斜抛运动采用斜交分解的话就很好算了，列个勾股定理，开根24就是二倍根号六", "id": "ep5:294665018305:r0"}, {"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 5, "message": "这好像是武汉三调的题吧，这武汉三调的压轴小题和压轴大题都用了三角函数。着急上学就先不展示过程了😂，等有空我补上", "id": "ep5:294665018305:r1"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 4, "message": "另一种简洁的方法就是另一个同学说的“斜交分解”，这种方法的本质其实和配速法是一样的。相同本质的一个问题在第四期中被一个名为“秃头少女”的同学所提到，你可以去看看。(就是上期提问的第一名)", "id": "ep5:294665018305:r2"}, {"uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 0, "message": "斜交分解勾股定理基本不等式", "id": "ep5:294665018305:r3"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 0, "message": "按照你的思路，最后得到的是一个关于角度和速度两个变量的不等式。约束是：对任意合法的角度，这个不等式都成立，求速度的最小值。这就是数学里的恒成立问题了。", "id": "ep5:294665018305:r4"}, {"uname": "银河小铆钉", "face": "_imgs/face_9359b494dba7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @求进步的祁厅长<\/span> 求", "id": "ep5:294665018305:r5"}]}, {"id": "ep5:294866253041", "module": "energy", "auto": false, "uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 0, "message": "@-Sir-xiao 积分得出能量守恒，是可以求出位移的", "raw_message": "@-Sir-xiao 积分得出能量守恒，是可以求出位移的", "images": ["_imgs/img_fd71326c505e.jpg"], "replies": []}, {"id": "ep5:294499829377", "module": "momentum", "auto": false, "uname": "e的变化率不是e", "face": "_imgs/face_85ac0420741b.jpg", "like": 6, "message": "关于能量，有几个想了很久的问题：\n1、动量对速度积分得到动能，乍一看好像很好解释，因为动量为积分<span class=\"math\">\\(F\\cdot dt\\)<\/span>，乘上瞬时速度<span class=\"math\">\\(v\\)<\/span>就变成积分<span class=\"math\">\\(F\\cdot dx\\)<\/span>等于动能，而瞬时速度正是时间与空间的桥梁。但是，仔细一想，这并不是“动量对速度积分”<span class=\"math\">\\((mv\\cdot dv)\\)<\/span>，而是瞬时速度对动量的积分<span class=\"math\">\\((v\\cdot mdv)\\)<\/span>？这要怎么理解比较好\n2、有些高中的课内难题或强基题，涉及较复杂的斜面滑块约束，这时用能量来做能避开约束力的引入以及受力分析，求出动能，然后求导即可得加速度。但是，这只适用“直线约束”，即如果斜面是曲面使物块做曲线运动，那么动能求导来求加速度将会损失法向分量，即求出的是切向加速度。这是因为能量的点乘只得到切向的投影，虽然避开了法向约束力，但也因此损失了法向的信息？\n3、为什么动能具有完美的“正交独立性”？\n4、动量+能量能确定一个系统，如何理解和证明这种充要性\n作为高中生，在线下问这些问题只会收到嘲笑，在咕咕这里相信有热爱思考的同志能来一起探讨[抱拳][抱拳]", "raw_message": "关于能量，有几个想了很久的问题：\n1、动量对速度积分得到动能，乍一看好像很好解释，因为动量为积分F·dt，乘上瞬时速度v就变成积分F·dx等于动能，而瞬时速度正是时间与空间的桥梁。但是，仔细一想，这并不是“动量对速度积分”（mv·dv），而是瞬时速度对动量的积分（v·mdv）？这要怎么理解比较好\n2、有些高中的课内难题或强基题，涉及较复杂的斜面滑块约束，这时用能量来做能避开约束力的引入以及受力分析，求出动能，然后求导即可得加速度。但是，这只适用“直线约束”，即如果斜面是曲面使物块做曲线运动，那么动能求导来求加速度将会损失法向分量，即求出的是切向加速度。这是因为能量的点乘只得到切向的投影，虽然避开了法向约束力，但也因此损失了法向的信息？\n3、为什么动能具有完美的“正交独立性”？\n4、动量+能量能确定一个系统，如何理解和证明这种充要性\n作为高中生，在线下问这些问题只会收到嘲笑，在咕咕这里相信有热爱思考的同志能来一起探讨[抱拳][抱拳]", "images": [], "replies": [{"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 9, "message": "对于你的第一个问题，我之前是无意中发现两者好像是一样的式子，我的感觉是好像在数学方面是成立的，但是它不具备物理意义，举个从初中学到现在的例子，电阻的比值定义，加在两端的电压与流经过的电流，乍一看好像是与电压成正比，与电流成反比，但是这是在数学意义上，但在物理层面，电阻值与材料，长度，横截面积三者相关，→→所以我觉得我们应该从真正的物理学层面来看待这个积分\n我记得哪一本人教版教材上好像提到过，也许是选择性必修一动量那一章，他那里确实提到了动量与动能的辩证关系，强调的是，力在时间上的累积，与力在空间上的累积，\n→→从教材出发，那要求动能肯定是跟空间位移有关x\n我们又已知动能等于fdx，<span class=\"math\">\\(Dx=V\\)<\/span>乘dt，<span class=\"math\">\\(F=dp\\)<\/span>比<span class=\"math\">\\(t\\)<\/span>，把它全部带进换掉，<span class=\"math\">\\(Fdx=v\\)<\/span>乘dp，也就是动量等于速度对动量变化的积分，所以我认为呀，这个虽然它有两种表达形式，但是从高中课本的角度引导的方向来说，应该是速度对动量的积分，只有这样才能体现出力在空间上的累积。\n而第二个式子只不过是等式，有点像三角恒等变换吧感觉，就换成了动量对速度的积分。\n所以我认为啊，数学上可以取等，但在物理方面应该只能是速度对动量的积分，这才是动能", "id": "ep5:294499829377:r0"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 2, "message": "第一题我没看懂是啥意思。))\n第二题：法向力是不做功的，也就是说，动能的信息里本来就不包含法向的信息，不是说求导把法向的信息给弄丢了。\n第三题，动能正比于速度平方，平方是两个速度矢量点积，正交分解的时候，点积的交叉项刚好是0，所以平方后只剩下两个分量的平方。\n第四题我也没看懂)😳\n我不知道我的解释有没有漏洞，如果有的话还请大佬们指出[给心心]", "id": "ep5:294499829377:r1"}, {"uname": "清子木", "face": "_imgs/face_00e4a2cf935d.jpg", "like": 1, "message": "上面说到 “动能关于速度的求导是动量” 并不完全合理。导数是 “看变化有多快”，积分是 “把这些变化一点点加回去”，二者互逆。所以 “动量对速度积分 = 动能” 同样默认了质量 m 不变。\n本质上，力 = 动量的变化率\n只有当质量 m 不变时，才能把 m 从变化量里提出来：<span class=\"math\">\\(\\Delta (mv)=m\\Delta v\n\\)<\/span>于是才有：<span class=\"math\">\\(F= m\\Delta v/\\Delta t =ma.\n\\)<\/span>力真正直接改变的，是动量 p；\n只有在质量 m 不变的前提下，动量变了，速度才不得不跟着变。<span class=\"math\">\\(\nE_k=\\int p\\Delta v\\)<\/span>也就是 “动量对速度积分等于动能”，是只有 m 不变时才成立的数学形式，并非物理本质。\n之所以这两个积分看上去相等，只是因为 m 不变，才能把 m 拆出来挪动：<span class=\"math\">\\(\n\\int v\\Delta p=\\int v⋅m\\Delta v=\\int mv⋅\\Delta v=\\int p\\Delta v\n\\)<\/span>但这只是数学变形，不是物理过程的顺序。\n所以物理上真实、合理的顺序是：\n先有动量变化<span class=\"math\">\\( \\Delta p\\)<\/span>，再乘速度 v → 得到动能增量\n而不是：\n先有速度变化<span class=\"math\">\\( \\Delta v\\)<\/span>，再乘动量 mv → 得到动能增量", "id": "ep5:294499829377:r2"}, {"uname": "清子木", "face": "_imgs/face_00e4a2cf935d.jpg", "like": 1, "message": "<span class=\"mention\">回复 @清子木<\/span> <span class=\"math\">\\( \\int vdp=\\int v⋅mdv=\\int mv⋅dv=\\int pdv\\)<\/span>，<span class=\"math\">\\(E_k=\\int pdv\\)<\/span>是不是这么写才对啊，我其实还没学微积分[撇嘴]。。。", "id": "ep5:294499829377:r3"}, {"uname": "清子木", "face": "_imgs/face_00e4a2cf935d.jpg", "like": 0, "message": "https://www.bilibili.com/read/cv31160577/?from=search&amp;spm_id_from=333.337.0.0&amp;opus_fallback=1", "id": "ep5:294499829377:r4"}, {"uname": "荡光_", "face": "_imgs/face_76773a25c555.jpg", "like": 0, "message": "一个清澈愚蠢的大一生来发表下拙见。\n问题1，动量的变化量是力在时间上的累计—冲量。怎么能让它转化成空间上的累积呢？自然要想到<span class=\"math\">\\(dx=vdt\\)<\/span>，也就是“桥梁”。我猜你的疑惑应该在怎么看待<span class=\"math\">\\(m\\)<\/span>上。我的理解是，质量，起码在宏观低速这边，是描述物体运动“程度”的量，就是一个系数。mvdv实际上就是“运动状态对变化的累积”，那么变化就要涉及能量的转化。\n问题2，起码在高中的时候，描述“累积”一般都是点乘，点乘实际上就是求一个量对另一个量的贡献。既然对能量操刀，那就很可能要舍弃“没有贡献”的一方--法向。\n问题3，我猜你想说的是动能可以类似的正交分解。我觉得本质上就是因为力和位移都是可以正交分解的，使得分力只对一方有贡献，另一方无贡献，自然可以做到正交。\n问题4，我觉得两者的变化量是力在时间和空间的累积导致的。力是物体状态变化的原因，使得我对于一个确定的物体，知道初始值，再知道力(变化因素)，我就可以确定它的运动。那么初始叠加上变化等于什么呢？末态的累计值，也就是动量能量。", "id": "ep5:294499829377:r5"}, {"uname": "荡光_", "face": "_imgs/face_76773a25c555.jpg", "like": 0, "message": "<span class=\"mention\">回复 @清子木<\/span> <span class=\"math\">\\(Fdt=mdv\\)<\/span>，两边乘<span class=\"math\">\\(v\\)<\/span>，变成<span class=\"math\">\\(Fvdt=mvdv\\)<\/span>。左边你说功率积分也行，<span class=\"math\">\\(vdt=dx\\)<\/span>也行，反正等于dW，右边<span class=\"math\">\\(d(\\frac{1}{2})mv^2\\)<\/span>", "id": "ep5:294499829377:r6"}]}, {"id": "ep5:294697048305", "module": "momentum", "auto": false, "uname": "叽里咕噜yyy-zzz", "face": "_imgs/face_cdd7535fe617.jpg", "like": 4, "message": "一个很有意思的问题：关于动能和动量的得出，一个“<span class=\"math\">\\(\\frac{1}{2}mv^2\\)<\/span>”一个“mv”，表达式如此相近，它们的得出是一种怎么样的感觉，有一种什么样的区别？再联系功与势能。弄清楚这个应该就很好理解能量和动量，以及如何共同确定一个系统了", "raw_message": "一个很有意思的问题：关于动能和动量的得出，一个“1/2mv²”一个“mv”，表达式如此相近，它们的得出是一种怎么样的感觉，有一种什么样的区别？再联系功与势能。弄清楚这个应该就很好理解能量和动量，以及如何共同确定一个系统了", "images": [], "replies": [{"uname": "清子木", "face": "_imgs/face_00e4a2cf935d.jpg", "like": 2, "message": "https://www.bilibili.com/read/cv31160577/?from=search&amp;spm_id_from=333.337.0.0&amp;opus_fallback=1", "id": "ep5:294697048305:r0"}]}, {"id": "ep5:294406913441", "module": "optics", "auto": false, "uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 16, "message": "我还有一个小时候一直想到大的问题，\n就是，我制作出来一个特殊的镜子，能让光路在里面多次弯折，使得其中一束光与入射光线完完全全的重合，此时再把激光笔关掉，会留下光路吗？", "raw_message": "我还有一个小时候一直想到大的问题，\n就是，我制作出来一个特殊的镜子，能让光路在里面多次弯折，使得其中一束光与入射光线完完全全的重合，此时再把激光笔关掉，会留下光路吗？", "images": ["_imgs/img_040a770ebfe5.jpg"], "replies": [{"uname": "道格拉斯-路西恩", "face": "_imgs/face_362f6c7d4188.jpg", "like": 10, "message": "一，我觉得光在碰撞的过程中应该会损失能量，会衰减🐶，二，如果这装置真锁住了光，没有光子来到眼睛，那你怎么看见光路呢🐶", "id": "ep5:294406913441:r0"}, {"uname": "清子木", "face": "_imgs/face_00e4a2cf935d.jpg", "like": 3, "message": "<span class=\"mention\">回复 @求进步的祁厅长<\/span> 那我也比较幼稚的接一接🐶\n如果是不完美的镜子\n光的存在、传播、消失，都需要时间\n光路不会立马断，光子会跑完最后一程\n只是这个时间尺度太小，大脑处理不了、感知不到。我们仍然是在人眼的尺度上讨论的。如果你的镜子能更神奇一点，就是巨大无比或者怎么着，或许我们可以把时间微小放大到人脑能处理的程度。\n如果是完美的镜子，没有损失，那么我们就可以囚禁光，光路永存！光子们在我们完美的镜腔内，幸福的生活到永远！\n可如果我不停的往这个系统里面灌光子呢？如果有一个完美的腔，那么我们就会得到一次完美的爆炸。也许宇宙中真的可以存在光囚笼……或许是磁场来充当？超出我的知识范畴了。。。", "id": "ep5:294406913441:r1"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 2, "message": "<span class=\"mention\">回复 @求进步的祁厅长<\/span>  我觉得也会消失，这个系统始终都有能量损失，当你停止了对这个系统输入能量，那么这个系统总有一天会把能量消耗殆尽的。", "id": "ep5:294406913441:r2"}, {"uname": "没实力的蹭课崽", "face": "_imgs/face_76afc9412d10.jpg", "like": 2, "message": "我也这么想过🤩，光的监狱", "id": "ep5:294406913441:r3"}, {"uname": "乱刃影舞", "face": "_imgs/face_abc3929aba34.jpg", "like": 2, "message": "折射的本质就是垂直方向光子动量衰减", "id": "ep5:294406913441:r4"}, {"uname": "清子木", "face": "_imgs/face_00e4a2cf935d.jpg", "like": 1, "message": "<span class=\"mention\">回复 @清子木<\/span> 不过光子如果被磁场囚禁的话，如果不停的灌输，达到一定限度后，会不会光子就不再是光子了呢？", "id": "ep5:294406913441:r5"}, {"uname": "清子木", "face": "_imgs/face_00e4a2cf935d.jpg", "like": 0, "message": "<span class=\"mention\">回复 @道格拉斯-路西恩<\/span>  赞啦\n不过为什么要关心能不能看到光呢？🐶\n我们只用考虑如果这装置真锁住了光，是否真的存在光路……", "id": "ep5:294406913441:r6"}, {"uname": "清子木", "face": "_imgs/face_00e4a2cf935d.jpg", "like": 0, "message": "<span class=\"mention\">回复 @清子木<\/span>  并不是看不见的就不存在", "id": "ep5:294406913441:r7"}, {"uname": "马白勺i", "face": "_imgs/face_28045bd3fcb1.jpg", "like": 0, "message": "每次反射都有能量损失，即使损失很少，但光速极快反射次数非常多，到最后能量衰减完也就看不见光了，这个过程基本上就是关闭激光灯的瞬间人眼就看不见了，因为光速太快了🐶", "id": "ep5:294406913441:r8"}]}, {"id": "ep5:294398743281", "module": "em", "auto": false, "uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 17, "message": "这是武汉三调的磁场题，\n我有一个错误的想法，导致我一直算不出来，滥用对称性分析简化成斜抛问题，这种情况真的无解吗", "raw_message": "这是武汉三调的磁场题，\n我有一个错误的想法，导致我一直算不出来，滥用对称性分析简化成斜抛问题，这种情况真的无解吗", "images": ["_imgs/img_8b4ea4f5d180.jpg", "_imgs/img_3d2815441468.jpg"], "replies": [{"uname": "8589869056", "face": "_imgs/face_312f2ee08559.jpg", "like": 4, "message": "不用看成斜抛问题，更不要用<span class=\"math\">\\(v_y t-\\frac{1}{2}g t^2\\)<\/span>这种公式。为了方便，约定粒子一开始进入磁场的时候水平位移是<span class=\"math\">\\(x\\)<\/span>，磁场让粒子向左水平运动<span class=\"math\">\\(y\\)<\/span>。首先，我们需要明白磁场对粒子的作用到底是什么，我们只看粒子的速度矢量，粒子进入磁场再出来，速度矢量就是关于<span class=\"math\">\\(x\\)<\/span>轴对称了一下。既然是这样，那么粒子从磁场出来以后，就会生成一个完全对称的轨迹，水平走过<span class=\"math\">\\(x\\)<\/span>，达到最高点，纵坐标为<span class=\"math\">\\(h\\)<\/span>，横坐标为<span class=\"math\">\\((2x-y)\\)<\/span>，接下来水平再走<span class=\"math\">\\(x\\)<\/span>，和原来一样地方式进入磁场，速度矢量没有变。纵观全部的运动过程，粒子达到纵坐标为<span class=\"math\">\\(h\\)<\/span>的点只能是一系列抛物线的最高点，每次这些最高点都向右平移<span class=\"math\">\\((2x-y)\\)<\/span>，所以自然地<span class=\"math\">\\(n(2x-y)=h\\)<\/span>就出来了。\n此外，值得提的是，磁场导致的粒子水平位移，是与粒子的初速度无关的。这里我们需要用到一个二级结论，即粒子在磁场中运动，竖直方向的速度决定水平方向的位移，水平方向的速度决定竖直方向的位移，由于电场没有变，粒子的竖直方向的速度没有变，所以粒子在磁场中的水平方向的位移，也就是<span class=\"math\">\\(y\\)<\/span>，是不会变的，也就是与<span class=\"math\">\\(x\\)<\/span>无关的。", "id": "ep5:294398743281:r0"}, {"uname": "-思厥", "face": "_imgs/face_98fe760e808e.jpg", "like": 1, "message": "你默认粒子在磁场运动的半径为<span class=\"math\">\\(h\\)<\/span>了，所以由于、对称性粒子会回到(0，h),这样导致到不了(h,h)", "id": "ep5:294398743281:r1"}, {"uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 0, "message": "<span class=\"mention\">回复 @8589869056<\/span> 我基本能理解整个运动图像了，但是我的对称性会想得比较慢，我想转出磁场来到电场的时候，速度跟原来是关于X轴对称(有圆的对称性可知，可以画一画线截圆有什么特点)，速度大小不变，受力不变，我也不是很能理解这个对称(就是这种对称性没有深入我的直觉)，但是能看出来对称，我觉得这个第二问的第一小问，感觉就是在考一个二级结论，明白洛伦兹力的冲量式，把在磁场中运动的时间分成无穷份，每一段运动都可以看成匀速直线运动，在利用运动的合成与分解，加上动量定理，在求和，就可以知道水平方向的位移是由竖直方向的速度变化量决定，感觉有点在考信息差，不知道洛伦兹力冲量式的人一般就写不出来", "id": "ep5:294398743281:r2"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 0, "message": "你能不能展开讲讲你是怎么用对称性简化的？这题我刚好也做了，我的理解是，磁场只是负责搬运粒子在电场中的轨迹", "id": "ep5:294398743281:r3"}, {"uname": "川島亞美-", "face": "_imgs/face_34b5b094b0b3.jpg", "like": 0, "message": "这就是这道题应该要用的正确解题思路，而且也不难想到，为什么要用“滥用”一词？你是如何算的呢，我不明白你说的这种情况的无解在哪", "id": "ep5:294398743281:r4"}]}, {"id": "ep5:294663087473", "module": "em", "auto": false, "uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 13, "message": "在学习法拉第电磁感应定律的时候，对非闭合电路中的电动势分析有些疑问，在单棒以<span class=\"math\">\\(V_{0}\\)<\/span>在切割磁场时，很明显由于电荷的移动，会产生一个电场，并且这个电场应该是匀强电场，在旋转切割时也同理，可是在具体分析这些电荷运动时却有些疑问，电场是一瞬间产生的，那么电荷也是一瞬间运动到平衡，但是在旋转时电荷是怎么分布的？求解答🙌🐶", "raw_message": "在学习法拉第电磁感应定律的时候，对非闭合电路中的电动势分析有些疑问，在单棒以V0在切割磁场时，很明显由于电荷的移动，会产生一个电场，并且这个电场应该是匀强电场，在旋转切割时也同理，可是在具体分析这些电荷运动时却有些疑问，电场是一瞬间产生的，那么电荷也是一瞬间运动到平衡，但是在旋转时电荷是怎么分布的？求解答[打call][doge_金箍]", "images": ["_imgs/img_33b5ebdfad2e.jpg"], "replies": [{"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 7, "message": "你把旋转切割剁碎成微圆小段来分析，那么在极小位移内就是一个单杆平动切割，就是非常简单的动生电动势了，再把它给累加起来就是旋转切割。\n其实电磁感应的微观本质就是电磁流量计，自由移动的电子就是带电的电解质溶质", "id": "ep5:294663087473:r0"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 3, "message": "<span class=\"mention\">回复 @丁真爱测码da<\/span> 电荷的分布我前面回答里写了，“电荷分布会不断调节直到该电荷分布产生的电场刚好抵消每处的电荷受到的洛伦兹力”，所以回答就是“其产生的电场刚好抵消每处的电荷受到的洛伦兹力的那样一个电荷分布”", "id": "ep5:294663087473:r1"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 2, "message": "这个提问的表述有问题吧：“很明显由于电荷的移动，会产生一个电场”，这句话不太对。电荷运动是不直接产生电场的，你可以说运动的电荷在磁场中受到洛伦兹力，这是可以的，然后再说：假如导体内的电荷只受这个里的话就不能平衡，就会有电流，导致正负电荷在导体表面堆积，这样的电流会持续直到堆积起来的电荷产生的静电场能够平衡掉洛伦兹力这个“非静电力”为止。这又是咕咕常说的“假设-调整”的图像。", "id": "ep5:294663087473:r2"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 2, "message": "“动生电场”和“洛伦兹力”，这两种看法是等价的，因为洛伦兹力就是产生“动生电场”的微观机制。这件事情咕咕有个视频讲过怎么从洛伦兹力推出动生电场，不知道现在这个视频还在不在，你可以去找来看看，不懂可以再问。", "id": "ep5:294663087473:r3"}]}, {"id": "ep5:294660588257", "module": "em", "auto": false, "uname": "-Sir-xiao", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 7, "message": "最近学到电磁感应这里，关于这一类从动量，能量考虑的问题为什么从能量考虑有时候就走不通了呢？目前感觉入手这一类题都是将动量 能量 电路相关式子列出再求解，没有太多目的性，这是怎么回事呢？(更具体的问题在<span class=\"math\">\\(P_{2})\\)<\/span>", "raw_message": "最近学到电磁感应这里，关于这一类从动量，能量考虑的问题为什么从能量考虑有时候就走不通了呢？目前感觉入手这一类题都是将动量 能量 电路相关式子列出再求解，没有太多目的性，这是怎么回事呢？（更具体的问题在P2）", "images": ["_imgs/img_099aa93e2e90.jpg", "_imgs/img_bc31275a49e1.jpg"], "replies": [{"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 10, "message": "当然可以用能量分析(因为全过程的力一直在变化肯定会想到用能量或者动量来规避动力学分析)不过你的能量转化写错了🐶可能你还没学到交流电那里，但是请你想一想电路中的电流是否是恒定的？如果不是那么是不是均匀变化的？那么如果不是均匀变化的又怎么能直接写<span class=\"math\">\\(Q=i^2rt\\)<\/span>呢？它确实是等于方rt只不过这个<span class=\"math\">\\(i\\)<\/span>应该是等效电流🐶", "id": "ep5:294660588257:r0"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 8, "message": "只不过用到能量分析时会遇到我说的问题所以还是要舍去，去选取动量", "id": "ep5:294660588257:r1"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 7, "message": "你的感觉是对的，用能量是能够确定的，也确实可以做出来答案。只不过光靠初末的能量是不能直接定出<span class=\"math\">\\(x\\)<\/span>的。你看你前面“能量”的那个推导，其实就是只用到了初末能量的变化，但你最终也看到了，能量变化并不直接对应<span class=\"math\">\\(x\\)<\/span>，而是对应一个 “<span class=\"math\">\\(v \\Delta  x \\)<\/span>求和” 。注意，你得到的这个量涉及整个过程的信息，而非只是初末状态，因为这个求和是受“<span class=\"math\">\\(v\\)<\/span>是如何随<span class=\"math\">\\(x\\)<\/span>变化”影响的。这就暗示，虽然能量是守恒的，从能量上也原则上足以确定下<span class=\"math\">\\(x\\)<\/span>，但并不是直接从初末能量就能直接定出<span class=\"math\">\\(x\\)<\/span>，而是要仔细研究每一小步的能量守恒，需要看清整个过程才行。下面是能量的正确做法\n根据能量守恒，动能的每一步微小变化<span class=\"math\">\\( \\Delta E = I^2 R \\Delta t = B^2 L^2 v^2 \\Delta t /R\n\\)<\/span>而动能的变化根据动能的定义又可以写作<span class=\"math\">\\( \\Delta E = \\Delta (\\frac{1}{2} mv^2) = mv \\Delta v\n\\)<\/span>直接代入得到<span class=\"math\">\\( m\\Delta v = B^2 L^2 v\\Delta t /R (\\)<\/span>这一行只是约掉了v)，\n到这里已经和动量推导出来的式子一模一样了，左边是<span class=\"math\">\\(\\Delta v\\)<\/span>，右边是<span class=\"math\">\\(v\\Delta t=\\Delta x\\)<\/span>。这就马上得到总位移正比于速度变化了。所以能量和动量的做法本质上是一致的，是自洽的。", "id": "ep5:294660588257:r2"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 6, "message": "面对一个未知量的时候要自动去想去类比去找寻哪个公式可以求，之前哪个题目求类似的东西了。类似于你求的<span class=\"math\">\\(x\\)<\/span>，<span class=\"math\">\\(x\\)<\/span>是位移，在运动学中<span class=\"math\">\\(x=vt\\)<\/span>而这时我就要想什么公式可以出现vt如果出现了，并且列出方程中的其余量是否已知或可求。或者看到<span class=\"math\">\\(x\\)<\/span>就和你一样想到了<span class=\"math\">\\(fx=w\\)<\/span>但是可以发现<span class=\"math\">\\(w\\)<\/span>在变式过程中就会出现未知量不可求，那么就要即是去换方法去求🐶", "id": "ep5:294660588257:r3"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 4, "message": "本质就是<span class=\"math\">\\(F=ma\\)<\/span>。你研究动能、动量在微小过程里的变化，都等价于在直接研究<span class=\"math\">\\(F=ma\\)<\/span>。因为动能、动量的表达式本来就是从 “<span class=\"math\">\\(F=ma \\)<\/span>在空间、时间上做一小段积累”推出来的。", "id": "ep5:294660588257:r4"}, {"uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 1, "message": "能量的话在运动方程两边乘以速度再积分", "id": "ep5:294660588257:r5"}, {"uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 1, "message": "只要有了运动方程，系统的所有行为就确定了，动量能量都可以积分运动方程得出", "id": "ep5:294660588257:r6"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 1, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> <span class=\"math\">\\(E=\\frac{1}{2}mv^2, \\)<\/span>所以<span class=\"math\">\\(E+dE=\\frac{1}{2}m(v+dv)^2,\\)<\/span>所以<span class=\"math\">\\(dE=mv dv. \\)<\/span>高阶小量<span class=\"math\">\\(dv^2\\)<\/span>被我扔掉了，这是因为这个分析是对非常小的dv过程进行的，随着把dv取的越来越小，<span class=\"math\">\\(dv^2\\)<\/span>会变得越来越无足轻重。", "id": "ep5:294660588257:r7"}, {"uname": "雷苇航", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "也就是说<span class=\"math\">\\(i\\)<\/span>在这种情况下不规律变化无法被等效吗？", "id": "ep5:294660588257:r8"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @xyz179<\/span> 请问一下deltaE为什么等于mv deltav", "id": "ep5:294660588257:r9"}]}, {"id": "ep5:294454549361", "module": "em", "auto": false, "uname": "没有脑的鱼", "face": "_imgs/face_b4aea5da599b.jpg", "like": 7, "message": "这个产生热量到底是不是这样？🐶", "raw_message": "这个产生热量到底是不是这样？[doge]", "images": ["_imgs/img_7d1b11bcb566.jpg"], "replies": [{"uname": "知微物理", "face": "_imgs/face_7d6970a35866.jpg", "like": 3, "message": "<span class=\"mention\">回复 @没有脑的鱼<\/span> 我发了一篇对你这个问题解答的文章 可以看一下 希望有帮助", "id": "ep5:294454549361:r0"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 1, "message": "说一下我的拙见吧🐶：在<span class=\"math\">\\(E_{0}\\)<\/span>下会产生电流而杆也会产生感应电动势，感应电动势会阻碍电荷的移动从而使通过的电荷量变少(也就是说感应电动势并没有做功)，而在电路中的总能量是由电源所提供并且电动势恒为<span class=\"math\">\\(E_{0}\\)<\/span>最后通过电路总能量就是在<span class=\"math\">\\(E_{0}\\)<\/span>下所通过的电荷量与<span class=\"math\">\\(E_{0}\\)<\/span>的乘积🐶", "id": "ep5:294454549361:r1"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 1, "message": "我本来想问这个的，被你抢先一步了🐶。不过我没看懂图像，能给我解释一下吗？", "id": "ep5:294454549361:r2"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @丁真爱测码da<\/span> 感应电动势就不是电动势吗？🐶", "id": "ep5:294454549361:r3"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @丁真爱测码da<\/span> 等下，这里安培力做正功，应该是会把电能转化成其他能量才对😭", "id": "ep5:294454549361:r4"}]}, {"id": "ep5:294556321217", "module": "em", "auto": false, "uname": "Yao174", "face": "_imgs/face_670ba83da88f.jpg", "like": 4, "message": "本题为2024年天津高考压轴题\n其中⑶让我产生疑问：时间为什么会产生矛盾？\n①从线圈的角度看，总时间是<span class=\"math\">\\(2\\pi /\\omega \\)<\/span>的求和，而它是一个发散的级数，趋近于无穷大；\n②从汽车的角度看，总时间是<span class=\"math\">\\(\\frac{x}{a}\\)<\/span>，而这应当是一个有限的值。\n这样时间不对应的矛盾是怎么产生的呢？\n矛盾产生的本质原因又是什么呢？[鸭科夫_干嘛鸭][鸭科夫_干嘛鸭]", "raw_message": "本题为2024年天津高考压轴题\n其中⑶让我产生疑问：时间为什么会产生矛盾？\n①从线圈的角度看，总时间是2π/ω的求和，而它是一个发散的级数，趋近于无穷大；\n②从汽车的角度看，总时间是x/a，而这应当是一个有限的值。\n这样时间不对应的矛盾是怎么产生的呢？\n矛盾产生的本质原因又是什么呢？[鸭科夫_干嘛鸭][鸭科夫_干嘛鸭]", "images": ["_imgs/img_4ea68070df4a.jpg", "_imgs/img_4632bc9e46b3.jpg"], "replies": [{"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 1, "message": "这是题目的问题。题目应该是暗含了“线框就是轮轴”这样的意思，你也是基于此指出了“线框转速的变化和车速变化不匹配”。你指出的是对的。我觉得就是题目的漏洞，要想圆回去，就只能说“线框和轮轴还不完全对应”，也许中间还插了个变速器……但你基于“线框转速就对应轮轴转速”这一假设之上做的推理是对的，如果是这样的话，那确实不自洽。", "id": "ep5:294556321217:r0"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @Yao174<\/span> 他的意思是你的推理过程出现了问题，题目本身没有问题。我没有具体看你的问题，你可以自己检查一下🐶", "id": "ep5:294556321217:r1"}, {"uname": "沈夏期", "face": "_imgs/face_dcf5bbcf137d.jpg", "like": 0, "message": "因为他不会转无数圈，你认为时间趋于无穷，是因为默认会转无穷圈，这显然错误", "id": "ep5:294556321217:r2"}, {"uname": "沈夏期", "face": "_imgs/face_dcf5bbcf137d.jpg", "like": 0, "message": "<span class=\"mention\">回复 @Yao174<\/span> ？题中哪里有矛盾", "id": "ep5:294556321217:r3"}, {"uname": "沈夏期", "face": "_imgs/face_dcf5bbcf137d.jpg", "like": 0, "message": "get it其实昨天发完评论我也想到这个问题，确实我一开始在求热量时也是无限求和。在写题时直观上你可以先明显感到线圈一定是只转一会就停下，时间一定是有限时间，而我问题觉得在于题中理想化情形脱离实际，等比例衰减的情况并非可行，以及我认为它隐含当指数放大一定程度时就认为线圈停下否则题中线圈停下无从谈起", "id": "ep5:294556321217:r4"}]}, {"id": "ep5:297418923168", "module": "em", "auto": false, "uname": "MySiddhartha", "face": "_imgs/face_48077d89217a.jpg", "like": 3, "message": "大家好，我这个问题是对于电感线圈两边瞬时加上电压之后为什么电流的变化率是由大变小，而不是由小变大(毕竟直觉上最开始自感电动势最大阻碍最大嘛)的一个常见错误的讨论。建模几乎原封不动来自2021年浙江卷。目前我的理解：\n对于一个线圈(电感 L ，电阻 R)，两端瞬时加上电压 U ，电流 i 由这个公式决定：\n电源电压 = 电阻的欧姆电压降 + 电感产生的自感电动势的大小，\n即<span class=\"math\">\\(U = iR + L\\frac{di}{dt}(\\)<\/span>这个公式看不懂的，我写在图片上了)\n这个公式就是全部的本质。 它告诉我们，外部电压 U 这个“总预算”，要用于两件事：一是维持已有电流 i 流过电阻 R，就是支付 iR 的“维持费”，二是用于支付 L\\frac{di}{dt} 的“变更费”。\n\n图像(上凸曲线)的正确解释\n初始时刻电流<span class=\"math\">\\( i=0\\)<\/span>，此时，外部电压全部用作“变更费”，全力负责电流的变化率。相应地，自感电动势 L\\frac{di}{dt} 也最大<span class=\"math\">\\((= U)\\)<\/span>。而随时间推移：电流 i 逐渐增大，“维持费” iR 随之增加。由于总预算U 不变，剩余的“变更费”就越来越少，导致电流变化率 \\frac{di}{dt} 越来越小。图像斜率由大变小，呈上凸形状。\n我的直觉错误：一开始自感电动势最大，阻碍最强，所以电流应该增加得最慢(斜率最小)，斜率应由小变大。\n错误根源在于因果倒置，我认为自感电动势大是原因，电流变化率小是结果。实际上恰恰相反。自感电动势是电流变化率的结果而不是原因。是“因为变化率大，所以自感电动势才大”，逻辑不能反过来。\n同时我混淆了 电流的大小和电流变化的快慢，在通电瞬间，电流的大小 确实是最小的(为零)，这才是因为自感电动势的阻碍，它阻止电流的瞬时建立。\n但电流变化的快慢(斜率) 是由“净驱动电压”决定的。初始时刻，电阻上无压降，净驱动电压就是 U，所以变化最快。自感电动势的“阻碍”体现在维持电流为零这个状态，而不是让它缓慢启动。\n\n有没有更好的理解方式？我们能从这个问题的修正中获得什么更高层面的启发？感谢大家参与讨论😳", "raw_message": "大家好，我这个问题是对于电感线圈两边瞬时加上电压之后为什么电流的变化率是由大变小，而不是由小变大（毕竟直觉上最开始自感电动势最大阻碍最大嘛）的一个常见错误的讨论。建模几乎原封不动来自2021年浙江卷。目前我的理解：\n对于一个线圈（电感 L ，电阻 R），两端瞬时加上电压 U ，电流 i 由这个公式决定：\n电源电压 = 电阻的欧姆电压降 + 电感产生的自感电动势的大小，\n即U = iR + L\\frac{di}{dt}（这个公式看不懂的，我写在图片上了）\n这个公式就是全部的本质。 它告诉我们，外部电压 U 这个“总预算”，要用于两件事：一是维持已有电流 i 流过电阻 R，就是支付 iR 的“维持费”，二是用于支付 L\\frac{di}{dt} 的“变更费”。\n\n图像（上凸曲线）的正确解释\n初始时刻电流 i=0，此时，外部电压全部用作“变更费”，全力负责电流的变化率。相应地，自感电动势 L\\frac{di}{dt} 也最大（等于 U）。而随时间推移：电流 i 逐渐增大，“维持费” iR 随之增加。由于总预算U 不变，剩余的“变更费”就越来越少，导致电流变化率 \\frac{di}{dt} 越来越小。图像斜率由大变小，呈上凸形状。\n我的直觉错误：一开始自感电动势最大，阻碍最强，所以电流应该增加得最慢（斜率最小），斜率应由小变大。\n错误根源在于因果倒置，我认为自感电动势大是原因，电流变化率小是结果。实际上恰恰相反。自感电动势是电流变化率的结果而不是原因。是“因为变化率大，所以自感电动势才大”，逻辑不能反过来。\n同时我混淆了 电流的大小和电流变化的快慢，在通电瞬间，电流的大小 确实是最小的（为零），这才是因为自感电动势的阻碍，它阻止电流的瞬时建立。\n但电流变化的快慢（斜率） 是由“净驱动电压”决定的。初始时刻，电阻上无压降，净驱动电压就是 U，所以变化最快。自感电动势的“阻碍”体现在维持电流为零这个状态，而不是让它缓慢启动。\n\n有没有更好的理解方式？我们能从这个问题的修正中获得什么更高层面的启发？感谢大家参与讨论[脸红]", "images": ["_imgs/img_f54b571ccde5.jpg"], "replies": [{"uname": "8589869056", "face": "_imgs/face_312f2ee08559.jpg", "like": 2, "message": "我补充两种理解🐶\n第一种：与其用“总预算”“维持费”“变更费”这样的比喻去理解，不妨把这个问题和其它的物理问题联系起来理解。你写下的这个微分方程，和RC充放电电路、<span class=\"math\">\\(f=-kv\\)<\/span>的含阻力下落运动、含阻力平抛运动、带电粒子在复合电磁场中的运动本质是一样的，既然是一样的，那么带电粒子在电磁场中运动和带阻力平抛可以用配速法，RC电路充电能不能用“配电压法”？你的电感电路能不能用“配电流法”？\n第二种：电路的暂态与稳态。在我们这个直流电路的情形里，我把开关闭合以后，经过足够长的时间，电路一定会达到稳态。什么是稳态？就是直流电路的各个参量不随时间改变。为什么？因为我们的输入是稳恒的，输入电压不随时间改变，那么我们期望的就是经过足够长时间输出电流不随时间改变(这里能严格化吗？)。这一点可以和电磁感应中的一些双杆问题联系起来，我们常常要求系统经过足够长时间两根棒的速度(或者加速度)，而我们用的方法就是电流的变化率为0。这里扯远了。所以系统在时间足够大的时候，电流的斜率一定是平的，这一点从根本上排除了电流的变化率从小到大的可能性。", "id": "ep5:297418923168:r0"}, {"uname": "8589869056", "face": "_imgs/face_312f2ee08559.jpg", "like": 2, "message": "另外还补充一下，我们可能因为最先接触的是电阻电路，而产生了这样一种惯性认识：电压是根本的，电流是由电压决定的。对电阻而言，的确如此，因为电阻的原理就是两端施加电场，带电粒子在电场作用下定向运动，和物质内部的晶格发生碰撞散射从而速度不能无限增加，形成恒定电流，近似和电场强度成线性关系，这就是欧姆定律的微观解释。但是电感则不同了，电感的原理是，有电流通过线圈，形成磁场。如果磁场恒定，则不会产生自感电动势，电感相当于导线。如果电流变化，则磁场变化，产生感应电动势，电感两端就有了电压。所以对电感而言，从物理上，是电流决定了电压；另一个方面，物理中的公式往往是原函数比导函数更基本：先有位置才能有速度，电势比电场更基本，磁矢势比磁场更基本，作用量比运动方程更基本……电压需要通过电流求导得出，就意味着电流起到更加决定的作用(当然这个判断也是不严谨的，可以想想有哪些公式是导函数比原函数更基本的)。", "id": "ep5:297418923168:r1"}]}, {"id": "ep5:297314439824", "module": "em", "auto": false, "uname": "KAXINMI", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "感觉要用配速法", "raw_message": "感觉要用配速法", "images": ["_imgs/img_8947c4537aee.jpg"], "replies": [{"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "确实要用配速法🙂感觉和另外一个有空气阻力的平抛好像🐶", "id": "ep5:297314439824:r0"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "评论@你了🙂可以看看小龙老师讲的类似的有阻力平抛", "id": "ep5:297314439824:r1"}]}, {"id": "ep5:294401544625", "module": "thermal", "auto": false, "uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 7, "message": "第三周的评论区有一个问题问的是为什么在处理弯管处恒定流速水对弯管的作用力的问题时，用动量定理算作用力时\\Delta t能被消掉？这次我问一个类似的问题：下面这个物理问题中，为什么求气体压强关于物体高度的变化时横截面积这个量能被消掉？(提示：上次那位同学提问时没有想出来是因为他没有从物理上去想为什么和<span class=\"math\">\\(t\\)<\/span>无关)", "raw_message": "第三周的评论区有一个问题问的是为什么在处理弯管处恒定流速水对弯管的作用力的问题时，用动量定理算作用力时\\Delta t能被消掉？这次我问一个类似的问题：下面这个物理问题中，为什么求气体压强关于物体高度的变化时横截面积这个量能被消掉？（提示：上次那位同学提问时没有想出来是因为他没有从物理上去想为什么和t无关）", "images": ["_imgs/img_8e863c60cd53.jpg"], "replies": [{"uname": "8589869056", "face": "_imgs/face_312f2ee08559.jpg", "like": 6, "message": "压强，就其定义来看，是单位面积上的受力。定义这个物理量的动机有一部分来自我们希望描述一团气体分子对器壁的作用力，但这个作用力显然是与器壁面积有关的，为了消除这个大小自由度，我们便引入了压强这样的强度量。因此，压强从被定义出来的时候就注定了与我选取的面积无关。在这个具体的场景中，自变量只有<span class=\"math\">\\(h\\)<\/span>，常量有g, R，已知量有M, T(更复杂的场景则是M(h), T(h))，压强最终只能用这些量表示，面积只能是中间量。\n为什么在中间求解的时候又得把面积请出来呢？因为压强定义的时候就暗含着一个微分过程：选一个宏观足够小，微观足够大的面积，宏观足够小保证了可以微分，微观足够大保证了平均。计算这个面积上的受力，根据受力的平衡来列方程：<span class=\"math\">\\(P(h+dh)A + \\rho(h)A dh g = P(h)A\\)<\/span>，<span class=\"math\">\\(P(h)M=\\rho(h)RT\\)<\/span>，这样思路上是非常顺利的。而随着我们的熟练化，在不断的做题实践中对其物理本质有了一定的理性认识后，我们可以抛弃掉用面积这个中间量，直接去列压强方程<span class=\"math\">\\(-dP = \\rho(h) g dh\\)<\/span>，这就是我们初中学的<span class=\"math\">\\(P=\\rho gh\\)<\/span>的微分形式(负号是因为向上为正方向)。", "id": "ep5:294401544625:r0"}]}, {"id": "ep5:294961736641", "module": "thermal", "auto": false, "uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 5, "message": "有一个生活中的例子：有一些水滴挂在竖直的玻璃上，最上面的水珠开始下滑，当这个水珠遇到下面的水珠并且合并的时候，会突然加速，这是为什么？", "raw_message": "有一个生活中的例子：有一些水滴挂在竖直的玻璃上，最上面的水珠开始下滑，当这个水珠遇到下面的水珠并且合并的时候，会突然加速，这是为什么？", "images": [], "replies": [{"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 3, "message": "刚好我们最近学到了物理最后一本书的液体，就提到了这个表面张力，我跟老师是这么思考的，\n两滴水合并的时候，它这个表面张力会把它给引过来，这就涉及一个表面能，也是一种能量，可以把它理解为势能，那这个能量减少了，就会转化成动能，就会加速流下去了，至于这个表面能是啥我也不知道，有没有懂行的？出来科普一下\n还有一点，老师说两个变一个，总的面积变小了，也变得圆润了，像流线型，所以阻力就变小了", "id": "ep5:294961736641:r0"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 3, "message": "仍然是看各个量对尺寸的依赖(“量纲分析”)，生活中很多问题都是如此：我们研究两个同样形状但不同尺寸(你可以认为是“直径”)的水滴，水滴挂在墙上靠的是表面张力对抗重力，重力正比于尺寸的三次，而表面张力大小是正比于尺寸的<span class=\"math\">\\((F=\\alpha L )\\)<\/span>，所以水滴的尺寸越大，表面张力相对于重力越不重要，越支撑不住。", "id": "ep5:294961736641:r1"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 2, "message": "合并的瞬间，重力猛增，大大超过了阻力，所以开始加速。但是阻力怎么变化我不知道😂🙂", "id": "ep5:294961736641:r2"}]}, {"id": "ep5:296928268704", "module": "thermal", "auto": false, "uname": "以书止戈", "face": "_imgs/face_8640c30636fe.jpg", "like": 5, "message": "各位下午好，生活中不知道大家有没有发现一个很有意思的现象，就是一个盘子装着菜端上桌的时候，这个桌子如果是那种光滑的桌子，这个盘子有时候会滑动几下甚至是会转一圈，尤其是盘子底下有水的时候", "raw_message": "各位下午好，生活中不知道大家有没有发现一个很有意思的现象，就是一个盘子装着菜端上桌的时候，这个桌子如果是那种光滑的桌子，这个盘子有时候会滑动几下甚至是会转一圈，尤其是盘子底下有水的时候", "images": [], "replies": [{"uname": "四风吟郁离", "face": "_imgs/face_8983715f6fb8.jpg", "like": 4, "message": "小时候遇见过一次类似的现象，把刚盛好米饭的碗放在玻璃桌面上，那个碗就一步一步地直线运动，直到接近桌子边缘被人拿起来，再放下就正常了。然而此后再也没见到过这个现象，和其他人说起都表示没见过，甚至不相信，搞得我一度怀疑自己的记忆混乱或是灵异事件😂。以下是我的理解：通常碗或盘子底部不是一个平面，而是一个有一定厚度的圆形底边(这样设计是为了端菜时不会烫手)，它会与桌面围成一个空腔。盛上热菜并放在桌上时，一部分常温的空气被密闭在这个空腔中，通过碗的下部分导热而等容升温<span class=\"math\">\\((p\\propto T)\\)<\/span>产生和盘子内的压强差，从而对盘子有一个向上的力，使桌子对盘子的支持力减小。同时，盘子底部或桌面某处可能会不完全平整的地方，导致空腔内气体压强到一定大小时会产生漏气，可由动量定律得到对盘子的一个力，若它大于了桌面对盘子的最大静摩擦力，盘子就会在桌面上滑动或转动。当盘子底部有水时，盘底空腔气密性会更好，空腔可以在漏气前达到更大的压强，使桌面与盘底的压力会更小；此外，水膜也能起到润滑的效果，盘底与桌面间的静摩擦系数也会减小，从而导致这类现象更容易发生。", "id": "ep5:296928268704:r0"}]}, {"id": "ep5:297033728208", "module": "other", "auto": false, "uname": "柚月漂我", "face": "_imgs/face_0338c7b55b33.jpg", "like": 3, "message": "如下", "raw_message": "如下", "images": ["_imgs/img_32ba13159ff2.jpg", "_imgs/img_e86744101329.jpg", "_imgs/img_a03842a4f46e.jpg", "_imgs/img_2f40f39ce460.jpg", "_imgs/img_c0e488482608.jpg"], "replies": []}, {"id": "ep5:295061770545", "module": "other", "auto": false, "uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 1, "message": "@KAXINMI 🐶", "raw_message": "@KAXINMI [doge_金箍]", "images": ["_imgs/img_4cce116256ec.jpg", "_imgs/img_37d3b505a596.jpg"], "replies": []}, {"id": "ep5:295055835665", "module": "other", "auto": false, "uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 0, "message": "一个综合力学和电学的问题", "raw_message": "一个综合力学和电学的问题", "images": ["_imgs/img_b58f88fc8672.jpg"], "replies": []}], "mod_stats": {"mech": {"q": 8, "r": 35, "img": 5}, "energy": {"q": 8, "r": 27, "img": 5}, "momentum": {"q": 2, "r": 8, "img": 0}, "optics": {"q": 1, "r": 9, "img": 1}, "em": {"q": 7, "r": 33, "img": 10}, "thermal": {"q": 3, "r": 5, "img": 1}, "other": {"q": 3, "r": 0, "img": 8}}, "removed": [["物理系咕咕叫兽", "请不要忘记给自己的评论和回复点赞[支持]", "人工判定噪音"], ["J-x3Seven", "这块小调整，为保证严谨", "归档时已排除"], ["教物理的670", "也是直接支持[doge]", "归档时已排除"], ["--不上川大不改名--", "全是我关注的up[星星眼]", "归档时已排除"], ["Serein0919", "老师 我想暂时取消一下订阅 怎么取消呢？等我暑假再来 平时太忙了 谢谢老", "占楼/闲聊"], ["Style逃回千禧年", "来支持了[doge]", "归档时已排除"], ["诶嘿诶嘿诶嘿诶_", "我去 关注的up凑一块了（）", "归档时已排除"], ["四顾托孤--Aqours", "从群里面来支持了", "归档时已排除"], ["Zuawluv", "https://b23.tv/EzkqkhB\n这个问题的解答，过程结果都", "归档时已排除"], ["咸咸海风吹面哭殇", "全是关注的up[doge][doge]", "归档时已排除"], ["五更疏欲断550", "好多关注的物理老师[笑哭][笑哭][笑哭]", "归档时已排除"], ["Atomphysics", "[打call][打call][打call]", "归档时已排除"], ["槭焰", "支持\n[蹲蹲]", "归档时已排除"], ["kangkang爱讲数学", "咕咕也是玩上vibe coding了", "归档时已排除"], ["是开心的小太阳呀", "咕咕教授可以回复我的私信吗", "归档时已排除"], ["牛顿和安培", "[打call]", "归档时已排除"], ["求进步的祁厅长", "现在倒回来复习电磁感应，有一个问题想问大家。\n电磁感应的单棒模型，达到最", "归档时已排除"]], "ghost_merged": 75, "total_q": 32, "total_r": 117, "total_img": 30, "auto_cnt": 0}, {"key": "ep6", "title": "第6期", "episodeId": "ep1775294076729", "export": "2026-08-25", "comments": [{"id": "ep6:295156176337", "module": "mech", "auto": false, "uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 11, "message": "这是一个圆盘模型，物块放在圆盘上面，随着圆盘一起做匀速圆周运动。问：为什么摩擦力指向圆心？从动力学角度来看的话，物块所需要的向心力只能由摩擦力提供，所以只能指向圆心。但从运动学来看的话，假如没有摩擦力，物块将沿切线的方向飞出，那么原来的摩擦力应该与飞出的方向反向才对。这两者怎么矛盾呢？", "raw_message": "这是一个圆盘模型，物块放在圆盘上面，随着圆盘一起做匀速圆周运动。问：为什么摩擦力指向圆心？从动力学角度来看的话，物块所需要的向心力只能由摩擦力提供，所以只能指向圆心。但从运动学来看的话，假如没有摩擦力，物块将沿切线的方向飞出，那么原来的摩擦力应该与飞出的方向反向才对。这两者怎么矛盾呢？", "images": ["_imgs/img_1b780651ef65.jpg"], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 14, "message": "简单说就是视角问题，在非惯性系(变速运动)不能以地面为参考系——静摩擦力是阻碍物体相对圆盘的运动力👌\n在摩擦力消失的一瞬间，这个物体下面压着的那个圆盘上的一个点是不是也有一个切向的速度？而且这个切向速度正好就等于物体此时切向速度，所以物体相对于这个点在切向方向上是静止的也就没有运动趋势，又因为此时摩擦力消失，所以这个物块相对于圆盘上这个点会受到一个背向圆盘圆心的力，所以他相对于圆盘是背向圆心出去的，你说的沿切线方向飞出是以地面为参考系的。", "id": "ep6:295156176337:r0"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 10, "message": "<span class=\"mention\">回复 @不要伤害我鹅子<\/span> 大可不换参考系，因为摩擦力始终是阻碍物体相对运动的力(惯性系与非惯性系都是)，就算以地面为参考系，去掉摩擦力的瞬间物体也是相对于圆盘上的接触点做背离圆心方向移动的，原来没有背离圆心方向移动的这个运动说明是摩擦力把它给平衡掉了，那也就说明摩擦力是指向圆心的。", "id": "ep6:295156176337:r1"}, {"uname": "椎名博士在邮箱", "face": "_imgs/face_6f6f41c52497.jpg", "like": 6, "message": "这个问题提的好，它告诉我们，我们有时候宏观地大致地看问题，容易出现一些偏差。就像这个题目上面所说的，如果你只看到圆盘整体所处的“位置”，那从这个“视觉画面”上看，如果没有摩擦力，物块确实是沿着切向方向走了，这就会给你一种感觉——这个物块正常情况下有好像一种沿切向方向的运动趋势。但这实际上是错误的，因为我们忽略了这个圆盘实际上是在转动的，回想一下，当初摩擦力是怎么定义的？哦！摩擦力要阻碍物体相对运动，这个“相对”是相对谁而言的呢？哦，应该是要相对施力物体，也就是被这个物块压着的那一小部分(这里不妨将物块看作质点，那么也就是相对转盘上那个被压着的位置)，这时候便恍然大悟：在撤掉摩擦力那一瞬间，物块和被它压着的那一部分是共速的，既然是共速的，好像又没有相对运动趋势了呢，是不是呢？不对，被压着的那一部分是属于圆盘上的物质，物质之间是可以有力的，通过分析可以发现：实际上这个被压着的部分在此刻是有一个向心加速度的，但是物块没有！也就是说物块相对被它压着的那一部分，有一个沿直径向外的加速度，哦，怪不得摩擦力要指向圆心了。以上是我思考的过程🐶", "id": "ep6:295156176337:r2"}, {"uname": "皮卡丘--------丘", "face": "_imgs/face_9b7d8d4e7f29.jpg", "like": 4, "message": "向心力是由摩擦力提供的，东西跟着圆盘转圈，本身想直直飞出去，相对于圆盘来说，是有往外甩的趋势的。而静摩擦力就是要拉住它，不让它往外跑，所以摩擦力就朝着圆心拽它，这个力刚好就当向心力，所以它一定是指向圆心的。🍉🍉", "id": "ep6:295156176337:r3"}, {"uname": "MySiddhartha", "face": "_imgs/face_48077d89217a.jpg", "like": 4, "message": "我通啦。你前面的分析，除了最后一句，全都是对的，问题在于把物块由从切线方向飞出，转换到跟着圆盘做匀速圆周运动，并不需要一个与切向运动反向的力，而是需要一个指向圆心的力。在匀速圆周运动中，切向加速度为零，所以切线方向根本不需要力来平衡；摩擦力指向圆心，因为它的作用不是阻止物体沿切线运动，而是使其转弯。", "id": "ep6:295156176337:r4"}, {"uname": "MySiddhartha", "face": "_imgs/face_48077d89217a.jpg", "like": 3, "message": "我说的没错呀。因为你把摩擦力的定义给搞错了。摩擦力定义是：两个相互接触的物体，当它们之间存在相对运动或相对运动趋势时，在接触面上产生的、阻碍这种相对运动或相对运动趋势的力。在这个情境中，你假设不受摩擦力，得到了一个切向的直线运动，然而，实际情况是，小块需要跟着圆盘做匀速圆周运动，这是因为圆盘在它那个方向上有一个转动的线速度，为了阻碍这种圆盘转而物体走直线的趋势，摩擦力作为向心力诞生了。摩擦力就是个被动响应并调节以抵抗相对运动的被动力，你要注意，它是抵抗相对运动，而不是抵抗物体运动。", "id": "ep6:295156176337:r5"}, {"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 2, "message": "应该是这个摩擦力将始终指向圆心，在任意时刻都不可能反向于切线方向，可以这么理解，这个摩擦力是要把你留在圆盘上，要拉住你，就像你自己挂一个求甩绳子，为了保证你在圆盘上，所以这个摩擦力必须是径向的", "id": "ep6:295156176337:r6"}, {"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 2, "message": "还有一个摩擦力的概念是发生相对滑动或者相对滑动的趋势，要特别注意相对这两个字，就是在以圆盘的视角看来，木块就是要离开圆心运动，而我们所说的切向运动是站在上帝视角看到的。那么在圆盘看来，这个摩擦力就是为了不让你发声相对滑动，也就是不让你离心，所以必定是要在指向圆心的", "id": "ep6:295156176337:r7"}, {"uname": "夜明伸影", "face": "_imgs/face_39850d8f278d.jpg", "like": 2, "message": "非常有意思的问题，受益匪浅。\n我顺便试图补全这个逻辑链：\n假定有一个轴固定在地面上的足够粗糙圆盘，在圆盘右侧边缘标记为A点，并在A点放置一个粗糙物块(可视为质点)。\n现给圆盘一恒定角速度<span class=\"math\">\\(\\omega (\\)<\/span>加速过程极短)，逆时针转动，在极短的加速瞬间，物体应当受到不指向圆心的摩擦力(从而获得一个切向初速度<span class=\"math\">\\(v_0)\\)<\/span>。\n不难发现，此时A点的初速度亦为<span class=\"math\">\\(v_0\\)<\/span>向上(俯视)，经过极短时间dt后，A点速度为<span class=\"math\">\\(v_0+dv\\)<\/span>，其中dv显然指向轴心方向，即A点相对原时刻的运动方向是指向轴心，而物块的运动方向恰是原时刻的运动方向，所以此时A点相对于物块的运动方向与dv方向一致，指向圆心。\n即物块相对A点有沿<span class=\"math\">\\(-dv\\)<\/span>方向的相对运动(趋势)，其所受摩擦力应该指向相反的方向即dv方向，即指向轴心。\n或者我觉得这里用黄夫人的理解会更快一点，物块受到摩擦力是因为想要和圆盘共速，所以圆盘对它的摩擦力方向应该等同于圆盘速度的改变趋向，即指向轴心。", "id": "ep6:295156176337:r8"}, {"uname": "皮卡丘--------丘", "face": "_imgs/face_9b7d8d4e7f29.jpg", "like": 1, "message": "可以做类比，假如说就是一个杯子放在旋转这个桌子上。杯子呢可以随着桌子匀速转动，如果没有摩擦呢，杯子就会沿切线飞出去嘛。但是如果餐桌还在继续转动，那么杯子相对于餐桌是往外侧滑。", "id": "ep6:295156176337:r9"}, {"uname": "皮卡丘--------丘", "face": "_imgs/face_9b7d8d4e7f29.jpg", "like": 1, "message": "静摩擦力呢，就是要阻碍这个向外滑的这个趋势，所以方向就是指向圆心的嘛。就和运动学里摩擦力当向心力结论是一致的", "id": "ep6:295156176337:r10"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 1, "message": "<span class=\"mention\">回复 @狴犴公然<\/span> 他的意思是从现象出发，你既然要让他保持平衡，那你肯定是有一个力跟摩擦力抵消掉了，那就是离心力。实际上换一个参考系之后是先产生了离心力在产生了摩擦力阻碍它。因为我们知道摩擦力是阻碍相对于产生的。肯定得先有这个趋势，他才能产生对吧？", "id": "ep6:295156176337:r11"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @狴犴公然<\/span> 因为圆盘上的点受到一个向心力，而此时物体没有摩擦力，那他就没有这个力，相对于圆盘就是有逆向圆心的离心力", "id": "ep6:295156176337:r12"}, {"uname": "李华为了不吃麒麟", "face": "_imgs/face_971a31f30e94.jpg", "like": 1, "message": "最后一句错了。原来的摩擦力与飞出的方向不一定相反，你想当然了。摩擦力它时刻垂直运动的速度，改变速度的方向。假如突然没有摩擦力，速度的方向保持不变，故沿切线飞出。", "id": "ep6:295156176337:r13"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span>  又因为此时摩擦力消失，所以这个物块相对于圆盘上这个点会受到一个背向圆盘圆心的力？？？不理解", "id": "ep6:295156176337:r14"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "这让我想到了离心力——这个换完系后的产物。\n事实上，按照速度的定义，<span class=\"math\">\\(v=\\frac{x}{t}\\)<\/span>，<span class=\"math\">\\(v\\)<\/span>应与<span class=\"math\">\\(x\\)<\/span>方向相同；\n用大地为参考系，<span class=\"math\">\\(v\\)<\/span>的改变是失去里一个力导致的受力不平衡从而发生<span class=\"math\">\\(v\\)<\/span>的改变\n用点为参考系，<span class=\"math\">\\(v\\)<\/span>的改变是受到里一个力导致发生<span class=\"math\">\\(v\\)<\/span>的改变\n这是<span class=\"math\">\\(v\\)<\/span>飞出沿切线的原因。", "id": "ep6:295156176337:r15"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "由于这个力只改变<span class=\"math\">\\(v\\)<\/span>的方向，而不是力的大小，可知只能与<span class=\"math\">\\(v\\)<\/span>垂直——也就是向圆心", "id": "ep6:295156176337:r16"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span>  “背向圆盘圆心的力”是由圆盘上的点受到一个向心力，推出的相对于圆盘逆向圆心的离心力\n你要证明向心力指向圆心，又把他当作事实，这不是循环论证吗", "id": "ep6:295156176337:r17"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span>  定是有一个力跟摩擦力抵消掉了，那就是离心力。——那么离心力的方向与向心力的方向相反，只有默认向心力的方向指向圆心才能得出楼主的结论", "id": "ep6:295156176337:r18"}, {"uname": "皮卡丘--------丘", "face": "_imgs/face_9b7d8d4e7f29.jpg", "like": 0, "message": "说的很有道理，比较清晰明了。❤️❤️", "id": "ep6:295156176337:r19"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "(取物块在最靠近左侧来分析)首先假设物块不受摩擦力，那么物块会径直向前走，而圆盘却是旋转，在这极短时间内，物块相对于圆盘是向左移动，也就是说摩擦力不应该没有而是指向相对位移的反方向🐶如有错误欢迎指出", "id": "ep6:295156176337:r20"}, {"uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不要伤害我鹅子<\/span> 虽然它是沿切线方向飞出，但摩擦力的方向并不取决于实际运动的方向，而是取决于它与圆盘上那个点的相对运动趋势，摩擦力永远都是阻碍相对运动趋势，所以可以推到木块始终相对于圆盘是沿圆心方向飞出的，是这样说吗？", "id": "ep6:295156176337:r21"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @狴犴公然<\/span> 你是说不知道为什么向心力指向圆心吗？这不是向心力的定义吗？", "id": "ep6:295156176337:r22"}, {"uname": "李华为了不吃麒麟", "face": "_imgs/face_971a31f30e94.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不要伤害我鹅子<\/span> 不违背。双手拿着杯子在固定高度水平方向做匀速直线运动。杯子所受到的摩擦力始终竖直向上，与重力平衡。摩擦力时刻与杯子运动速度方向垂直。摩擦力做功时刻为0。", "id": "ep6:295156176337:r23"}, {"uname": "李华为了不吃麒麟", "face": "_imgs/face_971a31f30e94.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不要伤害我鹅子<\/span> 定义还是那个定义，并不矛盾。根据定义，杯子受重力影响有向下运动趋势，所以静摩擦力得向上。与速度方向无关。\n说回圆周，你提出的问题确实很有思考价值。我认为是物体相对于接触点有沿径向向外的运动趋势。所以摩擦力与运动趋势相反，始终指向圆心。", "id": "ep6:295156176337:r24"}, {"uname": "你好亲亲亲亲亲", "face": "_imgs/face_97f7e89706df.jpg", "like": 0, "message": "<span class=\"mention\">回复 @MySiddhartha<\/span> 正解", "id": "ep6:295156176337:r25"}, {"uname": "心念文殊", "face": "_imgs/face_fa8d2aaeea5a.jpg", "like": 0, "message": "没有摩擦力他怎么就会飞出，向心力不就是让他弯了过来吗？", "id": "ep6:295156176337:r26"}, {"uname": "夜明伸影", "face": "_imgs/face_39850d8f278d.jpg", "like": 0, "message": "<span class=\"mention\">回复 @夜明伸影<\/span> 接下来推广到运动的任意时刻，其实是一样的。每一时刻都沿用刚才的分析思路，A点在任意时刻经过极短时间dt的速度增量dv都是垂直<span class=\"math\">\\(v_0\\)<\/span>的(根据圆周运动的定义)，则物块在任意时刻所受摩擦力都是指向圆心。", "id": "ep6:295156176337:r27"}, {"uname": "道戒破灵", "face": "_imgs/face_8a038ed0ec53.jpg", "like": 0, "message": "所以答案是什么？快告诉我", "id": "ep6:295156176337:r28"}, {"uname": "双手托腮一直发呆", "face": "_imgs/face_009cae2bcac8.jpg", "like": 0, "message": "你那个切向速度是相对地面而言，你要分析的是物块相对于圆盘的相对运动趋势方向，这样才能判断静摩擦力方向，你会发现相对运动趋势方向是延半径背离圆心，所以静摩擦力指向圆心", "id": "ep6:295156176337:r29"}]}, {"id": "ep6:295388978833", "module": "mech", "auto": false, "uname": "hehbu", "face": "_imgs/face_6ff929338ba1.jpg", "like": 9, "message": "各位运动是相对的这地心说日心说只是参照系不同地心同样有资格可以作为参照\n怎么就能说地心说错了呢", "raw_message": "各位运动是相对的这地心说日心说只是参照系不同地心同样有资格可以作为参照\n怎么就能说地心说错了呢", "images": [], "replies": [{"uname": "物你学家", "face": "_imgs/face_a2beefec54a5.jpg", "like": 3, "message": "这是个很好的问题！我相信提问的同学不是不知道地心说用来解释行星运动不够简洁，更不会不同意地心说被认为是错误的。他的困惑是，既然运动是相对的，那么为什么就非要说地球绕着太阳转才行，而不能同样地说，太阳是绕着地球转的呢？", "id": "ep6:295388978833:r0"}, {"uname": "-Sir-xiao", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 2, "message": "我看到过从辩论的角度来解释这个问题(当然也是科学的角度)，讲了什么可以判断一个“好的”天文学理论，在此贴个视频https://b23.tv/BV1Br4y1g7c6", "id": "ep6:295388978833:r1"}, {"uname": "皮卡丘--------丘", "face": "_imgs/face_9b7d8d4e7f29.jpg", "like": 2, "message": "我认为虽然运动是相对的，但地心说无法简洁解释行星运动，还不符合观测事实；日心说更简洁准确，符合科学规律，因此地心说被认为是错误的。然后呢，就一直认为他是错的。[笑]", "id": "ep6:295388978833:r2"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "地心说至少有一点错了——其他行星不会绕着地球转；\n如果认可其他行星绕着太阳转，那地球连6大行星的中心都不是，何谈地形说？\n如果不认可其他行星绕着太阳转，而是认可其他行星绕着地球转——与事实不符", "id": "ep6:295388978833:r3"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @物你学家<\/span>  运动是相对的定能说太阳是绕着地球转；\n\n运动是相对的却不能说绕着太阳转的绕着地球转", "id": "ep6:295388978833:r4"}]}, {"id": "ep6:297711773824", "module": "mech", "auto": false, "uname": "皮卡丘--------丘", "face": "_imgs/face_9b7d8d4e7f29.jpg", "like": 9, "message": "有一个关于物理的问题：汽车在行驶的过程中，它接受到发动机的牵引力又受到地面给的摩擦力，我们常认为它的动力呢是发动机的牵引力，但是呢，如果类比人走路，人给地面向后的力，地面给人向前的摩擦力，这摩擦力呢又是动力，那么如果类比的话，那么汽车行驶的话，摩擦力也应该是动力啊，可是摩擦力怎么是阻力呢？希望回复🤩🤩🤩", "raw_message": "有一个关于物理的问题：汽车在行驶的过程中，它接受到发动机的牵引力又受到地面给的摩擦力，我们常认为它的动力呢是发动机的牵引力，但是呢，如果类比人走路，人给地面向后的力，地面给人向前的摩擦力，这摩擦力呢又是动力，那么如果类比的话，那么汽车行驶的话，摩擦力也应该是动力啊，可是摩擦力怎么是阻力呢？希望回复[星星眼][星星眼][星星眼]", "images": [], "replies": [{"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 4, "message": "汽车的四个轮子里，有一类是主动轮，由发动机驱动，这个轮子就相当于人的腿。另一类是从动轮，这个轮子是是受到了摩擦力才会转动，它所受的摩擦力充当阻力。", "id": "ep6:297711773824:r0"}, {"uname": "槭焰", "face": "_imgs/face_0472628365bc.jpg", "like": 2, "message": "我认为定义动力与阻力应当与运动状态结合在一起，即这个力对于我目前的运动状态是阻碍还是促进，或者说是否与运动方向同向\n可以联想到牛二<span class=\"math\">\\(F=ma\\)<\/span>，<span class=\"math\">\\(F\\)<\/span>是<span class=\"math\">\\(a\\)<\/span>产生的原因，而<span class=\"math\">\\(a\\)<\/span>是<span class=\"math\">\\(F\\)<\/span>所产生的效果。仅供参考，对错勿怪🐶", "id": "ep6:297711773824:r1"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 2, "message": "以下是一些粗浅的看法，如果有错还请指正\n\n先考虑汽车启动加速的时候。这个时候汽车在水平方向上只受到地面给它的静摩擦力，还有各种阻力，如果从运动上分析，如果我们把车子看成一个整体，那么他想往前加速的话，静摩擦力必然是充当动力的作用总不可汽车自己给自己一个力吧，那么发动机的牵引力是什么作用呢？我们知道发动机在内部可以通过各种机构带动轮子的转动，那么轮子有往后转的趋势(指的是轮子地面的接触)，所以就产生了往前的静摩擦力。这个静摩擦力虽然对轮子这个接触点不做功，因为它是静摩擦力嘛，但是他对车子这个整体是做正功的，所以让车子往前走了。这就跟人走路一样摩擦力对脚面是不做功的，但是对人这个整体是做正功的，所以人能往前走。静摩擦力虽然在局部上是不做功的，也就是说不能让车子整体的能量增加，但是他能把轮子转动能量转化成车子往前的能量(但我不知道其中的原理)\n\n再看看车子匀速行驶的时候。因为它受到阻力，所以说摩擦力为了维持匀速运动肯定也是动力。这也是因为发动机在一直拽着轮子走，轮子一直有往后转动的趋势，所以静摩擦力也一直往前｡\n\n最后看看关掉动力滑行的时候。我们都知道这个时候车子是会减速的，而各种阻力已经对减速有作用了，所以我们不确定静摩擦力是什么方向，要好好分析一下。我们关掉发动机之后轮子就失去了往后转动的驱动力，全是阻碍他往后转动的阻力，因此它有转速减小的趋势，所以地面阻碍这个趋势就会产生一个向后的摩擦力，此时摩擦力是阻力", "id": "ep6:297711773824:r2"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 2, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 对了，这里的轮子指的都是主动轮，如果是其他轮子的话，那应该是一直有转速减小的趋势，摩擦力一直是阻力", "id": "ep6:297711773824:r3"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "汽车的四个轮子里，有一类是主动轮，由发动机驱动，发动机给的力给大地，大地就给轮子摩擦力来推动轮子(也<span class=\"math\">\\(i\\)<\/span>可以理解成动量守恒)。另一类是从动轮，这个轮子无发动机驱动，没有提供向前的动力，所以受到的摩擦力是阻力，被迫转动。", "id": "ep6:297711773824:r4"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "<span class=\"mention\">回复 @狴犴公然<\/span>  但这好像无法解释四轮驱动", "id": "ep6:297711773824:r5"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "<span class=\"mention\">回复 @狴犴公然<\/span>  会不会考虑发动机的摩擦？", "id": "ep6:297711773824:r6"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "动量守恒——牛顿第三定律；发动机给的力给大地，大地就给轮子摩擦力来推动轮子(作用力与反作用力)", "id": "ep6:297711773824:r7"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "考虑发动机的摩擦？我学识疏浅，难以解释", "id": "ep6:297711773824:r8"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @丁真爱测码da<\/span>  说错了，滚动摩擦力\n🐶🐶🐶", "id": "ep6:297711773824:r9"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 0, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span>  是这样，由牛顿第三定律，这两者是相等的(这是在理想的情况下，比如不考虑轴承之间的摩擦力什么的)", "id": "ep6:297711773824:r10"}, {"uname": "槭焰", "face": "_imgs/face_0472628365bc.jpg", "like": 0, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span>  也就是牛三，两者为一对相互作用力", "id": "ep6:297711773824:r11"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "首先，看摩擦力的方向，在人向前时，摩擦力也是向前的，为什么？因为脚在向后(这个想想应该很容易出来，脚从前往后明显是人在向前，从后往前明显人在向后)，于是根据摩擦力的定义，摩擦力方向向前。再看汽车，轮子向后那么动力向前。也就是说其实发动机的牵引力给汽车上的表现就是轮子在转动(这个轮子被叫做主动轮)，而轮子转动所带来的摩擦力就是动力，至于阻力，阻力可以由空气质量和和滚动摩擦带来(如果不是四轮驱动的话，从动轮会向前滚动那么会产生出向后的阻力)", "id": "ep6:297711773824:r12"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 都是静摩擦，因为实际上在滚动中，无论是主动轮还是从动轮，它们都相对于地面没有发生相对滑动所以应该是静摩擦", "id": "ep6:297711773824:r13"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @狴犴公然<\/span> 是静摩擦力", "id": "ep6:297711773824:r14"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @狴犴公然<\/span> 在轮子运动中与地面接触的那一个面并没有发生相对滑动，所以应该是静摩擦", "id": "ep6:297711773824:r15"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 很好的分析[支持]🙌", "id": "ep6:297711773824:r16"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 四轮驱动还有空气阻力和滚动摩擦以及内部的一些机械产生的摩擦🐶", "id": "ep6:297711773824:r17"}, {"uname": "天影地光", "face": "_imgs/face_44bd5f0f7346.jpg", "like": 0, "message": "动能是牵引力提供的，动量是摩擦力提供的。", "id": "ep6:297711773824:r18"}]}, {"id": "ep6:297755500528", "module": "mech", "auto": false, "uname": "皮卡丘--------丘", "face": "_imgs/face_9b7d8d4e7f29.jpg", "like": 3, "message": "又又又有一个物理的问题，电梯在上下行的过程中啊，是靠一个钢缆运行的吧？在运行的过程中，这个人呢，在电梯内。行走，或改变自己的位置。那么这个对电梯力的作用点就会改变，可是电梯的地板却仍然保持水平，按照常理来说，那这个正方体的电梯，就应该有一定的倾斜角度。那假如换成4根，钢轨，分别连着4个，顶点的话，那也应该发生一定的倾斜。可是生活中常识告诉我们，地板一直都是保持水平的，那这是为什么呢？或许是因为电梯的四角还有轨道，然后电梯在轨道中上下运行。那但是，如果是一个体重比较大的人进入电梯，那么电梯也会像底下安了弹簧一样上下晃动一下，那这与它是利用钢轨运行的，也不符。那到底是为什么呢？❤️❤️问题有点多，平时这种问题没有人解答，所以就问在这里了麻烦大家了，拜托😁", "raw_message": "又又又有一个物理的问题，电梯在上下行的过程中啊，是靠一个钢缆运行的吧？在运行的过程中，这个人呢，在电梯内。行走，或改变自己的位置。那么这个对电梯力的作用点就会改变，可是电梯的地板却仍然保持水平，按照常理来说，那这个正方体的电梯，就应该有一定的倾斜角度。那假如换成4根，钢轨，分别连着4个，顶点的话，那也应该发生一定的倾斜。可是生活中常识告诉我们，地板一直都是保持水平的，那这是为什么呢？或许是因为电梯的四角还有轨道，然后电梯在轨道中上下运行。那但是，如果是一个体重比较大的人进入电梯，那么电梯也会像底下安了弹簧一样上下晃动一下，那这与它是利用钢轨运行的，也不符。那到底是为什么呢？[喜欢][喜欢]问题有点多，平时这种问题没有人解答，所以就问在这里了麻烦大家了，拜托[呲牙]", "images": ["_imgs/img_84fcb902a027.jpg"], "replies": [{"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "钢缆——&gt;k十分的大，几乎无形变，故分别连着4个顶点的话不会发生一定的倾斜。", "id": "ep6:297755500528:r0"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "<span class=\"mention\">回复 @狴犴公然<\/span>  而电梯有轨道防止电梯像桌子一样翻倒，故更增加了稳定性", "id": "ep6:297755500528:r1"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span>  钢绳无法伸长，怎么上下晃动？？？", "id": "ep6:297755500528:r2"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 1, "message": "有可能是轿厢和导轨之间还有一层，弹簧就安装在这层与轿厢之间🐶", "id": "ep6:297755500528:r3"}, {"uname": "所有的入", "face": "_imgs/face_017bc74a0757.jpg", "like": 1, "message": "<span class=\"mention\">回复 @狴犴公然<\/span> 钢绳无法伸长，怎么晃动的上下的呢", "id": "ep6:297755500528:r4"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span>  类似于桌子(只不过腿朝上)，只要这四个钢杆的拉力不同，他也能保证稳定\n就像你即使站在桌子上，桌子也不会晃", "id": "ep6:297755500528:r5"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span>  怎么晃动呢？我没见过晃动的电梯", "id": "ep6:297755500528:r6"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span>  力的作用点改变了，钢杆的拉力也改变了", "id": "ep6:297755500528:r7"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span>  四个杠杆拉力不同，就是平稳的(不左右晃)\nk十分的大以至于几乎不可能发生较大的形变(不上下晃)\nright?", "id": "ep6:297755500528:r8"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "在你分析的情景中确实是这样的，那就应该是电梯自己的结构问题我们并不了解了🐶", "id": "ep6:297755500528:r9"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 就是轿厢和导轨之间有一层框架，这个框架是牢牢的被导轨约束住的，不能前后左右动。这个框架的底部还装了个弹簧，起到缓冲作用，当然可能其他方向也有弹簧。在弹簧的内部才是轿厢😁", "id": "ep6:297755500528:r10"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 不过这都是我的猜测罢了，我也不是什么工程师，也没见过电梯内部🐶", "id": "ep6:297755500528:r11"}]}, {"id": "ep6:297751477152", "module": "mech", "auto": false, "uname": "皮卡丘--------丘", "face": "_imgs/face_9b7d8d4e7f29.jpg", "like": 2, "message": "和上期有关的一个问题，小飞虫在高速行驶的汽车中那个问题。那如果把小飞虫换成无人机，把高速行驶的汽车换成上下行驶的电梯。也就是无人机在电梯中飞行，那么电梯在上或下移动时，这个无人机的运动情况也应该和小飞虫一样吧。跟随这个电梯一起运动，因为它这个无人机运行方式不就是给空气一个作用力，然后空气给它一个反作用力吗？那么跟小飞虫类似，也是给空气作用力。那为何大多数的实验视频都是与这个相反结果呢，它会撞到地板或者天花板？或者是因为电梯拥有加速度的原因？那当电梯处于匀速上或下运动时，他的状态是怎么样的呢？处理这种问题还有一个新的思路，把空气视为一种密度很小的溶液，物体处于这个溶液之中。这样分析问题可能会更简单一点。❤️❤️", "raw_message": "和上期有关的一个问题，小飞虫在高速行驶的汽车中那个问题。那如果把小飞虫换成无人机，把高速行驶的汽车换成上下行驶的电梯。也就是无人机在电梯中飞行，那么电梯在上或下移动时，这个无人机的运动情况也应该和小飞虫一样吧。跟随这个电梯一起运动，因为它这个无人机运行方式不就是给空气一个作用力，然后空气给它一个反作用力吗？那么跟小飞虫类似，也是给空气作用力。那为何大多数的实验视频都是与这个相反结果呢，它会撞到地板或者天花板？或者是因为电梯拥有加速度的原因？那当电梯处于匀速上或下运动时，他的状态是怎么样的呢？处理这种问题还有一个新的思路，把空气视为一种密度很小的溶液，物体处于这个溶液之中。这样分析问题可能会更简单一点。[喜欢][喜欢]", "images": [], "replies": [{"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "当电梯匀速运动时，无人机也可以悬停；\n当汽车加速运动时，小飞虫也可以后退；\n给空气一个作用力，然后空气给它一个反作用力没错，错在没考虑空气运动状态\n加速时空气亦受到惯性力！\n物体可以视为与空气静止，不对吗？", "id": "ep6:297751477152:r0"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span>  匀速上行的时候——空气静止\n加速上行的时候——空气向下运动", "id": "ep6:297751477152:r1"}]}, {"id": "ep6:297790224560", "module": "mech", "auto": false, "uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 2, "message": "发现：动力学中，<span class=\"math\">\\(m\\)<\/span>被滥用，一些公式中的<span class=\"math\">\\(m\\)<\/span>成为了无用量<span class=\"math\">\\(\nf=ma\\)<\/span>，<span class=\"math\">\\(f\\)<\/span>是改变物体的运动状态(改变形状=改变粒子运动状态)，但是<span class=\"math\">\\(a\\)<\/span>改变物体的运动状态。\n能量与功中，<span class=\"math\">\\(E_k=\\frac{1}{2}mv2;E_p=mgh;E_p=\\frac{1}{2}k_{2}x=\\frac{1}{2}fx=\\frac{1}{2}max;\n\\)<\/span>如果把<span class=\"math\">\\(m\\)<\/span>约掉，那么能量依然守恒；并且如果把功<span class=\"math\">\\(w=fx=max\\)<\/span>的<span class=\"math\">\\(m\\)<\/span>去掉，那动量守恒和功能关系亦不变。而<span class=\"math\">\\(a\\)<\/span>的传递受<span class=\"math\">\\(m\\)<\/span>的影响可用动量守恒解释。\n\n仔细想来，根本上是在于<span class=\"math\">\\(f=ma\\)<\/span>这个定义引起的，刚才我改的量好像都与<span class=\"math\">\\(f\\)<\/span>有关。孰能推广或跳出这个怪圈？还是<span class=\"math\">\\(f\\)<\/span>的定义是无稽之谈？谢谢！！", "raw_message": "发现：动力学中，m被滥用，一些公式中的m成为了无用量\nf=ma，f是改变物体的运动状态（改变形状=改变粒子运动状态），但是a改变物体的运动状态。\n能量与功中，Ek=1/2mv2;Ep=mgh;Ep=1/2k2x=1/2fx=1/2max;\n如果把m约掉，那么能量依然守恒；并且如果把功w=fx=max的m去掉，那动量守恒和功能关系亦不变。而a的传递受m的影响可用动量守恒解释。\n\n仔细想来，根本上是在于f=ma这个定义引起的，刚才我改的量好像都与f有关。孰能推广或跳出这个怪圈？还是f的定义是无稽之谈？谢谢！！", "images": [], "replies": [{"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 1, "message": "我回复能量那一条：能量是做功本领在物体及运动上的量度，做功本领是指能对外界产生多少效应。我们看回动能，它反映着物体自身运动、物体能够对外界做的功外界做功对物体运动产生的影响。相同速度，质量更大的物体明显能做的功更多，而同时质量大的物体，它的运动状态也更难改变，外界要使它加速所需要做的功更多。\n同时，你的回答中提到了作用中的<span class=\"ma
