，它就不能做稳定的匀速圆周运动。而电场力的方向只与它们的比例有关。现在方向确定，那么比例自然是确定的。", "id": "ep9:297402318033:r0"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "这是一个空间中嘛，当我看见你有两个压强，并且有电荷大小的时候，我就已经想把它化成等效重力了，如果有重力的话，那就是三力平衡，没有重力的话，那就二力平衡...", "id": "ep9:297402318033:r1"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "第二，问似乎，感觉有点极限...当你的速度，随阻力的影响越来越小，而你的阻力也越来越小，因为你的阻力越来越小，所以你速度减少的变化量也越来越小，所以你阻力减小的变化量也越来越小.....", "id": "ep9:297402318033:r2"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "感觉我第二问应该思考错了...", "id": "ep9:297402318033:r3"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "我在重力下匀速圆周，和在这个复和场圆周有什么区别", "id": "ep9:297402318033:r4"}]}, {"id": "ep9:300143079984", "module": "circuit", "auto": false, "uname": "账号已注销35058", "face": "_imgs/face_c47c155e4ae3.jpg", "like": 7, "message": "这里并联等效电动势部分我没有理解，为什么会等效为电阻 R 分得的电压呢？等效的实质又是什么呢？", "raw_message": "这里并联等效电动势部分我没有理解，为什么会等效为电阻 R 分得的电压呢？等效的实质又是什么呢？", "images": ["_imgs/img_4ff52b33736a.jpg"], "replies": [{"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 4, "message": "设想输出端口当前的电压为<span class=\"math\">\\(U\\)<\/span>，那么<span class=\"math\">\\(R\\)<\/span>上的电流就是<span class=\"math\">\\(\\frac{U}{R}\\)<\/span>，<span class=\"math\">\\(r\\)<\/span>上的电流是<span class=\"math\">\\((E-\\frac{U)}{r}\\)<\/span>，输出总电流就是<span class=\"math\">\\(I=\\frac{E}{r}-\\frac{U(1}{R}+1/r)\\)<\/span>。而我们知道，电源的输出关系就是 电流 = (电源电动势 - 输出电压)/内阻 ，对比系数发现二者完全等价，并且可以得到等效的内阻和电源电压", "id": "ep9:300143079984:r0"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 3, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 就是，当并联后的结构输出电压为<span class=\"math\">\\(U\\)<\/span>时，<span class=\"math\">\\(R\\)<\/span>上电流就是向右的<span class=\"math\">\\(\\frac{U}{R}\\)<\/span>，<span class=\"math\">\\(r\\)<\/span>上电流是向左的<span class=\"math\">\\((E-\\frac{U)}{r}\\)<\/span>，所以总输出电流是<span class=\"math\">\\(I=(E-\\frac{U)}{r}-\\frac{U}{R}=\\frac{E}{r}-\\frac{U(1}{r}+1/R)\\)<\/span>，即<span class=\"math\">\\(\\frac{ER}{(r}+R)=U+\\frac{IrR}{(r}+R)\\)<\/span>。根据全电路欧姆定律，电动势=输出电压+输出电流<span class=\"math\">\\(\\times \\)<\/span>内阻，发现整个结构具有完全等价的形式，因此可以等价于这样一个电源：其电动势为<span class=\"math\">\\(\\frac{ER}{(r}+R)\\)<\/span>，内阻为<span class=\"math\">\\(\\frac{rR}{(r}+R)\\)<\/span>", "id": "ep9:300143079984:r1"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 1, "message": "我咋感觉不太对呢？电动势是为了克服总电压的，把电池和<span class=\"math\">\\(R\\)<\/span>并联，总电压不变，咋就变成<span class=\"math\">\\(\\frac{R}{R}+r\\)<\/span>份了呢，这不是只克服了<span class=\"math\">\\(R\\)<\/span>两端，或者说等效电池两端的电压吗？", "id": "ep9:300143079984:r2"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 1, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 也就是说，虽然实际电动势没有乘上<span class=\"math\">\\(\\frac{R}{(R}+r)\\)<\/span>，但是如果说把它换成这样一个电池，输出的外电压和电流是不变的，也就是说对外电路毫无影响，所以在分析外电路时可以等价替换掉🙌", "id": "ep9:300143079984:r3"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 0, "message": "<span class=\"mention\">回复 @账号已注销35058<\/span> 这样容易说不清楚，我觉得从表达式出发就最简单直观", "id": "ep9:300143079984:r4"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 是的", "id": "ep9:300143079984:r5"}, {"uname": "佚之森", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "我同问。电压是针对外电路的分压 这可以理解。但是这个等效电阻是怎么回事？为什么是并联形式？", "id": "ep9:300143079984:r6"}, {"uname": "健康躺平", "face": "_imgs/face_b46e62b27d6c.jpg", "like": 0, "message": "这个是对外等效，也就是外端口的电压电流关系保持一致。详见戴维南定理", "id": "ep9:300143079984:r7"}, {"uname": "杰哥4", "face": "_imgs/face_ea8bd2a4a78d.jpg", "like": 0, "message": "想知道本质，我们老师也是让我们推导出可以等价的等式出来，想知道能不能一眼看出，解释原理😁", "id": "ep9:300143079984:r8"}]}, {"id": "ep9:300344701824", "module": "circuit", "auto": false, "uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 2, "message": "在一个两个电源并联的电路中我该如何去分析电路中电路的干路以及支路的电流大小？以及电路中各点的电势大小情况？在这里上下两个图都是<span class=\"math\">\\(E_{1}\\)<\/span>大于<span class=\"math\">\\(E_{2}\\)<\/span>，电源内阻为<span class=\"math\">\\(r\\)<\/span>", "raw_message": "在一个两个电源并联的电路中我该如何去分析电路中电路的干路以及支路的电流大小？以及电路中各点的电势大小情况？在这里上下两个图都是E1大于E2，电源内阻为r", "images": ["_imgs/img_724b51d31e6e.jpg"], "replies": [{"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 2, "message": "对于上图，你可以假设<span class=\"math\">\\(R\\)<\/span>上电压为U(假设左端电势高)，设<span class=\"math\">\\(E_{1}\\)<\/span>上电流为<span class=\"math\">\\(I_{1}(\\)<\/span>向左)，<span class=\"math\">\\(E_{2}\\)<\/span>上电流为<span class=\"math\">\\(I_{2}(\\)<\/span>向右)，则<span class=\"math\">\\(R\\)<\/span>上电流为<span class=\"math\">\\(I_{1}-I_{2}\\)<\/span>。欧姆定律告诉我们<span class=\"math\">\\(U=(I_1-I_2)R\\)<\/span>；对两个电源分析可知<span class=\"math\">\\(E_1-U=I_1r\\)<\/span>，<span class=\"math\">\\(E_2+U=I_2r\\)<\/span>。解方程即可。图二中把图一解出来的结果<span class=\"math\">\\(E_{1}\\)<\/span>改为<span class=\"math\">\\(-E_{1}\\)<\/span>就行", "id": "ep9:300344701824:r0"}, {"uname": "琮_cong", "face": "_imgs/face_4d6141ea987b.jpg", "like": 1, "message": "了解一下基尔霍夫定律", "id": "ep9:300344701824:r1"}]}, {"id": "ep9:300997163840", "module": "em", "auto": false, "uname": "Chairman_Lam", "face": "_imgs/face_f9c11ff1b4dc.jpg", "like": 3, "message": "曲边磁场的面积怎么求？感生和动生电动势怎么叠加？(平常都是只考其中一种，很少看到两个都考)撤外力后为什么不是静止？\n麻烦咕咕叫兽解答🐶🐶🐶[鸭科夫_干嘛鸭][鸭科夫_干嘛鸭][鸭科夫_干嘛鸭]", "raw_message": "曲边磁场的面积怎么求？感生和动生电动势怎么叠加？（平常都是只考其中一种，很少看到两个都考）撤外力后为什么不是静止？\n麻烦咕咕叫兽解答[脱单doge][脱单doge][脱单doge][鸭科夫_干嘛鸭][鸭科夫_干嘛鸭][鸭科夫_干嘛鸭]", "images": ["_imgs/img_d28fe2a251a7.jpg"], "replies": []}, {"id": "ep9:297577489489", "module": "em", "auto": false, "uname": "-Sir-xiao", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 3, "message": "我有一个偏做题向的问题。在这道题目的第三问中，我一直把自己困在了一个思维困境里面，我想的是只要物体保持匀速运动，就会切割磁感线产生感应电流，因此会消耗能量，所以绳子外力作为能量补充，就会有用武之地，杆子一直需要外力来拉住运动。想到这里我就觉得绳子应该把杆拉到终点使得无法再给它水平力。直到看到正确解答我才意识到应该考虑绳子直接把杆整体拉起来的情况。而在做题过程中我反复检查了我的逻辑链条觉得没有什么问题。像这样的错误可以如何避免呢？", "raw_message": "我有一个偏做题向的问题。在这道题目的第三问中，我一直把自己困在了一个思维困境里面，我想的是只要物体保持匀速运动，就会切割磁感线产生感应电流，因此会消耗能量，所以绳子外力作为能量补充，就会有用武之地，杆子一直需要外力来拉住运动。想到这里我就觉得绳子应该把杆拉到终点使得无法再给它水平力。直到看到正确解答我才意识到应该考虑绳子直接把杆整体拉起来的情况。而在做题过程中我反复检查了我的逻辑链条觉得没有什么问题。像这样的错误可以如何避免呢？", "images": ["_imgs/img_626a3be4f292.jpg"], "replies": []}, {"id": "ep9:300352364096", "module": "em", "auto": false, "uname": "馒头阿西", "face": "_imgs/face_bf512fbeb72a.jpg", "like": 2, "message": "想问一下第一问 答案直接说电容器两极板间电压等于导体棒运动产生的感应电动势\n可对于含容，一开始如果有初速度，棒的电动势不为零，但是电容的为零，所以电容要经历一个充电的过程，在这个过程当中，棒的速度在下降，充好的时候棒的速度已经不是一开始时候的速度， 这里第一问这样做的依据是什么呢？", "raw_message": "想问一下第一问 答案直接说电容器两极板间电压等于导体棒运动产生的感应电动势\n可对于含容，一开始如果有初速度，棒的电动势不为零，但是电容的为零，所以电容要经历一个充电的过程，在这个过程当中，棒的速度在下降，充好的时候棒的速度已经不是一开始时候的速度， 这里第一问这样做的依据是什么呢？", "images": ["_imgs/img_fbffeb768b37.jpg", "_imgs/img_368d9cda33a2.jpg"], "replies": [{"uname": "Y-Y-Y-Y-W-w", "face": "_imgs/face_ebba4faa03e9.jpg", "like": 0, "message": "感觉这属于题不严谨😂 静止地放一根棒在上面 趁其不备用手一弹 把它弹到10m/s 和电容有啥关系 充电都是产生电动势之后的事了", "id": "ep9:300352364096:r0"}]}, {"id": "ep9:300639073376", "module": "em", "auto": false, "uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 2, "message": "分享一道题🐶", "raw_message": "分享一道题[脱单doge]", "images": ["_imgs/img_cb957ec775e5.jpg"], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 那应该就是b了，B无限大导致分母无限大🐶(不考虑磁阻)", "id": "ep9:300639073376:r0"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "d.不过高中好像没有反馈电阻这一概念，我把它当作定制电阻看了，B增大导致流经Rf的电流增大(进而导致总<span class=\"math\">\\(i\\)<\/span>增大)，<span class=\"math\">\\(\\frac{u}{i}\\)<\/span>减小，最终<span class=\"math\">\\(qvB=qE\\)<\/span>平衡，<span class=\"math\">\\(R\\)<\/span>趋于定值", "id": "ep9:300639073376:r1"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 电子积累到面EFGH，导致Rf电压增大，进而电流增大", "id": "ep9:300639073376:r2"}]}, {"id": "ep9:300127103344", "module": "em", "auto": false, "uname": "心念文殊", "face": "_imgs/face_fa8d2aaeea5a.jpg", "like": 2, "message": "这道题就是考虑最容易射出的情况，那就肯定是将离子发射器摆在内圆的边缘上，但是我想你是最容易发射出去的直觉上不就是沿着内圆半径射出去的吗？为什么反而是沿着垂直于内圆半径射出的才是最容易射出的？", "raw_message": "这道题就是考虑最容易射出的情况，那就肯定是将离子发射器摆在内圆的边缘上，但是我想你是最容易发射出去的直觉上不就是沿着内圆半径射出去的吗？为什么反而是沿着垂直于内圆半径射出的才是最容易射出的？", "images": ["_imgs/img_2b0120423eeb.jpg"], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "https://www.bilibili.com/read/cv48170871 (点蓝字)", "id": "ep9:300127103344:r0"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> ps.(O轨)离(O磁)最近时，最不容易从外边界射出，因为此时(r投影)全在无磁场的内圆里", "id": "ep9:300127103344:r1"}, {"uname": "账号已注销35058", "face": "_imgs/face_c47c155e4ae3.jpg", "like": 0, "message": "<span class=\"math\">\\(v\\)<\/span>正比于r 所以你这种情况就是要求最小的r 那你可以根据数学知识 三角形等就可以得出在所成轨迹与内圆外切时<span class=\"math\">\\(r\\)<\/span>最小", "id": "ep9:300127103344:r2"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "问题出在你没有仔细思考什么叫“最容易射出去”。下面是怎么样想出最容易射出的方向。\n什么样的方向最容易射出呢？那我要先搞明白怎么样才算射出。那我要先把粒子的轨迹画出来吧，画出来之后你就会发现，哦，原来射出指的就是我们画出的轨迹为圆，这个圆的一部分在边界外。那什么时候粒子最容易射出呢？或者说什么时候轨迹最容易出现在边界外呢？这是你可能就已经发现关键了：这个轨迹延伸出去越远就越容易射出。那粒子沿什么样的方向出射轨迹延伸出去越远呢？那我们要知道什么东西决定了轨迹能延伸出去多远。这时候你大概可以看出来是过磁场圆心和轨迹圆心连线延长到轨迹的长度(记为d)决定的(想不到的话可以自己调一调角度，也就是转一转轨迹圆，感受感受)。那现在看d什么时候最大，就简单了🐶", "id": "ep9:300127103344:r3"}, {"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 0, "message": "夏总→托卡马克装置", "id": "ep9:300127103344:r4"}, {"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 0, "message": "环形磁场最高难度，花环问题，这个的话，你可以去看夏总的讲义，它里面会讲确定第五种圆心的方法", "id": "ep9:300127103344:r5"}]}, {"id": "ep9:297515189265", "module": "em", "auto": false, "uname": "-锦鸿", "face": "_imgs/face_a2b24f3cdea3.jpg", "like": 2, "message": "可能之前的表述不够简洁，还是想再问一遍第一个问题：第七期有同学提出了电磁感应中电容类比质量的问题，下面这道电容穿在导体棒的题第三问答案我算出来是圈出的值，也就是说形式上似乎可以理解为带电容的导体棒可以等效为质量是<span class=\"math\">\\(B^2L^2C\\)<\/span>，大小和电容一样。这里面有什么简单的道理吗？  还有上次评论中通过能量来理解的想法让我收获很大，但是从电容赋予电路惯性的角度能有更深入的理解吗(而且惯性在高等物理里好像有更复杂的研究)", "raw_message": "可能之前的表述不够简洁，还是想再问一遍第一个问题：第七期有同学提出了电磁感应中电容类比质量的问题，下面这道电容穿在导体棒的题第三问答案我算出来是圈出的值，也就是说形式上似乎可以理解为带电容的导体棒可以等效为质量是B2L2C，大小和电容一样。这里面有什么简单的道理吗？  还有上次评论中通过能量来理解的想法让我收获很大，但是从电容赋予电路惯性的角度能有更深入的理解吗（而且惯性在高等物理里好像有更复杂的研究）", "images": ["_imgs/img_7492cd248952.jpg"], "replies": []}, {"id": "ep9:297461988545", "module": "em", "auto": false, "uname": "-锦鸿", "face": "_imgs/face_a2b24f3cdea3.jpg", "like": 2, "message": "1.第七期有同学提出了电磁感应中电容类比质量的问题，下面这道电容穿在导体棒的题第三问答案我算出来是圈出的值，也就是说形式上似乎可以理解为带电容的导体棒可以等效为质量是<span class=\"math\">\\(B^2L^2C\\)<\/span>，大小和电容的一样。这里面有什么简单的道理吗？  还有上次评论中通过能量来理解的想法让我收获很大，但是从电容赋予电路惯性的角度能有更深入的理解吗(而且惯性在高等物理里好像有更复杂的研究)\n2.那道钓鱼的题C选项似乎漏掉了鱼自己挣扎时身体内部做的功，如果类比人在地面上跳起时身体做的功确实应该在算动能时加上这部分功，但是鱼自身做功时钓鱼人受到鱼线的拉力增大从相互作用来看有鱼发的力作用在鱼线上，也有鱼线反过来对鱼做的功，那这部分鱼体内的能量到底经历了什么过程，C选项可以认为是对吗。\n3.在运用物理图像时因为有时横纵坐标量纲不同，无法比较大小。好像可以将图像中的部分角令为特殊角然后根据比例关系用数学几何方法来获取一些信息如图中将下面的角设为<span class=\"math\">\\(45^\\circ \\)<\/span>由加速度1：2可以将图中角都求解为已知角。而图中会出现很多量纲上无意义的线段(如有长度和方向关系的AB和CD)这些图形真的没有意义吗？还有我用这一方法做题时很容易做错而且很多情况并没有什么用，想知道在个方式可以迁移到抛体运动中吗？如将图中的角<span class=\"math\">\\(\\theta \\)<\/span>规定为某个已知角。", "raw_message": "1.第七期有同学提出了电磁感应中电容类比质量的问题，下面这道电容穿在导体棒的题第三问答案我算出来是圈出的值，也就是说形式上似乎可以理解为带电容的导体棒可以等效为质量是B2L2C，大小和电容的一样。这里面有什么简单的道理吗？  还有上次评论中通过能量来理解的想法让我收获很大，但是从电容赋予电路惯性的角度能有更深入的理解吗（而且惯性在高等物理里好像有更复杂的研究）\n2.那道钓鱼的题C选项似乎漏掉了鱼自己挣扎时身体内部做的功，如果类比人在地面上跳起时身体做的功确实应该在算动能时加上这部分功，但是鱼自身做功时钓鱼人受到鱼线的拉力增大从相互作用来看有鱼发的力作用在鱼线上，也有鱼线反过来对鱼做的功，那这部分鱼体内的能量到底经历了什么过程，C选项可以认为是对吗。\n3.在运用物理图像时因为有时横纵坐标量纲不同，无法比较大小。好像可以将图像中的部分角令为特殊角然后根据比例关系用数学几何方法来获取一些信息如图中将下面的角设为45º由加速度1：2可以将图中角都求解为已知角。而图中会出现很多量纲上无意义的线段（如有长度和方向关系的AB和CD）这些图形真的没有意义吗？还有我用这一方法做题时很容易做错而且很多情况并没有什么用，想知道在个方式可以迁移到抛体运动中吗？如将图中的角θ规定为某个已知角。", "images": ["_imgs/img_78117c9635d3.jpg", "_imgs/img_25a45adc01b5.jpg", "_imgs/img_bf467b597707.jpg"], "replies": []}, {"id": "ep9:297363396833", "module": "ac", "auto": false, "uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 6, "message": "分享一道题", "raw_message": "分享一道题", "images": ["_imgs/img_3f11f9330429.jpg"], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 3, "message": "<span class=\"mention\">回复 @不要伤害我鹅子<\/span> 很抱歉我没解释清楚，我的意思是你用<span class=\"math\">\\(p=u\\)<\/span>阻2/r分析，可以，但是在<span class=\"math\">\\(u\\)<\/span>增大时，<span class=\"math\">\\(u\\)<\/span>阻并不是增大，这是错误点，因为在闭合电路欧姆定律中，<span class=\"math\">\\(u\\)<\/span>增大，分压增大，但是在这里不能这样用，因为<span class=\"math\">\\(u\\)<\/span>增大时<span class=\"math\">\\(i\\)<\/span>不会跟着增大(反而是减小)，这点是分析<span class=\"math\">\\(i\\)<\/span>得到的，所以<span class=\"math\">\\(u\\)<\/span>增大，<span class=\"math\">\\(u\\)<\/span>阻是减小的，我“何必绕一圈”的意思是，你既然已经分析了<span class=\"math\">\\(i\\)<\/span>和<span class=\"math\">\\(u\\)<\/span>直接用<span class=\"math\">\\(p=ui\\)<\/span>即可，为何还要把<span class=\"math\">\\(i\\)<\/span>转成<span class=\"math\">\\(\\frac{u}{r}\\)<\/span>", "id": "ep9:297363396833:r0"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 3, "message": "<span class=\"mention\">回复 @不要伤害我鹅子<\/span> 没关系，都是讨论问题并肩作战的朋友，重要的理解这个问题🤝，这样讨论客观上还加深印象了呢🐶", "id": "ep9:297363396833:r1"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 2, "message": "错把电源电压当作输电线电压(或把他俩趋势想成一致)\n正解：分两种情况，1、电压恒定，把输电线电阻和负载全部等效到电压端。\n探究<span class=\"math\">\\(r\\)<\/span>：用闭合电路欧姆定律，<span class=\"math\">\\(r\\)<\/span>增大，<span class=\"math\">\\(i\\)<\/span>减小，<span class=\"math\">\\(p\\)<\/span>不知道怎么变，那我们可以回想曾经学的电源输出功率变化曲线(内阻等于外阻是<span class=\"math\">\\(p\\)<\/span>输出最大)，在这里<span class=\"math\">\\(r=R\\)<\/span>其他时，<span class=\"math\">\\(p\\)<\/span>损最大，<span class=\"math\">\\(p\\)<\/span>向两头递减。\n2.电压不定，功率恒定(本题)\n同样，先等效电阻，但我们不能从<span class=\"math\">\\(u\\)<\/span>角度分析，试想：<span class=\"math\">\\(u\\)<\/span>增大，<span class=\"math\">\\(i\\)<\/span>减小，但<span class=\"math\">\\(i=\\frac{u}{r}\\)<\/span>，<span class=\"math\">\\(u\\)<\/span>增大时<span class=\"math\">\\(i\\)<\/span>应该增大才对故这个时候就不能用欧姆定律那套分压理论。要从电流角度分析，<span class=\"math\">\\(u\\)<\/span>增大，<span class=\"math\">\\(i\\)<\/span>减小，<span class=\"math\">\\(u\\)<\/span>线减小，<span class=\"math\">\\(p\\)<\/span>损<span class=\"math\">\\(=iu\\)<\/span>减小，<span class=\"math\">\\(r\\)<\/span>减小，ir减小，即<span class=\"math\">\\(p\\)<\/span>损<span class=\"math\">\\(=u\\)<\/span>线减小。", "id": "ep9:297363396833:r2"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @不要伤害我鹅子<\/span> 输电线上电压是由电流决定的，<span class=\"math\">\\(u\\)<\/span>增大，<span class=\"math\">\\(i\\)<\/span>减小，ir减小，<span class=\"math\">\\(u\\)<\/span>阻减小，确实也可以推出<span class=\"math\">\\(\\frac{u^2}{r}\\)<\/span>减小，不过何必绕一圈呢", "id": "ep9:297363396833:r3"}, {"uname": "Yeeelsen", "face": "_imgs/face_0da59923c7bb.jpg", "like": 0, "message": "应该是把<span class=\"math\">\\(U\\)<\/span>搞混了，这里的<span class=\"math\">\\(U\\)<\/span>应该是加在电阻两端的<span class=\"math\">\\(U\\)<\/span>，不是输电电压", "id": "ep9:297363396833:r4"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 他是因为默认<span class=\"math\">\\(u\\)<\/span>增大，会导致<span class=\"math\">\\(u\\)<\/span>阻增大导致出错，但是当他意识到这一点时，说明他已经想到电流了，何必再用电压呢", "id": "ep9:297363396833:r5"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不要伤害我鹅子<\/span> ？你用<span class=\"math\">\\(\\frac{u^2}{r}\\)<\/span>本就是在恒压电路中约掉电流方便分析，可是你现在已经分析电流了，为什么不直接用ui？", "id": "ep9:297363396833:r6"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不要伤害我鹅子<\/span> 你是默认你在攻击我的理论？何必攻击呢？", "id": "ep9:297363396833:r7"}, {"uname": "数学和物理都很有趣", "face": "_imgs/face_71bf55804b7f.jpg", "like": 0, "message": "这个我高中想过，这样想错在忽略了变压器，你公式里的<span class=\"math\">\\(U\\)<\/span>不是回路两端的电压，回路中还有变压器也在和他竞争电压，所以这个<span class=\"math\">\\(U\\)<\/span>是分压。如果你用“等效电阻”看的话很明显了。用等效电阻看，相当于两个串联电阻抢分压，你肯定希望导线上电阻分压尽量低，那就是要“等效电阻”尽量大，也就是<span class=\"math\">\\(\\frac{n1}{n2}\\)<\/span>越大越好，然后已知<span class=\"math\">\\(n_{2}\\)<\/span>那边用户电压是220V，那么<span class=\"math\">\\(n_{1}\\)<\/span>那边自然电压自然越高越好，所以需要高压输电", "id": "ep9:297363396833:r8"}, {"uname": "且应烛", "face": "_imgs/face_f68e6b0c40c8.jpg", "like": 0, "message": "不把变压器当用电器是这样的", "id": "ep9:297363396833:r9"}, {"uname": "蕾蒂喵的溜溜糖", "face": "_imgs/face_1c5fd66c8e7b.jpg", "like": 0, "message": "哇这个问题真经典，上学的时候我也问过。我的想法是题中提到的<span class=\"math\">\\(U\\)<\/span>是发电站输出的<span class=\"math\">\\(U\\)<\/span>，可以理解为一个电路上的总电压。但是算损耗的时候，应该用电阻上的<span class=\"math\">\\(U\\)<\/span>。这两个<span class=\"math\">\\(U\\)<\/span>是不一样的。总电压一定的情况下，电阻越小，电阻上的<span class=\"math\">\\(U\\)<\/span>越小", "id": "ep9:297363396833:r10"}]}, {"id": "ep9:300198556880", "module": "ac", "auto": false, "uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 2, "message": "还是关于确定性的问题🐶想知道除了感受情形，把握确定性还有什么关键？\n问题涉及的知识与直觉相符时，我们可以先感受情形，再通过感受的指引具体分析。比如受力分析\n但是看我图片里的问题，好像无法感受情形，由此引出两个问题：\n1.如果某些知识确实无法转化为直觉，那么在这种情况下，怎么把握确定性？\n2.如果知识都能转化为直觉，那么怎么培养这种直觉？直觉到什么样的程度才达标？", "raw_message": "还是关于确定性的问题[脱单doge]想知道除了感受情形，把握确定性还有什么关键？\n问题涉及的知识与直觉相符时，我们可以先感受情形，再通过感受的指引具体分析。比如受力分析\n但是看我图片里的问题，好像无法感受情形，由此引出两个问题：\n1.如果某些知识确实无法转化为直觉，那么在这种情况下，怎么把握确定性？\n2.如果知识都能转化为直觉，那么怎么培养这种直觉？直觉到什么样的程度才达标？", "images": ["_imgs/img_9d79f9e5dfdb.jpg"], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "物理模型的构建也很重要，本质刷不同类型题(有些直觉确实要靠一些好题来训练)\n这个题要求电压，有<span class=\"math\">\\(r\\)<\/span>有<span class=\"math\">\\(i\\)<\/span>，想到欧姆定律，但是这个<span class=\"math\">\\(i\\)<\/span>不是副线圈上的，可以把副线圈和负载全部等效到原线圈中。这样就可以用欧姆定律算电压了，但是最后电压还要等效回原电路。", "id": "ep9:300198556880:r0"}, {"uname": "小明同学574", "face": "_imgs/face_63600d54a3be.jpg", "like": 1, "message": "我认为物理是以实验为基础的，像人把鸡蛋悬在空中松手，每个人的直觉都会告诉自己鸡蛋会加速下落然后被打破，所以这样的电学题未必是无法感受到内种情形而是我们生活接触的 思考的少，因而我认为知识肯定能转化成直觉。", "id": "ep9:300198556880:r1"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 1, "message": "你要问确定性，首先我希望你不是单纯因为咕咕教授经常强调“确定性”而每道题都问。应该是当确实有确定的方式没看明白才自然的去追问，而不是去机械的“套”流程，甚至问题已经出口却不知道在问具体什么。\n这里的确定性，你看得清吗？我觉得按你的水平不应该有问题，因为给定一个输入电压U 后面每个电压电流显然都是完全定死的。那不就结了？哦一个<span class=\"math\">\\(U\\)<\/span>定出来一切，那么现在题目给你一个信息是不是就能反过来定出<span class=\"math\">\\(U\\)<\/span>？这应该是很直接的。你可以看看上面这两句话的逻辑里你是卡在了哪里，还是只记得凭空的一句“确定性”却都不知道从哪里开始说话呢？我觉得按照你的水平不应该会卡住，应该是后一种问题，这就是为什么我回答前要说第一句话。", "id": "ep9:300198556880:r2"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "我看了题目，分析了一下，觉得是可以算的，圆线圈中干路的电流已知，而两个分录中，其中一个分录的电阻已知另一个分录与负线圈相关，而负线圈的电阻也知道，既然都是定下来的，那么应该是可以进行求解的", "id": "ep9:300198556880:r3"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "求解的话，我应该会先将负线圈整体等效看为一个电阻，线圈加速知道的，然后电阻<span class=\"math\">\\(r_{2}\\)<\/span>也是知道的，所以这等效看成的这个电阻应该也是知道的，那么就直接变成了一个并联求电压的问题了...", "id": "ep9:300198556880:r4"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "呃，当然好的，前提是电流表和电压表都是理想的情况", "id": "ep9:300198556880:r5"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "怎么去求解负线圈等效看成的那个电阻的大小？可以将这个等效电阻的表达式写出来，也就是圆线圈中右边部分的电压比电流，然后再将电压和电流分别转化为负线圈中的电压和电流....", "id": "ep9:300198556880:r6"}]}, {"id": "ep9:297397350913", "module": "thermal", "auto": false, "uname": "四重吹不散", "face": "_imgs/face_dbb0bd97eb2e.jpg", "like": 3, "message": "我没搞清楚上期压强微分的问题，为什么质点系封闭要求体积不变啊，两者间有必然联系吗，我认为追问的问题出在虽然划出的是锥体，但是实际上并不是刚体啊，怎么能保证径向移动旁边气体不作功呢，沿着径向的运动应该是气体的“自发响应”，而不是引入一个的几何约束，而且为什么甲的选取微元对象是聪明而简单的？我认为实际上约束是——在半径方向，压力差产生的净力，必须刚好托住重量，而甲刚好不多余的满足了这个物理情形的约束", "raw_message": "我没搞清楚上期压强微分的问题，为什么质点系封闭要求体积不变啊，两者间有必然联系吗，我认为追问的问题出在虽然划出的是锥体，但是实际上并不是刚体啊，怎么能保证径向移动旁边气体不作功呢，沿着径向的运动应该是气体的“自发响应”，而不是引入一个的几何约束，而且为什么甲的选取微元对象是聪明而简单的？我认为实际上约束是——在半径方向，压力差产生的净力，必须刚好托住重量，而甲刚好不多余的满足了这个物理情形的约束", "images": [], "replies": [{"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 1, "message": "<span class=\"mention\">回复 @四重吹不散<\/span>  “质点系”可能是比较形式的讲法，取决于他怎么约定这些词的，比如什么叫“封闭体系”。但这些不重要，我认为这里的核心是，为了能够清楚的做“虚功”的分析，我才想去研究一个体积不变的移动过程(气体确实不是刚体所以允许气体形状变化)，这也是Frozen和另一位同学的核心意思。为什么“要想虚功做的清楚，就要取这样一个体积不变的过程”呢？因为体积如果变了就压缩了气体，那么外界对气体做功里面就包含了用来压缩气体做的功。但我在用虚功原理的时候不想触发这部分做功，这是因为虚功原理的根本想法是，“如果偏移一点外力会做功，那么物体就会获得动能，所以就会动起来，就不再平衡了，所以平衡位置附近的小偏移外力做功应该<span class=\"math\">\\(=0\\)<\/span>”，这段道理是假设了外力做的功只能转化为整体动能，这样才说得通。如果现在外力做的功有其他去处，不一定要变成动能了，那么上面这个道理就不再成立了。所以我为了能使用“平衡位置附近小偏移，虚功<span class=\"math\">\\(=0\\)<\/span>”，就要限制我所考虑的“小偏移”必须满足外力做的功不会产出别的能量，只能产出整体的动能。\n在我的视角下，两侧的气体压强确实不做功，那是因为我们研究的是这团气体顺着这个“滑槽”滑入的情况，壁本身没有动，从微观上看滑槽不会把能量输入给这团气体。\n但我预期你可能对我上面这句话有如下反对意见(如果没有的话可以跳过)：质心有移动，和侧面压力又不垂直，所以侧面压强明明是做功的。这个分析的完全正确，也可以自圆其说，得到正确的结论。但我们说的并不冲突，因为我们的视角是不同的，这种不同就像是看待地面上跳起的人，我问地面做功吗？在微观的视角里地面附近与地面接触的每一个人分子都没动(一旦动了也就没弹力了，地面很硬)，所以没有能量从地面输入给人，人的能量是人自己内部提供的。而在另一个的视角下，如果把人看作质点，那么地面给的弹力作用在质点上，质点升高了，弹力确实做了功。这两个分析都是对的。回到这个问题里，后面那种分析当然是对的，只不过那样其实回归到了“把圆弧块视作质点”的视角，也就是这里考虑的虚运动实际上变成了整个圆弧块去上下平移，这就等价于同学之前说的“老老实实把所有的力沿径向正交分解”，其实也就是你想的那种讲法。但同学想要问的不是这个，而是这样一团气体一边往里塞一遍变形来fit进“容器”形状的微小过程怎么从虚功上说的通，也就是前一种视角怎么走通。", "id": "ep9:297397350913:r0"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 0, "message": "根据球对称性，把质元取为<span class=\"math\">\\(r\\)<\/span>～<span class=\"math\">\\(r+dr\\)<\/span>段的球壳即可，研究此质元时，若对<span class=\"math\">\\(r\\)<\/span>取虚位移，则<span class=\"math\">\\(r+dr\\)<\/span>处的虚位移要保证整个球壳虚位移前后体积不变，从而保证我们没有“框入”不属于所考察质元的气体。做虚功的力仅有：重力(引力)、作用于内壁的压力、作用于外壁的压力。", "id": "ep9:297397350913:r1"}]}, {"id": "ep9:300304774688", "module": "thermal", "auto": false, "uname": "老姑家的咕咕鸡", "face": "_imgs/face_ff176075dea5.jpg", "like": 3, "message": "高温物体和低温物体放在一起时，温度由高向低传递，那么低温物体温度变高熵增，但是高温物体温度变低是熵减，因为必须整体是熵增，那是不是温度越低，身高相同的温度，附带熵变的能力越强呢", "raw_message": "高温物体和低温物体放在一起时，温度由高向低传递，那么低温物体温度变高熵增，但是高温物体温度变低是熵减，因为必须整体是熵增，那是不是温度越低，身高相同的温度，附带熵变的能力越强呢", "images": [], "replies": [{"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 1, "message": "熵变的定义就是，取一个可逆过程连接初末状态，沿着这个过程，计算吸热与温度之比<span class=\"math\">\\(\\Delta \\frac{Q}{T}\\)<\/span>再求和。所以同等条件下<span class=\"math\">\\(T\\)<\/span>越小熵变越大", "id": "ep9:300304774688:r0"}, {"uname": "High-explosive", "face": "_imgs/face_d20602747ba5.jpg", "like": 0, "message": "对", "id": "ep9:300304774688:r1"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 0, "message": "我认为由前者不能直接推出后者，因为前者中传热过程中低温和高温升降温度未必相同(根据<span class=\"math\">\\(\\Delta Q=cm\\,\\Delta T \\)<\/span>，cm未必相同，<span class=\"math\">\\(Q\\)<\/span>相同时，<span class=\"math\">\\(\\Delta  T\\)<\/span>未必相同)。你说的后者是基于传热过程中双方<span class=\"math\">\\(\\Delta  T\\)<\/span>相同得出的", "id": "ep9:300304774688:r2"}]}, {"id": "ep9:297406700241", "module": "thermal", "auto": false, "uname": "小明同学574", "face": "_imgs/face_63600d54a3be.jpg", "like": 2, "message": "分享一道题，对于这一个问题，如果上来就设未知量利用理想气体状态方程来解可以求解，但是回过头一看，这里面分母分子这些量一码是一码，所以有没有更快的讲法，直接讲出这个比例的来源，看见它的含义，而写出答案呢？？", "raw_message": "分享一道题，对于这一个问题，如果上来就设未知量利用理想气体状态方程来解可以求解，但是回过头一看，这里面分母分子这些量一码是一码，所以有没有更快的讲法，直接讲出这个比例的来源，看见它的含义，而写出答案呢？？", "images": ["_imgs/img_64103c74268b.jpg"], "replies": [{"uname": "reivolution", "face": "_imgs/face_05c1f4649501.jpg", "like": 2, "message": "站在车上看问题，两板受向右的<span class=\"math\">\\((M+m)a\\)<\/span>的惯性力，里面的气体为了维持平衡，就必须调整板的位置以获得额外的向左的<span class=\"math\">\\((M+m)a,\\)<\/span>气体对两板的贡献从<span class=\"math\">\\(2P_{0}S\\)<\/span>变成<span class=\"math\">\\(2P_{0}S+(M+m)a\\)<\/span>，力与体积成反比，<span class=\"math\">\\(L+\\Delta x=(2P_{0}S/2P_{0}S+(M+m)a)L\\)<\/span>，这就是比例的来源", "id": "ep9:297406700241:r0"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 0, "message": "把两个连在一起的活塞视为整体，右图对比左图，发现需要内部气体额外提供<span class=\"math\">\\((M+m)a\\)<\/span>的向左的压力；从直观的逻辑可以判断这个效应导致的位移关于<span class=\"math\">\\(a\\)<\/span>是非线性的，从而排除BD选项：假设<span class=\"math\">\\(a\\)<\/span>增加<span class=\"math\">\\(\\Delta a\\)<\/span>，所需的额外气压<span class=\"math\">\\(2\\Delta pS\\)<\/span>需要提供这个<span class=\"math\">\\(\\Delta a\\)<\/span>，但是<span class=\"math\">\\(p\\)<\/span>反比于<span class=\"math\">\\(V\\)<\/span>，而活塞位移量正比于<span class=\"math\">\\(\\Delta V\\)<\/span>，这就导致位移量必定不正比于<span class=\"math\">\\(\\Delta p\\)<\/span>，也就不正比于<span class=\"math\">\\(\\Delta a\\)<\/span>。对于AC选项，我们可以试图令<span class=\"math\">\\((M+m)a=-p_{0}S\\)<\/span>来判断：此时<span class=\"math\">\\(\\Delta p=-\\frac{p0}{2}\\)<\/span>，即压强减半，于是体积应当翻倍。注意到左图中气体体积为2SL，活塞向左位移<span class=\"math\">\\(\\frac{L}{2}\\)<\/span>时恰好达到4SL，符合，因此选A；而C选项给出的结果趋于无穷大，显然不符合。\n不过，我觉得直接硬算其实挺简便的，取巧的做法也没有方便很多", "id": "ep9:297406700241:r1"}]}, {"id": "ep9:297341198033", "module": "thermal", "auto": false, "uname": "槭焰", "face": "_imgs/face_0472628365bc.jpg", "like": 2, "message": "我自己做题时发现了自己的直觉与题目答案有所出入，现以展示，恳请各位多多指正。即：饱和汽压的大小与蒸汽体积无关，却与液面弯曲情况有关。同种温度下的同种液体，凸液面上方的饱和汽压比凹液面的情况下要大。\n我的第一反应是：涉及液面，那么有可能与水的张力有关；涉及凸凹液面，即同种液体对于不同容器来说是否润湿。凸液面属于不润湿的情况，那么液体表层内部的分子对于液体表层分子的引力，要大于外部对表层分子的引力，那么表层分子为了溢出所要做的功就更大，就更剧烈，单位时间内对于单位面积的碰撞就更多。凹液面则反之。所以凸液面上方的饱和汽压更大。    \n但是答案如下图。请给我一个解释，这两种回答哪一个存在漏洞，或哪一个更完美🧘🧘🧘", "raw_message": "我自己做题时发现了自己的直觉与题目答案有所出入，现以展示，恳请各位多多指正。即：饱和汽压的大小与蒸汽体积无关，却与液面弯曲情况有关。同种温度下的同种液体，凸液面上方的饱和汽压比凹液面的情况下要大。\n我的第一反应是：涉及液面，那么有可能与水的张力有关；涉及凸凹液面，即同种液体对于不同容器来说是否润湿。凸液面属于不润湿的情况，那么液体表层内部的分子对于液体表层分子的引力，要大于外部对表层分子的引力，那么表层分子为了溢出所要做的功就更大，就更剧烈，单位时间内对于单位面积的碰撞就更多。凹液面则反之。所以凸液面上方的饱和汽压更大。    \n但是答案如下图。请给我一个解释，这两种回答哪一个存在漏洞，或哪一个更完美[蹲蹲][蹲蹲][蹲蹲]", "images": ["_imgs/img_20117f2cc042.jpg", "_imgs/img_c85a38d6d4df.jpg"], "replies": []}, {"id": "ep9:297435033313", "module": "thermal", "auto": false, "uname": "空下去", "face": "_imgs/face_4537839cb640.jpg", "like": 1, "message": "如何理解帕斯卡原理这件事？\n这期视频中提到了一个基本图像：物体是否平衡取决于物体发生微小位形变化时是否有其它能量转化成动能？\n这句话我们该怎么理解？其中提到的关键词包括“微小位形”“其他形式能量”我们是如何理解的？这里的位形是不是过于模糊？以至于会导致理解的偏颇。能不能给位形加一个更加准确直观的理解？\n在这个问题下，液体处于无重力环境，这样来理解，确实很自然，很通透。如果算上重力的话，那么前后做的功就不等了，此时对应的水液面上升水的整体重力势能变大也可以理解。但是在无重力环境的解释下水处于平衡位置左右也为平衡是什么意思呀？", "raw_message": "如何理解帕斯卡原理这件事？\n这期视频中提到了一个基本图像：物体是否平衡取决于物体发生微小位形变化时是否有其它能量转化成动能？\n这句话我们该怎么理解？其中提到的关键词包括“微小位形”“其他形式能量”我们是如何理解的？这里的位形是不是过于模糊？以至于会导致理解的偏颇。能不能给位形加一个更加准确直观的理解？\n在这个问题下，液体处于无重力环境，这样来理解，确实很自然，很通透。如果算上重力的话，那么前后做的功就不等了，此时对应的水液面上升水的整体重力势能变大也可以理解。但是在无重力环境的解释下水处于平衡位置左右也为平衡是什么意思呀？", "images": ["_imgs/img_20d79b8904c8.jpg", "_imgs/img_b73de9eba5ff.jpg"], "replies": []}, {"id": "ep9:297390055281", "module": "thermal", "auto": false, "uname": "空下去", "face": "_imgs/face_4537839cb640.jpg", "like": 0, "message": "现在分析打气的过程：原：<span class=\"math\">\\((P_{0}-V_{0}) \\)<\/span>；要打入：<span class=\"math\">\\((2P_{0}-V_{1}\\)<\/span>和<span class=\"math\">\\(P_{0}-V_{2})\\)<\/span>；问最后的压强\n选取原和要打入的全部气体为对象：过程前后：<span class=\"math\">\\(P_{0}V_{0}+2P_{0}V_{1}+P_{0}V_{2}=P'V_{0}\n\\)<\/span>这很显然对吧？\n但是当情景转换到抽气，情况就大有不同了\n(见图)\n但是我想问的是同样是选取一定的气体，为什么我认为<span class=\"math\">\\(P_{0}V_{0}=P'(V_{0}+\\frac{V0}{2}+\\frac{V0}{2}+\\frac{V0}{2})\\)<\/span>是不正确的呢？\n有人给的解释是：每一次抽气后分析的气体质量改变了，且下一次抽时有两部分(留在汽缸里等待被抽搐的和已经被抽出的)压强不一样，没有办法进行等温分析。但是我想问的是在打气过程当中我们将全部的气体当作整体来分析为什么在这里也把它们当成整体来分析呢？另外再打气的时候<span class=\"math\">\\(2P_{0}-V_{1}\\)<\/span>看作<span class=\"math\">\\(P_{0}-2V_{1}\\)<\/span>，在这里，我们可不可以把第一次抽出的那一部分气体按在一个压强合适的容器里进而可以通过一个式子来表述出整个过程呢？这是可行的吗？", "raw_message": "现在分析打气的过程：原：（P0-V0） ；要打入：（2P0-V1和P0-V2）；问最后的压强\n选取原和要打入的全部气体为对象：过程前后：P0V0+2P0V1+P0V2=P‘V0\n这很显然对吧？\n但是当情景转换到抽气，情况就大有不同了\n（见图）\n但是我想问的是同样是选取一定的气体，为什么我认为P0V0=P’（V0+V0/2+V0/2+V0/2）是不正确的呢？\n有人给的解释是：每一次抽气后分析的气体质量改变了，且下一次抽时有两部分（留在汽缸里等待被抽搐的和已经被抽出的）压强不一样，没有办法进行等温分析。但是我想问的是在打气过程当中我们将全部的气体当作整体来分析为什么在这里也把它们当成整体来分析呢？另外再打气的时候2P0-V1看作P0-2V1，在这里，我们可不可以把第一次抽出的那一部分气体按在一个压强合适的容器里进而可以通过一个式子来表述出整个过程呢？这是可行的吗？", "images": ["_imgs/img_af3f8f2c2d65.jpg"], "replies": []}, {"id": "ep9:298155296369", "module": "math", "auto": false, "uname": "Yeeelsen", "face": "_imgs/face_0da59923c7bb.jpg", "like": 3, "message": "我来提个小学级别的问题好了，答案大家都会，缝隙=增长的<span class=\"math\">\\(6.28\\div 2\\pi \\)<\/span>，小朋友不理解的是：地球半径那么大，绳子长度才增长6.28米，为何半径还能增长1米？我再追加一些问题：1.在推导圆的周长公式的时候，为什么要引入<span class=\"math\">\\(\\pi \\)<\/span>？2.能不能从运动学的角度，直接解释周长差只与半径差有关？", "raw_message": "我来提个小学级别的问题好了，答案大家都会，缝隙=增长的6.28➗2π，小朋友不理解的是：地球半径那么大，绳子长度才增长6.28米，为何半径还能增长1米？我再追加一些问题：1.在推导圆的周长公式的时候，为什么要引入pi？2.能不能从运动学的角度，直接解释周长差只与半径差有关？", "images": ["_imgs/img_de01f40e413f.jpg"], "replies": [{"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 1, "message": "小朋友的问题应该是：赤道周长那么大，而增加的长度对赤道而言完全微不足道，但是如此微不足道的变化，竟然能产生这么大的变化，也就是直接把绳子抬高了1米。我感觉它在理解这个问题的时候，偷偷换了视角。增量微不足道是对赤道而言的。绳子抬高1米，是对它自己而言的，一个人才一米多，这么这个增量直接把绳子抬高到了腰间，对小学生而言，这个高度可能在它的脑袋附近，所以它才会觉得影响会如此巨大吧。如果它有一天能上天，去外太空再看一看的话，那么就会发现1米的增量其实也是微不足道的。\n不过，其实可以直接拿一根1米长的绳子 "q": 2, "r": 11, "img": 2}, "em": {"q": 7, "r": 10, "img": 10}, "ac": {"q": 2, "r": 18, "img": 2}, "thermal": {"q": 6, "r": 7, "img": 6}, "math": {"q": 3, "r": 1, "img": 1}, "other": {"q": 2, "r": 1, "img": 2}}, "removed": [["四重吹不散", "我觉得如果只是点出：混淆了两个“期望”，是不足以修正直觉的。问题究竟错在", "归档时已排除"], ["化真月", "讲一下第一个同学的直觉错误。如果把抛二十次硬币拆分成先抛十次记为步骤1，", "归档时已排除"], ["早八玛奇朵", "前排[星星眼]", "归档时已排除"], ["番茄茄茄z", "可惜高三没时间，趁今天休息才能看一看，我也好想参加这个活动哇！[大哭]", "人工判定噪音"], ["-千面妖容-", "咕，感觉我打开了网站电脑变得好卡啊", "归档时已排除"], ["小光会变身", "@账号已注销35058\n意义就是一束光，从真空中先经过水再到玻璃和直接进", "归档时已排除"], ["安德瑞er", "摸鱼前来学习[脱单doge]听完神清气爽，污浊退散[歪嘴]", "归档时已排除"], ["pure243", "讲得太好了！", "归档时已排除"], ["冥道残", "收获很多", "人工判定噪音"], ["绯村染之助", "抛硬币问题我的理解：\n做实验抛20次硬币，抛硬币结果分先后顺序共有2^2", "归档时已排除"], ["pure243", "我觉得从思考错误逻辑产生的原因，去推出正确的答案。比直接从正确答案出发去", "归档时已排除"], ["-corruption-", "[打call][打call]", "归档时已排除"], ["Leo的知识屋", "爱你", "归档时已排除"], ["太杂了只能记下来", "[doge][doge]", "归档时已排除"], ["秋的树叶", "老师，我想让孩子学您的选修二，但是我没找到，是在付费课程里么？付费的在哪", "归档时已排除"], ["逸竹笋", "[打call]", "归档时已排除"], ["e的变化率不是e", "@寒蝉月落\n评论的图", "归档时已排除"]], "ghost_merged": 44, "total_q": 38, "total_r": 120, "total_img": 34, "auto_cnt": 0}, {"key": "ep10", "title": "第10期", "episodeId": "ep1777796135094", "export": "2026-08-25", "comments": [{"id": "ep10:301585026192", "module": "mech", "auto": false, "uname": "高中物理咕咕助教", "face": "_imgs/face_8085b2aab17f.jpg", "like": 10, "message": "即使有九年制义务教育，我们在互联网上还是可以看到很多不科学的说法。\n比如说，当我们看到“同一辆汽车高速行驶时更难刹停”的现象，很多人脱口而出的总结仍然是“速度快的惯性大，更难停下”。\n学过初中物理的我们知道这个说法是荒谬的。\n问题是，你会怎么帮他纠正这种错误的直觉呢？或者你曾今是怎么样调和“惯性只取决于质量”这个课本的说法与上述生活经验的矛盾的呢？", "raw_message": "即使有九年制义务教育，我们在互联网上还是可以看到很多不科学的说法。\n比如说，当我们看到“同一辆汽车高速行驶时更难刹停”的现象，很多人脱口而出的总结仍然是“速度快的惯性大，更难停下”。\n学过初中物理的我们知道这个说法是荒谬的。\n问题是，你会怎么帮他纠正这种错误的直觉呢？或者你曾今是怎么样调和“惯性只取决于质量”这个课本的说法与上述生活经验的矛盾的呢？", "images": [], "replies": [{"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 2, "message": "<span class=\"mention\">回复 @白夜-017<\/span> 假如我就是问题中的那种人，那么我看到你的回答的感受如下：\n1 什么叫“更难停下”，这个“难”是什么意思？是需要更多的时间，还是需要更大的力气，还是需要更长的距离……？\n2 什么叫“惯性对应的运动状态”？惯性为什么有对应的运动状态？什么又叫“混为一谈”？为什么不能混在一起？\n3 你凭什么说惯性的本质就是“……”，你这就是在给我强行灌输这个概念。我对惯性有我自己的一套理解，你凭什么认为你说的就是本质？\n4什么叫“加上这一个变量的控制再比较”？这表述是什么东西？根本看不懂在讲什么。\nemm，感觉这个人又凶又爱杠🐶\n综上，我觉得你的这段回答一点说服力都没有。", "id": "ep10:301585026192:r0"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 1, "message": "<span class=\"mention\">回复 @高中物理咕咕助教<\/span> 我觉得在解释之前，需要把难停下这个概念界定清楚。只有双方在概念上达成共识时。讨论或者说解释才是有意义的，才有可能具备说服力。从犯错误的人的角度来思考的话，这个难停下至少有两种理解方式：\n\n如果从惯性的角度说“难停下”，意思是物体的运动状态不容易被外力改变。这个难易程度在高中物理中由质量决定。质量越大，同样外力下加速度越小，速度越难改变。\n\n如果从速度改变量的角度说“难停下”，意思是物体当前速度越大，要变成静止就需要减少更多速度。比如从<span class=\"math\">\\( 30 \\frac{m}{s} \\)<\/span>停到 0，比从<span class=\"math\">\\( 10 \\frac{m}{s} \\)<\/span>停到 0 需要更大的速度变化量。\n\n所以，高速车确实更难停，但这个“难”主要是“要改的速度多”，不是“速度更难被改变”。\n\n错误说法的根源就在于：它把“速度改变量大”和“速度改变更困难”混为一谈。所以他会得出速度大的物体惯性也大，这个荒谬的结论。", "id": "ep10:301585026192:r1"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 0, "message": "<span class=\"mention\">回复 @高中物理咕咕助教<\/span> 所以，我觉得，对于白夜同学的解释，应当补充对“难”的辨析。以及第四句话，应当引到“速度改变的难易程度” 和“速度改变量”这两个辨析上，而不是又回到质量上面，因为从犯错误的人的解释上来看的话，并没有充足理由看出：他不知道“惯性只取决于质量”这件事。", "id": "ep10:301585026192:r2"}, {"uname": "白夜-017", "face": "_imgs/face_06cee83bac38.jpg", "like": 0, "message": "客观现象没有错：同一辆汽车，高速行驶时确实更难刹停。\n但把刹停全过程和惯性对应的运动状态改变混为一谈了。\n刹停是让物体从原有速度完整减到0，过程里天然绑定初速度这个变量；\n而惯性的本质，是物体抵抗外界作用力、抗拒运动状态被改变的固有能力，它只看质量，和速度变化量Delta v没关系\n至于正确的直觉 我觉得简单点就加上这一个变量的控制再比较", "id": "ep10:301585026192:r3"}, {"uname": "无物知我", "face": "_imgs/face_27993139a565.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不要伤害我鹅子<\/span> 1.力是动量对时间的一阶导数，物体最后要停下来要改变的动量是相同的，用更小的力就要用更长的时间，如果力比较小的话，距离也确实比低速情形更远\n2.这个在3里回答\n3.质量是描述惯性大小的物理量，一个物体的质量越大，惯性也就越大，想要改变它的运动状态也就越难。至于为什么我说的是本质？这是教材定义的。回到2的问题，在低速情景，动量是描述惯性大小的“质量”与速度的乘积，质量的确影响改变物体运动状态的难易，但它与速度是平权的\n4.变量在这个语境下指的就是动量，你回复的那个人说“高速物体更难停下来”只与质量相关是完全错误的", "id": "ep10:301585026192:r4"}]}, {"id": "ep10:299694537649", "module": "mech", "auto": false, "uname": "闭关修炼-_", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 3, "message": "求教各位这个问题", "raw_message": "求教各位这个问题", "images": ["_imgs/img_8a3ea74b27dd.jpg"], "replies": [{"uname": "_moooom_", "face": "_imgs/face_f44efd6d906c.jpg", "like": 2, "message": "关键点在绳子上 现实生活中 绳子一定可以伸长(微小形变) 加入一开始又没有摩擦力又没有弹力 那么物块要往下掉 一旦位移拉长绳子 绳子就有拉力(但是很小)但是此时已经有对墙壁的压力了 再想动就得过摩擦力这一关 然后再动再压再战胜摩擦力 直到战胜不了摩擦力 所以是有静摩擦的", "id": "ep10:299694537649:r0"}, {"uname": "_moooom_", "face": "_imgs/face_f44efd6d906c.jpg", "like": 2, "message": "<span class=\"mention\">回复 @_moooom_<\/span> 而在理想模型中 通常绳不可伸长 什么意思？ 非常非常小的一点点位移就能产生无穷大的力呗 所以刚刚的论述中 一开始位移 绳子的力就啪一下给重力平衡了", "id": "ep10:299694537649:r1"}, {"uname": "_moooom_", "face": "_imgs/face_f44efd6d906c.jpg", "like": 2, "message": "<span class=\"mention\">回复 @_moooom_<\/span> 但有趣的是 现实生活中 如果我们先不让物块接触墙壁 而是用手拉开 使得绳子上的力大小刚好在图示情况平衡重力 再画一个弧把它贴到墙上 似乎又没有摩擦力了", "id": "ep10:299694537649:r2"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 1, "message": "没有相对运动趋势，就没有摩擦力", "id": "ep10:299694537649:r3"}, {"uname": "ZWB--", "face": "_imgs/face_b76ba2789588.jpg", "like": 1, "message": "<span class=\"mention\">回复 @史蒂夫2332<\/span> 就是一直是平衡的，他问怎么判断是拉力和重力抵消还是拉力加上静摩擦去抵消重力", "id": "ep10:299694537649:r4"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "求大神解答，关键在于解决什么叫“有相对运动趋势”🙌", "id": "ep10:299694537649:r5"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @闭关修炼-_<\/span> 物体没动，所有力一定平衡——牛顿第一定律", "id": "ep10:299694537649:r6"}]}, {"id": "ep10:301331369424", "module": "mech", "auto": false, "uname": "S-煜皇大帝", "face": "_imgs/face_e08acb4e6c7f.jpg", "like": 3, "message": "我对这题有疑惑…按现实来讲雨滴是会全覆盖的…我认为再怎么样也会落到箱子上。没有理解出题人的意味在哪，可以帮我解答一下吗。谢谢😊", "raw_message": "我对这题有疑惑…按现实来讲雨滴是会全覆盖的…我认为再怎么样也会落到箱子上。没有理解出题人的意味在哪，可以帮我解答一下吗。谢谢😊", "images": ["_imgs/img_f9c0a97b8ee3.jpg"], "replies": [{"uname": "_moooom_", "face": "_imgs/face_f44efd6d906c.jpg", "like": 5, "message": "咕咕讲过类似的题 假如说车跑的飞快 雨还没来得及落就被车头创飞了 于是箱子就不会沾到水(当然加速过程一定会被淋到) 或者从相对运动的视角 卡车速度很快时 站在箱子上 看到的雨滴是斜斜地飞(因为水平速度大)这样就会被车头挡住", "id": "ep10:301331369424:r0"}, {"uname": "有名等", "face": "_imgs/face_34af0e20d8c9.jpg", "like": 3, "message": "仔细思考一下雨滴全覆盖是什么意思，确实雨滴全覆盖了地面但是在这里的语境中地面应该是一个平面，所以说雨滴会都落在一个平面上，但是因为它这里雨滴有水平方向速度，所以应该是个斜面上，所以只要长方形木块，在这个斜面上的投影被这个车头完全挡住就可以不落在箱子上", "id": "ep10:301331369424:r1"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @有名等<\/span> 精确一点应该说以车为参考系时雨滴的速度有水平分量", "id": "ep10:301331369424:r2"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "可以看看咕咕讲变换参考系的视频", "id": "ep10:301331369424:r3"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @S-煜皇大帝<\/span> 看完可以顺便看看他讲惯性力的视频，是连贯的知识点🐶", "id": "ep10:301331369424:r4"}, {"uname": "滴ddddddddd", "face": "_imgs/face_a20093c4078b.jpg", "like": 0, "message": "这题我写过，你可以用那个还系思想写一下，把速度给雨滴，之后找临界关系🙌", "id": "ep10:301331369424:r5"}, {"uname": "滴ddddddddd", "face": "_imgs/face_a20093c4078b.jpg", "like": 0, "message": "更换参考系", "id": "ep10:301331369424:r6"}, {"uname": "巨雕-奥义", "face": "_imgs/face_f488b9ea12b9.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 哈哈我做这道题用的就是咕咕教的换系", "id": "ep10:301331369424:r7"}]}, {"id": "ep10:300344539345", "module": "mech", "auto": false, "uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 0, "message": "关于重力：重力的方向是怎样的？我们日常所说的向上滚或者向下滚的方向和所说的重力方向是一回事吗？\nhttps://youtu.be/o4xTbyfQgps?si=v8Ng7jknvdFDOJe5", "raw_message": "关于重力：重力的方向是怎样的？我们日常所说的向上滚或者向下滚的方向和所说的重力方向是一回事吗？\nhttps://youtu.be/o4xTbyfQgps?si=v8Ng7jknvdFDOJe5", "images": [], "replies": []}, {"id": "ep10:298725233297", "module": "mech", "auto": false, "uname": "bili_97646691291", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "小弟有个问题，这里答案说的是轻滑轮两侧轻绳与竖直杆夹角始终不变，我不理解", "raw_message": "小弟有个问题，这里答案说的是轻滑轮两侧轻绳与竖直杆夹角始终不变，我不理解", "images": ["_imgs/img_039f8cdd61cd.jpg"], "replies": [{"uname": "_moooom_", "face": "_imgs/face_f44efd6d906c.jpg", "like": 1, "message": "<span class=\"mention\">回复 @bili_97646691291<\/span> 把ab之间的绳子折上去 总绳长不变 间距不变 a往右移相当于折过的绳子整体向上平移", "id": "ep10:298725233297:r0"}, {"uname": "Tanga_Ibuki", "face": "_imgs/face_fd8b67741918.jpg", "like": 1, "message": "用视频中强调的思想：假设调整，首先绳子的张力处处相等，假设我向右移动过程中<span class=\"math\">\\(\\beta \\)<\/span>变小，<span class=\"math\">\\(\\alpha \\)<\/span>变大了，<span class=\"math\">\\(\\alpha >\\beta \\)<\/span>，直观上对<span class=\"math\">\\(a\\)<\/span>来说就有向左收回的趋势，再对<span class=\"math\">\\(a\\)<\/span>试着分析：假如夹角不相等，而两侧拉力大小相等，那么水平方向上两侧拉力无法抵消，<span class=\"math\">\\(a\\)<\/span>在水平方向上就会有加速度，直到<span class=\"math\">\\(\\alpha =\\beta \\)<\/span>", "id": "ep10:298725233297:r1"}, {"uname": "Tanga_Ibuki", "face": "_imgs/face_fd8b67741918.jpg", "like": 0, "message": "<span class=\"mention\">回复 @bili_97646691291<\/span>  角不变是绳长限制，假如角变大或者变小，绳子要么向下伸长要么向上缩短，但绳长是固定的", "id": "ep10:298725233297:r2"}, {"uname": "看美女的狗子", "face": "_imgs/face_8c6a597e63b5.jpg", "like": 0, "message": "这个题它实际给你的角是那个<span class=\"math\">\\(a\\)<\/span>两边的夹角，因为bc之间的距离没改变，所以绳的拉力，角度都不变，这种假动长绳就用定长绳的方式想就行，那个<span class=\"math\">\\(a\\)<\/span>两边的夹角只和其余二者之间的水平间距有关，具体说应该是二者之间的水平间距和绳长的比有关", "id": "ep10:298725233297:r3"}]}, {"id": "ep10:298428631169", "module": "energy", "auto": false, "uname": "A___lal", "face": "_imgs/face_385e27f596d1.jpg", "like": 5, "message": "1. 小球向下摆动的整个过程里，水平向右的速度一直在不断增大，只有摆到最低点时，水平速度才达到全程最大值。\n2. 既然小球水平速度是一直加速、最后才到最大，那分离绝对不可能发生在最低点之后，只能发生在到达最低点之前，或者刚好在最低点这一刻。\n3. 我们先做一个假设：假设小球刚好运动到最低点、速度最大的那一刻，才和斜面分离。\n这时候会出现明显矛盾：- 分离瞬间斜面不受小球压力，水平方向合力为0，开始匀速向右运动；\n- 小球在最低点时，只受重力和绳子拉力，合力沿竖直方向，没有水平方向的加速度；\n- 此时小球和斜面垂直斜面方向的加速度不一样，满足不了贴合接触的条件，说明根本不可能在最低点分离。\n4. 所以能确定：分离一定发生在最低点左侧(悬挂点O的左下方)。\n \n\n 问题\n1. 既然提前在最低点左侧就分离了，之后斜面一直匀速向右跑，而小球还在继续往下摆、水平速度还在持续加速变大，小球后面会不会越加速越快，重新追上斜面、再次碰撞贴合？\n2. 既然排除了最低点分离的可能，那小球和斜面真正准确的分离时刻，到底是什么时候？", "raw_message": "1. 小球向下摆动的整个过程里，水平向右的速度一直在不断增大，只有摆到最低点时，水平速度才达到全程最大值。\n2. 既然小球水平速度是一直加速、最后才到最大，那分离绝对不可能发生在最低点之后，只能发生在到达最低点之前，或者刚好在最低点这一刻。\n3. 我们先做一个假设：假设小球刚好运动到最低点、速度最大的那一刻，才和斜面分离。\n这时候会出现明显矛盾：- 分离瞬间斜面不受小球压力，水平方向合力为0，开始匀速向右运动；\n- 小球在最低点时，只受重力和绳子拉力，合力沿竖直方向，没有水平方向的加速度；\n- 此时小球和斜面垂直斜面方向的加速度不一样，满足不了贴合接触的条件，说明根本不可能在最低点分离。\n4. 所以能确定：分离一定发生在最低点左侧（悬挂点O的左下方）。\n \n\n 问题\n1. 既然提前在最低点左侧就分离了，之后斜面一直匀速向右跑，而小球还在继续往下摆、水平速度还在持续加速变大，小球后面会不会越加速越快，重新追上斜面、再次碰撞贴合？\n2. 既然排除了最低点分离的可能，那小球和斜面真正准确的分离时刻，到底是什么时候？", "images": ["_imgs/img_678b093b0239.jpg"], "replies": []}, {"id": "ep10:301916122832", "module": "energy", "auto": false, "uname": "阴中有阳阳中有阴", "face": "_imgs/face_5509411345cd.jpg", "like": 5, "message": "这个第八题很有意思🍉", "raw_message": "这个第八题很有意思[吃瓜]", "images": ["_imgs/img_772e92db35a9.jpg"], "replies": [{"uname": "_moooom_", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "A杆始终做负功 因为他一直被<span class=\"math\">\\(a\\)<\/span>压着<span class=\"math\">\\(\nB_{30}\\)<\/span>度时b的速度收杆子效率更高(夹角更小)所以肯   定<span class=\"math\">\\(a\\)<\/span>速度更大\nC我怎么定死b的速度？受力看不清 从能量上想 计算即可\nD显然不对 如果b有速度杆子就爆炸了", "id": "ep10:301916122832:r0"}, {"uname": "_moooom_", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @阴中有阳阳中有阴<\/span> c选项拼尽全力无法战胜 还希望你能分享更自然的做法", "id": "ep10:301916122832:r1"}]}, {"id": "ep10:298326025601", "module": "energy", "auto": false, "uname": "e的变化率不是e", "face": "_imgs/face_85ac0420741b.jpg", "like": 3, "message": "接这期最后的滑块问题，但比较的是两种情形下滑块的速度变化。滑块从斜面下滑，不计一切摩擦，在竖直方向，滑块有种“踩空了”的感觉，这样看滑块速度应比之前固定斜面时大；但在水平方向，却是“使不上劲”的感觉，这样的话速度在水平方向应该更小。\n问题是，为什么综合起来滑块速度是变小的？", "raw_message": "接这期最后的滑块问题，但比较的是两种情形下滑块的速度变化。滑块从斜面下滑，不计一切摩擦，在竖直方向，滑块有种“踩空了”的感觉，这样看滑块速度应比之前固定斜面时大；但在水平方向，却是“使不上劲”的感觉，这样的话速度在水平方向应该更小。\n问题是，为什么综合起来滑块速度是变小的？", "images": [], "replies": [{"uname": "空下去", "face": "_imgs/face_4537839cb640.jpg", "like": 0, "message": "在地面参考系中，曲面对小球的支持力与小球的运动方向成钝角，做负功具体可见@物你学家 Elas学姐的【两星题也可以是纸老虎《高中物理二级结论》能量和动量<span class=\"math\">\\(2-\\)<\/span>哔哩哔哩】 https://b23.tv/m46y8rh这期视频的57:22分处", "id": "ep10:298326025601:r0"}]}, {"id": "ep10:301545282304", "module": "energy", "auto": false, "uname": "佚之森", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 2, "message": "如图 两个质量分别为2m和<span class=\"math\">\\(m\\)<\/span>的小球被轻杆连接 放在球面上 求释放瞬间杆的力是多少。显然 如果没有杆的话 两个球分别做圆周运动 但加速度不同一个是g 一个是<span class=\"math\">\\(\\frac{1}{2}g \\)<\/span>杆出现了且不能伸长 其作用为约束二者沿杆加速度相同 我们把刚刚算出的<span class=\"math\">\\(g\\)<\/span>和<span class=\"math\">\\(\\frac{1}{2}g\\)<\/span>分别沿杆分解 并列出加速度相等 得到如图的式子和答案。但是正确答案是九分之二倍根号三mg 请问我的分析错在了哪里？😳", "raw_message": "如图 两个质量分别为2m和m的小球被轻杆连接 放在球面上 求释放瞬间杆的力是多少。显然 如果没有杆的话 两个球分别做圆周运动 但加速度不同一个是g 一个是1/2g 杆出现了且不能伸长 其作用为约束二者沿杆加速度相同 我们把刚刚算出的g和1/2g分别沿杆分解 并列出加速度相等 得到如图的式子和答案。但是正确答案是九分之二倍根号三mg 请问我的分析错在了哪里？[脸红]", "images": ["_imgs/img_f7ea5290b9f9.jpg", "_imgs/img_6bbbcd5b0265.jpg"], "replies": [{"uname": "e的变化率不是e", "face": "_imgs/face_85ac0420741b.jpg", "like": 1, "message": "<span class=\"mention\">回复 @佚之森<\/span> 一个小球相对另一个做圆周，需要向心相对加速度，大小为(v相)平方/L，<span class=\"math\">\\(L\\)<\/span>为相对圆周的“半径”，之所以延杆加速度不等而杆不会形变，就是因为两球延杆的加速度分量之差提供了做相对圆周的加速度", "id": "ep10:301545282304:r0"}, {"uname": "e的变化率不是e", "face": "_imgs/face_85ac0420741b.jpg", "like": 1, "message": "<span class=\"mention\">回复 @佚之森<\/span>  受力得结合具体情形啊，看具体的约束形式。不是因为杆的力产生加速度关联，而是确定的约束(如本题有杆的约束、碗壁的理想约束)引出了确定的加速度关联。最简单的例子，小球系绳做匀速圆周，常听到的是“球受到这么大的向心力，所以以这个速度这个半径做圆周”，这是因果颠倒的，应该是球在绳的约束下运动，绳子张力取决于球的运动方式(速度、向心、离心等)", "id": "ep10:301545282304:r1"}, {"uname": "Tanga_Ibuki", "face": "_imgs/face_fd8b67741918.jpg", "like": 1, "message": "我用了两组方法计算，一个是你这样的方法，另一个是两球切向加速度相等，因为接下来显然两球在圆弧面上保持切向共速，列式是<span class=\"math\">\\(g-(\\sqrt\\frac{3}{2})(\\frac{F}{2m})=(\\frac{1}{2})g+(\\sqrt\\frac{3}{2})(\\frac{F}{m})\\)<\/span>，解出来正好是答案。于是我用算出的答案验证“沿杆加速度相同”的正确性，其实能发现切向加速度沿着杆方向的加速度是相等的，如果加上径向加速度那么“沿杆加速度”就明显不等了", "id": "ep10:301545282304:r2"}, {"uname": "Tanga_Ibuki", "face": "_imgs/face_fd8b67741918.jpg", "like": 1, "message": "实际上杆子给的径向加速度在初始时应该和弹力的抵消，也就是说你的分析没有考虑弹力", "id": "ep10:301545282304:r3"}, {"uname": "Tanga_Ibuki", "face": "_imgs/face_fd8b67741918.jpg", "like": 1, "message": "小查了一下资料，沿杆加速度应该是在有相对运动的情况下都不会相等，就这道题里你可以假设一个初速度，然后再画出下一时刻的速度，会发现速度的变化率在方向上都不一样更何谈沿杆的分量相等呢", "id": "ep10:301545282304:r4"}]}, {"id": "ep10:298290398481", "module": "momentum", "auto": false, "uname": "Cgodot", "face": "_imgs/face_1b7109cfc8bc.jpg", "like": 3, "message": "还是有关能量与动量的问题", "raw_message": "还是有关能量与动量的问题", "images": ["_imgs/img_63d678f0c64d.jpg"], "replies": [{"uname": "e的变化率不是e", "face": "_imgs/face_85ac0420741b.jpg", "like": 2, "message": "<span class=\"mention\">回复 @e的变化率不是e<\/span>  其实如果抛开质量，单从运动学角度看，积分v•dv相当于是速度在自身空间上的积累，描述速度内在的强度积累，就像势能一样具有内在属性，或许积分v•dv可以叫做“速度势”", "id": "ep10:298290398481:r0"}, {"uname": "e的变化率不是e", "face": "_imgs/face_85ac0420741b.jpg", "like": 1, "message": "能量是速度对动量的积分(速度在动量上的累积)，物理理解是对于“运动强度”的描述，在动量变化过程中，显然速度越大运动强度越大，这种运动的总强度或存量体现于连续变化的整个过程，对于任意时刻，v•d(mv)它代表了“这一小步贡献的'运动强度'”，当前速度越快，同样一个微小的动量提升d(mv)，对这个“累积量”的贡献就越大。将其累加就得到了动能", "id": "ep10:298290398481:r1"}, {"uname": "e的变化率不是e", "face": "_imgs/face_85ac0420741b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span>  势能是积分<span class=\"math\">\\(F\\cdot dx\\)<\/span>，其中<span class=\"math\">\\(F=f(x)\\)<\/span>，力是位移的函数", "id": "ep10:298290398481:r2"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @e的变化率不是e<\/span> 问问势能咋转化成<span class=\"math\">\\(x\\cdot dx\\)<\/span>的形式", "id": "ep10:298290398481:r3"}, {"uname": "苏恩裕", "face": "_imgs/face_6ed57a4c4f23.jpg", "like": 0, "message": "学下微积分和普物力学", "id": "ep10:298290398481:r4"}]}, {"id": "ep10:298345632097", "module": "momentum", "auto": false, "uname": "e的变化率不是e", "face": "_imgs/face_85ac0420741b.jpg", "like": 2, "message": "对于高中那种常见的连续流体冲击问题，高中一般都是以质量微元dm为研究对象，<span class=\"math\">\\(F\\cdot dt=dm\\cdot v-dm\\cdot u\\)<\/span>，得出冲击力。但总感觉这样有点怪，因为既然研究dm，那其动量变化展开还有一项<span class=\"math\">\\(m·\\frac{dv}{dt}\\)<\/span>，但是微元速度是突变的，即速度不连续那<span class=\"math\">\\(\\frac{dv}{dt}\\)<\/span>就没意义了\n对此我有以下两种理解不知道对不对", "raw_message": "对于高中那种常见的连续流体冲击问题，高中一般都是以质量微元dm为研究对象，F·dt=dm·v-dm·u，得出冲击力。但总感觉这样有点怪，因为既然研究dm，那其动量变化展开还有一项m·dv/dt，但是微元速度是突变的，即速度不连续那dv/dt就没意义了\n对此我有以下两种理解不知道对不对", "images": ["_imgs/img_dcae534181bc.jpg"], "replies": [{"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "能简述一下题目描述的情形吗？我好像没见过这种题🙌", "id": "ep10:298345632097:r0"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "有没有一种可能dm是微元是一个定值，<span class=\"math\">\\(F\\cdot dt=dm\\cdot v-dm\\cdot u=m·\\frac{dv}{dt}\\)<\/span>", "id": "ep10:298345632097:r1"}]}, {"id": "ep10:298533652257", "module": "vibration", "auto": false, "uname": "-Sir-xiao", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 4, "message": "我对之前的简谐运动线性叠加还存在疑惑，在之前提到的一个例题中，物块被弹簧拉伸并给予初速度可以看成两个运动的叠加，它的道理是因为两种状态的受力相同，力可以叠加，进而与他成正比的位移可以叠加吗？我总感觉我的逻辑链还有哪里没有讲完整，我感觉我还没有形成直观的印象。希望能得到进一步的补充说明", "raw_message": "我对之前的简谐运动线性叠加还存在疑惑，在之前提到的一个例题中，物块被弹簧拉伸并给予初速度可以看成两个运动的叠加，它的道理是因为两种状态的受力相同，力可以叠加，进而与他成正比的位移可以叠加吗？我总感觉我的逻辑链还有哪里没有讲完整，我感觉我还没有形成直观的印象。希望能得到进一步的补充说明", "images": ["_imgs/img_6310c2649895.jpg"], "replies": [{"uname": "闭关修炼-_", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "我认为关键在于力与位移成正比，一个完整的简谐运动，不管你怎么拆，两个分开来的 力与位移也一定还成正比，也就是可以完美拆成两个简谐运动，既然可以拆，我就能让其中一个满足初位移是X，初速度为0，而另一个是初位移为0，速度是<span class=\"math\">\\(v\\)<\/span>的，能量也是守恒的。", "id": "ep10:298533652257:r0"}, {"uname": "白夜-017", "face": "_imgs/face_06cee83bac38.jpg", "like": 0, "message": "<span class=\"math\">\\(F=-kx \\)<\/span>所以<span class=\"math\">\\(F\\)<\/span>线性就是<span class=\"math\">\\(x\\)<\/span>线性了；也可以像函数那样对整体操作<span class=\"math\">\\(x=x_{1}+x_{2}\\)<\/span>，<span class=\"math\">\\(f(x)=-kx\\)<\/span>，即<span class=\"math\">\\(-kx=-k(x_{1}+x_{2})=-kx1-kx2 \\)<\/span>当然这个从物理 和一次函数角度都很好看出 所以函数只是作为一个工具写一下", "id": "ep10:298533652257:r1"}]}, {"id": "ep10:298630419889", "module": "vibration", "auto": false, "uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 3, "message": "分享一些我自己在思考线性叠加中产生的问题，以及ai的回答。希望对大家有用。", "raw_message": "分享一些我自己在思考线性叠加中产生的问题，以及ai的回答。希望对大家有用。", "images": ["_imgs/img_3f421fb1fb5b.jpg", "_imgs/img_7e6d7f683915.jpg", "_imgs/img_517d5bab4035.jpg", "_imgs/img_06fd67ee4439.jpg", "_imgs/img_b335121d8c0a.jpg", "_imgs/img_2ea4aa : false, "uname": "皮皮的电钮", "face": "_imgs/face_a1700bfaef36.jpg", "like": 4, "message": "咕咕教授是否愿意讲解一下在一个闭合电路当中电子跑一圈都感受到了啥，电源到底有什么作用，电阻到底是怎么阻碍电子的", "raw_message": "咕咕教授是否愿意讲解一下在一个闭合电路当中电子跑一圈都感受到了啥，电源到底有什么作用，电阻到底是怎么阻碍电子的", "images": [], "replies": [{"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @有名等<\/span> 电子还会撞到原子核，从而阻碍", "id": "ep10:301183698880:r0"}, {"uname": "_moooom_", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "同问", "id": "ep10:301183698880:r1"}, {"uname": "前进_y", "face": "_imgs/face_a41c3e40a59b.jpg", "like": 0, "message": "deepseek的回答\n1. 电子跑一圈，感受到了什么？\n\n· 电场力： 这是主要的驱动力。电源在两端产生电压，相当于在导线中建立了一个电场，这个力持续推动电子从负极流向正极。\n· 碰撞： 这是“阻力”的来源。电子在流动时会不断撞击导线中的原子核和杂质，每次碰撞都会损失动能，转化为内能，也就是发热。灯泡发光、电阻发热，根源都是这种碰撞。\n· 磁场力： 运动电子会产生磁场。在电机、电磁铁等器件里，磁场力会与其他磁场相互作用，把电能转化为机械能。\n· 稳定的恒定电流感： 在一个稳定的直流电路中，电子跑完一圈感受到的净加速度几乎为零。电场力在加速它们，碰撞阻力在减速它们，最终达到动态平衡，形成稳定的漂移速度(其实很慢，每秒几毫米)。\n\n2. 电源到底有什么作用？\n\n· 提供能量： 这是最核心的作用。电源是非静电力(电池中的化学力、发电机中的电磁力)做功的地方，它把其他形式的能(化学能、机械能)转化成电能。\n· 提供电动势： 它像一个“电荷泵”，把电子从正极强行“搬”到负极(或从低电位搬到高电位)，从而维持两极之间的电压差。这个电压差就是推动电子流动的根本原因。\n· 维持持续电流： 没有电源，电场瞬间消失，电子碰撞几下就停下来了。电源不断补充能量，才能让电子在碰撞消耗能量后还能继续跑下去。\n\n3. 电阻到底是怎么阻碍电子的？\n\n电阻的本质是原子对电子的“摩擦力”，它来源于两种效应：\n\n· 原子核的振动散射： 温度升高时，原子核振动加剧，就像拥挤、晃动剧烈的人群，电子穿过时更容易被撞偏、减速。这就是导体的电阻通常随温度升高而增大的原因。\n· 杂质和晶格缺陷： 完美晶格中电子可以较顺畅地穿行(如纯银)。一旦有杂质原子或晶格缺陷，就像道路上出现了大坑或路障，电子在此处会发生剧烈散射，表现为电阻。", "id": "ep10:301183698880:r2"}]}, {"id": "ep10:301558070688", "module": "circuit", "auto": false, "uname": "佚之森", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 2, "message": "我对等效电源 那个“并联式内阻”还有点疑惑 为什么电流流过<span class=\"math\">\\(R\\)<\/span>的时候是这么流过的？流过的电流不是应该回到电源的负极吗？为什么可以这么叠加", "raw_message": "我对等效电源 那个“并联式内阻”还有点疑惑 为什么电流流过R的时候是这么流过的？流过的电流不是应该回到电源的负极吗？为什么可以这么叠加", "images": [], "replies": []}, {"id": "ep10:298632434161", "module": "circuit", "auto": false, "uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 1, "message": "还有电学实验的部分(一次最多只能发9张图)", "raw_message": "还有电学实验的部分（一次最多只能发9张图）", "im "_imgs/img_8828fa0e9c5b.jpg"], "replies": []}, {"id": "ep10:298275240689", "module": "em", "auto": false, "uname": "qqqtome", "face": "_imgs/face_7cd9d9adb5b4.jpg", "like": 3, "message": "想请问一下磁场和磁力的本质是什么，和库仑力有什么关系，和电场有关系吗？", "raw_message": "想请问一下磁场和磁力的本质是什么，和库仑力有什么关系，和电场有关系吗？", "images": [], "replies": [{"uname": "有名等", "face": "_imgs/face_34af0e20d8c9.jpg", "like": 2, "message": "详情见《安培分子电流》，咳咳，虽然咕咕说了不能这么回答可是课本上都有啊🥹", "id": "ep10:298275240689:r0"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @思满邮笨蛋<\/span> 那么<span class=\"math\">\\(E=v\\times B\\)<\/span>也可以证明电场是磁场的相对论效应🍉", "id": "ep10:298275240689:r1"}, {"uname": "思满邮笨蛋", "face": "_imgs/face_dd27e4ca9081.jpg", "like": 0, "message": "磁场可以看成是电场的相对论变换，本质是一个东西，不过不同参考系下表现形式不同罢了，考虑一个运动电荷，在 a 参考系下是运动的在 b 参考系下静止的，那在 a 参考系下观察，它是电流的形式，会有磁场，在 b 参考系下观察它是静止的，所以只有电场…这个过程是保持电荷守恒的", "id": "ep10:298275240689:r2"}, {"uname": "思满邮笨蛋", "face": "_imgs/face_dd27e4ca9081.jpg", "like": 0, "message": "你以后学电动力学会学到这个", "id": "ep10:298275240689:r3"}, {"uname": "思满邮笨蛋", "face": "_imgs/face_dd27e4ca9081.jpg", "like": 0, "message": "其实当时法拉第的电磁感应的实验就已经给出了一点狭义相对论的现象了，因为法拉第的电磁感应实验里有两个情况，一个是相对于磁场运动的导体产生电动势和变化的磁场产生电动势，前者是磁力作为非静电力做功，后者是感生电场力做功。狭义相对论指出这俩力是同一本质", "id": "ep10:298275240689:r4"}, {"uname": "思满邮笨蛋", "face": "_imgs/face_dd27e4ca9081.jpg", "like": 0, "message": "<span class=\"mention\">回复 @有名等<\/span> 磁场可以看成是电场的相对论变换，本质是一个东西，不过不同参考系下表现形式不同罢了，考虑一个运动电荷，在 a 参考系下是运动的在 b 参考系下静止的，那在 a 参考系下观察，它是电流的形式，会有磁场，在 b 参考系下观察它是静止的，所以只有电场…这个过程是保持电荷守恒的", "id": "ep10:298275240689:r5"}]}, {"id": "ep10:301176377680", "module": "em", "auto": false, "uname": "夜明伸影", "face": "_imgs/face_fd7e3d0261b6.jpg", "like": 2, "message": "咕咕教授讲电感的部分我有些困惑。\n我们老师上新课时推过电感储存的能量是<span class=\"math\">\\(\\frac{1}{2} ·L\\cdot I^2\\)<\/span>，接着说能量不突变所以流过电感的电流不突变，即电感电流从0开始连续变化。\n当时我其实没懂她是怎么推出来储能公式的，只是先记住了电流不突变这个结论然后做题很方便。\n今天看到咕咕教授讲电感时，一开始根据欧姆定律，电流变为<span class=\"math\">\\(\\frac{E}{R}\\)<\/span>，随后由于电流变化率此时极大，所以产生无穷大感应电动势。但是很快咕咕又说<span class=\"math\">\\(\\frac{\\Delta i}{\\Delta t}\\)<\/span>会从小逐渐递增到等于<span class=\"math\">\\(E\\)<\/span>。\n这之间的逻辑关系并不连贯，甚至有些错乱。我的理解是，咕咕提到无穷大感应电动势并不是在描述接通瞬间的电路状态，只是假设这样子，推出矛盾。如果是这样，逻辑上就没有什么问题。不知是否如此？如果是，那么我对“假设调整”的理解就是：从合乎直觉的假设出发，调整以使情景(物理叙事)合乎逻辑。这并不对应客观现实的运动过程，而只是人类的分析方式。<span class=\"math\">\\(\nQ_{1}\\)<\/span>：在大家看来，这样子对假设调整的理解是否有问题？<span class=\"math\">\\(\nQ_{2}\\)<\/span>：咕咕在讲电感式为什么说<span class=\"math\">\\(\\frac{\\Delta i}{\\Delta t}\\)<\/span>从小递增而不是说从大递减？\n(最初我也没搞清楚自己的疑问点，所以来来回回做了很多修改，但是终究还是表达上会有所冗杂，请同学们见谅)", "raw_message": "咕咕教授讲电感的部分我有些困惑。\n我们老师上新课时推过电感储存的能量是1/2 ·L·I^2，接着说能量不突变所以流过电感的电流不突变，即电感电流从0开始连续变化。\n当时我其实没懂她是怎么推出来储能公式的，只是先记住了电流不突变这个结论然后做题很方便。\n今天看到咕咕教授讲电感时，一开始根据欧姆定律，电流变为E/R，随后由于电流变化率此时极大，所以产生无穷大感应电动势。但是很快咕咕又说delta_i/delta_t会从小逐渐递增到等于E。\n这之间的逻辑关系并不连贯，甚至有些错乱。我的理解是，咕咕提到无穷大感应电动势并不是在描述接通瞬间的电路状态，只是假设这样子，推出矛盾。如果是这样，逻辑上就没有什么问题。不知是否如此？如果是，那么我对“假设调整”的理解就是：从合乎直觉的假设出发，调整以使情景（物理叙事）合乎逻辑。这并不对应客观现实的运动过程，而只是人类的分析方式。\nQ1：在大家看来，这样子对假设调整的理解是否有问题？\nQ2：咕咕在讲电感式为什么说delta_i/delta_t从小递增而不是说从大递减？\n（最初我也没搞清楚自己的疑问点，所以来来回回做了很多修改，但是终究还是表达上会有所冗杂，请同学们见谅）", "images": [], "replies": [{"uname": "有名等", "face": "_imgs/face_34af0e20d8c9.jpg", "like": 2, "message": "<span class=\"mention\">回复 @夜明伸影<\/span> 其实是因为电感在感应过程中出现电磁振荡现象，以机械波形式发射出去，非纯电阻电路那不能用欧姆定律", "id": "ep10:301176377680:r0"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "①我觉得假设调整其实就跟反证法比较类似，就是他实际情况不是这样子的，但是你假设他是这样子的，通过逻辑推理，你会得到一个荒谬的结果，从而推断出假设不成立。在这个问题里面就是假设电流变化率不等于<span class=\"math\">\\(\\frac{E}{L}\\)<\/span>，推出电流方向改变的荒谬结果，从而推断出假设不成立，电流变化率等于<span class=\"math\">\\(\\frac{E}{L}\n\\)<\/span>这么看来假设调整和反证法是一样讲道理的。\n②咕咕讲的时候思维应该是有点跳跃，应该是说两种情况：电流变化率太大和电流变化率太小。假设调整动作做得仔细一点就是先说电流变化率太大会怎么样，然后再说电流变化率太小会怎么样\n\n个人拙见🐶", "id": "ep10:301176377680:r1"}, {"uname": "空下去", "face": "_imgs/face_4537839cb640.jpg", "like": 0, "message": "原电路：未接通，没有电流\n接通之后：欧姆定律告诉他，你的电阻为零，电流要无穷大\n\n电感：！电流在瞬间从零变无穷大，我也要反馈出无穷大的反向电压\n\n由于起点是未接通时，电路中电流为零，这个才是变化的原点铁铁🐶", "id": "ep10:301176377680:r2"}]}, {"id": "ep10:298534779137", "module": "ac", "auto": false, "uname": "闭关修炼-_", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "请问各位正弦式交流电有效值为什么是最大值除以根号二？", "raw_message": "请问各位正弦式交流电有效值为什么是最大值除以根号二？", "images": ["_imgs/img_74448817fa92.jpg"], "replies": [{"uname": "夜明伸影", "face": "_imgs/face_fd7e3d0261b6.jpg", "like": 0, "message": "<span class=\"mention\">回复 @闭关修炼-_<\/span> 你这个思路挺好的，老师说不严谨那是以为你没有把整条逻辑链讲完整。前面正余弦叠加都没问题，就是后面平方除以二的那一步是不严谨的。你最好先说明正余弦电流有效值相同，所以有效值对半分。\n也没有什么更好的方法吧，通解通法是二倍角公式化简，画出函数图像，然后割补法可以补成高为<span class=\"math\">\\(\\frac{I_m}{2}\\)<\/span>的矩形，所以有效值自然是二分之根二。", "id": "ep10:298534779137:r0"}, {"uname": "康喂喂喂", "face": "_imgs/face_72ffca8baca5.jpg", "like": 0, "message": "<span class=\"mention\">回复 @闭关修炼-_<\/span> 没问题的", "id": "ep10:298534779137:r1"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "交流电在一个周期内，流过一个<span class=\"math\">\\(R\\)<\/span>的电阻产生的热量，如果等价于在这个周期内强度为<span class=\"math\">\\(I\\)<\/span>的直流电产生的热量，这个<span class=\"math\">\\(I\\)<\/span>就是有效值\n通过数学公式<span class=\"math\">\\(I=(\\int i^2 \\frac{dt)}{T}(\\)<\/span>积分上下限为0~T)，可以算出来：由于<span class=\"math\">\\(i=(i_{\\max})\\,\\,\\sin  (\\omega t)→I=(i_{\\max})/\\sqrt{2}\\)<\/span>", "id": "ep10:298534779137:r2"}]}, {"id": "ep10:301191408352", "module": "ac", "auto": false, "uname": "我本有山", "face": "_imgs/face_c431734a364b.jpg", "like": 0, "message": "振荡电路连通一瞬间 电感等效电阻为何无限大 😂", "raw_message": "振荡电路连通一瞬间 电感等效电阻为何无限大 [笑哭]", "images": [], "replies": [{"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 1, "message": "<span class=\"mention\">回复 @suhdoshu<\/span> 磁通量变化率不是无穷大吧，反电动势应该等于电容两端电压，要不然电流反着流了", "id": "ep10:301191408352:r0"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "视频没好好看哦，里面有电感🐶", "id": "ep10:301191408352:r1"}, {"uname": "suhdoshu", "face": "_imgs/face_a46003e5464f.jpg", "like": 0, "message": "因为此时磁通量变化率无穷大，线圈的感应电动势遵循法拉第电磁感应定律，线圈产生的反向电压无穷大，因此电路电流为零，等效电阻无穷大", "id": "ep10:301191408352:r2"}, {"uname": "suhdoshu", "face": "_imgs/face_a46003e5464f.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 确实，我说法有误，就图像分析，磁通量随时间的图像也是三角函数，没有斜率无穷大的时候", "id": "ep10:301191408352:r3"}]}, {"id": "ep10:301390309296", "module": "thermal", "auto": false, "uname": "Chairman_Lam", "face": "_imgs/face_f9c11ff1b4dc.jpg", "like": 1, "message": "分享一道物理题的思考过程吧：有一个篮球，球压强比大气压大，对球面受力分析。   当时想到受力是内部压强产生的力要大于大气压，但是体积会变大。然后就假设球变大，发现有收缩的趋势，所以想到还有球的弹力纠正使其体积维持原状。(不知道还有没有更好的解释🧘😂😂)", "raw_message": "分享一道物理题的思考过程吧：有一个篮球，球压强比大气压大，对球面受力分析。   当时想到受力是内部压强产生的力要大于大气压，但是体积会变大。然后就假设球变大，发现有收缩的趋势，所以想到还有球的弹力纠正使其体积维持原状。（不知道还有没有更好的解释[蹲蹲][笑哭][笑哭]）", "images": [], "replies": [{"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "就是假设调整嘛，假设没有弹力，球要变大，但实际上球没变大，那肯定有向内的弹力平衡掉", "id": "ep10:301390309296:r0"}]}, {"id": "ep10:298256267601", "module": "thermal", "auto": false, "uname": "槭焰", "face": "_imgs/face_0472628365bc.jpg", "like": 1, "message": "我自己做题时发现了自己的直觉与题目答案有所出入，现以展示，恳请各位多多指正。即：饱和汽压的大小与蒸汽体积无关，却与液面弯曲情况有关。同种温度下的同种液体，凸液面上方的饱和汽压比凹液面的情况下要大。\n我的第一反应是：涉及液面，那么有可能与水的张力有关；涉及凸凹液面，即同种液体对于不同容器来说是否润湿。凸液面属于不润湿的情况，那么液体表层内部的分子对于液体表层分子的引力，要大于外部对表层分子的引力，那么表层分子为了溢出所要做的功就更大，就更剧烈，单位时间内对于单位面积的碰撞就更多。凹液面则反之。所以凸液面上方的饱和汽压更大。    \n但是答案如下图。请给我一个解释，这两种回答哪一个存在漏洞，或哪一个更完美🧘🧘🧘", "raw_message": "我自己做题时发现了自己的直觉与题目答案有所出入，现以展示，恳请各位多多指正。即：饱和汽压的大小与蒸汽体积无关，却与液面弯曲情况有关。同种温度下的同种液体，凸液面上方的饱和汽压比凹液面的情况下要大。\n我的第一反应是：涉及液面，那么有可能与水的张力有关；涉及凸凹液面，即同种液体对于不同容器来说是否润湿。凸液面属于不润湿的情况，那么液体表层内部的分子对于液体表层分子的引力，要大于外部对表层分子的引力，那么表层分子为了溢出所要做的功就更大，就更剧烈，单位时间内对于单位面积的碰撞就更多。凹液面则反之。所以凸液面上方的饱和汽压更大。    \n但是答案如下图。请给我一个解释，这两种回答哪一个存在漏洞，或哪一个更完美[蹲蹲][蹲蹲][蹲蹲]", "images": ["_imgs/img_7ea0c00a74a4.jpg", "_imgs/img_e9d94b97d926.jpg"], "replies": [{"uname": "suhdoshu", "face": "_imgs/face_a46003e5464f.jpg", "like": 0, "message": "容器分子对液体表面分子的吸引力对水分子是否溢出的影响应该不大。主要取决于内部分子对表层分子的引力的绝对大小。凹凸与否取决于容器分子与液体内部分子的对表层液体分子的引力的相对大小，而这凹与凸正好影响了内部分子对表层分子的引力的绝对大小，因此你的推理过程中认为凸液面水分子溢出所需做的功更大是有问题的，该情况内部水分子对表面水分子作用力更小，应更易脱离，所需做功相对小。", "id": "ep10:298256267601:r0"}]}, {"id": "ep10:303511864672", "module": "thermal", "auto": false, "uname": "魔小喵说不妙啊", "face": "_imgs/face_553151d39664.jpg", "like": 0, "message": "能问一个比较无脑的问题吗🐶网上如果有答案麻烦好心传送一下，没空也可以不管😂\n它是初中问题，但高中化学偶尔也考\n大锅套小锅，锅内都装水，大锅不烧干，小锅内水就不能沸腾\n书上说是因为环境温度不能高于沸点让它吸热达到沸点，在家实验也发现它是真的\n但是想不明白，都是水，只隔了一层能导热的材料，怎么就不一样了？\n如果假设材料可以让热量传送不损失，小锅的水就可以沸腾吗？", "raw_message": "能问一个比较无脑的问题吗[doge]网上如果有答案麻烦好心传送一下，没空也可以不管[笑哭]\n它是初中问题，但高中化学偶尔也考\n大锅套小锅，锅内都装水，大锅不烧干，小锅内水就不能沸腾\n书上说是因为环境温度不能高于沸点让它吸热达到沸点，在家实验也发现它是真的\n但是想不明白，都是水，只隔了一层能导热的材料，怎么就不一样了？\n如果假设材料可以让热量传送不损失，小锅的水就可以沸腾吗？", "images": [], "replies": []}, {"id": "ep10:302563453536", "module": "thermal", "auto": false, "uname": "铜色帽子", "face": "_imgs/face_8112ea955721.jpg", "like": 0, "message": "大家好，在学习分子内能的相关内容中 我有一个困惑，：“为什么内能一定是大于零的？”课文中提到分子内能等于分子势能和分子总动能相加，假如分子势能是负的。且它的绝对值等于分子总动能，那它们俩相加不就是零了吗？", "raw_message": "大家好，在学习分子内能的相关内容中 我有一个困惑，：“为什么内能一定是大于零的？”课文中提到分子内能等于分子势能和分子总动能相加，假如分子势能是负的。且它的绝对值等于分子总动能，那它们俩相加不就是零了吗？", "images": [], "replies": [{"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "(我问了ai)首先内能是否为零取决于你选择的参考点。因为内能和势能一样，没有绝对的大小。其次对于你说的情况说理论可行，但实际上不稳定🐶", "id": "ep10:302563453536:r0"}]}, {"id": "ep10:298417763425", "module": "thermal", "auto": false, "uname": "空下去", "face": "_imgs/face_4537839cb640.jpg", "like": 0, "message": "分享一个很吊诡的问题：\n题目中说求升到什么温度时，<span class=\"math\">\\(a\\)<\/span>全部流出，而“答案”中设流出后“还剩”<span class=\"math\">\\(x\\,\\text{cm}\\)<\/span>水银柱，当<span class=\"math\">\\(x=7.5\\,\\text{m}\\)<\/span>时<span class=\"math\">\\(T_{2}\\)<\/span>取最值，我就想问了，你<span class=\"math\">\\(x=7.5\\,\\text{cm}\\)<\/span>取温度最值，你这不是还没流干净，还剩<span class=\"math\">\\(7.5\\,\\text{cm}\\)<\/span>吗🦊\n我的想法是：水银柱一定，A气体最初状态确定，当温度上升到把水银柱顶出去去只剩无限薄的一层时看成恰好完全顶出，此时对无限薄的水银柱：<span class=\"math\">\\(P_{0}=P_A'\n\\)<\/span>对气体A，变温前后：<span class=\"math\">\\(P_A·\\frac{LS}{T1} = P_A'·(2h+\\frac{L)S}{Tm} \\)<\/span>求得<span class=\"math\">\\(T\\)<\/span>的最小值<span class=\"math\">\\(T_m=436.25K\n\\)<\/span>但是！！！这个物理图像只看到了结果：PA'可以把无限小薄的水银膜托起，而没有注意到这个过程中，PA'仅仅是<span class=\"math\">\\(P_{0}\\)<\/span>是无法将没有溢出时的水银柱托起的！！！\n从这两个角度来看压强因该是经历了一个先变大再变小的过程\n\n第一个对于剩下<span class=\"math\">\\(x\\,\\text{cm}\\)<\/span>该怎么理解呢？", "raw_message": "分享一个很吊诡的问题：\n题目中说求升到什么温度时，a全部流出，而“答案”中设流出后“还剩”xcm水银柱，当x=7.5m时T2取最值，我就想问了，你x=7.5cm取温度最值，你这不是还没流干净，还剩7.5cm吗[藏狐]\n我的想法是：水银柱一定，A气体最初状态确定，当温度上升到把水银柱顶出去去只剩无限薄的一层时看成恰好完全顶出，此时对无限薄的水银柱：P0=PA‘\n对气体A，变温前后：PA·LS/T1 = PA‘·（2h+L）S/Tm 求得T的最小值Tm=436.25K\n但是！！！这个物理图像只看到了结果：PA’可以把无限小薄的水银膜托起，而没有注意到这个过程中，PA'仅仅是P0是无法将没有溢出时的水银柱托起的！！！\n从这两个角度来看压强因该是经历了一个先变大再变小的过程\n\n第一个对于剩下xcm该怎么理解呢？", "images": ["_imgs/img_7bba6d3d6b47.jpg", "_imgs/img_afb3bdd47781.jpg"], "replies": [{"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "那<span class=\"math\">\\(7.5\\,\\text{cm}\\)<\/span>你自己会跑出去，因为墙壁内部的压强大到可以绝热膨胀将所有的水银顶出去", "id": "ep10:298417763425:r0"}]}, {"id": "ep10:301178872864", "module": "thermal", "auto": false, "uname": "清子木", "face": "_imgs/face_f72612000747.jpg", "like": 0, "message": "一个浅浅的小问题。\n一个水槽中插了两根粗细相同的玻璃管，一根是直的，一根是弯的，其中直的那个玻璃管的液面高于弯管的拐弯处。\n问题：\n受力分析，判断弯管的水柱会不会流出来？\n如果不会，但我让向下弯的这一节足够长的话，会不会流下来？\n\n弯管处向下拐弯的那一节水柱的受力是怎样的？重力，大气压力，还有向上的表面张力吧\n现在怎么判断这个合力是朝哪里的？感觉是向上的。这个张莉和大气压力可以把重力平衡掉，那这一段水就不会流下来了。那如果重力大呢，就是这一段水柱特别特别长呢……有没有可能水就流下来了？ \n还是说水流下来的条件是毛细现象，这个直管。里的水超出了承受范围 ，和弯管向下弯的长度无关？", "raw_message": "一个浅浅的小问题。\n一个水槽中插了两根粗细相同的玻璃管，一根是直的，一根是弯的，其中直的那个玻璃管的液面高于弯管的拐弯处。\n问题：\n受力分析，判断弯管的水柱会不会流出来？\n如果不会，但我让向下弯的这一节足够长的话，会不会流下来？\n\n弯管处向下拐弯的那一节水柱的受力是怎样的？重力，大气压力，还有向上的表面张力吧\n现在怎么判断这个合力是朝哪里的？感觉是向上的。这个张莉和大气压力可以把重力平衡掉，那这一段水就不会流下来了。那如果重力大呢，就是这一段水柱特别特别长呢……有没有可能水就流下来了？ \n还是说水流下来的条件是毛细现象，这个直管。里的水超出了承受范围 ，和弯管向下弯的长度无关？", "images": ["_imgs/img_62837f4186f9.jpg"], "replies": [{"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "绝对会,自由面受力不平衡", "id": "ep10:301178872864:r0"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @清子木<\/span> 会不断流出,当你的压强不足以平衡的时候,水一定会有速度,自由面处所有的受力朝下，因此水一定会流出", "id": "ep10:301178872864:r1"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @清子木<\/span> 毛细现象的本质原因是因为表面张力起显著作用，而液体不得不利用自身的重力和表面张力平衡，最直观的体现就是在毛细管内部升高了一段水柱\n\n假如原本毛细血管中液体能升高到<span class=\"math\">\\(H\\)<\/span>，如果你在<span class=\"math\">\\(H\\)<\/span>以下的某个高度<span class=\"math\">\\(h\\)<\/span>变成了<span class=\"math\">\\(U\\)<\/span>型弯道，这个时候重力就不起显著的作用了，而在<span class=\"math\">\\(u\\)<\/span>型管的另外一个开口，这个时候因为重力向下，表面张力的方向也向下，水就一定会流出，因此理论上向下弯的管有多长都行，但前提是不能深入液面以下，不然的话你就要考虑<span class=\"math\">\\(pV=\\text{constant}\\)<\/span>这种情况", "id": "ep10:301178872864:r2"}]}, {"id": "ep10:298417533793", "module": "math", "auto": false, "uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 6, "message": "今天问一道数学题好了。\n这是我在葛军老师的视频中看到的一道题，题目下面是我给出的关键一步，但我没给任何解释。\n所以我的问题是：请用咕咕教授在运动学中教你的思考方式，将这一步背后的动机补充完整。(无参考答案，无标准答案。也可以不用咕咕教授教你的。欢迎畅所欲言。)(禁止出现“注意到”，“显然”这类回答)", "raw_message": "今天问一道数学题好了。\n这是我在葛军老师的视频中看到的一道题，题目下面是我给出的关键一步，但我没给任何解释。\n所以我的问题是：请用咕咕教授在运动学中教你的思考方式，将这一步背后的动机补充完整。（无参考答案，无标准答案。也可以不用咕咕教授教你的。欢迎畅所欲言。）（禁止出现“注意到”，“显然”这类回答）", "images": ["_imgs/img_b3640967d078.jpg"], "replies": [{"uname": "_moooom_", "face": "_imgs/face_f44efd6d906c.jpg", "like": 7, "message": "可以从阳哥的思路上想 ab两个自由度 一个牵制 要求一个定值 那么只有两种情况 一种是不变量 此时原式一定可以充要替换成<span class=\"math\">\\(a-b=c(\\)<\/span>定值)\n但尝试后发现不能 于是只可能是临界问题 一个方程消去多个自由度(比如<span class=\"math\">\\(x^2+y^2+z^2=0 \\)<\/span>一个式子减三个自由度)这时候关键就在于范围 有了明确目的 要研究范围 那么很容易就可以发现这一情况", "id": "ep10:298417533793:r0"}, {"uname": "有名等", "face": "_imgs/face_34af0e20d8c9.jpg", "like": 6, "message": "其实原因是<span class=\"math\">\\(\\sin A\\)<\/span>，<span class=\"math\">\\(\\sin B\\)<\/span>都大于他们的积，也就是说他们既要小于1，又不能乘使得自己变小，所以就等于零了，明白这个之后，就一定会知道只要一边消去1个元，无论通过相减相除一定可以由下界得到答案", "id": "ep10:298417533793:r1"}, {"uname": "Tanga_Ibuki", "face": "_imgs/face_fd8b67741918.jpg", "like": 0, "message": "三角函数的值域限定了这个等式很难成立，可以用小数找找感觉，就可以发现sinA,sinB如果是正数的话左边会更大，于是猜测<span class=\"math\">\\(sinA=sinB=0\\)<\/span>，有了目标接下来其实怎么做都能做出来吧🤔我用基本不等式都化成乘积运算后就能很容易导出矛盾", "id": "ep10:298417533793:r2"}]}, {"id":
