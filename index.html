th\">\\(a\\)<\/span>反映质量，所以质量也可以忽略是一种本末倒置，我可以问你这样一个问题：是质量决定加速度还是加速度决定质量？如果加速度决定质量，可以想象这个世界会变得很奇怪。", "id": "ep6:297790224560:r0"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 1, "message": "一个物体“只”看它自身时(注意是“只”)算比例问题是可以忽略一直不变的自身物理属性的，但是一旦和外界交互，就要更仔细的考虑物理上的意义。", "id": "ep6:297790224560:r1"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 1, "message": "<span class=\"mention\">回复 @狴犴公然<\/span> 加速度并不能替代力，因为加速度是力作用在物体后反应到物体运动属性上的效应，而力并不能被看作那个被加速/减速物体自身属性", "id": "ep6:297790224560:r2"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 1, "message": "<span class=\"mention\">回复 @狴犴公然<\/span>  我可能理解错你那句话的意思了\n如果简单的回答就是<span class=\"math\">\\(: \nf=ma\\)<\/span>并不是力的定义式\n而是力对于质量为<span class=\"math\">\\(m\\)<\/span>的物体能造成的运动上的影响", "id": "ep6:297790224560:r3"}, {"uname": "槭焰", "face": "_imgs/face_0472628365bc.jpg", "like": 0, "message": "根据牛一，物体在不受外力的情况下总是保持静止或匀速直线运动。当物体的静止或匀速直线运动状态被改变时，<span class=\"math\">\\(a\\)<\/span>就是描述改变的程度，<span class=\"math\">\\(F\\)<\/span>是改变物体运动状态的原因，<span class=\"math\">\\(m\\)<\/span>是用来描述<span class=\"math\">\\(F\\)<\/span>使物体具有<span class=\"math\">\\(a\\)<\/span>的难易程度", "id": "ep6:297790224560:r4"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @狴犴公然<\/span> 我说的时候确实有些不准确，我想表达的意思是：力和质量能一起决定加速度，但实际上并不是加速度决定物体的质量(可以想象一下如果物理世界真的是这样日常生活是否会发生变化)", "id": "ep6:297790224560:r5"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @狴犴公然<\/span> 我说的是从物理上的而非数学上考虑的，但如果你坚持从数学的角度想那我也没办法了😂", "id": "ep6:297790224560:r6"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @狴犴公然<\/span> 数学表达式要看到背后的物理意义，我并没有说数学表达式只是式子", "id": "ep6:297790224560:r7"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "我们是不是学过一个实验方法叫控制变量法？<span class=\"math\">\\(F=ma\\)<\/span>，如果我们让<span class=\"math\">\\(F\\)<\/span>不变，只改变<span class=\"math\">\\(m\\)<\/span>呢？我们在生活中会发现，质量越大的物体，你让他动起来越难，也就是说质量越大，惯性越大，物体的运动状态越难改变。而加速度就是衡量运动状态改变的量，因此<span class=\"math\">\\(F\\)<\/span>一定的情况下，<span class=\"math\">\\(m\\)<\/span>如果越大<span class=\"math\">\\(a\\)<\/span>是会越小的，也就是说<span class=\"math\">\\(m\\)<\/span>对这个式子是有影响的", "id": "ep6:297790224560:r8"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @狴犴公然<\/span> 能不能解释一下动量守恒为什么能替代<span class=\"math\">\\(a\\)<\/span>受<span class=\"math\">\\(m\\)<\/span>的影响？另外，如果说把<span class=\"math\">\\(M\\)<\/span>换掉，那岂不是还有一个量要替代<span class=\"math\">\\(m\\)<\/span>的位置，那不还是一样的？", "id": "ep6:297790224560:r9"}]}, {"id": "ep6:298438114768", "module": "mech", "auto": false, "uname": "玻璃鞋822", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "求助，能不能用讲故事的方式，给我讲讲这里面谁定死了谁？", "raw_message": "求助，能不能用讲故事的方式，给我讲讲这里面谁定死了谁？", "images": ["_imgs/img_b7a29fff52f0.jpg"], "replies": [{"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "我的理解：先换系看上面(球和轨道)(即假象轨道倾斜放置)\n球的轨迹被轨道定死，同时在重力的作用下，球被迫向下运动。可以求出小球速度为<span class=\"math\">\\(v_{1}(\\)<\/span>动能变化量=重力势能能变化量=相对高度*mg)\n\n在考虑上下关系，把上面当一个整体，可以求出上面速度<span class=\"math\">\\(v_{2}\\)<\/span>；\n小球速度——<span class=\"math\">\\(v_{1}+v_{2}\\)<\/span>", "id": "ep6:298438114768:r0"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 0, "message": "这个问题太复杂，三个东西都在动，虽然几个相对速度方向都是定死的，但也有三个自由度了，就是三个独立的相对速度，而守恒律只能给出两个约束(水平动量、能量)，所以光靠守恒定律都不足以确定下来，原则上要仔细去分析过程，也就是分析每个位置上的受力、加速度。估计这个问题是你自己想的。\n另外，你的分析过程有具体的物理错误，你意思应该是想换到轨道参考系里看球，那么要注意轨道本身是有加速度的，所以这个系里看到小球要多受一个惯性力，所以就不能说它在这个系里的动能=重力势能的变化了，在这个系里惯性力对小球做功的。", "id": "ep6:298438114768:r1"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 0, "message": "我好像看走眼了，原来下面的回复不是题主写的。反正题主你先看看我的回答吧，应该前半段也适用于回答你。", "id": "ep6:298438114768:r2"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 0, "message": "自由度的分析：这里三个速度考虑了约束后剩下的自由度数还有3。约束的作用是把自由度从6降到了3(本来每个相对速度有<span class=\"math\">\\(x\\)<\/span>、<span class=\"math\">\\(y\\)<\/span>两个分量的，现在约束导致每个相对速度都只有固定的方向了)。", "id": "ep6:298438114768:r3"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 0, "message": "你要的讲故事、谁定死谁：这就是要看受力。可以先假定斜面有个加速度，它身上的东西应该是完全定死的，因为就是它身上那坨在受正常的力的基础上再各自加一个惯性力。但具体怎么定死还是比较复杂，钻进去看：2和球，圆弧约束比较讨厌，要站到2上去才能看到真的沿圆弧曲线走，所以站到2上看。假使2相对斜面的加速度知道了，那么发现小球相对于2的运动又可定死。但是2相对斜面的加速度应该是确定的，怎么确定的，哦这要去分析小球在2系里的受力，小球给2的反作用力以及2自己收的重力、因斜面在加速而受惯性力一起决定了斜面上看到的2的加速度。所以2相对于斜面的加速度和小球相对于2的加速度是你确定我我确定你的感觉，也就是自洽来确定的(这就是两个方程，小球受力分析一个，2受力分析一个)。而上述这些都是假定斜面的加速度之后才有的。现在不再假定了，斜面的加速度不是人来指定的，是被决定的，怎么决定的呢？哦要回来看斜面的受力，哦是它身上那些东西压它的力决定的。所以这就和刚才2与2身上的小球间的关系一样，斜面和斜面身上的东西也是“你决定我我决定你”的感觉，所以也会有几个方程，分析斜面有一个，分析上面的物体又有一个。所以最终这个故事就不是简单“串行”的类型，而是一种“并行”、“纠缠”的感觉，是大家都在相互约束着被决定下来的，而不是简单的多米诺骨牌式的一环扣一环、“定完A就能定B定完B就能定C”这样的穿行故事。所以列出来的式子也会是方程组，要联合起来一起解出来，而不是逐个解出来。但是即便故事讲不成一条线，我刚才逐个写下方程的过程仍然是顺着因果的梳理写下的。", "id": "ep6:298438114768:r4"}]}, {"id": "ep6:297966550736", "module": "mech", "auto": false, "uname": "J-x3Seven", "face": "_imgs/face_05fe31020cdb.jpg", "like": 1, "message": "问题：为什么无论运动正放和倒放，<span class=\"math\">\\(x\\)<\/span>的表达式中<span class=\"math\">\\(\\frac{1}{2}at^2\\)<\/span>始终为正值呢?\n我的解释：\n1. 表层：时间的叠加累积<span class=\"math\">\\(t^2\\)<\/span>的二次消除了<span class=\"math\">\\(-t\\)<\/span>时间的负号\n2. 本质：<span class=\"math\">\\(a\\)<\/span>的本源来自于<span class=\"math\">\\(F\\)<\/span>，也就是<span class=\"math\">\\(F\\)<\/span>决定<span class=\"math\">\\(a\\)<\/span>，<span class=\"math\">\\(F\\)<\/span>想做的是让物体朝施力方向运动，那么<span class=\"math\">\\(a\\)<\/span>的作用也就和<span class=\"math\">\\(F\\)<\/span>一样，<span class=\"math\">\\(a\\)<\/span>想要让物体朝自己方向运动，所以由于正放倒放的时间反演对称性<span class=\"math\">\\(a\\)<\/span>不变，那<span class=\"math\">\\(\\frac{1}{2}at^2\\)<\/span>即<span class=\"math\">\\(a\\)<\/span>产生的时间累积存量必然也不变\n\n想听听大家对于这个的理解", "raw_message": "问题：为什么无论运动正放和倒放，x的表达式中1\\2at^2始终为正值呢?\n我的解释：\n1. 表层：时间的叠加累积t^2的二次消除了-t时间的负号\n2. 本质：a的本源来自于F，也就是F决定a，F想做的是让物体朝施力方向运动，那么a的作用也就和F一样，a想要让物体朝自己方向运动，所以由于正放倒放的时间反演对称性a不变，那1\\2at^2即a产生的时间累积存量必然也不变\n\n想听听大家对于这个的理解", "images": [], "replies": [{"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 2, "message": "当场抓到没看视频的，我现在这期视频里刚好有讲为什么<span class=\"math\">\\(a\\)<\/span>不变号。", "id": "ep6:297966550736:r0"}, {"uname": "叽里咕噜yyy-zzz", "face": "_imgs/face_cdd7535fe617.jpg", "like": 0, "message": "可以去看看上期对倒放的讨论哦", "id": "ep6:297966550736:r1"}, {"uname": "叽里咕噜yyy-zzz", "face": "_imgs/face_cdd7535fe617.jpg", "like": 0, "message": "<span class=\"mention\">回复 @J-x3Seven<\/span> https://b23.tv/BV1kKXVB3ER7", "id": "ep6:297966550736:r2"}]}, {"id": "ep6:295522159473", "module": "mech", "auto": false, "uname": "立春重度依赖", "face": "_imgs/face_0217362db277.jpg", "like": 1, "message": "这是今天我对两道基础力学题的思考过程，主要讨论了所有不确定性过程以及对自己低级错误的反思，以及想法的更新，想问一下有没有逻辑错误或不严谨之处，或有更简洁的方法，请各位斧正勘误\n看视频感觉自己听懂了，但做起来的确是两码事，还是需要继续思考内化啊", "raw_message": "这是今天我对两道基础力学题的思考过程，主要讨论了所有不确定性过程以及对自己低级错误的反思，以及想法的更新，想问一下有没有逻辑错误或不严谨之处，或有更简洁的方法，请各位斧正勘误\n看视频感觉自己听懂了，但做起来的确是两码事，还是需要继续思考内化啊", "images": ["_imgs/img_1ce876a22be1.jpg", "_imgs/img_175ad681364f.jpg", "_imgs/img_cccb20005b28.jpg", "_imgs/img_80f93ed98eeb.jpg", "_imgs/img_e74eee338a6d.jpg"], "replies": [{"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "第一个题目有点长，我有点懒得看🐶那我说一下第二个吧。你有对情形的感觉挺好的，我因为对一般的做法习惯了，有些时候都丧失了这种感觉，还挺羡慕你的😁。不过我要提醒一下教授一直强调的：感觉之后的分析是逃不掉的，感觉起到的是引导思路的作用，你在感觉了之后一定要老老实实地再分析一下，比如这里就是老老实实地做受力分析", "id": "ep6:295522159473:r0"}]}, {"id": "ep6:295128407457", "module": "energy", "auto": false, "uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 3, "message": "第五周评论区有一个关于倒放运动的问题，由于势能本身给出的能量只与物体的位置有关的特点，这个物理情形经常在势能问题中出现，我自己在学习势能时就有一个疑问，凭什么下图中的(2.16)式中可以用关于位移的积累来描述时间差?万一出现一段往返运动后再继续往前进的物理情形的话，所算出的运动所用时间不就会比实际时间少了吗?(真的会出现一段往返运动后再继续往前进的情况吗?)如果只做了往返运动，关于位移的积累到底算的是一次往返运动所用的时间还是只是一个方向上运动所用的时间呢?", "raw_message": "第五周评论区有一个关于倒放运动的问题，由于势能本身给出的能量只与物体的位置有关的特点，这个物理情形经常在势能问题中出现，我自己在学习势能时就有一个疑问，凭什么下图中的（2.16）式中可以用关于位移的积累来描述时间差?万一出现一段往返运动后再继续往前进的物理情形的话，所算出的运动所用时间不就会比实际时间少了吗?（真的会出现一段往返运动后再继续往前进的情况吗?）如果只做了往返运动，关于位移的积累到底算的是一次往返运动所用的时间还是只是一个方向上运动所用的时间呢?", "images": ["_imgs/img_30b7a8913695.jpg"], "replies": [{"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 2, "message": "看清人家说话的前提：“Providing the velocity in 2.15 has a fixed sign...”🐶 Providing是假如的意思。", "id": "ep6:295128407457:r0"}, {"uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 0, "message": "朗道？", "id": "ep6:295128407457:r1"}, {"uname": "槭焰", "face": "_imgs/face_0472628365bc.jpg", "like": 0, "message": "我没有学习过积分，但我注意到了你说位移的积累。如果是往返运动，位移的积累量难道不就是路程吗，已知路程与速度难道不能求时间吗？根据2.15式我是否能认为在总能量不变的情况下，得知势能或是所在位置就能求得速度。\n若出现了一段往返运动继续往前的情况，是否意味着总能量也变了呢，因为位置“突破”了？\n也许是我对于位移的积累有误解。只是在此做出思考。欢迎指正", "id": "ep6:295128407457:r2"}, {"uname": "Atomphysics", "face": "_imgs/face_19704788688b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @Light_dreamer探索者<\/span> 例如在一个星球内部挖一个圆柱孔洞 物体放在里面视为质点就可以做简谐运动 所以的确可以做往复运动 我觉得你这里是把他这当作一个general的事情了 他只是做了一个比较常见情形的分析而已 看书有点想太多了？", "id": "ep6:295128407457:r3"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @Light_dreamer探索者<\/span> 瞎讲。没这个限定怎么行。这和倒放没关系。就是<span class=\"math\">\\(\\frac{dx}{dt}=v \\)<\/span>，很直接，没什么内容。", "id": "ep6:295128407457:r4"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 0, "message": "我要说几句你听了一定不会太高兴的话。但是我觉得必须要说：\n你这逻辑是怎么回事啊？先粗略说：我不知道为什么别人赞，但是我觉得这本身是个非常非常简单的问题，<span class=\"math\">\\(\\frac{dx}{dt}=v\\)<\/span>仅此而已，初中物理，没有任何花活，你是大学物理系的同学，这页应该秒懂，有那么多疑问已经是不太正常的情况。然后仔细看讨论：我开始是以为你是没看见“假定速度不变”这个限制，或者没看懂英文所以才质疑这个公式，我想那是小问题，大家都有粗心的时候，于是我才来回复了一下，想快速了结没必要的讨论。但是后来我看到你书上明明自己已经圈出了它，还有自己的批注！说明你并不是没看到！我来回想了好久才明白，原来你的想法是，“因为一个运动是可以来回走，所以不应该去'假定'？”是吗？是的话，这什么逻辑啊？人家说的是“假定”诶朋友，又不是“得出结论”，是“如果”这件事情发生了我才有下面这个式子，即便一个往复的运动，我不能取它单向的那一段分析吗？简谐振动，我半个周期半个周期分析，不行吗？正是因为我知道它有来回走的可能，而只有在单向走的一段里才有下面这个式子，所以我才要在写式子前讲清楚，'假定这段是单向走，才有...' 啊。有什么问题吗？包括你后面的追问，再次显示出你这层逻辑的混乱：你自己先说，“可以不要这个限定”，我说你瞎讲，怎么能不要呢？结果你还说“咕咕叫兽是说在一段运动中速度不会一下正一下负吗” 这到底是什么逻辑啊？我再说一遍，难道不应该是：正是因为我知道它有来回的可能，而只有在单向的一段里才有下面这个式子，所以我才要在写式子前注明“限制条件”吗？", "id": "ep6:295128407457:r5"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 0, "message": "还有，后面你还说了什么力啊什么，还有说2.15到2.16怎么推导，天呐这还要推吗？<span class=\"math\">\\(dt=\\frac{dx}{v}\\)<\/span>都写好了在那里了，每一小段时间是多少你都知道了，现在要算总时间，这还有东西可推？这不求合起来(积分)就结束了吗，唯一要小心一点的就是<span class=\"math\">\\(v\\)<\/span>的符号所以他才要多加一句限定。你怎么还要倒退回去把力搞出来才行？这个从物理上、从数学上都说不过去啊。我不知道你的高等数学和大学物理分别都是怎么学的。更不要说你现在看的是理论力学，它和大学物理的一大区别就是完全避免用“力”。至于后面说到的倒放，我更是不知道和这里的问题有何关系。也许你说的是抵达同一位置的时候速度可取正负，正负两种状态间的关系可以看作正放倒放。如果你是这样说的，那我觉得这话本身没问题，但是和这里在讨论的事情又有何关系呢？后面还出现什么“电荷量”(这都哪儿和哪儿啊)，什么“相同位置受力不变的奇妙情形”(这有什么奇的吗？势能是<span class=\"math\">\\(x\\)<\/span>位置唯一确定的，相同位置受力当然是确定的)，反正我都觉得像是在说梦话。\n我觉得你的问题并不是想多了/想少了/基础好不好。我觉得问题是以下三件事：\n1.你的逻辑怎么了？2.你的高等数学和大学物理怎么了？3.醒醒快醒醒", "id": "ep6:295128407457:r6"}]}, {"id": "ep6:295137550465", "module": "energy", "auto": false, "uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 2, "message": "此外，我还有一个问题(这个问题我目前还没有弄明白)：为什么势能定义成关于位移微分得到相应位置力的定义？直觉上来说乍一看可以很快接受，毕竟在势能场中力与位置有关，但是势能是关于位移变化的吗？以及为什么要将势能看作力随位移的积累？能量不可以是断点(不连续的)吗？能量可以是不连续的，还是说是我没把能量和势能区分开？可是势能又不是由力决定的，它只与位置有关应该也可以是不连续的啊，但是这样还能看出力吗？感觉我的推导里面有的地方是矛盾的", "raw_message": "此外，我还有一个问题（这个问题我目前还没有弄明白）：为什么势能定义成关于位移微分得到相应位置力的定义？直觉上来说乍一看可以很快接受，毕竟在势能场中力与位置有关，但是势能是关于位移变化的吗？以及为什么要将势能看作力随位移的积累？能量不可以是断点（不连续的）吗？能量可以是不连续的，还是说是我没把能量和势能区分开？可是势能又不是由力决定的，它只与位置有关应该也可以是不连续的啊，但是这样还能看出力吗？感觉我的推导里面有的地方是矛盾的", "images": [], "replies": [{"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 2, "message": "你的问题在于，你这几句话在完全不同问题间切来切去，说明你其实不知道自己问题在哪里。后面说到连续不连续，那又是另一回事了，但也是没什么可惊奇的事：一张很硬的桌子，你看成很硬很硬的弹簧好了，现在你描述桌上一个物块的势能。重力势能这些我们就不讲了，桌面的存在也可以用势能描写吧？那写出来是不是就是一个很陡很陡的抛物线势能，在无限陡的时候是不是就是趋近于不连续了？刚体的墙，那就是势能的突变，突然上一个台阶，没什么问题吧？你要问弹力，那就是势能的导数。刚性的墙的弹力是多少，这你也知道肯定不能去拿着刚性的极限傻傻的求导，导数都不存在，物理上看就是因为物体陷入墙里的深度很小，在无穷硬时，你说不清楚到底压到了多深。应该做的事情是回到弹性的模型力(就是硬度<span class=\"math\">\\(k\\)<\/span>很大的弹簧)去看，那就没什么奇异的地方了，压进去多大的力，就会陷入相应的深度，墙的弹力和压力平衡。", "id": "ep6:295137550465:r0"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "能量与力有关，势能是能量，势能与力有关；\n势能场中力与位置有关，力关于位移变化，所以势能关于位移变化；\n能量是守恒的，某个能量的变化是连续的，不存在能量的凭空消失；\n位置变化可以不连续吗？这好像只有科幻小说做得到。", "id": "ep6:295137550465:r1"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 1, "message": "不明白问题在哪里。“为什么势能定义成关于位移的微分得到相应位置力的定义”这个说法很绕，你其实就是在说，“为什么势能定义为力对位移的积分”，可是这又有什么惊奇的呢？难道不是从学mgh就是这么说的吗？你要问为什么这么定义，那就是说它守恒，就是因为它在某类过程里守恒所以我定义的它。为什么定义动量？就是因为它在某一类过程里守恒所以我定义一下方便。类似的问题我看到咕咕在历来各种回复里少说也解释了有十次了🐶怎么回事。", "id": "ep6:295137550465:r2"}]}, {"id": "ep6:295693443697", "module": "energy", "auto": false, "uname": "叙事背叛体验", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "势能如何准确定义？弹簧的弹性势能减小，会使接触的物块动能增大。人的重力势能减小，使自身的动能增大。这两个过程看着完全不同。势能应是系统中的能量，那为什么弹簧单个物体会有弹性势能。", "raw_message": "势能如何准确定义？弹簧的弹性势能减小，会使接触的物块动能增大。人的重力势能减小，使自身的动能增大。这两个过程看着完全不同。势能应是系统中的能量，那为什么弹簧单个物体会有弹性势能。", "images": [], "replies": [{"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 1, "message": "你提的问题很好，这两个情况看上去确实很不一样。这并不是你的问题，而是有些东西学校没教到。\n\n不知道你学重力势能的时候有没有这个疑惑：在一般的情况下，有力做负功是不是要把能量从一个物体抽走？那在这里能量也理应是从物体中被抽走了。确实，动能减小了。但是仔细一想：不对呀，动能减小了，但重力势能不是增加了吗？物体的总能量不是不变吗？其实在大学的场论中，我们引入“场”的概念，认为重力势能是“场”所有的。这样一来物体减小的能量就被转移到“场”里面，就符合力对物体做负功能量从物体中被抽走的一般规律了。\n\n弹性势能也是一样的，它实际上是弹簧所具有的。如果物体往里压缩弹簧，弹力做负功，动能被从物体里抽走。抽到哪里去了呢？抽到弹簧里去了，变成了弹簧的弹性势能。\n\n如此看来，两种情况是不是差不多呢？", "id": "ep6:295693443697:r0"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "在这种观点下势能就不是系统所共有的能量了。我认为实际上用高中的观点来看，弹性势能也应该是弹簧的能量才对。", "id": "ep6:295693443697:r1"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "你可以去看看上上期视频里我在评论区提的问题，也是能量有关，up主作了详细的答复，非常建议你去看，翻到最底下", "id": "ep6:295693443697:r2"}]}, {"id": "ep6:297794106720", "module": "energy", "auto": false, "uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "可以用能量守恒去求竖直方向的速度，再由其求出<span class=\"math\">\\(t\\)<\/span>，通过<span class=\"math\">\\(t\\)<\/span>求出水平方向的速度，勾股定理即可", "raw_message": "可以用能量守恒去求竖直方向的速度，再由其求出t，通过t求出水平方向的速度，勾股定理即可", "images": [], "replies": []}, {"id": "ep6:295378401233", "module": "energy", "auto": false, "uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 0, "message": "能量守恒是普适的，就这道题而言，如何自然地想到从功能关系入手，我的第一想法是分析受力看运动，重力和水平恒力已知，唯一在变的就是绳子拉力在这里转动，唯一的约束就是绳子不能伸长，但可以缩短。但是在这个题里，可以清楚的知道<span class=\"math\">\\(a\\)<\/span>到c这个阶段绳子都是处于将要伸长，但是绳子一直拉着他不让他伸，也就是他在竖直面内做一个圆周运动", "raw_message": "能量守恒是普适的，就这道题而言，如何自然地想到从功能关系入手，我的第一想法是分析受力看运动，重力和水平恒力已知，唯一在变的就是绳子拉力在这里转动，唯一的约束就是绳子不能伸长，但可以缩短。但是在这个题里，可以清楚的知道a到c这个阶段绳子都是处于将要伸长，但是绳子一直拉着他不让他伸，也就是他在竖直面内做一个圆周运动", "images": ["_imgs/img_fb4194fec7c9.jpg"], "replies": [{"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "为什么这道题一定要用能量守恒呢？我的第一想法也是分析受力，因为重力和水平上力都是恒定的，那么我就不妨把这两个力合成了，去减少讨论。", "id": "ep6:295378401233:r0"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "然后根据几何关系 可以知道合力与水平上的倾角为<span class=\"math\">\\(90^\\circ -\\Theta \\)<\/span>那么我就知道了在合力方向与绳子方向相同时速度最大，此时与竖直倾角为<span class=\"math\">\\(\\Theta \\)<\/span>也就是应该是b点速度最大，而因为绳子长度不变，所以绳子上的力最小也要等于合力，又因为我知道<span class=\"math\">\\(f\\)<\/span>向等于<span class=\"math\">\\(mv^2\\)<\/span>比r 所以我知道了，此时的<span class=\"math\">\\(f\\)<\/span>向不为0也就是有向心加速度所以b错误", "id": "ep6:295378401233:r1"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "又根据绳子长度不变所以我知道只有在垂直与绳子的合力的分力才能提供所谓的加速或者减速，又由对称性所以我知道ac两点速度相同，所以c正确", "id": "ep6:295378401233:r2"}]}, {"id": "ep6:295498545265", "module": "energy", "auto": false, "uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 0, "message": "这是一个斜抛运动。因为它会脱离管道从力学方面分析，可以知道完全由重力的分力提供向心力。从运动学角度去分析，它恰好能掉落到圆心的位置。我就想到了上次做武汉三调的选择题的时候，我在上次问过大家的，可以通过斜交分解进行简化运算。我在这里我就想用斜交分解。我明确的感知到有三个未知数，两个方程。说明我选择斜交分解一定是遗漏了什么信息，我是漏了什么信息呢？", "raw_message": "这是一个斜抛运动。因为它会脱离管道从力学方面分析，可以知道完全由重力的分力提供向心力。从运动学角度去分析，它恰好能掉落到圆心的位置。我就想到了上次做武汉三调的选择题的时候，我在上次问过大家的，可以通过斜交分解进行简化运算。我在这里我就想用斜交分解。我明确的感知到有三个未知数，两个方程。说明我选择斜交分解一定是遗漏了什么信息，我是漏了什么信息呢？", "images": ["_imgs/img_266f06e1b9ee.jpg"], "replies": [{"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "三个方程分别是<span class=\"math\">\\(mg\\,\\,\\sin  =mv^2\\div r\\)<\/span>，<span class=\"math\">\\(\\frac{1}{2}g\\,\\,\\sin  t^2\\)<\/span>等于<span class=\"math\">\\(r\\)<\/span>，还有一个垂直的方程<span class=\"math\">\\(v=gcos\\frac{1}{2}t(\\)<\/span>这里用了对称)自查一下哪个方程忘写了吧", "id": "ep6:295498545265:r0"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "其实对于斜交分解与正交分解我认为其实都是一个东西，都是在两个互相垂直的面上分析运动，只不过是在有些时候斜交分解时更容易分析罢了", "id": "ep6:295498545265:r1"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @h0122erodb<\/span> 这个就是斜交分解的方程啊😂", "id": "ep6:295498545265:r2"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @h0122erodb<\/span> 沿它离开的那个点与圆心的连线为<span class=\"math\">\\(x\\)<\/span>轴，垂直方向为<span class=\"math\">\\(y\\)<\/span>", "id": "ep6:295498545265:r3"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @h0122erodb<\/span> 你可以再仔细看看我写的方程，并没有<span class=\"math\">\\(g\\)<\/span>而是<span class=\"math\">\\(g\\sin \\)<\/span>与<span class=\"math\">\\(g\\cos \\)<\/span>这不能看出是斜交分解吗😂", "id": "ep6:295498545265:r4"}, {"uname": "物你学家", "face": "_imgs/face_a2beefec54a5.jpg", "like": 0, "message": "<span class=\"mention\">回复 @h0122erodb<\/span> 无论是用你说的这种斜交分解，还是另一位同学说的分解方法，甚至直接用沿水平竖直的分解，都是在处理一个二维的运动，所以运动学上一定有两个方程，再加上一个动力学方程，3个方程3个未知数，是一定可以做出来的。我看了你试卷上的笔迹，你只用到了勾股定理，而实际上那个三角形中还有一个角度是<span class=\"math\">\\(\\theta \\)<\/span>，这一点你没有用，所以漏掉了一个方程。顺便，这道题用斜交分解是计算最简便的", "id": "ep6:295498545265:r5"}, {"uname": "双手托腮一直发呆", "face": "_imgs/face_009cae2bcac8.jpg", "like": 0, "message": "延斜面和垂直斜面分解运动就可以了，另外注意一个条件，就是延斜面位移为<span class=\"math\">\\(r\\)<\/span>", "id": "ep6:295498545265:r6"}]}, {"id": "ep6:295236420721", "module": "momentum", "auto": false, "uname": "玻璃鞋821", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 7, "message": "问题：动量定理为什么一般只要列一个方向就可以充分刻画物理过程？\n1接下来我想分享一下我对物理的看法，我觉得列式子主要就是刻画延展量守恒(比如说位移，几何关系，电荷量守恒)和确定物理过程(能量守恒与动量守恒，以及速度关联)，我将速度关联视为“消去接触”，就是两个接触的物体就要去整体考虑，然后通过列速度关联消掉这个接触，我感觉这样刻画信息是极其充分的。\n2当然，我认为我这样子做题有收集方程的嫌疑，我现在就很想知道，就像我的问题一样，为什么我进行某些刻画之后，我就可以确定我的限制没有任何遗漏，就是那种自信，我对着题目列完式子，不去利用自由度个数检验，我就能知道，如果我解不出来那这个题就出错了", "raw_message": "问题：动量定理为什么一般只要列一个方向就可以充分刻画物理过程？\n1接下来我想分享一下我对物理的看法，我觉得列式子主要就是刻画延展量守恒（比如说位移，几何关系，电荷量守恒）和确定物理过程（能量守恒与动量守恒，以及速度关联），我将速度关联视为“消去接触”，就是两个接触的物体就要去整体考虑，然后通过列速度关联消掉这个接触，我感觉这样刻画信息是极其充分的。\n2当然，我认为我这样子做题有收集方程的嫌疑，我现在就很想知道，就像我的问题一样，为什么我进行某些刻画之后，我就可以确定我的限制没有任何遗漏，就是那种自信，我对着题目列完式子，不去利用自由度个数检验，我就能知道，如果我解不出来那这个题就出错了", "images": [], "replies": [{"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 2, "message": "你的问题是不错的，至少我大概能看懂，比如这句“我将速度关联视为“消去接触”，就是两个接触的物体就要去整体考虑，然后通过列速度关联消掉这个接触，我感觉这样刻画信息是极其充分的。” 我猜你大概是在表达，关联就是说几个东西之间有种绑定的感觉，效果就是“一个约束减小一个自由度”，然后基于这些感觉你通常就可以更清楚到底还有什么信息是缺的了，比如两个物体，关联了，速度之间的关系完全锁死了，那么剩下就差一个“总的”的信息要定出来，那么就想到从比如总能量来定出来。这都是很对的。有个错要指出：没有说动量定理只要列一个方向。你碰到的问题列一个方向那是因为哪一个方向上已经把运动确定死了。你看这期视频里主播刚好讲到了相关的事情，他举了二维平面里碰撞的例子，那不单需要两个方向的动量守恒，还需要更多的信息。另外有个小错：“延展量”这个词好像用的不太对，不是指这个意思。\n你说的第二点，也是很好的反思。确实，“找方程”是会造成不必要的混乱的。但它也是我们的兜底，有些问题它的逻辑就是几条线并行的，那么感受可能会承载不了，不得已的时候可能会去要看看自由度。只不过对于其实是有一串简单逻辑(因果、关联)的问题如果还要去数方程，那就很被动了，这就是我说的“不必要的麻烦”。这种时候就要用你平常训练的感觉，就是你在第一点里说的那种，“什么和什么是锁死的，我可以看作谁在牵动谁”，你平时这样去说成人话，是可以梳理清楚整个问题的确定性的逻辑的(“因果”、“主动被动”等等)。如果你都梳理清了这个故事的确定性关系的链条，那么写出方程就是顺手的事了，你已经感觉的很清楚它通过你想的这么几件事情定死了，那就肯定能求解了，不会再去盲目的找“还有没有方程没写上去”了。", "id": "ep6:295236420721:r0"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "wow!你的问题令我惊叹！——可惜我没看懂。\n\n1.我的理解：动量是刻画物体运动的一个工具<span class=\"math\">\\((p=mv,\\)<\/span>有两个重要的物理量:m改变物体运动状态的难易程度(我的浅显理解，相对<span class=\"math\">\\(f\\)<\/span>来言)，<span class=\"math\">\\(v\\)<\/span>直接描写物体运动状态)\n\n动量守恒是物体动量交换中守恒(我认为只要认可牛三，就可以理解这是守恒的<span class=\"math\">\\()\nf=f(\\)<\/span>牛三<span class=\"math\">\\();\\frac{f}{t}=\\frac{f}{t};\n\\)<\/span>由<span class=\"math\">\\(f=ma=\\frac{m(dv}{t})=\\frac{p}{t}\\)<\/span>得<span class=\"math\">\\( \\frac{f}{t}=p;\n\\)<\/span>故<span class=\"math\">\\(p=p;2\\)<\/span>。希望讲解：\n什么是刻画延展量守恒和确定物理过程？如何刻画延展量守恒和确定物理过程？\n什么是自由度？进行哪些刻画？\n\n[给心心][给心心][给心心]谢谢！！！", "id": "ep6:295236420721:r1"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "[鼓掌][鼓掌][鼓掌][保佑][保佑][保佑]", "id": "ep6:295236420721:r2"}, {"uname": "玻璃鞋822", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @xyz179<\/span> 谢谢你喵，那么我现在抛出一个现实的问题，你能不能来帮我看一下？事先说明，我不确定我给的调件是否充足。\n(你说的那个延展量，这个词确实是我乱找的啦，我承认错误，我只是觉得，把几何关系，位移关系，电荷量守恒等等诸多东西放到一个框架里，把她命名成延展量似乎很合适)", "id": "ep6:295236420721:r3"}, {"uname": "Atomphysics", "face": "_imgs/face_19704788688b.jpg", "like": 0, "message": "用了一些似是而非的名词 描述不太清楚 其次是动量定理在多个方向的使用也非常常见 感觉不是很懂这个问题在说什么", "id": "ep6:295236420721:r4"}]}, {"id": "ep6:295373395649", "module": "momentum", "auto": false, "uname": "入地上天", "face": "_imgs/face_8ecac10d7e8e.jpg", "like": 4, "message": "1.关于牛顿摆的问题，我们想象在一个光滑的水平面上，放置了三个一模一样的物块，碰撞都是弹性的，其中，物块A放在左边，物块BC紧挨着放在右边，此时给物块A一个速度撞向BC，此时我们都会分析说，<span class=\"math\">\\(a\\)<\/span>与b发生速度交换，然后b与c又发生速度交换，结果就是AB都停止了c飞出去了。那么，为什么不能这样分析？将BC看成一个整体，<span class=\"math\">\\(a\\)<\/span>与这个BC整体发生弹性碰撞，这样的话是b和c一起飞出去和<span class=\"math\">\\(a\\)<\/span>又反弹回来，这样分析在能量动量上面也是合理的，其中肯定有某个条件，我没有注意到限制了这个情况的发生是什么呢？\n2.关于功，能量和力的问题。我们想象一个人穿着喷气背包，假如说此时他静止在空中，那么，此时喷气背包有个升力，这个人的重力势能没有变化。假设这个人初始时有一个速度，此时匀速上升，那么，这个人的重力势能就会匀速提高。两种情况，喷气背包给的力都是一样的，然而一个情况，人的重力势能不变，一个情况，人的重力势能变了，喷气背包向外散热的热量也是一样的，那么能量去哪了呢？这与我们沿着斜坡奔跑，与在斜着的跑步机上奔跑，有异曲同工之妙。我稍微想明白了一点，在静止时，我们缺少的那一部分重力势能的增量给了空气，也就是说，空气速度变大了，然而，在飞起来的时候，空气本来就有一个速度，但是我们实际上让它的速度减小了，我们分析的系统本来就只有这两个物体，人与空气，那么人的重力势能没有减小，那么问题就肯定出现在空气了。我又想象了一个场景，是两个轮子夹着一根绳子(一个电动小车爬绳子)，然后往上攀爬，刚开始也是静止在绳子上，第二个情况就是匀速向上攀爬，而这个情况，我们发现在静止的时候，只有电路的耗散热量，而上升的时候，整个电路消耗的能量更大了，因为除了相同的电路耗散热量，还有因为电机转动带来反电动势，从中消耗的能量对应着这个小车的重力势能提高，仔细一想，这种情况与上一种情况确实有所不同。我最开始的疑惑是，观察整个人的状态以及力的状态都是一样的，为什么有时候力会做功，能量会增大，有时候力不做功，能量不增大，而他却与一个物体的初始状态有关，当然，这个问题看起来确实很幼稚，但好像稍微有一些眉目了。", "raw_message": "1.关于牛顿摆的问题，我们想象在一个光滑的水平面上，放置了三个一模一样的物块，碰撞都是弹性的，其中，物块A放在左边，物块BC紧挨着放在右边，此时给物块A一个速度撞向BC，此时我们都会分析说，a与b发生速度交换，然后b与c又发生速度交换，结果就是AB都停止了c飞出去了。那么，为什么不能这样分析？将BC看成一个整体，a与这个BC整体发生弹性碰撞，这样的话是b和c一起飞出去和a又反弹回来，这样分析在能量动量上面也是合理的，其中肯定有某个条件，我没有注意到限制了这个情况的发生是什么呢？\n2.关于功，能量和力的问题。我们想象一个人穿着喷气背包，假如说此时他静止在空中，那么，此时喷气背包有个升力，这个人的重力势能没有变化。假设这个人初始时有一个速度，此时匀速上升，那么，这个人的重力势能就会匀速提高。两种情况，喷气背包给的力都是一样的，然而一个情况，人的重力势能不变，一个情况，人的重力势能变了，喷气背包向外散热的热量也是一样的，那么能量去哪了呢？这与我们沿着斜坡奔跑，与在斜着的跑步机上奔跑，有异曲同工之妙。我稍微想明白了一点，在静止时，我们缺少的那一部分重力势能的增量给了空气，也就是说，空气速度变大了，然而，在飞起来的时候，空气本来就有一个速度，但是我们实际上让它的速度减小了，我们分析的系统本来就只有这两个物体，人与空气，那么人的重力势能没有减小，那么问题就肯定出现在空气了。我又想象了一个场景，是两个轮子夹着一根绳子（一个电动小车爬绳子），然后往上攀爬，刚开始也是静止在绳子上，第二个情况就是匀速向上攀爬，而这个情况，我们发现在静止的时候，只有电路的耗散热量，而上升的时候，整个电路消耗的能量更大了，因为除了相同的电路耗散热量，还有因为电机转动带来反电动势，从中消耗的能量对应着这个小车的重力势能提高，仔细一想，这种情况与上一种情况确实有所不同。我最开始的疑惑是，观察整个人的状态以及力的状态都是一样的，为什么有时候力会做功，能量会增大，有时候力不做功，能量不增大，而他却与一个物体的初始状态有关，当然，这个问题看起来确实很幼稚，但好像稍微有一些眉目了。", "images": [], "replies": [{"uname": "物你学家", "face": "_imgs/face_a2beefec54a5.jpg", "like": 0, "message": "这两个问题都很棒！！为了确保我正确理解了你的问题，想问下问题1你为什么觉得BC可以看作一个整体呢？", "id": "ep6:295373395649:r0"}, {"uname": "老姑家的咕咕鸡", "face": "_imgs/face_ff176075dea5.jpg", "like": 0, "message": "关于第一个问题，B受到A给的<span class=\"math\">\\(N\\)<\/span>而撞击C，BC间因此产生相反的一对<span class=\"math\">\\(N\\)<\/span>，所以AC受力等大相反，B两边抵消，BC加速度都不同，不能当做整体，等效整体的前提是：系统内各物体相对静止(无相对运动)，具有相同的加速度。", "id": "ep6:295373395649:r1"}, {"uname": "老姑家的咕咕鸡", "face": "_imgs/face_ff176075dea5.jpg", "like": 0, "message": "当然最准确应该是说A减速，B先加后减，C加速", "id": "ep6:295373395649:r2"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "如果从做功的角度来看，我个人认为第二个问题是比较容易的。两种情况的差别就在于一个有初速度一个没有初速度有初速度的那个会产生位移，所以力会做功，力会做功就伴随着能量的转化。不过我觉得你应该是别的地方有疑问。你能详细说一下你的疑问在哪里吗？", "id": "ep6:295373395649:r3"}]}, {"id": "ep6:295145541361", "module": "vibration", "auto": false, "uname": "槭焰", "face": "_imgs/face_0472628365bc.jpg", "like": 4, "message": "这是咕咕叫兽往期视频里的一个。先谈谈我的看法：物块所受的的力永远指向平衡位置的方向，无论物块受到被施加了速度或力。在受到弹性限度和在水平面上运动的约束下，永远不影响其所受合外力指向平衡位置。这样一来，物块的移动只是被各种因素叠加的结果\n那么这里面的<span class=\"math\">\\(\\frac{V0}{w}\\)<\/span>所代表的是什么呢，本人数学功底不好，希望各位大佬给予点拨", "raw_message": "这是咕咕叫兽往期视频里的一个。先谈谈我的看法：物块所受的的力永远指向平衡位置的方向，无论物块受到被施加了速度或力。在受到弹性限度和在水平面上运动的约束下，永远不影响其所受合外力指向平衡位置。这样一来，物块的移动只是被各种因素叠加的结果\n那么这里面的V0/w所代表的是什么呢，本人数学功底不好，希望各位大佬给予点拨", "images": ["_imgs/img_af6e57f2c2e2.jpg"], "replies": [{"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 2, "message": "我觉得你对于叠加的解释有问题，如果力是正比于位移的平方，那就没法直接叠加了。<span class=\"math\">\\( \\frac{v}{w}\\)<\/span>，从量纲来看的话就是，就是转过一个微小弧度，能转化出来的位移是多少，这个比值就是转化率。从弧度制的定义来看的话，这个比值就是圆的半径，从简谐振动和圆周运动的关系来看，圆的半径就是简谐振动的振幅，所以这个比值就是振幅。(注：弧度制可以去看看数学教材必修一三角函数那一章节)", "id": "ep6:295145541361:r0"}]}, {"id": "ep6:295200707921", "module": "vibration", "auto": false, "uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 1, "message": "依旧简谐运动🐶", "raw_message": "依旧简谐运动[doge]", "images": ["_imgs/img_d3c483522549.jpg"], "replies": [{"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 2, "message": "好经典的题呀，我听老师讲过，C选项非常反直觉，他做的竟然真是一条直线", "id": "ep6:295200707921:r0"}, {"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 2, "message": "我们老师管这个叫做\n弹簧投影加简谐运动加矢量合成，好像吧，让我回去复习一下，明天来分享", "id": "ep6:295200707921:r1"}, {"uname": "玻璃鞋821", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "湖南四大名校月考题？", "id": "ep6:295200707921:r2"}, {"uname": "皮卡丘--------丘", "face": "_imgs/face_9b7d8d4e7f29.jpg", "like": 0, "message": "两个方向的分运动都不是简谐运动吧", "id": "ep6:295200707921:r3"}]}, {"id": "ep6:295581125281", "module": "optics", "auto": false, "uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 0, "message": "在常见路灯的照射下，影子的外圈更亮，内圈更暗，并且在人眼看来区分很明显，但又有一些渐变的感觉\n我将手拿到路灯斜下方，出现了两个影子，一层更暗一层不那么暗，并且移动手时，一个影子跑的更快，一个影子跑的更慢\n我用手电筒在黑暗的地方照射也会出现这种现象(不止有一个影子)，而且离光源越近明暗分离越明显\n\n疑问：\n1. 是两个影子还是一个影子？\n2. 银河猜测可能也和人眼对明暗对比度的感知有关\n3. 是否与光的波动性有关？", "raw_message": "在常见路灯的照射下，影子的外圈更亮，内圈更暗，并且在人眼看来区分很明显，但又有一些渐变的感觉\n我将手拿到路灯斜下方，出现了两个影子，一层更暗一层不那么暗，并且移动手时，一个影子跑的更快，一个影子跑的更慢\n我用手电筒在黑暗的地方照射也会出现这种现象（不止有一个影子），而且离光源越近明暗分离越明显\n\n疑问：\n1. 是两个影子还是一个影子？\n2. 银河猜测可能也和人眼对明暗对比度的感知有关\n3. 是否与光的波动性有关？", "images": ["_imgs/img_d829a0a3e0b2.jpg"], "replies": [{"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 4, "message": "这几个问题你自己没有办法辨别吗？是不是眼睛的错觉，你把图片放大把像素点拉大看也看得出来啊，遇到问题总得想办法吧？第三个问题尤其要批评，题主你肯定知道光的波动性是什么，那还想不到什么简单的论述直接把它排除吗？我听说你是大学生，我觉得这个问题如果大学生还是只能问而不能自己根据已经学过的东西去排除、辨析的话，那是不够的。高中生也是，只要学过了干涉衍射，都应该有办法论证。\n咕咕警示过多次了，缺少思考的提问、没有推理或依据的猜测，这都是不好的。我并不是要根据问题的“难易”或知识的深浅来评判，我批判就是因为你们明明知识是够的，却没有展现出足够的主观能动性，没有主动出击的习惯，还是只能等着人告诉你。咕咕呱呱一直在视频里教大家的，并且也反复强调的，就是这个主动出击的思考习惯，知识只是训练的素材，这话他们也讲过多次。你们都是粉丝，结果还是没学到。这次观察到了有趣的现象，问到了正确的机理是什么，下次呢？", "id": "ep6:295581125281:r0"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 4, "message": "<span class=\"mention\">回复 @狴犴公然<\/span>  这位同学大概是新来的，可能是高一学生。我看得出来你没学过波动光学，说了一些明显的错误，这不怪你。你感兴趣的话可以自己上网查一下光的波动性是什么，由什么决定，如果真的看都看不懂，那确实是缺了知识，那就等高二学到了就知道了。\n不过有一点我要提出：没有根据、没有推理的猜想是不好的，咕咕说过。以后这样的想法放在心里就行了，都不用说，因为即使碰巧猜中了也不说明什么。物理这么学是不会长进的。以后遇到自己知识范围明显还没有覆盖到的内容，比如这里的波动性，你也知道你坑听说过但没学过，那就直接去查，知识性的东西，没什么好空想的，纯浪费时间。好的提问和回答是什么样的，你从这个活动中也能看到，大家都是在已有的知识范围内想的比人更深远，才会使得提问有深度、回答有启发。所以你提出猜想也不能是胡乱一猜，要基于推理的猜想才有意义。你在其他评论下的多条回复也是如此，有很多凭空的猜想，我就不挨个去说了，但你自己心里清楚，该学知识的时候就直接去学，该思考的时候就不要一个“盲猜”糊弄过去，不然会一直原地踏步。", "id": "ep6:295581125281:r1"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "<span class=\"mention\">回复 @xyz179<\/span>  我希望能聆听您对教主思考的见解。\n说实在，我听教主授课更多局限于的是知识本身和帮助理解的技巧，对于思考方法习惯不经理解不到位还有很多偏差。教主以习题为例子反复强调的许多思考方式却被我当成二级结论记下——说实话，我真的很傻。\n希望您能指点一下，不胜感激。\n谢谢国科大老师", "id": "ep6:295581125281:r2"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 1, "message": "<span class=\"mention\">回复 @狴犴公然<\/span> 你怎么听不懂呢？刚说完，你又接着瞎猜，还是没有严格的物理推理的凭空猜！你还说之前猜的“有道理”？有什么“道理”啊？之前那都是凭空猜的，我之前已经委婉的说了，没有思考的猜就算猜对了也没意义，现在说的再明白点，一个学过物理的人应该为自己只能盲目猜测那些已经在自己知识范围内的东西而羞耻。说的话，每一句都是“凭感觉”，一点检视的习惯都没有，这能学好？咕咕呱呱说的这么久的反思检查，屡次抓到这样的评论屡次指出，你们都有当回事吗？这样的“猜对”不是什么光彩的事，价值取向要端正。\n而且你查的东西也不对，我让你查，是让你补充好知识之后开始推理，因为在知识不足的时候在那儿胡乱瞎说毫无意义。所以我让你查的是“光的波动性是什么、由什么控制”，你怎么去整个问题扔给AI了？我看你的话就知道那肯定是某个不太聪明的AI给你的，而且还明显是受了你的误导之后试图讨好你，硬把你错的说成“有道理”。\n正确的做法是，当你知道了光的波动性是什么、衍射表先出来是什么样、图样受什么东西影响控制，应该基于这些认识，自己看图比对。也就是说，你应该自己有能力判断看到的东西是不是衍射，说的再直白一点，一个自认为已经搞清楚了衍射是怎么形成的人，如果再说“我一点检验排除的办法都没有”，就应该感到羞愧了，要么是不会思考，要么是衍射整个形成的机制还没搞清楚。\n听我的话不要只听好听的，我对低年级同学上来都比较温和，只是因为他们缺了知识，这不是错，但如果知识补齐了还不能思考，那就是主观能动性、思考习惯的大问题，那我的态度会和对待高年级同学、大学生一样刻薄。", "id": "ep6:295581125281:r3"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 1, "message": "<span class=\"mention\">回复 @Light_dreamer探索者<\/span> 这个真的有很多角度可以论证，最直接的你去看量级，通过衍射光斑要形成你看到的模糊范围，需要遮光的障碍物尺寸(相当于单缝的缝宽)大概是多少？实际遮光的东西尺寸是多少？这肯定都差了好几个量级了\n换一个角度，波动性跟什么有关？最直接的就是波长了，那一般的光里刚好混合着各种波长，如果是波动造成的话，红光和蓝光不应该各自展现出不同程度的衍射吗，波长能差接近两倍了，衍射光斑宽度也能差这么多倍，那应该直接看得出来模糊区域有红蓝分层啊。这里有吗？事实上你去看那些真正的衍射主导的光学现象，像太阳光照在特别细小的微米级的水珠上形成的衍射版本的“彩虹”，(不是真的彩虹，真的彩虹是几何光学，是更大的水珠)，那都是有明显的红蓝连续过度的色彩的。", "id": "ep6:295581125281:r4"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 1, "message": "排除了波动性的可能，知道必须是几何光学了，那剩下的就更清楚了。你只要想象你自己站在那个模糊的阴影里到底会看到什么，你肯定得看到打了折扣的亮度，怎么会打折呢？你要追查这件事，人下意识的动作就是抬头看看天上到底是怎么了，哦原来云遮住了半个太阳，那么难怪地上亮度减半了，哦所以中间这个过渡的区域就是因为太阳它不是一个点，云可以遮挡部分的太阳。你于是马上去画光路图，看看哪块地面是整个太阳都被遮住的，也就是从太阳上的任何一处发的光都照不到的，看看哪块地面是部分太阳被遮住的，也就是从太阳上某些地方发出的光能到达但某些地方又不能到达的。这一画，彻底清除了。想起来月食日食里面有听说过“本影、半影”，对比看看好像确实是一个意思。这下都联系上了。", "id": "ep6:295581125281:r5"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "光不沿直线传播，而是在一个极小的范围波动，当大量聚集时(大面积照射)个波动变大，从而越过障碍。\n太阳光：强度不够，波动作用小——出现了两个影子，一个真真正正的被挡住了，一个部分绕过了\n以上均为猜想，欢迎指正", "id": "ep6:295581125281:r6"}, {"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @xyz179<\/span>  万分感谢！我发现我对物理学习有很大误区，我从来没学会如何学物理。\n对于问题，我在查阅后表示我的看法——\n1.我胡猜的可能有一定道理：光有衍射，在阳光(平行光，这里意思是非点光源)有极小部分能穿过，这一部分能导致边缘模糊；没有在中间形成光点，是因为遮光条件不足+物体边缘粗糙让本来就杂乱无章的光更加乱，让光波相互抵消概率变大；\n2.其他可能：大气折射效果", "id": "ep6:295581125281:r7"}]}, {"id": "ep6:297751912992", "module": "circuit", "auto": false, "uname": "_-_-_-_lIlIIIll", "face": "_imgs/face_850a99e40810.jpg", "like": 4, "message": "之前在学校想到的，清明假期回来分享🍉", "raw_message": "之前在学校想到的，清明假期回来分享[吃瓜]", "images": ["_imgs/img_c9eb5eccce83.jpg", "_imgs/img_f03c93fbc2c6.jpg", "_imgs/img_c59f1d9e55d0.jpg", "_imgs/img_8126dcd2c0fd.jpg"], "replies": [{"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 2, "message": "感谢你的分享，不过我有点不理解。明明内接法的电压就是准确的呀，怎么就“不符合期望”呢？不过我个人也有另一种视角的看法，就是这里的“准确”，其实是指你测出来的电压和电流是不是实际的路端电压、路端电流，也就是说，当你把滑动变阻器调到某一个阻值的时候，它就对应一个实际的路端电压和实际的路端电流，他在图像上会对应一个点，而你的测量值也会在图像上留下一个点，我们说的准不准确，实际上是看这两个点的X一不一样，Y一不一样。如果一样就是准确，如果不一样就是不准确。而“正确”，指的是你把一个个测量值对应的点连起来之后形成了一条直线，他的纵截距和“实际的路端电压和实际的路端电流”对应的那条直线的纵截距是不是一样的。从图像的角度来看，“准确”和“正确”并不矛盾", "id": "ep6:297751912992:r0"}]}, {"id": "ep6:295166227041", "module": "em", "auto": false, "uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 7, "message": "水平放置的光滑平行导轨左端接有自感系数为 L 的线圈，导轨间距为 d ，导轨上垂直放置一根质量为 m 的金属棒，整个装置处于磁感应强度大小为 B 、方向垂直导轨平面向里的匀强磁场中。已知导轨、金属棒、线圈的电阻均可忽略，现给金属棒一个沿导轨向右的初速度<span class=\"math\">\\( v_{0} \\)<\/span>，不计线圈对磁场的影响\n \n(1) 证明：金属棒将做简谐运动；\n(2) 求金属棒做简谐运动的圆频率", "raw_message": "水平放置的光滑平行导轨左端接有自感系数为 L 的线圈，导轨间距为 d ，导轨上垂直放置一根质量为 m 的金属棒，整个装置处于磁感应强度大小为 B 、方向垂直导轨平面向里的匀强磁场中。已知导轨、金属棒、线圈的电阻均可忽略，现给金属棒一个沿导轨向右的初速度 v0 ，不计线圈对磁场的影响\n \n(1) 证明：金属棒将做简谐运动；\n(2) 求金属棒做简谐运动的圆频率", "images": [], "replies": [{"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 4, "message": "两个东西相互决定着：电流变化率正比于速度，速度的变化率正比于电流，所以电流的变化率的变化率正比于电流(相应也有速度变化率的变化率正比于速度)，可以类比加速度(位移变化率的变化率)正比于位移的情形，也就是简谐运动。所以是简谐。", "id": "ep6:295166227041:r0"}, {"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 1, "message": "原频率是bd比上Ml开根", "id": "ep6:295166227041:r1"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "根据回路没有任何电阻，所以动生电动势等于自感电动势，那么<span class=\"math\">\\(bdv=ldi\\div dt\\)<\/span>，化简得<span class=\"math\">\\(bdx=li\\)<\/span>，最后<span class=\"math\">\\(i=bdx\\div l\\)<\/span>，而<span class=\"math\">\\(f=bid\\)<\/span>，既<span class=\"math\">\\(f=b^2d^2x\\div l\\)<\/span>，<span class=\"math\">\\(f\\)<\/span>与<span class=\"math\">\\(x\\)<\/span>成正比，而<span class=\"math\">\\(f\\)<\/span>与运动方向相反于是是简谐运动", "id": "ep6:295166227041:r2"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "而圆频率<span class=\"math\">\\(\\omega \\)<\/span>等于<span class=\"math\">\\(\\sqrt{k\\div m}\\)<\/span>，此时<span class=\"math\">\\(k=b^2d^2\\div l\\)<\/span>，化简得<span class=\"math\">\\(\\omega =bd\\div \\sqrt{ml}\\)<\/span>", "id": "ep6:295166227041:r3"}]}, {"id": "ep6:295520792961", "module": "em", "auto": false, "uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 4, "message": "这是上一期末我提问的问题，我虽然已经有收获，但觉得还是挺有意思的\n现在倒回来复习电磁感应，有一个问题想问大家。\n电磁感应的单棒模型，达到最终的时间，应该会很长很长，由于自平衡效应，它的图像的斜率是越来越平缓的，后来我用微积分严格证明，他的时间就是是正无穷的，但是，我想问，→为什么有时候题目里面还会让我们求时间？", "raw_message": "这是上一期末我提问的问题，我虽然已经有收获，但觉得还是挺有意思的\n现在倒回来复习电磁感应，有一个问题想问大家。\n电磁感应的单棒模型，达到最终的时间，应该会很长很长，由于自平衡效应，它的图像的斜率是越来越平缓的，后来我用微积分严格证明，他的时间就是是正无穷的，但是，我想问，→为什么有时候题目里面还会让我们求时间？", "images": ["_imgs/img_6186b269d8db.jpg"], "replies": [{"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "那些求时间的题目应该还有些前提条件吧，例如到多少速度，多少位移之类的🐶", "id": "ep6:295520792961:r0"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "毕竟要真去求速度为0的时间肯定是不现实的", "id": "ep6:295520792961:r1"}, {"uname": "Atomphysics", "face": "_imgs/face_19704788688b.jpg", "like": 0, "message": "这个问题我给学生讲过 你会发现你取一个有限 不太大的时间 这个平衡已经在非常非常小的数量级了 某种程度上就可以认为达到了平衡", "id": "ep6:295520792961:r2"}, {"uname": "Atomphysics", "face": "_imgs/face_19704788688b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @Atomphysics<\/span> 这个主要还是高中命题的问题 但是从实际的情况来讲 这个也有一定的道理", "id": "ep6:295520792961:r3"}, {"uname": "绯村染之助", "face": "_imgs/face_904f9dcc8f9b.jpg", "like": 0, "message": "机车恒定功率启动等问题同理，时间无限长，题目一般假定达到99.x%就算最大了", "id": "ep6:295520792961:r4"}]}, {"id": "ep6:295548563809", "module": "em", "auto": false, "uname": "-Sir-xiao", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 3, "message": "关于书上自感的一些问题，我主要想要了解当磁通量变化(通过开关电路)之后到底通过怎样的机制来产生感应电流的，我自己想了一些原因，总感觉与书上的有矛盾，具体问题在图上，希望能得到解答！", "raw_message": "关于书上自感的一些问题，我主要想要了解当磁通量变化（通过开关电路）之后到底通过怎样的机制来产生感应电流的，我自己想了一些原因，总感觉与书上的有矛盾，具体问题在图上，希望能得到解答！", "images": ["_imgs/img_48e9711814fe.jpg", "_imgs/img_a5e99b4eaa91.jpg", "_imgs/img_e29c5ead9028.jpg"], "replies": []}, {"id": "ep6:295500888417", "module": "em", "auto": false, "uname": "-Sir-xiao", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 3, "message": "最近学到了涡流，我始终不太明白涡流路径(涡流到底是怎么样流的)是如何选取的，以下是我的四个更细节的问题，希望能得到解答！", "raw_message": "最近学到了涡流，我始终不太明白涡流路径（涡流到底是怎么样流的）是如何选取的，以下是我的四个更细节的问题，希望能得到解答！", "images": ["_imgs/img_b3f30d002053.jpg", "_imgs/img_e89f01f4fbe9.jpg", "_imgs/img_445515df3a65.jpg", "_imgs/img_33822c509a29.jpg", "_imgs/img_9cffb2b7b636.jpg"], "replies": [{"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 3, "message": "对，我之前也想到了，为什么不能是好多个蜗牛，\n老师是这么跟我解释的，再加上我自己的理解\n我们先从化学类比来，在化学中我们认为能量越低的物质越稳定，那么在涡流中也是这样的，多个小涡流产生的焦耳热会大禹一个大蜗牛形成的焦耳热，所以这是不稳定的，就像化学里的，不能自发\n还有多个小蜗牛产生的磁场会相互抵消，这样子就不能做到最大程度的去阻碍磁通量的变化，也不能自发行程\n所以最终只能形成最老实，最省事的环状涡流", "id": "ep6:295500888417:r0"}, {"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 3, "message": "对，我之前也想到了，为什么不能是好多个蜗牛，\n老师是这么跟我解释的，再加上我自己的理解\n我们先从化学类比来，在化学中我们认为能量越低的物质越稳定，那么在涡流中也是这样的，多个小涡流产生的焦耳热会大禹一个大蜗牛形成的焦耳热，所以这是不稳定，就像化学里的，不能自发\n还有多个小蜗牛产生的磁场会相互抵消，这样子就不能做到最大程度的去阻碍磁通量的变化，也不能自发行程\n所以最终只能形成最老实，最省事的环状涡流", "id": "ep6:295500888417:r1"}, {"uname": "Atomphysics", "face": "_imgs/face_19704788688b.jpg", "like": 1, "message": "可以和ai探讨一下趋肤深度的概念", "id": "ep6:295500888417:r2"}, {"uname": "雷苇航", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "为什么多个小涡流产生的焦耳热会大于一个大涡流产生的焦耳热？小涡流产生的磁场会相互抵消，但是一圈一圈的大涡流也会呀。", "id": "ep6:295500888417:r3"}]}, {"id": "ep6:295502433601", "module": "em", "auto": false, "uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 2, "message": "我们学校的老师没有很系统的讲不等距切割模型，后面两个的导体就省略不画了\n当这个棒运动到不等距的交界处，能画一下这个e和<span class=\"math\">\\(t\\)<\/span>的图像吗，不知道自己画的对不对？\n然后呢由这个前两幅图类推到第三步的线性变化，那这样子的图像又长什么样呢？\n(这些思考都过去半年了，年代久远到我自己都忘记想问什么了，大家就可以把想法发出来，给我补充科普一下)\n还有就是最后一类，不线性变化，我记得哪一年？高考题还是模拟题考过？他讲的是抛物线，选项里还有让你求最终停下时扫过的面积的", "raw_message": "我们学校的老师没有很系统的讲不等距切割模型，后面两个的导体就省略不画了\n当这个棒运动到不等距的交界处，能画一下这个e和t的图像吗，不知道自己画的对不对？\n然后呢由这个前两幅图类推到第三步的线性变化，那这样子的图像又长什么样呢？\n（这些思考都过去半年了，年代久远到我自己都忘记想问什么了，大家就可以把想法发出来，给我补充科普一下）\n还有就是最后一类，不线性变化，我记得哪一年？高考题还是模拟题考过？他讲的是抛物线，选项里还有让你求最终停下时扫过的面积的", "images": ["_imgs/img_3448e0e22699.jpg", "_imgs/img_04b9078066e3.jpg"], "replies": [{"uname": "e的变化率不是e", "face": "_imgs/face_85ac0420741b.jpg", "like": 0, "message": "去年的湖南高考多选压轴", "id": "ep6:295502433601:r0"}]}, {"id": "ep6:298012188880", "module": "em", "auto": false, "uname": "物理要悟理", "face": "_imgs/face_082b74800695.jpg", "like": 2, "message": "大家好像在学电磁感应时对磁通量太无感了我推出一些思考\n先提出一些高等思想：磁场是电磁张量空间属性，磁通量可以想象成对磁的数量的定义\n问题：为什么在线圈在磁场中下落时动量与磁通量成正比，为什么在导体棒切割磁感线的过程中位移与电荷量成正比，时间为什么要累集成其他量，这与其空间属性有无关联，还可以再关注一些运动过程中速度，位移的关系，能不能直接一句话说出来\n参考思路：不妨把动量看成中心，以动量观解决问题，比如能量可看成动量的积累，力是动量变化的快慢。试着去看看动量与磁通量能否“等价”\n个人见解，仅供参考", "raw_message": "大家好像在学电磁感应时对磁通量太无感了我推出一些思考\n先提出一些高等思想：磁场是电磁张量空间属性，磁通量可以想象成对磁的数量的定义\n问题：为什么在线圈在磁场中下落时动量与磁通量成正比，为什么在导体棒切割磁感线的过程中位移与电荷量成正比，时间为什么要累集成其他量，这与其空间属性有无关联，还可以再关注一些运动过程中速度，位移的关系，能不能直接一句话说出来\n参考思路：不妨把动量看成中心，以动量观解决问题，比如能量可看成动量的积累，力是动量变化的快慢。试着去看看动量与磁通量能否“等价”\n个人见解，仅供参考", "images": [], "replies": []}, {"id": "ep6:295291323169", "module": "em", "auto": false, "uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 2, "message": "对于一个不考虑所有内阻的单杠感应电路中，根据楞次定律可以知道最终速度应该会无限趋近于0，而没有内阻也就代表没有焦耳热的产生，那么损失的动能到了哪里呢？", "raw_message": "对于一个不考虑所有内阻的单杠感应电路中，根据楞次定律可以知道最终速度应该会无限趋近于0，而没有内阻也就代表没有焦耳热的产生，那么损失的动能到了哪里呢？", "images": ["_imgs/img_f926083e55dd.jpg"], "replies": [{"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 2, "message": "高中阶段我们用不可忽略的电阻来配合题目，完成了能量守恒，即有焦耳热的转化，但是如果不考虑电阻，哦那么就只能考虑自感电动势了，产生的感应电流会激发一个磁场，转化成为磁场能，应该只能这么解释了，毕竟能量是守恒的嘛", "id": "ep6:295291323169:r0"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 2, "message": "你们都有自己去好好分析一下吗？看到出现奇异行为了，有试图看看行为到底是怎么发生的吗？有电阻的时候能量也不守恒吗？哦有电阻的时候是守恒的，现在电阻越取越小，就一路都守恒，就在0的时候不守恒了。你跟我说这样的情况会需要新编一个效应出来解释？这动脑筋了吗？", "id": "ep6:295291323169:r1"}, {"uname": "物理要悟理", "face": "_imgs/face_082b74800695.jpg", "like": 0, "message": "高中的物理刻意抹去了感应电流也会产生变化的磁场，这里你的困惑实际就是忘记了产生的电流也会产生磁场，因为很微弱所以平时忽略了，但你的这种理想模型就不可忽略了", "id": "ep6:295291323169:r2"}, {"uname": "物理要悟理", "face": "_imgs/face_082b74800695.jpg", "like": 0, "message": "<span class=\"mention\">回复 @史蒂夫2332<\/span> 我不太理解您的意思，我的说法是感应电流也具有磁效应，会影响原本电磁场的张量分布，<span class=\"math\">\\(B\\,I\\,L\\)<\/span>应该是安培力的公式，是电流在磁场中的宏观力作用，这与我上述说法有和观联，请您点明一下[保佑]", "id": "ep6:295291323169:r3"}, {"uname": "物理要悟理", "face": "_imgs/face_082b74800695.jpg", "like": 0, "message": "<span class=\"mention\">回复 @史蒂夫2332<\/span> 哦我能理解您的意思，您的说法是安培力是感应电流磁效应的结果，确实是如此。电流会产生垂直于电流平面磁场与原磁场相互作用产生安培力，但是我的意思是感应电流也会产生次感应磁场，这个磁场与原磁场的作用确实是安培力，而这个磁场会影响原磁场的分布，用传统相对论的思想来看微观，因为没有电阻电子流飘移速度非常快此时磁场在电子参考下的分布改变，所以回到最开始的问题能量去了哪里：散布在了空间中的电磁场中。只是此时场的受力抵消。个人拙见", "id": "ep6:295291323169:r4"}, {"uname": "物理要悟理", "face": "_imgs/face_082b74800695.jpg", "like": 0, "message": "思考这个问题我觉得会不可避免的涉及到电动力学和一些相对论的知识，不知道同学们有其他更简单的角度吗", "id": "ep6:295291323169:r5"}, {"uname": "物理要悟理", "face": "_imgs/face_082b74800695.jpg", "like": 0, "message": "光是电磁场，光的动量不变所以恒定电磁场的动量不变，这个体系里棒的动量去了哪里，或者是电磁场什么时候会改变动量，想清楚这个问题，确实就解决了🐶", "id": "ep6:295291323169:r6"}, {"uname": "物理要悟理", "face": "_imgs/face_082b74800695.jpg", "like": 0, "message": "<span class=\"mention\">回复 @史蒂夫2332<\/span> 这个模型还是太理想了，电流速度太大，整个情况发生的时间太短，不过这样的讨论依旧很有意义，比如我们又重温了一次安倍力👌", "id": "ep6:295291323169:r7"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @物理要悟理<\/span> 你猜猜<span class=\"math\">\\(I\\,B\\,L\\)<\/span>是什么", "id": "ep6:295291323169:r8"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @物理要悟理<\/span> <span class=\"math\">\\(I\\,B\\,L\\)<\/span>安培力的来历其实就是因为电流的磁效应,中学物理把电流产生的磁效应容括在安培力里面了，所以棒子减速就是因为产生了<span class=\"math\">\\(I\\,B\\,L\\)<\/span>", "id": "ep6:295291323169:r9"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @求进步的祁厅长<\/span> 你猜猜<span class=\"math\">\\(I\\,B\\,L\\)<\/span>是什么", "id": "ep6:295291323169:r10"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @物理要悟理<\/span> 没有电阻杆会瞬间停止，你也拉不动杆", "id": "ep6:295291323169:r11"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @物理要悟理<\/span> 因为现在安培力要多大有多大", "id": "ep6:295291323169:r12"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "对题主：你说“根据楞次定律可以知道最终速度应该会无限趋近于0” 楞次定律是这么说的？它到底是怎么说的你去看看。看完并且认识到错误了之后再想想，楞次定律说的和直接“<span class=\"math\">\\(B\\,L\\,v\\)<\/span>，<span class=\"math\">\\(I\\,B\\,L\\)<\/span>，受力分析”这套标准的、老老实实的、绝对不可能错的分析 做出来的结果是一致的吗？不知道的话 那说明你这个重要的事情就没搞清楚，还在当作两件独立的事情看待。知道的话，你都已经“发现”楞次定律“给出奇怪结果”了，那是不是更应该自己去标准的分析对比一下了？为什么没有呢？", "id": "ep6:295291323169:r13"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "真的，这个问题从问题的提出到猜测到下面的回复到处都是明显的错误，但是下面的回复却人家说什么就直接接下去了。这太让我震惊了。", "id": "ep6:295291323169:r14"}, {"uname": "Yao174", "face": "_imgs/face_670ba83da88f.jpg", "like": 0, "message": "如果真的什么都不计，只做一个极理想化的思想实验，我觉得是电磁辐射[捂眼][捂眼]", "id": "ep6:295291323169:r15"}, {"uname": "看好这快递", "face": "_imgs/face_70b76638958b.jpg", "like": 0, "message": "因为迅速变化的电流产生的磁场能量以电磁辐射的形式损失掉了", "id": "ep6:295291323169:r16"}]}, {"id": "ep6:295384752081", "module": "em", "auto": false, "uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 0, "message": "怎么确定匀强磁场的最小面积呢？答案直接给了个图", "raw_message": "怎么确定匀强磁场的最小面积呢？答案直接给了个图", "images": ["_imgs/img_5bb8569a62ee.jpg"], "replies": [{"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 0, "message": "我记得这一类最小面积的，\n在词的三大模型，磁聚焦，磁发散，磁控数词覆盖，最小面积有时候是画个矩形，就只要保证它的面积盖住了圆形轨迹即可", "id": "ep6:295384752081:r0"}, {"uname": "Yao174", "face": "_imgs/face_670ba83da88f.jpg", "like": 0, "message": "磁约束/磁聚焦逻辑：两个圆相交，根据对称性，一个交点是一个圆的最低点，另一个交点必定是另一个圆的最高点🐶\n先确定整体磁场，再根据最外侧的轨迹圈出需要的磁场😳", "id": "ep6:295384752081:r1"}, {"uname": "Yao174", "face": "_imgs/face_670ba83da88f.jpg", "like": 0, "message": "<span class=\"mention\">回复 @Yao174<\/span> 补：两个大小相同的圆。在这种情形中也就是粒子的轨迹圆和磁场的边界圆🐶", "id": "ep6:295384752081:r2"}, {"uname": "Yao174", "face": "_imgs/face_670ba83da88f.jpg", "like": 0, "message": "<span class=\"mention\">回复 @h0122erodb<\/span> 我自己对于这类问题的理解是基于数学几何知识的😂\n   你可以画一个圆A，再画出几个不同的半径相等的圆B(1、2……)，使它们其中一个交点是A的最低点(具体是哪个空间位置其实都无区别，设为最下端仅仅为了方便视觉体会)\n   你或许可以体会到这样的直觉：一个交点是A的最低点，另一个就应该是B的最高点(由于对称性)\n   在这类问题(磁聚焦、磁发散)：平行射入汇聚为点，点射出发散为线(其实只是正放倒放的区别)，就是利用了上面提到的几何直觉。\n   以磁发散为例：粒子在同一点向不同方向射入磁场，粒子在磁场中的轨迹是圆，如果想经过磁场后平行出射，那么结合上面的直觉，或许你能猜到磁场的边界应当是圆，我们假定粒子入射点就是两圆交点中磁场圆的“最高点”(当然你可以通过旋转使它真的是空间位置的最高点)\n   如果磁场半径和粒子半径一致，入射是磁场圆最高点，出射就是粒子圆的最低点，于是就能保证平行了🐶\n   磁聚焦就是它的逆过程，就不再重复了🐶\n   以上是我对于这类问题的理解，更多是基于数学几何逻辑，在物理方面理解不深😂，不知道还有没有更清晰的理解方式", "id": "ep6:295384752081:r3"}]}, {"id": "ep6:297801232576", "module": "math", "auto": false, "uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 3, "message": "蜗牛<span class=\"math\">\\(v=\\frac{k}{x}\\)<\/span>，求蜗牛到<span class=\"math\">\\(x_{0}\\)<\/span>所花的时间\n解法很巧，一开始没看出来[笑]", "raw_message": "蜗牛v=k/x，求蜗牛到x0所花的时间\n解法很巧，一开始没看出来[笑]", "images": ["_imgs/img_a17b57500538.jpg"], "replies": [{"uname": "皮卡丘--------丘", "face": "_imgs/face_9b7d8d4e7f29.jpg", "like": 1, "message": "解法详细说一下呗。谢谢啦", "id": "ep6:297801232576:r0"}, {"uname": "所有的入", "face": "_imgs/face_017bc74a0757.jpg", "like": 1, "message": "蹲我也没太看懂", "id": "ep6:297801232576:r1"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "对于任意的<span class=\"math\">\\(x\\)<\/span>都有确定的<span class=\"math\">\\(v\\)<\/span>，于是运动已经确定了，对于最开始，<span class=\"math\">\\(v\\)<\/span>趋向于无穷大，而到<span class=\"math\">\\(x_{0}\\)<\/span>时却是确定的速度，那么加速度是不会影响我计算时间的因为速度的变化我无法探测，那么<span class=\"math\">\\(v\\)<\/span>和<span class=\"math\">\\(x\\)<\/span>的关系可以直接去确定<span class=\"math\">\\(t\\)<\/span>，于是我把原式改写成<span class=\"math\">\\(v_x=k\\)<\/span>，再把<span class=\"math\">\\(x\\)<\/span>改写为<span class=\"math\">\\(v\\)<\/span>成dt再给等式两边同时乘dt，再累计于是计算得<span class=\"math\">\\(t=x_{0}^2\\)<\/span>除以<span class=\"math\">\\(k\\)<\/span>。解答结束，却和答案有出入，是计算的问题吗？", "id": "ep6:297801232576:r2"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @狴犴公然<\/span> 感谢修正，但是纯物理方法有点困难🐶可以等着咕咕下一期回复一下，毕竟物理数学不分家嘛🙌", "id": "ep6:297801232576:r3"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 在极短时间内有<span class=\"math\">\\(t=x\\)<\/span>除以<span class=\"math\">\\(v\\)<\/span>于是在<span class=\"math\">\\(v\\)<\/span>，<span class=\"math\">\\(x\\)<\/span>分之一图像里每一个小部分的面积就等于那一部分位移所用的时间，那么总时间就对应的是面积", "id": "ep6:297801232576:r4"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "<span class=\"mention\">回复 @所有的入<\/span> 在极短时间内有<span class=\"math\">\\(t=x\\)<\/span>除以<span class=\"math\">\\(v\\)<\/span>于是在<span class=\"math\">\\(v\\)<\/span>，<span class=\"math\">\\(x\\)<\/span>分之一图像里每一个小部分的面积就等于那一部分位移所用的时间，那么总时间就对应的是面积", "id": "ep6:297801232576:r5"}, {"uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 0, "message": "<span class=\"mention\">回复 @丁真爱测码da<\/span> 我不理解这个图像的面积为什么是总时间，根据时间等于位移<span class=\"math\">\\(\\div \\)<\/span>速度，那么不应该总面积为时间的倒数吗", "id": "ep6:297801232576:r6"}, {"uname": "Yao174", "face": "_imgs/face_670ba83da88f.jpg", "like": 0, "message": "郭爷吗哈哈😳", "id": "ep6:297801232576:r7"}, {"uname": "Yao174", "face": "_imgs/face_670ba83da88f.jpg", "like": 0, "message": "<span class=\"mention\">回复 @h0122erodb<\/span> 可能打错了，应该是<span class=\"math\">\\(x-\\frac{1}{v}\\)<\/span>的图吧😳", "id": "ep6:297801232576:r8"}]}, {"id": "ep6:295286763825", "module": "math", "auto": false, "uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "@狴犴公然 过程如图，在回复中无法发图，于是单独列出条评论", "raw_message": "@狴犴公然 过程如图，在回复中无法发图，于是单独列出条评论", "images": ["_imgs/img_46e2654b2832.jpg"], "replies": [{"uname": "狴犴公然", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "[给心心][给心心][给心心]厉害\n我不会积分，万分惭愧，只好请教AI\n不过我记得郭爷也用了这种方法，讲的不错，可以一听！\n——————————————————————————\n“已知<span class=\"math\">\\(\nv=xk\\)<\/span>速度定义：<span class=\"math\">\\(v=dtdx\n\\)<\/span>所以：<span class=\"math\">\\(dtdx=xk\n\\)<\/span>第一步：两边乘 dt(分离变量<span class=\"math\">\\()\ndx=xkdt\n\\)<\/span>两边再乘 x：<span class=\"math\">\\(xdx=kdt\n\\)<\/span>第二步：两边同时 “累积”(积分)\n左边对 x 从<span class=\"math\">\\( x_{0} \\)<\/span>积到 x右边对 t 从 0 积到<span class=\"math\">\\( t\n\\int_{x_0}^{x}x\\,dx=\\int_0^t k\\,dt\n\\)<\/span>左边积分：<span class=\"math\">\\(21x_{2}-21x_{02}\n\\)<\/span>右边积分：kt\n所以：<span class=\"math\">\\(21(x_{2}-x_{02})=kt\n\\)<\/span>第三步：整理出<span class=\"math\">\\( t\nt=2kx2-x_{02}\n\\)<\/span>如果你最后得到<span class=\"math\">\\(t=kx_0^2\\)<\/span>那一般是：\n要么你只积到<span class=\"math\">\\( x=0(\\)<\/span>走到原点)\n要么题目里有其他条件把系数约掉了\n你问的 “如何累积”，做法就这三句：\n把 v 写成 dtdx\n移项、乘 dt，把 x 放一边、t 放一边\n两边同时积分(左边积 x，右边积 t)\n化简算出 t(x)\n这就是通过速度累积位移、反解时间的做法。\"", "id": "ep6:295286763825:r0"}, {"uname": "Yao174", "face": "_imgs/face_670ba83da88f.jpg", "like": 0, "message": "<span class=\"math\">\\(x=vdt\\)<\/span>这里就已经出问题了，<span class=\"math\">\\(x\\)<\/span>是vdt的积分，而dx=vdt🐶\n   另外，不知道你有没有了解过积分相关的知识(我也仅仅是草草学习过，可能说的不太清楚[捂眼])。如果真的想利用数学方法，本题一般是将<span class=\"math\">\\(v\\)<\/span>改为<span class=\"math\">\\(\\frac{dx}{dt}\\)<\/span>再解微分方程(把<span class=\"math\">\\(x\\)<\/span>和dx挪到一边，dt挪到另一边)\n   退一步来说，如果按照你的思路也没问题。先对原表达式两侧取微分：<span class=\"math\">\\(dx=\\frac{d(k}{v})\\)<\/span>，再<span class=\"math\">\\(dx=vdt\\)<\/span>；而<span class=\"math\">\\(k\\)<\/span>不是变量，是常数，可以直接拿出来：<span class=\"math\">\\(\\frac{d(k}{v})=k·\\frac{d(1}{v})\n   \\)<\/span>得到<span class=\"math\">\\(dt=\\frac{k(1}{v})·\\frac{d(1}{v})\\)<\/span>；再对两侧积分，<span class=\"math\">\\(t=(\\frac{1}{2})\\frac{k(1}{v})^2\\)<\/span>，再把上限<span class=\"math\">\\(v=\\frac{k}{x0}\\)<\/span>带入即可。\n   不过你可能对积分和解微分方程的程序还不太熟悉，所以才会导致解题时有些混乱，不知道该怎么操作🐶，不过本题图像法也蛮有趣的🐶", "id": "ep6:295286763825:r1"}]}, {"id": "ep6:298219613344", "module": "other", "auto": false, "uname": "皮卡丘--------丘", "face": "_imgs/face_9b7d8d4e7f29.jpg", "like": 1, "message": "在运动学中，一些重要的公式都是由几个基础公式推导出来的，经过一定数学变形。可以推导出核心公式。在物理中，各个模块也是如此，一般都是有几个基础公式，推出了好多个公式，然后这些公式中有很重要的作用。那么是不是仅仅通过几个基础公式，加上变通的思维，就能做出所有的题目呢？", "raw_message": "在运动学中，一些重要的公式都是由几个基础公式推导出来的，经过一定数学变形。可以推导出核心公式。在物理中，各个模块也是如此，一般都是有几个基础公式，推出了好多个公式，然后这些公式中有很重要的作用。那么是不是仅仅通过几个基础公式，加上变通的思维，就能做出所有的题目呢？", "images": [], "replies": []}, {"id": "ep6:298155100608", "module": "other", "auto": false, "uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 1, "message": "@求进步的祁厅长 @-Sir-xiao \n送你们的", "raw_message": "@求进步的祁厅长 @-Sir-xiao \n送你们的", "images": ["_imgs/img_17183ce07894.jpg", "_imgs/img_2b9dc6422656.jpg"], "replies": []}], "mod_stats": {"mech": {"q": 9, "r": 87, "img": 8}, "energy": {"q": 6, "r": 23, "img": 3}, "momentum": {"q": 2, "r": 9, "img": 0}, "vibration": {"q": 2, "r": 5, "img": 2}, "optics": {"q": 1, "r": 8, "img": 1}, "circuit": {"q": 1, "r": 1, "img": 4}, "em": {"q": 8, "r": 35, "img": 13}, "math": {"q": 2, "r": 11, "img": 2}, "other": {"q": 2, "r": 0, "img": 2}}, "removed": [["狴犴公然", "分期，不利于长期思考与回头再理解琢磨；\n奖励，学习本是自己的事，何须奖励", "归档时已排除"], ["54444444444444", "好爹已笑翻", "归档时已排除"], ["皮皮的电钮", "哇", "归档时已排除"], ["江南杰克鲁", "这个封面笑死了", "归档时已排除"], ["考研竞赛kangkang", "[doge]", "归档时已排除"], ["丁真爱测码da", "@h0122erodb 这是解答图像可能有点潦草[笑哭]将就看看吧", "归档时已排除"], ["皮卡丘--------丘", "来了[星星眼][星星眼]", "归档时已排除"], ["种花家004舰长华卿", "封面何意味？", "归档时已排除"], ["u之", "我去，我高中关注的物理up居然联动了[打call][打call][打ca", "归档时已排除"], ["晞纆", "怎么还联动了", "归档时已排除"], ["灯塔映春港", "[大会员粉豆人_啊？]", "归档时已排除"], ["通往珊瑚的海", "秒吃", "归档时已排除"], ["丁真爱测码da", "@h0122erodb  在平常的重力场中，从a到b再到c不用说也知道肯", "归档时已排除"], ["槭焰", "来了来了[打call]", "归档时已排除"]], "ghost_merged": 78, "total_q": 33, "total_r": 179, "total_img": 35, "auto_cnt": 0}, {"key": "ep7", "title": "第7期", "episodeId": "ep1775882842744", "export": "2026-08-25", "comments": [{"id": "ep7:298814584000", "module": "mech", "auto": false, "uname": "白夜-017", "face": "_imgs/face_06cee83bac38.jpg", "like": 4, "message": "为什么一个力在分析的时候可以又用在平动分析中又用在转动的分析中？关于提问的动机：感觉很不自然 有点违背直觉(可以理解以前是因为物体受到的力矩为0 不管是以什么为支点吧 所以其实以前的情形下有这个同时使用的“设定”并没有出格 但感觉这不算理解 就这样塞进来了；想要类比：<span class=\"math\">\\(F\\)<\/span>是矢量所以如果有互不干扰的向量分解(例如平面直角坐标系 空间直角坐标系等) 可以拆分研究各方向的运动后合成起来 但是 虽然平动和转动的运动合成之后是一般的运动 但是并没有对应拆分力的过程；有办法让这两个运动有一个统一的形式吗(或许在微观上)？", "raw_message": "为什么一个力在分析的时候可以又用在平动分析中又用在转动的分析中？关于提问的动机：感觉很不自然 有点违背直觉（可以理解以前是因为物体受到的力矩为0 不管是以什么为支点吧 所以其实以前的情形下有这个同时使用的“设定”并没有出格 但感觉这不算理解 就这样塞进来了；想要类比：F是矢量所以如果有互不干扰的向量分解（例如平面直角坐标系 空间直角坐标系等） 可以拆分研究各方向的运动后合成起来 但是 虽然平动和转动的运动合成之后是一般的运动 但是并没有对应拆分力的过程；有办法让这两个运动有一个统一的形式吗（或许在微观上）？", "images": [], "replies": []}, {"id": "ep7:296028783697", "module": "energy", "auto": false, "uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 2, "message": "我想问一下这道题的bd选项。在地球表面上的物体受到的重力实际上是万有引力减去它所在的平面转动所需要的向心力(矢量相减)什么时候重力最大呢？当然是所需要的向心力为零的时候也就处于两极的状态。而低轨卫星它的半径是接近于地球的半径的。也就是低轨卫星的向心加速度近似等于地球表面最大的重力加速度。那低轨卫星的加速度当然就可以大于地球表面的重力加速度啊B选项，我这么分析哪里错了？C选项就是一个化简的问题，机械能等于引力势能加上动能动能的话把速度给求解出来，然后化简为同一个形式，可以判断出影响二者机械能的无非就是它们自身对应的质量以及轨道半径，质量未知，所以c选项不可比较。D选项的话，我不知道如何直观理解这件事情，我会觉得有点反直觉，通过c选项，我们可以得到它的能量的表达式。它只有机械能，机械能等于引力势能加动能，动能中的速度，通过万有引力提供向心力。这个约束来写出。空气阻力始终与运动方向相反，对低轨卫星做负功，消耗能量。可以得到轨道半径，它是在减小的。可以得到线速度是增大的。", "raw_message": "我想问一下这道题的bd选项。在地球表面上的物体受到的重力实际上是万有引力减去它所在的平面转动所需要的向心力(矢量相减)什么时候重力最大呢？当然是所需要的向心力为零的时候也就处于两极的状态。而低轨卫星它的半径是接近于地球的半径的。也就是低轨卫星的向心加速度近似等于地球表面最大的重力加速度。那低轨卫星的加速度当然就可以大于地球表面的重力加速度啊B选项，我这么分析哪里错了？C选项就是一个化简的问题，机械能等于引力势能加上动能动能的话把速度给求解出来，然后化简为同一个形式，可以判断出影响二者机械能的无非就是它们自身对应的质量以及轨道半径，质量未知，所以c选项不可比较。D选项的话，我不知道如何直观理解这件事情，我会觉得有点反直觉，通过c选项，我们可以得到它的能量的表达式。它只有机械能，机械能等于引力势能加动能，动能中的速度，通过万有引力提供向心力。这个约束来写出。空气阻力始终与运动方向相反，对低轨卫星做负功，消耗能量。可以得到轨道半径，它是在减小的。可以得到线速度是增大的。", "images": ["_imgs/img_5a29aef99a44.jpg"], "replies": [{"uname": "Physicscw_GWDM", "face": "_imgs/face_540d3fe8596d.jpg", "like": 0, "message": "B选项揣摩一下题意，这个题真要考你地球不同地方<span class=\"math\">\\(g\\)<\/span>不一样，就不会用”地球表面重力加速度”的表述。这就像平常我说“老虎比美洲狮体型大”，你说”幼虎的体型可以比成年美洲狮的体型小“。", "id": "ep7:296028783697:r0"}, {"uname": "Physicscw_GWDM", "face": "_imgs/face_540d3fe8596d.jpg", "like": 0, "message": "D选项，首先匀速圆周运行在轨速度正比于半径的负一次方。你说反直觉是指什么？如果是指，机械能越小，平衡时飞行轨道越低，不如拿第一第二第三宇宙速度去想一下，他要飞得越远出发时携带的动能就越大。", "id": "ep7:296028783697:r1"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "因为近地卫星和低轨卫星不一样，低轨卫星不能认为贴着地表走，根据我查的资料，只有轨道高度低于11千米的，它的向心加速度才大于地球的重力加速度，如果再高的话，那半径造成影响比地球自转产生向心力分力的影响要大", "id": "ep7:296028783697:r2"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @史蒂夫2332<\/span> 并非，重力加速度只有在地球两极才等于万有引力加速度，其他地方要分出来一部分给自转提供向心力，实际上是比<span class=\"math\">\\(\\frac{gm}{r^2}\\)<\/span>要小，而这样就使得绝对近地卫星加速度可以比地球除两极地区的重力加速度更大，但题目低轨卫星不是近地卫星", "id": "ep7:296028783697:r3"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @史蒂夫2332<\/span> 外有引力加速度并不等于重力加速度(两极除外)你只考虑了外有引力加速度，没有考虑重力加速度实际上比地球本身受到的万有引力加速度要小", "id": "ep7:296028783697:r4"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "低轨卫星的轨道高度一般是200千米到2000千米远大于11千米", "id": "ep7:296028783697:r5"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "没有任何一个卫星的加速度可以比地表得到的重力加速度大，因为<span class=\"math\">\\(a=\\frac{GM}{r}^2\\)<\/span>已经说明了，<span class=\"math\">\\(r\\)<\/span>怎么都比地球半径大\n\nD选项想想陨石砸地球，在大气层上方空气阻力<span class=\"math\">\\(f\\)<\/span>不一定与<span class=\"math\">\\(v^2\\)<\/span>成关系", "id": "ep7:296028783697:r6"}]}, {"id": "ep7:299058972960", "module": "energy", "auto": false, "uname": "家是本-湖湘总督", "face": "_imgs/face_704d0bbf909a.jpg", "like": 1, "message": "我就是在处理这样一个问题的时候出现的疑问。这个问题是我从离地球外，距地球高度为 H 的一个地方，抛出一个<span class=\"math\">\\( V_{0} \\)<\/span>速度的小球，然后它贴着这个地球的边做椭圆运动。也就是说它的椭圆轨道哈，这么落下去以后，贴着这个地球移<span class=\"math\">\\( V_{1} \\)<\/span>速度跑过去，这样一个模型里边，我只列， M乘以<span class=\"math\">\\(V_{1}\\)<\/span>乘以<span class=\"math\">\\( R = M\\)<\/span>乘以<span class=\"math\">\\(V_{0} \\)<\/span>乘以括号 R 加 H。 还要列，为什么还要列个能量方程才能卡死这个情境呢？才能榨取掉这个情境的所有信息呢？但是问题是我总感觉哎，好像角动量守恒已经是牛顿第二定律呀，为什么还能量守恒呢？为什么为什么只列角动量守恒会缺失信息呢？会丢失信息呢？我就不理解了。就是还是那个，归根到底还是那个原因，就是我就是我想不，我就是当时我列方程的时候，做不出这个题的时候。我就是缺失了一环，就是我没有想到要去列能量方程，能量守恒方程\n\n为什么列方程的时候角动量守恒和能量守恒两个方程是互相独立的？我怎么感觉好像，既然都是由牛顿运动定律推出来的二级结论。也就是说能量守恒和角动量守恒既然都是从牛顿第二定律推出来的二级结论，为什么它们两个又是独立的方程呢？少一个都不行呢？我只列角动量守恒方程就解不出来，然后我要再列一个方程，为什么这个时候往往列的是能量方程呢？难道说它们两个其实不独立吗？\n\n我是一个没有系统的学习过物理的人，不过也觉得物理很有意思，提出来的问题可能没啥营养，求轻喷。", "raw_message": "我就是在处理这样一个问题的时候出现的疑问。这个问题是我从离地球外，距地球高度为 H 的一个地方，抛出一个 V0 速度的小球，然后它贴着这个地球的边做椭圆运动。也就是说它的椭圆轨道哈，这么落下去以后，贴着这个地球移 V1 速度跑过去，这样一个模型里边，我只列， M乘以V1乘以 R 等于 M乘以V0 乘以括号 R 加 H。 还要列，为什么还要列个能量方程才能卡死这个情境呢？才能榨取掉这个情境的所有信息呢？但是问题是我总感觉哎，好像角动量守恒已经是牛顿第二定律呀，为什么还能量守恒呢？为什么为什么只列角动量守恒会缺失信息呢？会丢失信息呢？我就不理解了。就是还是那个，归根到底还是那个原因，就是我就是我想不，我就是当时我列方程的时候，做不出这个题的时候。我就是缺失了一环，就是我没有想到要去列能量方程，能量守恒方程\n\n为什么列方程的时候角动量守恒和能量守恒两个方程是互相独立的？我怎么感觉好像，既然都是由牛顿运动定律推出来的二级结论。也就是说能量守恒和角动量守恒既然都是从牛顿第二定律推出来的二级结论，为什么它们两个又是独立的方程呢？少一个都不行呢？我只列角动量守恒方程就解不出来，然后我要再列一个方程，为什么这个时候往往列的是能量方程呢？难道说它们两个其实不独立吗？\n\n我是一个没有系统的学习过物理的人，不过也觉得物理很有意思，提出来的问题可能没啥营养，求轻喷。", "images": ["_imgs/img_b379ff95acec.jpg", "_imgs/img_1bc51a1941c1.jpg"], "replies": [{"uname": "bili_38727059351", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "机械能守恒只能决定速度大小的变化而角动量守恒可以决定速度方向变化角动量，角动量是矢量研究转动与动量定理研究直线运动有些像", "id": "ep7:299058972960:r0"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "很简单，二元未知数至少列两个方程才能结，<span class=\"math\">\\(v\\)<\/span>和<span class=\"math\">\\(v_{0}max\\)<\/span>都是未知数。", "id": "ep7:299058972960:r1"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "和弹性碰撞解法类似", "id": "ep7:299058972960:r2"}]}, {"id": "ep7:296037228753", "module": "momentum", "auto": false, "uname": "Luck吉", "face": "_imgs/face_96e7278c55f5.jpg", "like": 2, "message": "机械能守恒，动量守恒，动量守恒定律，动能定理，这些怎么区分啊，看到题目都不知道用哪个", "raw_message": "机械能守恒，动量守恒，动量守恒定律，动能定理，这些怎么区分啊，看到题目都不知道用哪个", "images": [], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "机械能守恒是动能和势能守恒(主要是重力势能与弹性势能的转化)(题目给弹簧，你就可以说根据机械能守恒)\n动量守恒定律顾名思义，只研究动量层面，起始系统mv等于终止mv(不受外力为前提)\n你说的动量守恒(因为动量守恒和动量守恒定律是一个东西)不对，应该是动量定理，这个是研究动量改变本质的，即<span class=\"math\">\\(ft=mv-mv\\)<\/span>，力与速度转化时用\n动能定理侧重动能与势能之间的转化，而非机械能守恒的势能与势能之间\n当然机械能守恒和动能定理本质上可以互换，上文提到的是习惯用法", "id": "ep7:296037228753:r0"}]}, {"id": "ep7:298509582784", "module": "vibration", "auto": false, "uname": "上学人甲", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 4, "message": "这是动量的弹簧模型，A球应该是相对B球做简谐运动，若以B为参照系，建立<span class=\"math\">\\(v-t\\)<\/span>图像，A应该是一个前面系数为v₀的，相位为<span class=\"math\">\\(\\pi /2 - \\omega \\)<\/span>余弦函数，但如果以地面为参考系，又该如何证明A球和B球的<span class=\"math\">\\(v-t\\)<\/span>图像依然是个正/余弦函数图像，小人物理学的不好，可能问得有些幼稚简单，但真的不会，望大佬回答", "raw_message": "这是动量的弹簧模型，A球应该是相对B球做简谐运动，若以B为参照系，建立v-t图像，A应该是一个前面系数为v₀的，相位为π/2 - ω余弦函数，但如果以地面为参考系，又该如何证明A球和B球的v-t图像依然是个正/余弦函数图像，小人物理学的不好，可能问得有些幼稚简单，但真的不会，望大佬回答", "images": ["_imgs/img_dd8a9eb00a26.jpg"], "replies": [{"uname": "继欣", "face": "_imgs/face_b4b1b3c81417.jpg", "like": 2, "message": "以地面为参考系就可以把小球的运动分解成质心的运动和相对质心的运动。因为动量守恒，所以这一个质心做的是一个匀速直线运动，小球又相对这一个质心做的是简谐运动(这里要对两个小球分别列牛顿第二定律，两式相加之后可以得到小球的质量乘以加速度正好就等于他到质心的相对距离)，最后就能得到小球是做一个简谐运动，这样得出来的结果其实更加好理解。", "id": "ep7:298509582784:r0"}, {"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 0, "message": "很值得思考的问题，可惜我不会啊😂，希望大佬现身讲解🤩", "id": "ep7:298509582784:r1"}, {"uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 0, "message": "换到A和B的质心系，然后AB的质心相对地面做匀速直线运动", "id": "ep7:298509582784:r2"}, {"uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 0, "message": "在质心系里面，A和B显然都做简谐运动", "id": "ep7:298509582784:r3"}, {"uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 0, "message": "质心系的含义：选取一个惯性参考系，使得在这个参考系中，A和B的总动量为0", "id": "ep7:298509582784:r4"}]}, {"id": "ep7:296247701809", "module": "vibration", "auto": false, "uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 1, "message": "这道题我完全不知道从哪里入手，怎么确定这个<span class=\"math\">\\(x_{0}\\)<\/span>呢？是什么决定了这个<span class=\"math\">\\(x_{0}\\)<\/span>呢？以及第1个运动过程约束了什么呢？看答案也看得很懵。", "raw_message": "这道题我完全不知道从哪里入手，怎么确定这个x0呢？是什么决定了这个x0呢？以及第1个运动过程约束了什么呢？看答案也看得很懵。", "images": ["_imgs/img_a398dac4740e.jpg", "_imgs/img_0a36e015605a.jpg"], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "题目其实给提示了，把有初速度等效为无初速度，即简谐运动位移最大处。第一个运动过程啥用都没，只是告诉你最终静止在<span class=\"math\">\\(l\\)<\/span>处，下面是具体分析过程https://www.bilibili.com/read/cv47876422 (点蓝字)", "id": "ep7:296247701809:r0"}]}, {"id": "ep7:298504759312", "module": "optics", "auto": false, "uname": "老姑家的咕咕鸡", "face": "_imgs/face_ff176075dea5.jpg", "like": 8, "message": "为什么书本上说“障碍物尺寸和波长差不多时，衍射最明显”？按惠更斯原理，我从子波源的角度考虑，孔或缝的尺寸<span class=\"math\">\\(a\\)<\/span>越小，波面被切得越碎，受到干涉的抵消作用就越弱它不就应该越不“像”直线、衍射就应该越明显吗？为什么是“<span class=\"math\">\\(a\\approx \\lambda \\)<\/span>”而不是“<span class=\"math\">\\(a\\)<\/span>越小越明显”？\n后来我思考波长的角色：为什么一定要和波长<span class=\"math\">\\(\\lambda \\)<\/span>比较？如果缝宽<span class=\"math\">\\(a\\)<\/span>固定，通过的子波数量不就固定了吗？波长的物理意义在这里到底是什么？它如何影响“明显”的程度？以长波长为例，因为相位随距离变化慢，即使缝的两端相距较远，它们发出的子波在相位上仍然比较接近(相位差小)。相位差小，干涉时就不容易互相抵消，容易形成稳定的衍射，所以波能“拐大弯”。\n基于此我得出的结论是衍射现象明显程度与波长正相关，与缝宽负相关。\n那为什么我们做实验和课本结论，都把“<span class=\"math\">\\(a\\approx \\lambda \\)<\/span>”作为一个最佳观察点，而不是“<span class=\"math\">\\(a\\)<\/span>尽可能小”？这里“明显”的定义，是不是悄悄从“物理效应的强度”，切换成了“人眼或仪器的可观测性”？\n所以我推测，当<span class=\"math\">\\(a\\)<\/span>远小于<span class=\"math\">\\(\\lambda (a<<\\lambda )\\)<\/span>时，虽然物理上衍射可能极强，但会导致两个实际问题：第一，通过的能量太弱，图样太暗以至于看不见；第二，可能失去清晰的干涉条纹，变成一片均匀的模糊光斑。 是这样的吗？\n所以，我是否可以这样总结这个矛盾？\n   衍射的物理效应强度，与比值<span class=\"math\">\\( a/\\lambda  \\)<\/span>单调负相关(a越小或<span class=\"math\">\\(\\lambda \\)<\/span>越大，效应越强)。\n   为了让图样同时满足“足够亮”和“条纹清晰” 这两个可观测条件，找到了一个最佳实践点，即<span class=\"math\">\\( a \\approx  \\lambda \\)<\/span>，并在这个语境下定义它为“最明显”。\n以上是我个人的一些想法，希望得到大家的指正", "raw_message": "为什么书本上说“障碍物尺寸和波长差不多时，衍射最明显”？按惠更斯原理，我从子波源的角度考虑，孔或缝的尺寸a越小，波面被切得越碎，受到干涉的抵消作用就越弱它不就应该越不“像”直线、衍射就应该越明显吗？为什么是“a≈λ”而不是“a越小越明显”？\n后来我思考波长的角色：为什么一定要和波长λ比较？如果缝宽a固定，通过的子波数量不就固定了吗？波长的物理意义在这里到底是什么？它如何影响“明显”的程度？以长波长为例，因为相位随距离变化慢，即使缝的两端相距较远，它们发出的子波在相位上仍然比较接近（相位差小）。相位差小，干涉时就不容易互相抵消，容易形成稳定的衍射，所以波能“拐大弯”。\n基于此我得出的结论是衍射现象明显程度与波长正相关，与缝宽负相关。\n那为什么我们做实验和课本结论，都把“a≈λ”作为一个最佳观察点，而不是“a尽可能小”？这里“明显”的定义，是不是悄悄从“物理效应的强度”，切换成了“人眼或仪器的可观测性”？\n所以我推测，当a远小于λ（a<<λ）时，虽然物理上衍射可能极强，但会导致两个实际问题：第一，通过的能量太弱，图样太暗以至于看不见；第二，可能失去清晰的干涉条纹，变成一片均匀的模糊光斑。 是这样的吗？\n所以，我是否可以这样总结这个矛盾？\n   衍射的物理效应强度，与比值 a/λ 单调负相关（a越小或λ越大，效应越强）。\n   为了让图样同时满足“足够亮”和“条纹清晰” 这两个可观测条件，找到了一个最佳实践点，即 a ≈ λ，并在这个语境下定义它为“最明显”。\n以上是我个人的一些想法，希望得到大家的指正", "images": [], "replies": [{"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 2, "message": "这个回答的不对了。一般来说，障碍物尺寸越小就是应该衍射效果越明显，你提问里的思考方式是很对的，就是应该从基本原理(这里是惠更斯原理)出发自己判断，不盲从，但具体怎么用惠更斯原理分析我一会儿细说。如果有人说“衍射图样在尺寸和波长可比的时候最明显”，我觉得他们意思可能是，在尺寸更小的时候就看不到明暗相间的衍射图样了，然而这恰恰是因为波动性的效果太强了，第一条亮纹亮斑都变得很粗，才导致看不到第二条，甚至连第一条暗纹都看不到。最极端的例子就是小孔小到只有一个没有大小的点(也就是半径远小于波长)，此时根据惠更斯原理，那个点就是唯一起作用的子波源，它仍然能发出的波，而且此时整个<span class=\"math\">\\(-90\\)<\/span>度到90度的圆弧屏幕上应该几乎一样亮，因为透过的波是由点状波源发出的，各向同性。如果有人以看不看得见亮暗交替为标准，那现在确实看不见，但此时的图像仍然是衍射的图像，在衍射的语言下，整个屏幕一样亮就是因为此时衍射图样里的零级亮斑很大很大，各个方向都是完美的相长干涉。当然，可能还有些人的意思是“缝太窄了衍射图样整体亮度就暗了，不容易观察”，这是没错的，但这已经不是在讨论波动性了，波动性效果确实是孔越小越显著的。\n再举一个生活中的例子证明：如果对于一般的波来说，都有类似“狭缝的尺寸小于半个波长就都透不过去”的限制，那么我们都听不到一般的声音，因为我们的耳道尺寸才几厘米，而声波频率可以是几百赫兹甚至更低，波长是几米的量级。", "id": "ep7:298504759312:r0"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 1, "message": "下面这位朋友所描述的其实是电磁波(光)在通过有一定厚度的导体材质的小孔时才会有的现象，是针对特定模型的，并不是波动的普遍现象。他说的这种情况下有“半波长”的限制，是因为导体的特点是不允许其表面有顺着表面方向的电场分量(你在静电学里应该学过，理想导体表面的电场必须垂直于理想导体表面，对于电磁波，这仍然成立，AI说到趋肤效应，那是实际的电导率有限的金属材料，也就是不理想的导体才有的，高中生不用细究)。所以如果把有深度的小洞看成一个通道，那么在这个通道的“壁”上电磁波的振幅都像是被一只无形的手“压住”了，必须为零，于是在通道比半个波长还窄的时候，通道里就连一节电磁波的驻波都“塞不下”了(驻波的每一节长度，即波节到波节到距离，刚好是半个波长)，或者说给定波长的电磁波找不到一种“姿势”来满足在两侧的金属界面上振幅都为零，所以就通不过这个洞了。总之，这是具体设定里的特殊现象，并不是对波动性的一般结果，不能以偏概全。", "id": "ep7:298504759312:r1"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "光只能越过超过自己半波长的狭缝🍉", "id": "ep7:298504759312:r2"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @老姑家的咕咕鸡<\/span>  光的传播需要考虑光程差，比如我可以让一个小孔孔径定义为AB，在光越过障碍物之后某个点<span class=\"math\">\\(P\\)<\/span>，定义一个<span class=\"math\">\\(d=|AP-BP|\\)<\/span>，当<span class=\"math\">\\(\\lambda >d\\)<\/span>才可能存在波传播过<span class=\"math\">\\(P\\)<\/span>点，由于一般d&lt;AB，因此波长<span class=\"math\">\\(\\lambda >AB\\)<\/span>的时候，在小孔或者障碍物后面任何地方都可以检测到波，但是当<span class=\"math\">\\(\\lambda <AB\\)<\/span>，只存在一部分可以测到波，因为只有在这个时候<span class=\"math\">\\(\\lambda >d\\)<\/span>——但是当AB太小，小于了二分之一个波长，这个时候光就没有办法拥有足够的能量越过这个障碍物，因此在小孔后面无法看见任何的波，这一点就是我们的微波炉的设计\n\n在微波炉的玻璃罩内部充满着很多的铁丝组成的细孔网状，微波炉的微波常用波长大概在12厘米左右，范围大概是毫米到厘米之间，但是光只有300~850纳米，因此光可以自由出微波炉，但是微波只能约束在一定的范围内无法出来，这也是为什么最后我们的微波炉可以放心使用而不必担心人体受到影响", "id": "ep7:298504759312:r3"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @老姑家的咕咕鸡<\/span> 那你可以想想为什么同为电磁波的光就不会被反射回去", "id": "ep7:298504759312:r4"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @老姑家的咕咕鸡<\/span> 不是因为趋肤效应导致电磁屏蔽失效的问题，趋肤深度是需要对整块导体进行分析，他描述的是你的电流在电磁波的感应下集中在导体表面的深度或者电磁波集中在表面的程度，但是这不是电磁波能够穿透到的最深的深度更不是长波能够反射回去的原因，Al对红外线有良好的吸收性，却对光进行反射，对长波的话波反而会绕开铝，因为你无论用铝制造什么东西，你造不出来无限大的平面\n对于平面波来说，当你在障碍物上面开一个口，他就会有波穿出去，但是有些波就是穿不过一些口，这就是因为它的波长太大出不去，对于长波来说这就像一堵墙一样，但对于光波来说这就是透明的，所以你才能看到里面的物体加热的怎么样，不要觉得物理学上面出现了一个指数函数，就觉得一定存在，物理学不是数学，你在外面的确测不到微波\n\n衍射也分很多种，在真实情况下，你还要考虑物体的厚度，一般认为你平行波穿过的物质本身厚度满足R&gt;孔径<span class=\"math\">\\(^2/\\lambda \\)<\/span>才可能出现衍射🍉", "id": "ep7:298504759312:r5"}]}, {"id": "ep7:296229044401", "module": "circuit", "auto": false, "uname": "一直扬帆的西瓜", "face": "_imgs/face_eece75c586e5.jpg", "like": 0, "message": "我想请问大家关于输出功率和内外电阻配比之间的关系。如果从定义开始，功率为单位时间内做功的快慢。我用<span class=\"math\">\\(R\\)<\/span>分配到的电压<span class=\"math\">\\(x\\)<\/span>干路电流，如此便可以通过均值不等式证明。代数上证明比较容易，最后的结果也比较美观。但可否有更好的解决办法，除了用代数刻画他们之间的关系，还可以用什么别的更符合直觉的方法进行判断吗？总找不到一个合适的理由说服我自己", "raw_message": "我想请问大家关于输出功率和内外电阻配比之间的关系。如果从定义开始，功率为单位时间内做功的快慢。我用R分配到的电压x干路电流，如此便可以通过均值不等式证明。代数上证明比较容易，最后的结果也比较美观。但可否有更好的解决办法，除了用代数刻画他们之间的关系，还可以用什么别的更符合直觉的方法进行判断吗？总找不到一个合适的理由说服我自己", "images": ["_imgs/img_cd97afe2fc9e.jpg"], "replies": [{"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 1, "message": "感觉可以用一下极限🐶在外电阻无限趋近于0时，此时的总电路功率最大但是外电阻占总功率的比值太低，而在外电阻逼近于正无穷时，占的比值最高，但是总电路功率逼近于0，也就是说只有在外电阻在中间左右大小时外功率最大", "id": "ep7:296229044401:r0"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 1, "message": "至于说大小，我感觉可以把内阻类比成一个收费站，在经过它时总要收费，而功率是ui，也就是说不能只让外电阻拿到的最多(电压)，也要让它尽量快(电流)在这两个东西“势均力敌”时应该就是功率最大的时候🐶这只是直觉，如有错误感谢指出🙂", "id": "ep7:296229044401:r1"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @丁真爱测码da<\/span> 说得好，基本不等式本身似乎也可以这么解释", "id": "ep7:296229044401:r2"}]}, {"id": "ep7:295845825745", "module": "em", "auto": false, "uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 10, "message": "大家好呀！依旧是一道电磁感应的题，大家可以看一下内容，讲的很简单，就是一个单棒切割，这个棒是斜着放的，运动的速度垂直于棒，求扫过的面积\n第一种错觉是我一开始做的，后面发现了向下平移也会有面积的增量，所以应该比错解的面积要大，\n但是把图画出来，为什么感觉他们是全等的，可以把那个平行四边形补成正解的长方形，所以这两个不应该相同吗？\n第二个问题，就是我把这个实际速度把它看成一个水平速度的分量，然后再去用错解的平行四边形去做，还真做出来了，这样子做对是蒙中的吗？这有什么道理啊，搞不懂😂", "raw_message": "大家好呀！依旧是一道电磁感应的题，大家可以看一下内容，讲的很简单，就是一个单棒切割，这个棒是斜着放的，运动的速度垂直于棒，求扫过的面积\n第一种错觉是我一开始做的，后面发现了向下平移也会有面积的增量，所以应该比错解的面积要大，\n但是把图画出来，为什么感觉他们是全等的，可以把那个平行四边形补成正解的长方形，所以这两个不应该相同吗？\n第二个问题，就是我把这个实际速度把它看成一个水平速度的分量，然后再去用错解的平行四边形去做，还真做出来了，这样子做对是蒙中的吗？这有什么道理啊，搞不懂[笑哭]", "images": ["_imgs/img_68e902f009b9.jpg"], "replies": [{"uname": "Yao174", "face": "_imgs/face_cba4996b2059.jpg", "like": 4, "message": "楼主错解的原因在于将速度分解为<span class=\"math\">\\(x\\)<\/span>、<span class=\"math\">\\(y\\)<\/span>方向，而只计算了<span class=\"math\">\\(x\\)<\/span>方向面积(在评论区，这点已经被指出🙌)\n   那么楼主“奇思怪想”为什么正确？[鸭科夫_干嘛鸭]\n   如果想利用速度分解的方式得到正确答案，就必须使其中一个分量在运动时对面积没有贡献。\n   而在楼主的“奇思怪想”中，实际就是将速度分解到了沿杆和水平方向，从而只有水平分量对面积有贡献(沿杆位移对面积无影响)，于是得到了正确的结论🐶", "id": "ep7:295845825745:r0"}, {"uname": "J-o-hn", "face": "_imgs/face_d15e5503c330.jpg", "like": 2, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 对，你说的没问题。而且无限长的杆往右下移动，表现出来会很像是杆在水平向右平移，我猜这也是让楼主忽略杆竖直移动的一个诱导因素。如果按照你这样去分析，水平和竖直的移动就拆分的很清晰了。而若想要实现这种等效的“水平右移”，则需要补充一个沿着杆长方向的速度。", "id": "ep7:295845825745:r1"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "没有考虑<span class=\"math\">\\(y\\)<\/span>方向上的位移得到的面积。具体https://www.bilibili.com/read/cv47720821 点击蓝字", "id": "ep7:295845825745:r2"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @J-o-hn<\/span> 对，少乘了<span class=\"math\">\\(\\frac{L}{\\sin \\\\theta}  \\)<\/span>，但我推的时候乘了，没写到解答过程上，结果是对的，你可以相加算一算", "id": "ep7:295845825745:r3"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @J-o-hn<\/span> 楼主是忽略了杆在竖直方向的位移也产生面积", "id": "ep7:295845825745:r4"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @J-o-hn<\/span> 他把速度分为水平和竖直，但是只分析了水平方向上的速度造成的位移，忽略了竖直方向速度造成的位移", "id": "ep7:295845825745:r5"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "错解和正解面积不是相等的，只是图形长得像而已", "id": "ep7:295845825745:r6"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 图片不清楚，补充一下：红色面积指AA'BB'，蓝色面积指AAxBBx", "id": "ep7:295845825745:r7"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @J-o-hn<\/span> 这样比较好理解，上端点和下端点造成的误差可以抵消，只要研究一般的点就好", "id": "ep7:295845825745:r8"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @J-o-hn<\/span> 就是这个意思，端点的下一时刻出范围就不再对面积产生影响了，但是下一个点会移到端点弥补曾经的端点。", "id": "ep7:295845825745:r9"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @J-o-hn<\/span> ✅", "id": "ep7:295845825745:r10"}, {"uname": "J-o-hn", "face": "_imgs/face_d15e5503c330.jpg", "like": 0, "message": "我认为，这与棒的尺寸有关。\n很久没做这类题，印象里给的棒的尺寸都是无限长，即使给的速度方向是你图中标志的方向(右下)，但是由于棒子无限长，也可以认为棒子实际是往正右方向走的。棒子无限长补充了某种速度？\n目前在外面不方便，回去拿笔算算，比如棒子长度如果不是无限长，而是刚好卡住导轨等。", "id": "ep7:295845825745:r11"}, {"uname": "J-o-hn", "face": "_imgs/face_d15e5503c330.jpg", "like": 0, "message": "哦我突然想到了，你可以理解为了满足“棒子卡住导轨”这个条件，有限长的棒子自然有一个往右上的速度。\n意思就是，比如棒子长度刚好卡住导轨，棒子斜向右下走，肯定有一部分会捅出去，然后捅出去的左下这一部分棒子瞬间移到右上缺失的一部分。", "id": "ep7:295845825745:r12"}, {"uname": "J-o-hn", "face": "_imgs/face_d15e5503c330.jpg", "like": 0, "message": "这样的话，原本这个所谓的指向右下的“总速度”<span class=\"math\">\\(v\\)<\/span>，其实也只是一个速度分量，与这个“无限长”杆条件带来的自然的补偿杆长的速度一起，组成了实际水平向右的合速度", "id": "ep7:295845825745:r13"}, {"uname": "J-o-hn", "face": "_imgs/face_d15e5503c330.jpg", "like": 0, "message": "这样看的话，类似“无限长”的条件，都能换成“一个有限长的更实际的物体+一个补偿速度”来替代。欢迎给出反例", "id": "ep7:295845825745:r14"}, {"uname": "J-o-hn", "face": "_imgs/face_d15e5503c330.jpg", "like": 0, "message": "<span class=\"mention\">回复 @J-o-hn<\/span> 呃，感觉这结论下的还是太草率，还是当做一个启发而不是结论吧", "id": "ep7:295845825745:r15"}, {"uname": "J-o-hn", "face": "_imgs/face_d15e5503c330.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 我觉得你考虑的思想有点像微元法，也就是考虑一小段位移前后都在导轨之间的杆，然后分析具体是哪些面积少了，只不过你体现出来的已经是一个求和后的整体了。\n另外，你的推导有些小问题，你说多出来的面积是vt减去vx...，这里你似乎少乘了一项？毕竟vt只是长度，而长度乘长度才是面积。不然后面的推导我觉得不对，你再看看。", "id": "ep7:295845825745:r16"}, {"uname": "J-o-hn", "face": "_imgs/face_d15e5503c330.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 为什么你能得到“上端点和下端点造成的误差抵消”这个结论呢？归根到底还是因为杆是无限长，否则无法抵消。\n所以我认为，楼主会得出错解的原因是没有考虑到杆无限长这个条件，“无限”的东西往往有点反直觉。\n借助你的方法，如果我们去考虑导轨边界的点，我相信一下就能证明“杆长无限”是“上下误差抵消”的一个必要条件，有空我再算算", "id": "ep7:295845825745:r17"}, {"uname": "J-o-hn", "face": "_imgs/face_d15e5503c330.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 嗯", "id": "ep7:295845825745:r18"}]}, {"id": "ep7:295941556641", "module": "em", "auto": false, "uname": "-Sir-xiao", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 9, "message": "我对一个电磁感应中的一个特殊例子很好奇，这个例子中导体棒受恒力运动，同时向电路中电容器充电，最终计算可得这个导体棒做匀加速运动。大多数这样的例子中始末状态通常由题目给出来求解其他量(比如电荷量，热量，运动距离等)，为什么在这个例子中运动就这么确定呢？还有一个小问题，我的物理老师在讲这道题的时候说<span class=\"math\">\\(B^2L^2C\\)<\/span>可以看做m'，这仅仅是量纲上的一致还是有什么物理含义呢？", "raw_message": "我对一个电磁感应中的一个特殊例子很好奇，这个例子中导体棒受恒力运动，同时向电路中电容器充电，最终计算可得这个导体棒做匀加速运动。大多数这样的例子中始末状态通常由题目给出来求解其他量（比如电荷量，热量，运动距离等），为什么在这个例子中运动就这么确定呢？还有一个小问题，我的物理老师在讲这道题的时候说B²L²C可以看做m'，这仅仅是量纲上的一致还是有什么物理含义呢？", "images": ["_imgs/img_b6f1dd919a50.jpg"], "replies": [{"uname": "Atomphysics", "face": "_imgs/face_19704788688b.jpg", "like": 4, "message": "如果你能写出其能量表达式 会发现其在能量公式中和质量的地位是一样的 于是我们可以看成等效质量", "id": "ep7:295941556641:r0"}, {"uname": "Atomphysics", "face": "_imgs/face_19704788688b.jpg", "like": 2, "message": "<span class=\"mention\">回复 @Atomphysics<\/span> 这种思考方式有点接近以后物理系的理论力学的思维 先处理系统的能量", "id": "ep7:295941556641:r1"}, {"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 1, "message": "这一类题目都可以从动量守恒的角度去思考。", "id": "ep7:295941556641:r2"}, {"uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 1, "message": "好多网红老师把它称为增重，量纲上刚好凑巧配成了质量，这样子提供了一种快的解题思路，你要是想老老实实做出来的话，还是要列\n三不七类四微元", "id": "ep7:295941556641:r3"}, {"uname": "老姑家的咕咕鸡", "face": "_imgs/face_ff176075dea5.jpg", "like": 1, "message": "https://b23.tv/BV1DcDDBHE2a  评论区好像发不了图片，我就把它弄成动态了，这是我从高二生视角得出的一些想法", "id": "ep7:295941556641:r4"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 1, "message": "与其说是这个运动状态确定不如说是这个运动状态在其他背景下是比较简单的，在时间或者速度等等量在确定的情况下(磁场和杆质量等等不变)无论电路中是怎样接一个电源或用电器都确定好了，状态已经锁死了，只不过在直观下这个匀加速运动相对于其他变加速或变加速更容易求解而已🐶", "id": "ep7:295941556641:r5"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 1, "message": "而对于这个等效质量我倒认为不只是量纲上的一致🙂", "id": "ep7:295941556641:r6"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 1, "message": "与其说是量纲不如说是等效质量，在<span class=\"math\">\\(f\\)<\/span>做功时能量会转化为杆的动能和电容器的能量，电容器能量应该与qu成正比(电容器总能量应该是搬运电荷做的功)而在电容中<span class=\"math\">\\(q=cu\\)<\/span>就可以转化为<span class=\"math\">\\(cu^2\\)<\/span>，<span class=\"math\">\\(u\\)<\/span>又应该等于杆产生的感应电动势，转化为<span class=\"math\">\\(b^2l^2cv^2\\)<\/span>，而这个式子与二分之一<span class=\"math\">\\(mv^2\\)<\/span>在数学公式下应该是同源的，并且在电路系统中电容也就是反抗电压变化的，这个阻碍就应该是在力学上等效<span class=\"math\">\\(m\\)<\/span>的表现🐶", "id": "ep7:295941556641:r7"}, {"uname": "Physicscw_GWDM", "face": "_imgs/face_540d3fe8596d.jpg", "like": 1, "message": "运动简单是因为电磁力<span class=\"math\">\\(F\\)<\/span>正比于当前的运动加速度<span class=\"math\">\\(a\\)<\/span>，可以把<span class=\"math\">\\(a\\)<\/span>提出来。\nF正比<span class=\"math\">\\(a\\)<\/span>是因为<span class=\"math\">\\(F\\)<\/span>正比电流<span class=\"math\">\\(i\\)<\/span>，<span class=\"math\">\\(i\\)<\/span>正比感应电动势<span class=\"math\">\\(U\\)<\/span>的变化率，<span class=\"math\">\\(U\\)<\/span>正比切割速度<span class=\"math\">\\(v\\)<\/span>，也就是<span class=\"math\">\\(F\\)<\/span>正比<span class=\"math\">\\(v\\)<\/span>的变化率。", "id": "ep7:295941556641:r8"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @有名等<\/span> 电流不是零吧", "id": "ep7:295941556641:r9"}]}, {"id": "ep7:295940573457", "module": "em", "auto": false, "uname": "-Sir-xiao", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 4, "message": "我对阿拉果圆盘(磁场如图分布的转动圆盘)中涡流的产生仍然不明白，这里是我的一个想法，我不明白它与法拉第圆盘的区别，希望能得到解答！", "raw_message": "我对阿拉果圆盘（磁场如图分布的转动圆盘）中涡流的产生仍然不明白，这里是我的一个想法，我不明白它与法拉第圆盘的区别，希望能得到解答！", "images": ["_imgs/img_a5fa67485bbe.jpg"], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "外电路打破静电平衡。\n不接外电路就没有电流", "id": "ep7:295940573457:r0"}, {"uname": "雷苇航", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "可是阿拉果圆盘内部会有涡流", "id": "ep7:295940573457:r1"}, {"uname": "雷苇航", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "所以为什么会产生涡流呢，涡流在电动势条件的基础上还要什么额外的条件吗？", "id": "ep7:295940573457:r2"}, {"uname": "雷苇航", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @史蒂夫2332<\/span> 这里所指的电场只是等效电场啊，并不是真的电场", "id": "ep7:295940573457:r3"}, {"uname": "雷苇航", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @史蒂夫2332<\/span> 法拉第圆盘也可以视为内部有电场，但是并没有形成电流啊，或者说当我们画出电场分布，那下一步应该做些什么来判断有没有电流的形成呢？", "id": "ep7:295940573457:r4"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "涡流是闭合的", "id": "ep7:295940573457:r5"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 涡流是闭合的", "id": "ep7:295940573457:r6"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @雷苇航<\/span> 只要有电场一定有电流", "id": "ep7:295940573457:r7"}]}, {"id": "ep7:298554392512", "module": "em", "auto": false, "uname": "枪与她", "face": "_imgs/face_e5ba64cf556b.jpg", "like": 3, "message": "求教", "raw_message": "求教", "images": ["_imgs/img_64987b604114.jpg"], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 2, "message": "https://www.bilibili.com/read/cv47806524 (点这几个蓝字)，分析过程中有我画的图以及几何证明，如果没时间看的话，我在这里简述一下，根据磁聚焦的性质可以证明出<span class=\"math\">\\(x_{0}=2\\sin \\\\theta  (\\)<\/span>即<span class=\"math\">\\(x_{0}\\)<\/span>与<span class=\"math\">\\(\\sin \\\\theta  \\)<\/span>成线形关系)，而<span class=\"math\">\\(\\sin \\\\theta  \\)<\/span>和<span class=\"math\">\\(\\\\theta  \\)<\/span>是非线性关系，故<span class=\"math\">\\(x_{0}\\)<\/span>与<span class=\"math\">\\(\\\\theta  \\)<\/span>不成线形关系，自然<span class=\"math\">\\(\\\\theta  \\)<\/span>就不和<span class=\"math\">\\(x_{0}\\)<\/span>一样线形分布(就是你说的均匀分布)", "id": "ep7:298554392512:r0"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "同学，给你个建议🐶下一次提问时可以在评论中增加些文字说明，不要光摆个图并且图还是反着放的🐶这样回复的人就不会这么稀少了", "id": "ep7:298554392512:r1"}, {"uname": "物你学家", "face": "_imgs/face_a2beefec54a5.jpg", "like": 0, "message": "同意楼上同学说的。我看了群里的讨论，其实你这是个很好的问题，建议加一段文字说明，好让更多的同学明白你的问题是什么", "id": "ep7:298554392512:r2"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> <span class=\"math\">\\(x_{0}\\)<\/span>为MH上任意一点到<span class=\"math\">\\(M\\)<\/span>的距离", "id": "ep7:298554392512:r3"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 之所以这样想是因为三角函数往往与边与直接关系，通过三角函数为桥梁方便研究边与角的关系", "id": "ep7:298554392512:r4"}]}, {"id": "ep7:295940137697", "module": "em", "auto": false, "uname": "-Sir-xiao", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 3, "message": "我对如何选取合适的观测区域进而从磁通量变化的角度确定感应电动势与感应电流仍不明白，下面是我举出的一个不明白的例子，希望能得到解答！", "raw_message": "我对如何选取合适的观测区域进而从磁通量变化的角度确定感应电动势与感应电流仍不明白，下面是我举出的一个不明白的例子，希望能得到解答！", "images": ["_imgs/img_60ce790903d6.jpg"], "replies": [{"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 1, "message": "一根棒切割磁感线也是会产生感应电动势的，说明感应电动势的产生和回路是不是闭合没有关系。感应电动势是怎么产生的？这你要从微观上来看电子的行为。电子随着棒子一起动的话，他在磁场里必然会受到洛伦兹力，那电子是不是一定会动？", "id": "ep7:295940137697:r0"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 1, "message": "<span class=\"mention\">回复 @史蒂夫2332<\/span> 楼主问的不就是动生电动势吗🐶", "id": "ep7:295940137697:r1"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 1, "message": "<span class=\"mention\">回复 @雷苇航<\/span> 你想想一颗电池，如果不接导线的话会有电流吗？但是不接导线，是不是还是有电动势？那接不接导线的区别是什么？就是有没有形成闭合回路。所以形成感应电动势并不一定会形成感应电流", "id": "ep7:295940137697:r2"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "从宏观上不好解释，但本题可以用很简单的微元法分析，即\n圆环下落时，环上每一点都在垂直切割径向磁感线，用洛伦兹力判断动生电动势方向：\n速度 v：竖直向下\n磁场 B：水平径向向外\n由<span class=\"math\">\\( F=qvB\\)<\/span>可得导体中自由电子受到的洛伦兹力方向为顺时针切线方向\n因此正电荷的运动方向(感应电流方向)为逆时针切线方向\n如果硬要宏观的话，等效曲面(以圆环为上边界等效一个圆柱侧面)(法拉第定律允许使用以回路为边界的任意曲面)，<span class=\"math\">\\(\\Phi \\)<\/span>减小，为抑制减小，感应电动势由此产生", "id": "ep7:295940137697:r3"}, {"uname": "雷苇航", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "这个问题往期也有问过，可以尝试把磁感线补充完全(在磁体内部)，这样就可以发现磁通量是在变化的，是一致的了", "id": "ep7:295940137697:r4"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @史蒂夫2332<\/span> 哦，我知道了，我不应该用“感应电动势”这个词的很容易被看错😂", "id": "ep7:295940137697:r5"}, {"uname": "雷苇航", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 会一定动，但是涡流不就是会一直动下去吗，什么时候电子回一直动下去而不仅仅是被甩到边上呢", "id": "ep7:295940137697:r6"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 那是动生电动势", "id": "ep7:295940137697:r7"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 感生电动势是磁动化电", "id": "ep7:295940137697:r8"}]}, {"id": "ep7:295846182209", "module": "em", "auto": false, "uname": "求进步的祁厅长", "face": "_imgs/face_c311e1174576.jpg", "like": 2, "message": "我们学校的老师没有很系统的讲不等距切割模型，后面两个的导体就省略不画了\n当这个棒运动到不等距的交界处，能画一下这个e和<span class=\"math\">\\(t\\)<\/span>的图像吗，不知道自己画的对不对？\n然后呢由这个前两幅图类推到第三步的线性变化，那这样子的图像又长什么样呢？\n(这些思考都过去半年了，年代久远到我自己都忘记想问什么了，大家就可以把想法发出来，给我补充科普一下)\n还有就是最后一类，不线性变化，我记得哪一年？高考题还是模拟题考过？他讲的是抛物线，选项里还有让你求最终停下时扫过的面积的", "raw_message": "我们学校的老师没有很系统的讲不等距切割模型，后面两个的导体就省略不画了\n当这个棒运动到不等距的交界处，能画一下这个e和t的图像吗，不知道自己画的对不对？\n然后呢由这个前两幅图类推到第三步的线性变化，那这样子的图像又长什么样呢？\n（这些思考都过去半年了，年代久远到我自己都忘记想问什么了，大家就可以把想法发出来，给我补充科普一下）\n还有就是最后一类，不线性变化，我记得哪一年？高考题还是模拟题考过？他讲的是抛物线，选项里还有让你求最终停下时扫过的面积的", "images": ["_imgs/img_d3902a58fc43.jpg", "_imgs/img_e61da66d3a74.jpg"], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @求进步的祁厅长<\/span> <span class=\"math\">\\(v\\)<\/span>在时间上积分等于<span class=\"math\">\\(x\\)<\/span>，和你说的<span class=\"math\">\\(q=\\)<\/span>德尔塔<span class=\"math\">\\(\\Phi \\)<\/span>比<span class=\"math\">\\(R\\)<\/span>是同源的", "id": "ep7:295846182209:r0"}, {"uname": "天际老猫", "face": "_imgs/face_46b92af98521.jpg", "like": 0, "message": "那个面积的话，写运动方程，再对时间积分就可以了(好像2025湖南考过这个🐶)", "id": "ep7:295846182209:r1"}, {"uname": "可叵可", "face": "_imgs/face_62772df98f9b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @求进步的祁厅长<\/span> 他的意思应该就是用动量定理吧，对时间积分", "id": "ep7:295846182209:r2"}]}, {"id": "ep7:298875809744", "module": "em", "auto": false, "uname": "bili_38727059351", "face": "_imgs/face_0e41c09d6c32.j
