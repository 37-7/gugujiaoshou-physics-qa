let page = 1;
const PAGE_SIZE = 12;
let ALL = [];
let lbList = [], lbIdx = 0, lbScale = 1, lbRot = 0, lbTx = 0, lbTy = 0;

/* ---------- localStorage: 收藏 / 已阅 ---------- */
const LS_FAV = 'wb_phys_fav', LS_SEEN = 'wb_phys_seen';
function getLS(k){ try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e){ return []; } }
function setLS(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
let favIds = getLS(LS_FAV), seenIds = getLS(LS_SEEN);

/* ---------- 预构建扁平列表 ---------- */
function buildAll(){
  ALL = [];
  DATA.episodes.forEach(e => {
    e.comments.forEach(c => {
      const replyText = c.replies.map(r => r.message.replace(/<[^>]+>/g, '')).join(' ');
      const searchKey = (c.uname + ' ' + c.raw_message + ' ' + replyText).toLowerCase();
      ALL.push({ epKey: e.key, epTitle: e.title, c, searchKey });
    });
  });
}

/* ---------- 侧栏筛选 ---------- */
function buildSidebar(){
  const epWrap = document.getElementById('epFilters');
  epWrap.innerHTML = '';
  DATA.episodes.forEach(e => epWrap.appendChild(makeChip(e.key, e.title, e.comments.length, selEps, null)));
  const modWrap = document.getElementById('modFilters');
  modWrap.innerHTML = '';
  const modCount = {};
  ALL.forEach(o => modCount[o.c.module] = (modCount[o.c.module] || 0) + 1);
  DATA.modules.forEach(m => { if (modCount[m.key]) modWrap.appendChild(makeChip(m.key, m.name, modCount[m.key], selMods, m.color)); });
}
function makeChip(key, label, cnt, setObj, color){
  const el = document.createElement('label');
  el.className = 'fchip' + (setObj.has(key) ? ' on' : '');
  el.innerHTML = (color ? `<span class="mdot" style="background:${color}"></span>` : '<span class="box"></span>')
    + `${label}<span class="cnt">${cnt}</span>`;
  el.onclick = () => { if (setObj.has(key)) setObj.delete(key); else setObj.add(key); el.classList.toggle('on'); page = 1; render(); };
  return el;
}

/* ---------- 候选集（筛选 + 收藏 + 已阅） ---------- */
function getCandidate(){
  let arr = ALL.filter(o => !seenIds.includes(o.c.id));
  if (favOnly) arr = arr.filter(o => favIds.includes(o.c.id));
  if (scopeMode !== 'all') {
    arr = arr.filter(o => (selEps.size === 0 || selEps.has(o.epKey)) && (selMods.size === 0 || selMods.has(o.c.module)));
  }
  return arr;
}

function epTitleOf(k){ const e = DATA.episodes.find(x => x.key === k); return e ? e.title : k; }
function heroTitleText(){
  if (scopeMode === 'all') return '全库搜索范围';
  const eps = selEps.size ? [...selEps].sort().map(epTitleOf).join('、') : '全部期数';
  const mods = selMods.size ? [...selMods].map(k => MODMAP[k].name).join('、') : '所有模块';
  return eps + ' · ' + mods;
}

/* ---------- 文本渲染（无展开/收起） ---------- */
function makeMsg(wrap, text){
  wrap.className = wrap.classList.contains('r-msg') ? 'r-msg' : 'c-msg';
  wrap.innerHTML = text;
}

function renderCommentCard(c, modColor, epTitle, modName){
  const card = document.createElement('div');
  card.className = 'c-card';
  card.style.setProperty('--card-accent', modColor);
  card.style.setProperty('--avatar-accent', modColor);
  if (colorOn && c.uname === UP_NAME) card.classList.add('op');
  card.dataset.id = c.id;
  const top = document.createElement('div');
  top.className = 'c-top';
  const av = document.createElement('div');
  av.className = 'avatar';
  if (c.face) {
    const img = document.createElement('img');
    img.src = c.face; img.loading = 'lazy';
    img.onerror = () => { av.textContent = c.uname[0] || '?'; };
    av.appendChild(img);
  } else av.textContent = c.uname[0] || '?';
  top.appendChild(av);
  const un = document.createElement('div');
  un.style.flex = '1'; un.style.minWidth = '0';
  let unHtml = `<div class="uname">${c.uname}`;
  if (c.auto) unHtml += '<span class="tag">自动分类</span>';
  if (c.uname === UP_NAME) unHtml += '<span class="tag op">UP主</span>';
  unHtml += '</div>';
  un.innerHTML = unHtml;
  const chips = document.createElement('div');
  chips.className = 'chips';
  chips.innerHTML = `<span class="chip ep">${epTitle}</span><span class="chip mod" style="background:${modColor}">${modName}</span>`;
  un.appendChild(chips);
  top.appendChild(un);
  const like = document.createElement('div');
  like.className = 'like';
  like.innerHTML = `<span class="h">♥</span>${c.like}`;
  top.appendChild(like);
  const act = document.createElement('div');
  act.className = 'c-actions';
  const favBtn = document.createElement('span');
  favBtn.className = 'c-btn' + (favIds.includes(c.id) ? ' faved' : '');
  favBtn.textContent = favIds.includes(c.id) ? '★ 已收藏' : '☆ 收藏';
  favBtn.onclick = (e) => { e.stopPropagation(); toggleFav(c.id); };
  const seenBtn = document.createElement('span');
  seenBtn.className = 'c-btn';
  seenBtn.textContent = '☑ 已阅';
  seenBtn.onclick = (e) => { e.stopPropagation(); markSeen(c.id); };
  act.appendChild(favBtn); act.appendChild(seenBtn);
  top.appendChild(act);
  card.appendChild(top);
  const msg = document.createElement('div');
  makeMsg(msg, c.message);
  card.appendChild(msg);
  if (c.images.length) {
    const grid = document.createElement('div');
    grid.className = 'img-grid' + (c.images.length === 1 ? ' one' : '');
    c.images.forEach((u, i) => {
      if (/^_imgs\//.test(u)) {
        const im = document.createElement('img');
        im.src = u; im.loading = 'lazy'; im.alt = '题图 ' + (i + 1);
        im.onerror = () => { im.style.display = 'none'; };
        im.onclick = () => openLightbox(c.images, i);
        grid.appendChild(im);
      } else {
        const miss = document.createElement('div');
        miss.className = 'img-miss';
        miss.textContent = '⚠ 题图未能下载到本地（' + (i + 1) + '）';
        grid.appendChild(miss);
      }
    });
    card.appendChild(grid);
  }
  if (c.replies.length) {
    const rw = document.createElement('div');
    rw.className = 'replies';
    const rh = document.createElement('div');
    rh.className = 'replies-head';
    rh.innerHTML = `<span class="count">${c.replies.length}</span> 条回复`;
    rw.appendChild(rh);
    c.replies.forEach(r => {
      const item = document.createElement('div');
      item.className = 'r-item';
      const rav = document.createElement('div');
      rav.className = 'avatar';
      if (r.face) {
        const img = document.createElement('img');
        img.src = r.face; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
        img.onerror = () => { rav.textContent = r.uname[0] || '?'; };
        rav.appendChild(img);
      } else rav.textContent = r.uname[0] || '?';
      item.appendChild(rav);
      const box = document.createElement('div');
      box.className = 'r-box';
      const rtop = document.createElement('div');
      rtop.className = 'r-top';
      rtop.innerHTML = `<div class="uname">${r.uname}</div><div class="r-like"><span class="h">♥</span>${r.like}</div>`;
      box.appendChild(rtop);
      const rmsg = document.createElement('div');
      makeMsg(rmsg, r.message);
      box.appendChild(rmsg);
      item.appendChild(box);
      rw.appendChild(item);
    });
    card.appendChild(rw);
  }
  return card;
}

/* ---------- 主渲染 ---------- */
function render(){
  const sectionsEl = document.getElementById('sections');
  sectionsEl.innerHTML = '';
  document.getElementById('heroTitle').textContent = heroTitleText();

  let list = getCandidate();
  const q = document.getElementById('search').value.trim().toLowerCase();
  if (q) list = list.filter(o => o.searchKey.includes(q));
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (page > pages) page = pages;
  const start = (page - 1) * PAGE_SIZE;
  const slice = list.slice(start, start + PAGE_SIZE);

  let lastEp = null;
  slice.forEach(o => {
    if (o.epKey !== lastEp) {
      lastEp = o.epKey;
      const n = slice.filter(x => x.epKey === o.epKey).length;
      const b = document.createElement('div');
      b.className = 'ep-banner';
      b.id = 'ep-' + o.epKey;
      b.innerHTML = `<span class="badge">${o.epTitle}</span><span class="meta">${o.epKey.toUpperCase()} · 本页该期 ${n} 条</span>`;
      sectionsEl.appendChild(b);
    }
    const mod = MODMAP[o.c.module];
    sectionsEl.appendChild(renderCommentCard(o.c, mod.color, o.epTitle, mod.name));
  });

  document.getElementById('empty').style.display = total ? 'none' : 'block';
  document.getElementById('heroSub').textContent = `共 ${total} 条匹配 · 第 ${page} / ${pages} 页`;
  document.getElementById('sideFoot').textContent = `共 ${ALL.length} 问 · ${favIds.length} 收藏 · ${seenIds.length} 已阅`;
  document.getElementById('favCount').textContent = favIds.length;
  document.getElementById('seenCount').textContent = seenIds.length;
  document.getElementById('favBtn').classList.toggle('on', favOnly);
  document.getElementById('scopeSel').value = scopeMode;

  buildPager(pages, total);

  if (window.renderMathInElement) {
    try { renderMathInElement(sectionsEl, { delimiters: [{ left: '\\(', right: '\\)', display: false }], throwOnError: false }); } catch (e) {}
  }
  if (q) highlightWalk(sectionsEl, q);
  if (colorOn) colorizeWalk(sectionsEl);
}

/* ---------- 分页 ---------- */
function pageNums(cur, total){
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  const res = [1];
  if (cur > 3) res.push('...');
  for (let n = Math.max(2, cur - 1); n <= Math.min(total - 1, cur + 1); n++) res.push(n);
  if (cur < total - 2) res.push('...');
  res.push(total);
  return res;
}
function buildPager(pages, total){
  const p = document.getElementById('pager');
  p.innerHTML = '';
  const info = document.createElement('span');
  info.className = 'pginfo';
  info.textContent = `共 ${total} 条 · 第 ${page} / ${pages} 页`;
  p.appendChild(info);
  const mk = (label, pg, dis) => {
    const b = document.createElement('button');
    b.className = 'pg' + (pg === page ? ' active' : '');
    b.textContent = label; b.disabled = dis;
    b.onclick = () => { page = pg; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    p.appendChild(b);
  };
  mk('‹ 上一页', page - 1, page <= 1);
  pageNums(page, pages).forEach(n => {
    if (n === '...') { const s = document.createElement('span'); s.className = 'pellipsis'; s.textContent = '…'; p.appendChild(s); }
    else mk(String(n), n, false);
  });
  mk('下一页 ›', page + 1, page >= pages);
}

/* ---------- 着色 ---------- */
const LAWS = ['基尔霍夫电流定律','基尔霍夫电压定律','基尔霍夫定律','欧姆定律','戴维南定理','柯尼希定理','楞次定律','法拉第电磁感应定律','安培定律','库仑定律','动量守恒定律','能量守恒定律','机械能守恒定律','万有引力定律','胡克定律','伯努利方程','叠加原理','牛顿第二定律','牛顿第三定律','开普勒第三定律','开普勒定律','热力学第一定律','热力学第二定律','阿基米德原理'];
const lawAlt = LAWS.slice().sort((a, b) => b.length - a.length).map(s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
const TOKEN = new RegExp('(' + lawAlt + ')|@([\\u4e00-\\u9fff\\w]{1,30})|([A-Za-z]+)|([0-9]+)', 'g');
function esc(s){ return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function colorizeStr(s){
  let out = '', last = 0, m;
  TOKEN.lastIndex = 0;
  while ((m = TOKEN.exec(s))) {
    out += esc(s.slice(last, m.index));
    if (m[1] !== undefined) out += '<span class="vc-law">' + esc(m[1]) + '</span>';
    else if (m[2] !== undefined) out += '<span class="vc-at">@' + esc(m[2]) + '</span>';
    else if (m[3] !== undefined) out += '<span class="vc-var">' + esc(m[3]) + '</span>';
    else if (m[4] !== undefined) out += '<span class="vc-num">' + esc(m[4]) + '</span>';
    last = m.index + m[0].length;
  }
  out += esc(s.slice(last));
  return out;
}
function colorizeWalk(container){
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      let p = n.parentNode;
      while (p && p !== container){
        if (p.classList && (p.classList.contains('math') || p.classList.contains('katex'))) return NodeFilter.FILTER_REJECT;
        if (p.tagName === 'A' || p.tagName === 'SCRIPT' || p.tagName === 'STYLE') return NodeFilter.FILTER_REJECT;
        p = p.parentNode;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const html = colorizeStr(n.nodeValue);
    if (html === esc(n.nodeValue)) return;
    const tmp = document.createElement('span');
    tmp.innerHTML = html;
    const frag = document.createDocumentFragment();
    while (tmp.firstChild) frag.appendChild(tmp.firstChild);
    n.parentNode.replaceChild(frag, n);
  });
}
/* ---------- 搜索高亮（在 KaTeX 渲染后、着色前执行）---------- */
function highlightWalk(root, q){
  const skipTags = new Set(['A','SCRIPT','STYLE','IMG']);
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if (!n.nodeValue) return NodeFilter.FILTER_REJECT;
      if (n.nodeValue.toLowerCase().indexOf(q) === -1) return NodeFilter.FILTER_REJECT;
      let p = n.parentNode;
      while (p && p !== root){
        if (p.classList && (p.classList.contains('math') || p.classList.contains('katex'))) return NodeFilter.FILTER_REJECT;
        if (skipTags.has(p.tagName)) return NodeFilter.FILTER_REJECT;
        p = p.parentNode;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  let t; while (t = walker.nextNode()) nodes.push(t);
  nodes.forEach(n => {
    const text = n.nodeValue, low = text.toLowerCase();
    const frag = document.createDocumentFragment();
    let last = 0, idx;
    while ((idx = low.indexOf(q, last)) !== -1){
      if (idx > last) frag.appendChild(document.createTextNode(text.slice(last, idx)));
      const m = document.createElement('mark');
      m.className = 'hl';
      m.textContent = text.slice(idx, idx + q.length);
      frag.appendChild(m);
      last = idx + q.length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });
}

/* ---------- 灯箱 ---------- */
function openLightbox(list, i){
  lbList = list; lbIdx = i; lbScale = 1; lbRot = 0; lbTx = 0; lbTy = 0; updateLightbox();
  document.getElementById('lightbox').classList.add('open');
}
function applyTransform(){ document.getElementById('lbImg').style.transform = `translate(${lbTx}px,${lbTy}px) rotate(${lbRot}deg) scale(${lbScale})`; }
function updateLightbox(){
  const u = lbList[lbIdx];
  document.getElementById('lbImg').src = u;
  document.getElementById('lbInfo').textContent = (lbIdx + 1) + ' / ' + lbList.length + '　滚轮缩放 · 拖动平移';
  document.getElementById('lbOrig').href = u;
  document.getElementById('lbDl').onclick = () => { const a = document.createElement('a'); a.href = u; a.download = u.split('/').pop(); document.body.appendChild(a); a.click(); a.remove(); };
  applyTransform();
}
const lbBox = document.getElementById('lightbox');
document.getElementById('lbClose').onclick = () => lbBox.classList.remove('open');
document.getElementById('lbPrev').onclick = e => { e.stopPropagation(); lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; lbScale = 1; lbRot = 0; lbTx = 0; lbTy = 0; updateLightbox(); };
document.getElementById('lbNext').onclick = e => { e.stopPropagation(); lbIdx = (lbIdx + 1) % lbList.length; lbScale = 1; lbRot = 0; lbTx = 0; lbTy = 0; updateLightbox(); };
document.getElementById('lbZoomIn').onclick = () => { lbScale *= 1.25; applyTransform(); };
document.getElementById('lbZoomOut').onclick = () => { lbScale /= 1.25; applyTransform(); };
document.getElementById('lbReset').onclick = () => { lbScale = 1; lbRot = 0; lbTx = 0; lbTy = 0; applyTransform(); };
document.getElementById('lbRotL').onclick = () => { lbRot -= 90; applyTransform(); };
document.getElementById('lbRotR').onclick = () => { lbRot += 90; applyTransform(); };
const lbStage = document.getElementById('lbStage');
lbStage.addEventListener('wheel', e => { e.preventDefault(); lbScale *= (e.deltaY < 0 ? 1.15 : 1 / 1.15); lbScale = Math.min(8, Math.max(0.1, lbScale)); applyTransform(); }, { passive: false });
let dragging = false, sx = 0, sy = 0;
lbStage.addEventListener('mousedown', e => { if (e.target.tagName === 'IMG') { dragging = true; sx = e.clientX - lbTx; sy = e.clientY - lbTy; lbStage.classList.add('grabbing'); } });
window.addEventListener('mousemove', e => { if (dragging) { lbTx = e.clientX - sx; lbTy = e.clientY - sy; applyTransform(); } });
window.addEventListener('mouseup', () => { dragging = false; lbStage.classList.remove('grabbing'); });
lbBox.addEventListener('click', e => { if (e.target.id === 'lightbox') lbBox.classList.remove('open'); });
document.addEventListener('keydown', e => {
  if (!lbBox.classList.contains('open')) return;
  if (e.key === 'Escape') lbBox.classList.remove('open');
  if (e.key === 'ArrowLeft') { lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; lbScale = 1; lbRot = 0; lbTx = 0; lbTy = 0; updateLightbox(); }
  if (e.key === 'ArrowRight') { lbIdx = (lbIdx + 1) % lbList.length; lbScale = 1; lbRot = 0; lbTx = 0; lbTy = 0; updateLightbox(); }
  if (e.key === '+' || e.key === '=') { lbScale *= 1.25; applyTransform(); }
  if (e.key === '-') { lbScale /= 1.25; applyTransform(); }
  if (e.key === '0') { lbScale = 1; lbRot = 0; lbTx = 0; lbTy = 0; applyTransform(); }
});

/* ---------- 收藏 / 已阅 ---------- */
function toggleFav(id){
  const i = favIds.indexOf(id);
  if (i >= 0) favIds.splice(i, 1); else favIds.push(id);
  setLS(LS_FAV, favIds);
  if (favOnly) render(); else updateCardButtons();
}
function markSeen(id){
  if (!seenIds.includes(id)) seenIds.push(id);
  setLS(LS_SEEN, seenIds);
  render();
}
function updateCardButtons(){
  document.querySelectorAll('.c-card').forEach(card => {
    const id = card.dataset.id;
    const btn = card.querySelector('.c-btn');
    if (btn) { const on = favIds.includes(id); btn.classList.toggle('faved', on); btn.textContent = on ? '★ 已收藏' : '☆ 收藏'; }
  });
  document.getElementById('favCount').textContent = favIds.length;
}
document.getElementById('favBtn').onclick = () => { favOnly = !favOnly; page = 1; render(); };
document.getElementById('seenBtn').onclick = () => openSeenModal();

function openSeenModal(){
  const body = document.getElementById('modalBody');
  document.getElementById('modalTitle').textContent = '已阅历史（' + seenIds.length + '）';
  body.innerHTML = '';
  if (!seenIds.length) {
    body.innerHTML = '<div class="modal-empty">还没有标记已阅的题目。</div>';
  } else {
    const byId = {};
    DATA.episodes.forEach(e => e.comments.forEach(c => byId[c.id] = { ep: e.title, c }));
    seenIds.forEach(id => {
      const o = byId[id];
      const it = document.createElement('div');
      it.className = 'seen-item';
      const t = document.createElement('div');
      t.className = 't';
      t.textContent = o ? o.c.uname + '：' + o.c.raw_message.slice(0, 60) : id;
      it.appendChild(t);
      const ep = document.createElement('span');
      ep.className = 'ep';
      ep.textContent = o ? o.ep : '';
      it.appendChild(ep);
      const btn = document.createElement('button');
      btn.textContent = '恢复显示';
      btn.onclick = () => { seenIds = seenIds.filter(x => x !== id); setLS(LS_SEEN, seenIds); openSeenModal(); render(); };
      it.appendChild(btn);
      body.appendChild(it);
    });
  }
  document.getElementById('modalMask').classList.add('open');
}
document.getElementById('modalClose').onclick = () => document.getElementById('modalMask').classList.remove('open');
document.getElementById('modalMask').addEventListener('click', e => { if (e.target.id === 'modalMask') document.getElementById('modalMask').classList.remove('open'); });

/* ---------- 过滤说明 ---------- */
(function buildReport(){
  const ul = document.getElementById('reportList');
  const removedTotal = DATA.episodes.reduce((s, e) => s + e.removed.length, 0);
  const ghostTotal = DATA.episodes.reduce((s, e) => s + e.ghost_merged, 0);
  document.getElementById('reportSummary').textContent = `过滤说明（共移除 ${removedTotal} 条占楼/闲聊/归档排除项；${ghostTotal} 条"纯回复"条目已并入所属主题）`;
  const li = document.createElement('li');
  li.innerHTML = '<span class="why">移除内容：</span>' + DATA.episodes.map(e => {
    const lines = e.removed.slice(0, 6).map(r => `${r[0]}「${r[1]}」`).join('、');
    const more = e.removed.length > 6 ? ` 等共 ${e.removed.length} 条` : '';
    return `${e.title}：${lines}${more}`;
  }).join('；');
  ul.appendChild(li);
  const li2 = document.createElement('li');
  li2.innerHTML = '<span class="why">分类说明：</span>全部 ' + DATA.episodes.length + ' 期的 ' + DATA.total_q + ' 条问题均已逐条人工通读分类（含回复上下文），仅个别内容完全在题图中的归入"其他·待定"。';
  ul.appendChild(li2);
  const li3 = document.createElement('li');
  li3.innerHTML = '<span class="why">结构说明：</span>题图与头像已本地化到 _imgs/ 文件夹（B 站防盗链，浏览器直链无法显示），公式由 KaTeX 本地渲染；请保持 HTML 与 _imgs/、assets/ 目录完整。';
  ul.appendChild(li3);
})();

/* ---------- 启动 ---------- */
buildAll();
buildSidebar();
render();
</script>
</body>
