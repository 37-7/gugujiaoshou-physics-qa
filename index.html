pg", "like": 1, "message": "在输电线路中，电源内阻是“电流从电源正极流到负极，在电源内部经过的导体电阻”——对三角形线圈来说，电流在内部是沿“单根导体的总长度”流动，因此内阻是总长度对应的阻值，与转轴位置无关吗，为什么不把它分成两个电阻并联，计算总电阻", "raw_message": "在输电线路中，电源内阻是“电流从电源正极流到负极，在电源内部经过的导体电阻”——对三角形线圈来说，电流在内部是沿“单根导体的总长度”流动，因此内阻是总长度对应的阻值，与转轴位置无关吗，为什么不把它分成两个电阻并联，计算总电阻", "images": [], "replies": [{"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "并联的电流不都是先分再合的吗？你看看线圈里的电流是怎么留的？", "id": "ep7:298875809744:r0"}]}, {"id": "ep7:295900709713", "module": "ac", "auto": false, "uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 3, "message": "在理想变压器中原线圈的电路中会出现电源电动势与自感电动势，而线圈的自感系数出现于正无穷，也就是说自感电动势与电源电动势等大反向，而电流是微观状态下带电粒子的定向运动，可电路现在的电动势全部抵消了。为什么还会产生电流呢，电源为正弦交变电源，在空载与负载的情况下有什么不同吗？🐶", "raw_message": "在理想变压器中原线圈的电路中会出现电源电动势与自感电动势，而线圈的自感系数出现于正无穷，也就是说自感电动势与电源电动势等大反向，而电流是微观状态下带电粒子的定向运动，可电路现在的电动势全部抵消了。为什么还会产生电流呢，电源为正弦交变电源，在空载与负载的情况下有什么不同吗？[doge]", "images": [], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "无负载时U(电源电压)、E(自感电动势)等大反向，无净电压，自然无电流。副线圈接负载后，<span class=\"math\">\\(E\\)<\/span>相当于多出来一条支路，由闭合电路欧姆定律，产生<span class=\"math\">\\(I_{2}\\)<\/span>，<span class=\"math\">\\(I_{2} \\)<\/span>产生的磁通与原线圈磁通方向相反，导致铁芯中总磁通变化率降低；自感电动势<span class=\"math\">\\(E\\)<\/span>随之降低，此时<span class=\"math\">\\( U_{1}(\\)<\/span>电源电压)大于<span class=\"math\">\\(E_{1}(\\)<\/span>自感电动势)，原线圈两端出现了“净电压差”；这个电压差驱动原线圈产生额外的电流<span class=\"math\">\\( I_{1}\\)<\/span>，它产生的磁通会抵消副线圈电流的影响，使总磁通恢复到空载时的水平，最终达到平衡：<span class=\"math\">\\(U_{1}=E_{1}\\)<\/span>", "id": "ep7:295900709713:r0"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 最终平衡状态的<span class=\"math\">\\(E_{1}\\)<\/span>和不接负载的<span class=\"math\">\\(E\\)<\/span>相同，都等于U(在大小上)", "id": "ep7:295900709713:r1"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "自感系数怎么可能是正无穷？", "id": "ep7:295900709713:r2"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @丁真爱测码da<\/span> 电感无穷大<span class=\"math\">\\(\\ne \\)<\/span>自感系数无穷大", "id": "ep7:295900709713:r3"}]}, {"id": "ep7:295901385361", "module": "ac", "auto": false, "uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 2, "message": "在正弦交变电路中，电源电阻不计。电压表测量的用电器两端的电势差，而用电器两段电势差在电源电阻为0的情况下应该等于电源电动势，可是电源电动势处于变化之中，为什么电压表测定的值一直是有效值呢？🙌🙌", "raw_message": "在正弦交变电路中，电源电阻不计。电压表测量的用电器两端的电势差，而用电器两段电势差在电源电阻为0的情况下应该等于电源电动势，可是电源电动势处于变化之中，为什么电压表测定的值一直是有效值呢？[打call][打call]", "images": [], "replies": [{"uname": "老姑家的咕咕鸡", "face": "_imgs/face_ff176075dea5.jpg", "like": 0, "message": "内部会进行结构改造，利用到了指针的惯性，内部结构和直流电表是不一样的，如果想具体定量了解一下的话，你可以去搜平方律", "id": "ep7:295901385361:r0"}, {"uname": "绯村染之助", "face": "_imgs/face_904f9dcc8f9b.jpg", "like": 0, "message": "测交流电用的是交流电压表，内部构造可以把交流电转化为直流电", "id": "ep7:295901385361:r1"}]}, {"id": "ep7:295945987377", "module": "thermal", "auto": false, "uname": "Yuenson", "face": "_imgs/face_3fd1bd9039dc.jpg", "like": 4, "message": "在热学图像(如<span class=\"math\">\\(P-T\\)<\/span>图)中，我们通常用割线来判断第三量的变化关系(如V)，可是在其他情况中(如<span class=\"math\">\\(v-t\\)<\/span>图),我们却用切线来判断，这两种情况分别在什么时候使用？  我思考，也许是因为热学图像一定过原点？", "raw_message": "在热学图像（如P-T图）中，我们通常用割线来判断第三量的变化关系（如V），可是在其他情况中（如v-t图）,我们却用切线来判断，这两种情况分别在什么时候使用？  我思考，也许是因为热学图像一定过原点？", "images": [], "replies": [{"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "在vt图中切线有明确的意义，而在PT图中割线意味着是等容线，我感觉也就是在图像中找寻图像中所包含的意义🐶", "id": "ep7:295945987377:r0"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "vt图里的切线：<span class=\"math\">\\(a=\\frac{dv}{dt}\\)<\/span>；pT图里的过原点割线：<span class=\"math\">\\(\\frac{nR}{V}=\\frac{p}{T}\\)<\/span>看出公式的区别了吗😁", "id": "ep7:295945987377:r1"}, {"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 0, "message": "切线是有明确的物理意义的：一个物理量的瞬时变化率，描述的是这个物理量在当下变化的有多快。而割线在我看来并没有实际的物理意义，它只是数学上的巧合，某一状态下，几个状态量的比值，在分子分母都加一个0上去，刚好就是这个点与原点之间的斜率，也就是割线。", "id": "ep7:295945987377:r2"}]}, {"id": "ep7:296055727841", "module": "math", "auto": false, "uname": "四重吹不散", "face": "_imgs/face_dbb0bd97eb2e.jpg", "like": 4, "message": "我的问题涉及三个层面，彼此关联，核心是对“角度”这个量在数学和物理中不同角色的理解。\n\n第一，关于弧度制与微积分。 我了解弧度制由欧拉引入，动机与微积分有关。从“微分是线性映射”的角度看，对三角函数求导时，自变量<span class=\"math\">\\( \\theta  \\)<\/span>的微分 dtheta 究竟对应什么几何上的线性部分？对 x 求导时，dx 是直线上的均匀位移，那么对角度求导时，角度的“均匀增加”在几何上指什么？我无法将“弧度作为无量纲比值”与“微分运算中的线性自变量”这两者直观地统一起来\n\n第二，关于物理量纲分析。 分析单摆周期  时，量纲分析迫使初始角度 必须是一个无量纲量。这呼应了弧度制必须采用“齐次形式”(即无量纲)。但我困惑的是：这究竟是一个不得不打上的补丁，还是说一个为了便利性去约定的巧合，有没有更好去解释他不得不是齐次形式的东西\n\n第三，关于角速度的向量性。 角速度是一个向量。为什么在无穷小尺度下角度变化率就能表现为向量？这是否意味着在大尺度下角度本身也具有某种向量性质？为何“无穷小”会赋予它线性结构。\n总的来说，角度作为无量纲比值，如何在数学中成为“好的自变量”(弧度制)，如何在物理定律中成为“合法的无量纲参数”(量纲分析)，以及如何在运动学中成为“瞬时向量”(角速度)。这三个侧面似乎共享某种共同的几何基础，但我尚未理清", "raw_message": "我的问题涉及三个层面，彼此关联，核心是对“角度”这个量在数学和物理中不同角色的理解。\n\n第一，关于弧度制与微积分。 我了解弧度制由欧拉引入，动机与微积分有关。从“微分是线性映射”的角度看，对三角函数求导时，自变量 theta 的微分 dtheta 究竟对应什么几何上的线性部分？对 x 求导时，dx 是直线上的均匀位移，那么对角度求导时，角度的“均匀增加”在几何上指什么？我无法将“弧度作为无量纲比值”与“微分运算中的线性自变量”这两者直观地统一起来\n\n第二，关于物理量纲分析。 分析单摆周期  时，量纲分析迫使初始角度 必须是一个无量纲量。这呼应了弧度制必须采用“齐次形式”（即无量纲）。但我困惑的是：这究竟是一个不得不打上的补丁，还是说一个为了便利性去约定的巧合，有没有更好去解释他不得不是齐次形式的东西\n\n第三，关于角速度的向量性。 角速度是一个向量。为什么在无穷小尺度下角度变化率就能表现为向量？这是否意味着在大尺度下角度本身也具有某种向量性质？为何“无穷小”会赋予它线性结构。\n总的来说，角度作为无量纲比值，如何在数学中成为“好的自变量”（弧度制），如何在物理定律中成为“合法的无量纲参数”（量纲分析），以及如何在运动学中成为“瞬时向量”（角速度）。这三个侧面似乎共享某种共同的几何基础，但我尚未理清", "images": [], "replies": []}, {"id": "ep7:298557694608", "module": "other", "auto": false, "uname": "皮卡丘--------丘", "face": "_imgs/face_9b7d8d4e7f29.jpg", "like": 8, "message": "在运动学中，一些重要的公式都是由几个基础公式推导出来的，经过一定数学变形。可以推导出核心公式。在物理中，各个模块也是如此，一般都是有几个基础公式，推出了好多个公式，然后这些公式中有很重要的作用。那么是不是仅仅通过几个基础公式，加上变通的思维，就能做出所有的题目呢？甚至电学里的一些公式都是从力学的所有公式推出来的。举个简单的例子，动能定理是用速方差公式推出来的。那么是不是有关动能定理的题目呢，都能用速方差公式做呢？那这样的话，我们是不是就不用掌握那么多公式了，直接由一个原始公式在题目上直接加以变形就能做出来了呢？求解", "raw_message": "在运动学中，一些重要的公式都是由几个基础公式推导出来的，经过一定数学变形。可以推导出核心公式。在物理中，各个模块也是如此，一般都是有几个基础公式，推出了好多个公式，然后这些公式中有很重要的作用。那么是不是仅仅通过几个基础公式，加上变通的思维，就能做出所有的题目呢？甚至电学里的一些公式都是从力学的所有公式推出来的。举个简单的例子，动能定理是用速方差公式推出来的。那么是不是有关动能定理的题目呢，都能用速方差公式做呢？那这样的话，我们是不是就不用掌握那么多公式了，直接由一个原始公式在题目上直接加以变形就能做出来了呢？求解", "images": [], "replies": [{"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 2, "message": "我个人目前的体会是：不同表达式的物理意义和物理图像不同，并且有些虽然是由其他表达式推出来的但是后来发现更加普适并且在物理上的价值更高\n举个例子：热学上我们可以由理想气体状态方程<span class=\"math\">\\(PV=kNT(\\)<\/span>这已经暗含了理想气体状态方程的假设了)加上分子密度不高的假设推导出分子平动动能<span class=\"math\">\\((\\frac{1}{2}m \\bar{v^2})=\\frac{3}{2}kT\\)<\/span>，暗示温度是分子的热运动剧烈程度的宏观表现，它的物理意义要比理想气体状态方程更大，同时它其实还适用于液体和固体", "id": "ep7:298557694608:r0"}, {"uname": "有名等", "face": "_imgs/face_34af0e20d8c9.jpg", "like": 2, "message": "<span class=\"mention\">回复 @Light_dreamer探索者<\/span> 回复的不错，但还没有让他懂得你想表达的完全意思，如果一味地把推导出来的公式当作一种数学上的巧合，而不赋予他物理意义，可能会杀死物理学存在的美，就比如在上一节中咕咕没有使用传统的做法去用力来推导动能和动量的关系，而是直接观察他们之间存在的微积分关系，这样做的意义在于走出现阶段之外，会遇到更多的问题，难以通过力<span class=\"math\">\\(F=M A\\)<\/span>这样的形式来解决，而能量和动量会成为更基本量(详情见上结)，所以就不详细说明了", "id": "ep7:298557694608:r1"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 1, "message": "其次对于不同的情景下，公式的应用也应该不同，就例如<span class=\"math\">\\(f=ma\\)<\/span>以及<span class=\"math\">\\(ft=m\\Delta v\\)<\/span>，动量定理肯定是能由牛二推出的，但是对于这两个公式的应用，很明显大多是不相同的，而在特定的情景下用适合的公式才是比较适配物理思维的🐶", "id": "ep7:298557694608:r2"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 1, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 当然可以解出题目，只是过程有点冗杂(在已知的公式中既然能推出题目中真正需要或者说是适配的公式，那原来的公式肯定是能解出题目的🐶)", "id": "ep7:298557694608:r3"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 1, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 理论上当然可行，但是新的公式是否能揭示出新的物理量之间的关系呢(是否这个公式所带来的物理意义更适配其余情景呢)，再者说，在限定的时间内写完一套试卷用最基础的公式一遍遍推出其余公式时间上是否允许🐶", "id": "ep7:298557694608:r4"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 1, "message": "例如题主说的速方差以及动能定理，由速方差肯定能推出动能定理，但是在揭示的维度上是否有所不同呢？在动能定理上更倾向于能量的角度，而在速方差更倾向于动力学的角度，两者有区别的(虽然在数学变形上是等价的，但是物理意义有所不同)", "id": "ep7:298557694608:r5"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 1, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 为什么还要再有一个动能定理呢？速方差公式只关心物体的运动，你不能从这个式子中看到力、物体运动的能量这些信息。你可能会反驳我说乘上质量不就行了？嗯，你已经引入了一个量，并且我还要多问你一个问题：为什么要引入这个物理量？你想做什么？是你先有了单纯物质的速度不足以代表外在力改变的“运动量”，相同速度质量越大运动量越大，反之同样的功也就是同样的作用量(我已经开始用到相互作用这个基本想法了，这与加速度是不等价的)质量越大速度越难改变。动能定理说的要比速方差公式更深刻，并且也更普适(你可以自己想一下速方差公式的前提条件，而且动能定理的思想可以看出有比从速方差公式开始推更好的方式：从作用量和对物体带来的影响入手，这是一个更普适更深刻的想法，你甚至是先有了“运动量”和“作用量”的想法才能想出动能定理，你可以想一下动能定理中是先有了动能和力能造成的影响(作用)这两个定义才有动能定理的", "id": "ep7:298557694608:r6"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 1, "message": "粗略来说就是：速方差公式中用到的定义(匀加速运动：<span class=\"math\">\\(v=v_0\\cdot t)\\)<\/span>和动能定理中用到的定义(动能：<span class=\"math\">\\(\\frac{1}{2}mv^2\\)<\/span>，力对物体所做的功(力的作用量(力对物质运动量造成的影响<span class=\"math\">\\()F\\cdot s\\)<\/span>或x(s和<span class=\"math\">\\(x\\)<\/span>不相同，一个是路程一个是位移，这是不同的物理情形))是不同的，速方差公式是极为特别物理情形(匀加速运动)的运动学的式子，动能定理是更加基本的概念中的关系式(直观的将力对物体运动的作用量对物体本性的影响表现出来(不是说速度不是本性而是说这里的主题是：作用量以及作用量能造成的影响))", "id": "ep7:298557694608:r7"}, {"uname": "丁真爱测码da", "face": "_imgs/face_6798465f059c.jpg", "like": 0, "message": "在理论上最基本的公式肯定是能推出其余的公式🙂但是我认为在有限的时间内只是记住基础的公式而其余的公式现场推导似乎并不高效。", "id": "ep7:298557694608:r8"}, {"uname": "Physicscw_GWDM", "face": "_imgs/face_540d3fe8596d.jpg", "like": 0, "message": "会推公式不等于能顺利做题，就像你把一个题用到的所有公式子写出来给没学过物理的学生做ta也很难做出来。\n此外就算是恒等变形，公式长相不一样，诱导你去思考的方向也不一样。\n另外你之后会知道，高中课本上的相当推导都是形而上的，物理上并没有必然性。", "id": "ep7:298557694608:r9"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 0, "message": "<span class=\"mention\">回复 @Light_dreamer探索者<\/span> 再结合@有名等  和我最开始的那条回复应该就是目前在我看来对形成这个问题的比较完整的回答了。", "id": "ep7:298557694608:r10"}]}, {"id": "ep7:299227255280", "module": "other", "auto": false, "uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 3, "message": "分享一些自创的题目；另外建议在网站上加一个直接投稿的功能🐶", "raw_message": "分享一些自创的题目；另外建议在网站上加一个直接投稿的功能[doge_金箍]", "images": ["_imgs/img_aee1c4760397.jpg", "_imgs/img_320a92467c0a.jpg", "_imgs/img_45e6130b9b96.jpg", "_imgs/img_d42c4e6a01ff.jpg", "_imgs/img_752a8c09d913.jpg", "_imgs/img_9ac6950b2b7b.jpg"], "replies": []}], "mod_stats": {"mech": {"q": 1, "r": 0, "img": 0}, "energy": {"q": 2, "r": 10, "img": 3}, "momentum": {"q": 1, "r": 1, "img": 0}, "vibration": {"q": 2, "r": 6, "img": 3}, "optics": {"q": 1, "r": 6, "img": 0}, "circuit": {"q": 1, "r": 3, "img": 1}, "em": {"q": 7, "r": 55, "img": 7}, "ac": {"q": 2, "r": 6, "img": 0}, "thermal": {"q": 1, "r": 3, "img": 0}, "math": {"q": 1, "r": 0, "img": 0}, "other": {"q": 2, "r": 11, "img": 6}}, "removed": [["求进步的祁厅长", "@-Sir-xiao \n不知道能不能看得懂， So这样子思考非常快，我们", "归档时已排除"], ["SH_hk_hku", "[打call][打call][打call]", "归档时已排除"], ["数学和物理都很有趣", "[打call][打call][打call]", "归档时已排除"], ["生活里的小透明", "[星星眼][打call]", "归档时已排除"], ["无字城2", "第一第一，学姐加油！[打call][打call][打call]", "归档时已排除"], ["是开心的小太阳呀", "咕咕呱呱可以回复我的私信吗", "人工判定噪音"], ["求进步的祁厅长", "@-Sir-xiao 来练习一下[呲牙]赣州一模", "归档时已排除"], ["印空的修行世界", "[打call][打call][打call]", "归档时已排除"], ["-Sir-xiao", "@求进步的祁厅长 我觉得第二种分解方法当然是对的（不是蒙对的），因为垂直", "归档时已排除"], ["哈勃先生", "[吃瓜]", "归档时已排除"]], "ghost_merged": 83, "total_q": 21, "total_r": 101, "total_img": 20, "auto_cnt": 0}, {"key": "ep8", "title": "第8期", "episodeId": "ep1776495656356", "export": "2026-08-25", "comments": [{"id": "ep8:299358114800", "module": "mech", "auto": false, "uname": "残月laonyeot", "face": "_imgs/face_35829c9c3835.jpg", "like": 5, "message": "从数学角度看约束条件，把握确定性，基础问题亦有妙趣", "raw_message": "从数学角度看约束条件，把握确定性，基础问题亦有妙趣", "images": ["_imgs/img_a5db2d22ceef.jpg", "_imgs/img_a9d7696c8979.jpg"], "replies": [{"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 2, "message": "嗯，可以通过画图感受确定过程", "id": "ep8:299358114800:r0"}, {"uname": "子携清风游四海", "face": "_imgs/face_a455f1e3f600.jpg", "like": 1, "message": "后面用辅助角定范围的理解咕咕教授讲过，其实就是看成两个向量的内积，于是用值域定范围的动机就更合理了", "id": "ep8:299358114800:r1"}]}, {"id": "ep8:299292209792", "module": "mech", "auto": false, "uname": "皮卡丘--------丘", "face": "_imgs/face_9b7d8d4e7f29.jpg", "like": 5, "message": "功是用来改变物体动能的，假设用力拉一个物体在粗糙的地面上滑动，地面给物体一个向后的摩擦力，那么地面对物体就是做的是负功，就让物体的动能减小，是对的，但是物体对地面做的正功，就会让地面的动能增加。物体速度减小，动能减小，地面没动，动能怎么增加了呢？还是它的动能根本就没有增加呢？", "raw_message": "功是用来改变物体动能的，假设用力拉一个物体在粗糙的地面上滑动，地面给物体一个向后的摩擦力，那么地面对物体就是做的是负功，就让物体的动能减小，是对的，但是物体对地面做的正功，就会让地面的动能增加。物体速度减小，动能减小，地面没动，动能怎么增加了呢？还是它的动能根本就没有增加呢？", "images": [], "replies": [{"uname": "物你学家", "face": "_imgs/face_a2beefec54a5.jpg", "like": 6, "message": "这位同学，首先感谢你一直以来提出的各种问题，其中不乏有趣的观察，谢谢你的贡献。\r\n其次我想说的是，参加讨论问题的大多数是高中生，可能有些时候不能完全清楚地表达自己的意思，或者是表达有不完美的地方。那么我想，讨论的心态应该更多地放在，别人提出的想法有没有对我有启发的地方，而不是他这里说得不对有漏洞。不然就不是讨论，而是抬杠了。\r\n再说到你这个问题，你注意到了一般问题中都认为地面不动，那么物体对地面的摩擦力做功到哪里去了这个“盲点”。那么既然要考虑对地面也受到了力，也要分析力对它做的功，也就是说(正如已经有同学指出来的)地面不再是一个合适的参考系，而要换一个更“惯性系”的惯性系。不妨抽象为一个“更光滑”的水平“地面”上叠放着两个物体，两个物体之间有摩擦力，而且下面的物体质量远大于上面的滑块，然后去用普通的外力拉上面的物体一段时间。你自己去试着分析这个物理过程，具体写一写下面那个大物体的位移，动能增加，以及摩擦力对它做的功，就会明白为什么最开始就有回复告诉你，它的动能是增加了，只不过由于大物体质量过大，你看不出来有什么变化。", "id": "ep8:299292209792:r0"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 3, "message": "一般做题把地面视作静止，动能没有增加，物体动能转化为系统生热。实际中地面和地球相连，地球的质量极大，即便物体对地面的摩擦力做功，根据<span class=\"math\">\\(E_k=\\frac{1}{2}mv^2\\)<\/span>，地球获得的动能会极小极小(速度趋近于0)，几乎无法察觉(你的疑惑)。系统生热等于物体动能减地球获得的动能，近似于物体动能。", "id": "ep8:299292209792:r1"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 3, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 又回到参考系问题了😂。概念：一旦把某个物体当作参考系，就默认它是静止的，其他物体的运动都是相对它而言的。以地面为参考系就默认地面静止了，不过这个静止不是绝对静止，也是相对的。一旦换个其他参考系，比如地心，那地面就是运动的，和我之前说的动量守恒不矛盾，地面就是会有个速度，只不过以地面为参考系的时候“假想”为静止罢了。所以想要更直观的研究这个问题，不如把参考系换到另一个比地面更静止的物体。", "id": "ep8:299292209792:r2"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 2, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 如果你以地面为参考系的话，那地面当然是静止的", "id": "ep8:299292209792:r3"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 2, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 有位移，只不过太小忽略了", "id": "ep8:299292209792:r4"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 1, "message": "功改变的是物体的能量，不一定是动能，可以是产热(内能)", "id": "ep8:299292209792:r5"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 不然动量守恒定律就不守恒了", "id": "ep8:299292209792:r6"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 地心默认是一个不跟地球其他部分连接的点，地面绕着它转。不是你想的“地心”(地核)", "id": "ep8:299292209792:r7"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 它会随着地球公转，但是不会自转了，不然你说地球绕着谁自转？连地心都转就相当于没转了吧？我说的(也是物理学规定的)地心是不能再分的那个点，你可以说它周围的地核在自转，但不能说地心自转", "id": "ep8:299292209792:r8"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 其实就这一个分歧吧？后面把参考系换到地心，地面不再静止，由动量守恒定律，物体得到一个向后的远大于地面的速度(在原有速度基础上)，地面得到一个向前的远小于物体的速度，对外表现出来就是地面近似静止，而产生的内能近似等于物体动能减少量", "id": "ep8:299292209792:r9"}, {"uname": "Atomphysics", "face": "_imgs/face_19704788688b.jpg", "like": 1, "message": "增加了 可是地面有极为巨大的质量 导致这一点摩擦力作用产生的加速度对地面速度的变化是十分有限的 所以你看不出来有变化", "id": "ep8:299292209792:r10"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @皮卡丘--------丘<\/span> 地面绕着地心在转", "id": "ep8:299292209792:r11"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 这个速度趋近于零由动量守恒定律易得", "id": "ep8:299292209792:r12"}, {"uname": "老姑家的咕咕鸡", "face": "_imgs/face_ff176075dea5.jpg", "like": 0, "message": "带动了表面小分子的运动相互撞击以热量形式耗散，也就是摩擦热", "id": "ep8:299292209792:r13"}]}, {"id": "ep8:299466242048", "module": "mech", "auto": false, "uname": "皮卡丘--------丘", "face": "_imgs/face_9b7d8d4e7f29.jpg", "like": 4, "message": "初中就学过滑动摩擦力与接触面的粗糙程度<span class=\"math\">\\(\\mu \\)<\/span>有关，类似第3张图中锯齿状的是接触面，这是把接触面放大后的样子，当滑动时会相互阻碍。其他条件一样时，<span class=\"math\">\\(\\mu \\)<\/span>越大，滑动摩擦力就越大。<span class=\"math\">\\(\\mu \\)<\/span>就是接触面的粗糙程度，接触面越粗糙，滑动摩擦力就越大。而当两块很光滑的金属块叠放在一起时。他们两个之间的摩擦力却很大，很难拽开，似乎是像被什么东西黏住了一样。第2张图的两张铜版卡片也是一样，新开封的卡片，一整摞像是粘在了一起一样，每两张要想把它们分开，两张之间的摩擦力都非常大。而它们的表面却非常光滑，比一般常见的物体光滑的多，但摩擦力却也比常见的物体多(并没有施加压力)。上述两者物体都是很光滑的，但摩擦力却很大，造成以上现象的原因是什么呢？", "raw_message": "初中就学过滑动摩擦力与接触面的粗糙程度μ有关，类似第3张图中锯齿状的是接触面，这是把接触面放大后的样子，当滑动时会相互阻碍。其他条件一样时，μ越大，滑动摩擦力就越大。μ就是接触面的粗糙程度，接触面越粗糙，滑动摩擦力就越大。而当两块很光滑的金属块叠放在一起时。他们两个之间的摩擦力却很大，很难拽开，似乎是像被什么东西黏住了一样。第2张图的两张铜版卡片也是一样，新开封的卡片，一整摞像是粘在了一起一样，每两张要想把它们分开，两张之间的摩擦力都非常大。而它们的表面却非常光滑，比一般常见的物体光滑的多，但摩擦力却也比常见的物体多（并没有施加压力）。上述两者物体都是很光滑的，但摩擦力却很大，造成以上现象的原因是什么呢？", "images": ["_imgs/img_6d0f589397d4.jpg", "_imgs/img_d0bf0510cfa6.jpg", "_imgs/img_19b29b5a27e5.jpg"], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 2, "message": "有没有可能摩擦力有很多种🐶\n一是凹凸啮合造成的摩擦力，二是金属与金属间是分子间引力造成的摩擦力(因为极端光滑后分子与分子之间很近，有强大的范德华力)。\n还有，在极端光滑的情况下你没施加压力，但是大气压帮你施加压力了(原本缝隙间可以有气体来抵消一部分大气压，但现在没有了，整体压力更大，<span class=\"math\">\\(f\\)<\/span>更大)", "id": "ep8:299466242048:r0"}]}, {"id": "ep8:299311663632", "module": "mech", "auto": false, "uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 3, "message": "在评论区分享一道题，欢迎大家讨论", "raw_message": "在评论区分享一道题，欢迎大家讨论", "images": ["_imgs/img_57ca576427d7.jpg"], "replies": [{"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 1, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 感谢，我悟了[支持]只要<span class=\"math\">\\(v\\)<\/span>大小确定，不管<span class=\"math\">\\(v\\)<\/span>方向怎么变，经过一段时间后的距离是确定的，尽管位移不确定", "id": "ep8:299311663632:r0"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "ABC，https://www.bilibili.com/read/cv47937442 (点蓝字)", "id": "ep8:299311663632:r1"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 径向和切向分速度始终垂直，不够直观可以用微元法想一想", "id": "ep8:299311663632:r2"}, {"uname": "高中物理咕咕助教", "face": "_imgs/face_8085b2aab17f.jpg", "like": 0, "message": "A也有问题，他可以转几圈。这样只有BC对了吧", "id": "ep8:299311663632:r3"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "ABCD？", "id": "ep8:299311663632:r4"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 0, "message": "其实D不太对 我自己控制着v 我可以随便突然来个急转弯，那加速度就是无穷大了", "id": "ep8:299311663632:r5"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @xyz179<\/span>  你控制不了<span class=\"math\">\\(v\\)<\/span>", "id": "ep8:299311663632:r6"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span>  但是你不一定能控制它", "id": "ep8:299311663632:r7"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span>  你能控制的是船相对于地面的速度也就是静水速度，从而才可能控制<span class=\"math\">\\(v\\)<\/span>", "id": "ep8:299311663632:r8"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span>  你没懂我的意思：\n1.你能控制的是船相对于地面的速度也就是静水速度，从而才可能控制<span class=\"math\">\\(v\\)<\/span>，我说的很清楚\n2.你这是圆周运动加上直线运动的合成，方向不是任意可调的，因为那么你相对于自身的坐标来说，每一个地方速度的方向都是一定的，但是问题是这是极坐标系，在真实轨迹之中，速度方向是会变的，所以你不一定控制得了<span class=\"math\">\\(v\\)<\/span>", "id": "ep8:299311663632:r9"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span>  因为这道题的本身考察，其实是你在自然中坐标系(原点为物体自身)之中的速度分解，和极坐标的使用，因为怎么样都存在切向速度，所以这个<span class=\"math\">\\(v\\)<\/span>怎么样都会存在方向上的改变，这个改变就不是你能控制的了", "id": "ep8:299311663632:r10"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span>  1.你说反了，相对水流的可以是直线运动\n2.这是可以的，极坐标系下我们只存在圆周运动和径向直线运动", "id": "ep8:299311663632:r11"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span>  比如地球椭圆轨道就可以视为<span class=\"math\">\\(r\\)<\/span>径向方向上<span class=\"math\">\\(r\\)<\/span>的改变和<span class=\"math\">\\(r\\)<\/span>本身的旋转，任何运动最后都可以化繁为简，更何况你要论的还是极坐标", "id": "ep8:299311663632:r12"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span>  所以我说，你没都懂我的意思", "id": "ep8:299311663632:r13"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 1.有一个东西叫自然坐标系，自然坐标系和真实坐标系存在关系，在自然坐标系中速度方向是确定的，但是在真实坐标系之中，这个速度就不一定是方向一定的，这让我想到你对自然坐标系和真实坐标系是不是不太知道和清楚\n2.一个无非定<span class=\"math\">\\(r\\)<\/span>看<span class=\"math\">\\(\\theta \\)<\/span>一个无非定<span class=\"math\">\\(\\theta \\)<\/span>看<span class=\"math\">\\(r\\)<\/span>改变，要么就是变速圆周运动要么匀速圆周运动，径向更好讨论了，不要学的那么死，想简单点，灵活运用一点", "id": "ep8:299311663632:r14"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 那么你就应该知道<span class=\"math\">\\(v\\)<\/span>只能在自然参考系下保持不变，但是在真实参考系下不一定可控🍉", "id": "ep8:299311663632:r15"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 或者说那么你就应该知道<span class=\"math\">\\(v\\)<\/span>只能在自然参考系下可以控制方向，但是在真实参考系下不一定可控🍉", "id": "ep8:299311663632:r16"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 啊😦\n自然坐标系指的是这个坐标系设置在物体本身，随着物体运动而运动，这个坐标系是用来分析速度之间关系或者受力情况而诞生的，你甚至为了方便可以让一个方向和速度完全一样\n我们极坐标才是真实坐标系", "id": "ep8:299311663632:r17"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 但是极坐标系之中<span class=\"math\">\\(v\\)<\/span>的速度一定不可控", "id": "ep8:299311663632:r18"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 讨论速度的方向性这要对船本身讨论才有用，也就是在自然坐标下，但是一旦放到极坐标中，<span class=\"math\">\\(v\\)<\/span>总可能不被控制", "id": "ep8:299311663632:r19"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 别忘了你还有圆周运动，当你<span class=\"math\">\\(v\\)<\/span>存在一个分量是切向的时候，他改变方向这个东西就不是你能控制的了的", "id": "ep8:299311663632:r20"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 什么时候自然坐标系有自己的速度了🤨", "id": "ep8:299311663632:r21"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> <span class=\"math\">\\(v\\)<\/span>难道不是在极坐标下定义的🧐", "id": "ep8:299311663632:r22"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 是啊，我可以在自然坐标里面分解啊🤨", "id": "ep8:299311663632:r23"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 速度关系是在自然坐标系之中找到的啊😦", "id": "ep8:299311663632:r24"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 你在极坐标之中的真实速度放到自然坐标系之中一下子就简化为了两个存在夹角的速度了，一个坐标方向沿着<span class=\"math\">\\(u\\)<\/span>", "id": "ep8:299311663632:r25"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 我没说你这个错，但是你对坐标的理解很差", "id": "ep8:299311663632:r26"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 不，你不理解坐标系", "id": "ep8:299311663632:r27"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 因为你根本就不知道自然坐标系是用来干什么的，你在用相对速度和我辩，你也在混淆相对速度和自然坐标系的使用🍉", "id": "ep8:299311663632:r28"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 那么我问你个问题哈[汤圆]\n1.现在你船相对地面的速度是始终沿径向，那么<span class=\"math\">\\(v\\)<\/span>就沿着一个与<span class=\"math\">\\(u\\)<\/span>速度呈现夹角的<span class=\"math\">\\(v\\)<\/span>，请问：自然坐标系下轨迹是什么样，极坐标系下是怎么样\n2.你每时每刻速度分解，是极坐标还是自然坐标系好", "id": "ep8:299311663632:r29"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 还有你的<span class=\"math\">\\(d\\delta r\\)<\/span>，我没找到任何的现实依据可以这么用，而且你这方程也解不了，你看的资料是什么，我想看看🍉", "id": "ep8:299311663632:r30"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 你不考虑<span class=\"math\">\\(u\\)<\/span>了", "id": "ep8:299311663632:r31"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 来，那本书写的，告诉我", "id": "ep8:299311663632:r32"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 请教一下B选项为什么可以用勾股定理算出路程？小船的运动不是不沿径向吗？也就是说他的速度方向会改变，它是曲线运动。", "id": "ep8:299311663632:r33"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @xyz179<\/span> 请教一下D选项🐶评论区已经有解答了，不过我不明白为什么可以用勾股定理。或者您有什么别的理解？", "id": "ep8:299311663632:r34"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 是曲线没问题，但径向分速度是固定的<span class=\"math\">\\(v\\)<\/span>", "id": "ep8:299311663632:r35"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 对的👍", "id": "ep8:299311663632:r36"}]}, {"id": "ep8:296904535985", "module": "mech", "auto": false, "uname": "假肢轩与徐", "face": "_imgs/face_c18064099f5d.jpg", "like": 1, "message": "相似三角形的“比例尺”，是怎样一个物理感觉，有没有其他解法？它在提醒我们什么？", "raw_message": "相似三角形的“比例尺”，是怎样一个物理感觉，有没有其他解法？它在提醒我们什么？", "images": ["_imgs/img_83971fbc9f53.jpg"], "replies": [{"uname": "物你学家", "face": "_imgs/face_a2beefec54a5.jpg", "like": 2, "message": "我想你问的意思大概不是，比例尺是什么物理感觉---比例尺就是放大缩小咯，而是为什么要用相似三角形来做力的问题。运用力的三角形与几何三角形相似来解决物理问题，看起来很巧，好像不容易想到。但其实，当三个共点力平衡时，要求解这些力，画出矢量图来的确就是三个力首尾相连组成三角形(这种题往往用正交分解十分复杂，你可以尝试一下)。这时候你相当于就是要解这个三角形。怎么解三角形？哦去寻找角度，这才找到了图中的几何关系，也就是用题目所给的几何量来表示力的三角形的几个内角。而这几个角本身在几何上又刚好组成了一个三角形，这样你用正弦定理分别对力的三角形和几何三角形写出来，实际上就是在用相似三角形了。做了一些题之后有经验了，思维上就可以跳过分别列正弦定理的那一步，而直接写相似三角形的比例了。", "id": "ep8:296904535985:r0"}]}, {"id": "ep8:297185153969", "module": "mech", "auto": false, "uname": "拖司机的冰镐", "face": "_imgs/face_f0145a0daa8a.jpg", "like": 1, "message": "我有个问题，如下图两根杆夹着一个圆环，圆环内夹着一个球，现给球一个大小为<span class=\"math\">\\(V\\)<\/span>的速度，求球和圆环共速的速度及位置，我的问题在于我很难描绘出球与圆环是怎么动的，求大佬解答", "raw_message": "我有个问题，如下图两根杆夹着一个圆环，圆环内夹着一个球，现给球一个大小为V的速度，求球和圆环共速的速度及位置，我的问题在于我很难描绘出球与圆环是怎么动的，求大佬解答", "images": ["_imgs/img_e518f04decae.jpg"], "replies": []}, {"id": "ep8:299353604176", "module": "energy", "auto": false, "uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 2, "message": "来个经典的🐶如图一所示，这个物体以<span class=\"math\">\\(v_{0}\\)<\/span>冲上半圆轨道，在中途脱离轨道，半径和速度都给你，求恰好脱离时的速度。\n\n图二是解法。我第一次做这个问题的时候，很自然地就列出了第一个方程。因为恰好脱离翻译过来就是弹力为零嘛。那弹力为零是怎么决定脱离点的速度的呢？那就是重力沿半径方向分解得到的向心力决定的嘛。但是第二个方程我死活想不出来。\n\n我试图用咕咕的方式解释了一下动机(图二中“①”“②”)：第一个方程是说角度决定了速度，第二个方程式是说速度决定了角度，两者相互决定，从而确定了情形。可是如果让我自己想角度是由什么决定的时候，我又想不出来了。\n\n请问我的问题出在哪里？怎么想出第二个方程？", "raw_message": "来个经典的[doge]如图一所示，这个物体以v0冲上半圆轨道，在中途脱离轨道，半径和速度都给你，求恰好脱离时的速度。\n\n图二是解法。我第一次做这个问题的时候，很自然地就列出了第一个方程。因为恰好脱离翻译过来就是弹力为零嘛。那弹力为零是怎么决定脱离点的速度的呢？那就是重力沿半径方向分解得到的向心力决定的嘛。但是第二个方程我死活想不出来。\n\n我试图用咕咕的方式解释了一下动机（图二中“①”“②”）：第一个方程是说角度决定了速度，第二个方程式是说速度决定了角度，两者相互决定，从而确定了情形。可是如果让我自己想角度是由什么决定的时候，我又想不出来了。\n\n请问我的问题出在哪里？怎么想出第二个方程？", "images": ["_imgs/img_ecc9d034624d.jpg", "_imgs/img_92da14b597a2.jpg"], "replies": [{"uname": "高中物理咕咕助教", "face": "_imgs/face_8085b2aab17f.jpg", "like": 3, "message": "题目问我什么时候脱离，那脱离的条件是什么呢？我物体运动到什么样的程度会脱离呢？或者说，我应该去理解为什么刚开始不脱离，之后变成要脱离呢？\n那感觉就是刚开始是被按死在轨道上的，之后没有被按死。什么叫按死呢？“按死”的体验是怎么来的？做了这么多题目能体会这种被“怼在墙上”的感觉吗？你可以说我被离心力甩出去了，像滚筒洗衣机里的衣服一样。也可以说我天然想直走，轨道不让我走直线，所以我肯定要顶墙上。但是这些图像对应什么样的物理语言呢？就是我如果真的要沿着轨道转，就需要轨道给我弹力来满足我圆周运动的向心力需求嘛。所以什么时候不再被按死？临界状态就是轨道不需要提供弹力我都能够自给自足做圆周运动。换句话说，就是重力的向心力分量独自能够满足我的圆周运动向心力需求。所以这个受力图像应该给我什么样的动态演化过程呢？一开始，物体速度最大，向心力需求也就最大，而重力提供的反而是纯纯向外(离心)的力，所以一定要一个轨道的支撑才能做圆周运动。后来<span class=\"math\">\\(\\theta \\)<\/span>变大，物体越走越高，速度越来越慢，需要的向心力<span class=\"math\">\\(\\frac{mv^2}{r}\\)<\/span>越来越小，同时重力的向心分量呢？越来越大，因为越来越“向心”。也就是说，重力提供的向心力(供给)越来越大，而我需要的向心力(需求)越来越小，所以是不是早晚有一天两个人要打平手，“供给=需求”，那就是我们前面说的刚刚能“不需要轨道弹力就能自己做圆周运动”的那个临界状态。“供给=需求”，这就是你们在找的第二个方程。\n\n你看，我们都是先看到了图像，先摸清了事情大致的演化方向/趋势，先预判这个问题有没有答案，再自然写出方程的，这之中并没有花力气去判断：这个题是什么知识点，是该用受力分析了还是动量守恒能量守恒。我们不问这些问题的。我们问的问题是，这个东西在干什么？如果有人说它要掉下来，我能不能理解它为什么之前不掉下来？如果我是木块，我感觉到什么？这种感觉对应什么样的物理语言？理解了之前为什么不脱离，之后又是怎么从不脱离变成能脱离的。", "id": "ep8:299353604176:r0"}, {"uname": "高中物理咕咕助教", "face": "_imgs/face_8085b2aab17f.jpg", "like": 2, "message": "我觉得大家的说法里面好像还是有一种很浓的凑方程数量的感觉，虽然说话用词反复提“决定关系”，但是你们的说法里面没有充分反映出因果和动态图像。我会这么描述，你们看看跟自己的理解有没有差别。\n\n这个问题，给我轨道的形状(半径)，同时给我触速度，这样把什么定死了呢？我希望你能感觉到，这两个信息已经把木块之后的命运全部定死了。这什么意思呢？就是只要木块还在轨道上动，那么你告诉我木块动到哪个位置，我就能马上告诉你木块这个时候动多块，定死运动状态也就知道受多少力等等。这个是情形的确定性。那这是怎么“感觉到”的呢？因为木块假如还在轨道上，那就只有一种“动法”就是沿着轨道动，永远就这一个方向，唯一的问题是动得多块。那么动🉐多快这件事是怎么定下来的？换句话说木块有没有可能白白动得更快或者更慢？不可能，这种事情能量守恒的要求摆在那，你怎么可能白白变快或者变慢呢？你看，到这里，自然而然你已经在用能量守恒去定死<span class=\"math\">\\( v(\\theta ) \\)<\/span>这个关系了。\n\n那接下去呢？情形都确定了，接下来就是问我什么我就应该能答什么了。", "id": "ep8:299353604176:r1"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 2, "message": "第二个方程实际上是高度决定了速度(动能定理)，只不过这个高度刚好与角度有关。弄清因果关系就容易列出第二个方程。", "id": "ep8:299353604176:r2"}, {"uname": "拖司机的冰镐", "face": "_imgs/face_f0145a0daa8a.jpg", "like": 1, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 没问题，助教把我的想法通俗化的说了一遍，本质上来说就是在刚要掉下来的时候，重力的分量就恰好能够维持向心力，你再走速度就不够了，也就是说你的速度不足以支撑你继续走下去，向心力不足", "id": "ep8:299353604176:r3"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 由第一个式子可以画出简图，根据这个简图可以看出也可以表示出物体此时的高度，而自然地想到用动能定理表示此时的速度大小。从最本源的角度你应该列三个方程，第二个方程应该用<span class=\"math\">\\(h\\)<\/span>去表示，第三个表示出<span class=\"math\">\\(\\cos \\)<\/span>与<span class=\"math\">\\(h\\)<\/span>的关系，这样最自然", "id": "ep8:299353604176:r4"}, {"uname": "拖司机的冰镐", "face": "_imgs/face_f0145a0daa8a.jpg", "like": 0, "message": "是的，在恰好脱离时的向心力恰好等于重力<span class=\"math\">\\(\\cos \\)<\/span>分量，速度不足以支撑向心力(或者两者同时到达临界？)继续跑下去，这就是临界状态。这里的<span class=\"math\">\\(v\\)<\/span>是可以解的，同时你这里的<span class=\"math\">\\(v\\)<\/span>只被<span class=\"math\">\\(h\\)<\/span>所影响，所以你这里可以建立一个有关与<span class=\"math\">\\(h\\)<\/span>与<span class=\"math\">\\(\\theta \\)<\/span>的函数， 结合动能定理即可求解\n以上是我的看法，不知道对不对🍉", "id": "ep8:299353604176:r5"}]}, {"id": "ep8:299438081376", "module": "em", "auto": false, "uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 8, "message": "分享一道题，欢迎大家讨论", "raw_message": "分享一道题，欢迎大家讨论", "images": ["_imgs/img_d3f99485457e.jpg"], "replies": [{"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 2, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 看不太懂你的描述 但是我知道答案是D🐶", "id": "ep8:299438081376:r0"}, {"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 2, "message": "根据你上次的建议，我已经在网页里新增了在线投稿的功能，由于还没有投稿，所以不知道效果如何。欢迎测试。不过发题目之前最好备份一下以免网页bug导致丢失。", "id": "ep8:299438081376:r1"}, {"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 1, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 你是怎么得出B来的呢？我怎么觉得好像不是B…(ps这个叫作拓扑不太恰当，拓扑说的是在连续的变形下保持不变的东西，这个肯定不能算，这个考察的就是感生电动势产生的基本原理，好题)", "id": "ep8:299438081376:r2"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> https://b23.tv/BV1jed6BmEgg ，知道面积后在<span class=\"math\">\\(q=\\)<\/span>德尔塔<span class=\"math\">\\(\\Phi \\)<\/span>比<span class=\"math\">\\(S\\)<\/span>就行", "id": "ep8:299438081376:r3"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 这个环绕看的不是导线，而是电流", "id": "ep8:299438081376:r4"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 有了", "id": "ep8:299438081376:r5"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 咋理解“环绕”(才发现自己有这么多漏洞😭)", "id": "ep8:299438081376:r6"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @粒子迷航<\/span> 咋理解“环绕”(才发现自己有这么多漏洞😭)", "id": "ep8:299438081376:r7"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @粒子迷航<\/span> 没事，我高二🐶(不过这不算本质吗？因为如果说正常的题目线圈不都是规整的形状吗？如果不理解本质，碰到这样的情况不就束手无策了吗？)", "id": "ep8:299438081376:r8"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @粒子迷航<\/span> 嗯，谢谢您", "id": "ep8:299438081376:r9"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 嗯，结合“粒子”说的，我明白了[支持]", "id": "ep8:299438081376:r10"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "B.有点反直觉。(有点像去年八省联考数学多选最后一道，也是拓扑😭)", "id": "ep8:299438081376:r11"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @xyz179<\/span> 中间电流和四周电流反向", "id": "ep8:299438081376:r12"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @xyz179<\/span> 直观看的话会误以为中间电流和四周电流同向，但是区域边界的“方向”不是看导线本身的走向，而是看区域位于导线的哪一侧。", "id": "ep8:299438081376:r13"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @xyz179<\/span> 怎么解释[tv_晕]", "id": "ep8:299438081376:r14"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 👌", "id": "ep8:299438081376:r15"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 我录了个视频，稍等一下发给你", "id": "ep8:299438081376:r16"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 而且电流都是同方向的，我之前想错了", "id": "ep8:299438081376:r17"}, {"uname": "粒子迷航", "face": "_imgs/face_a58cba8052a5.jpg", "like": 0, "message": "类比某年福建卷的单选压轴(那道题是个莫比乌斯环) 数一下每个部分环绕次数即可 有效面积应该是<span class=\"math\">\\(1+1+1+2=5 \\)<\/span>选D", "id": "ep8:299438081376:r18"}, {"uname": "粒子迷航", "face": "_imgs/face_a58cba8052a5.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 想象你站在导线围成的每个小区域中心，盯着一个沿导线跑完一整圈的朋友：如果你为了盯着他必须原地自转一圈，该区域的“缠绕层数”就是1；如果你先左转又右转最后回到了原位(即身体没原地打转)，层数就是0；而像题目中的三叶结，当你站在中心区域时，盯着他跑完一圈会让你原地转整整两圈，层数就是2。实操时，只需给顺时针转记为正、逆时针记为负，数出每个小格子的总圈数，再用“面积<span class=\"math\">\\( \\times  \\)<\/span>圈数”把所有格子的分值加起来，就能得出总感应量", "id": "ep8:299438081376:r19"}, {"uname": "粒子迷航", "face": "_imgs/face_a58cba8052a5.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 用Gemini辅助写了一下 我自己说不太清", "id": "ep8:299438081376:r20"}, {"uname": "粒子迷航", "face": "_imgs/face_a58cba8052a5.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 不过这种不太需要掌握 最后50天做点来路正的题目 少做这些野题 回归本质", "id": "ep8:299438081376:r21"}, {"uname": "粒子迷航", "face": "_imgs/face_a58cba8052a5.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 这道题再深挖就到拓扑了 高考考不了这么深 如果是高三的话，那还是把有限的精力放在经典的模型上吧，高二可以看看", "id": "ep8:299438081376:r22"}]}, {"id": "ep8:296679779889", "module": "em", "auto": false, "uname": "-Sir-xiao", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 5, "message": "我在磁场自身变化的时候很难理清楚其中的能量转换。我遇到了这样的一个例子，当存在感生电动势时，安培力做功总是不等于电路的焦耳热，我觉得是因为运动的磁场会产生电场，使得其中有额外的能量来补偿焦耳热。但是在计算感应电动势的时候不是已经把这部分的能量算进去了吗？为什么还要再算一遍呢？我还是没有理解清楚。\n另外，当磁场自身运动时，可以转换参考系来让磁场静止下来计算，如果磁场大小在发生变化这时候该怎样来计算它所产生的能量呢？(具体的例子在图中))", "raw_message": "我在磁场自身变化的时候很难理清楚其中的能量转换。我遇到了这样的一个例子，当存在感生电动势时，安培力做功总是不等于电路的焦耳热，我觉得是因为运动的磁场会产生电场，使得其中有额外的能量来补偿焦耳热。但是在计算感应电动势的时候不是已经把这部分的能量算进去了吗？为什么还要再算一遍呢？我还是没有理解清楚。\n另外，当磁场自身运动时，可以转换参考系来让磁场静止下来计算，如果磁场大小在发生变化这时候该怎样来计算它所产生的能量呢？（具体的例子在图中））", "images": ["_imgs/img_f33fa2e549bf.jpg"], "replies": [{"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 4, "message": "我在之前的某期活动里见过类似的问题，下面是我对上次问题的理解，不一定百分百正确，看看我说得对不对🐶\n\n你把最后得到的柿子变形一下，就可以得到焦耳热产生的功率等于感生电动势产生电能的功率加上外力做功的功率，翻译一下就是总电能等于感应电动势产生的电能加上外力产生的电能。\n\n你可能会疑惑为什么外力做功会是感应电动势产生的电能，以及为什么外力对电能的贡献没有把磁场变化对电能的贡献包含进去。正如学姐所说，柿子里有磁场的变化，不代表把它带来的能量变化算进去。你把<span class=\"math\">\\(P\\)<\/span>外<span class=\"math\">\\(=BiLv\\)<\/span>变形一下，会发现它等于动生电动势乘电流，也就是棒子产生的电功率。\n\n这从微观上也可以解释。外力做正功把能量给棒子安培力做负功，又把这份能量从棒子中抽出来。抽到哪里去呢？安培力实际上是棒内电子洛伦兹力在棒运动方向上的分量，做负功；洛伦兹力还有一个沿棒的分量。那我们知道洛伦兹力是不做功的，也就是说这个沿棒的分量做的是和负功大小相等的正功。那就相当于电子能量先被暂存到磁场里，再从磁场又回到电子，变成电子沿棒方向的能量，也就有了电能。也就是说安培力是把电子沿棒运动方向的能量给吃掉了，把它变成棒方向的能量；而我的外力就是为了维持电子沿棒方向的能量，让他能一直吃下去。那我就可以解释为什么外力做功会转化成电能了。相当于外力把能量交给电子，让电子自己处置，电子想在沿棒运动方向上能量一定，那就只好把这份能量给沿棒方向，也就是转化成电能。你看这个过程没有涉及到左侧变化的磁场吧。", "id": "ep8:296679779889:r0"}, {"uname": "物你学家", "face": "_imgs/face_a2beefec54a5.jpg", "like": 4, "message": "其实你已经计算出了关键，相差的部分正是电流<span class=\"math\">\\(i\\)<\/span>乘以感生电动势ks，也就是感生电动势所做的功率。虽然你前面计算总的感应电动势考虑了感生电动势(必须的)，这只是在计算总的感应电动势，从而算出总的电流和正确的外力，也就是说你算的外力的功率是正确的。而这一部分，只是动生电动势的功率，所以还得加上感生电动势的功率，才等于回路中消耗的焦耳热的功率", "id": "ep8:296679779889:r1"}, {"uname": "不知称何妙", "face": "_imgs/face_5471c9fff018.jpg", "like": 0, "message": "<span class=\"mention\">回复 @不知称何妙<\/span> 我没把电子的能量说成动能，因为有电场力什么的。所以我的理解还是有点模糊，我觉得我的解释自洽就发了，还请大家帮忙看看", "id": "ep8:296679779889:r2"}]}, {"id": "ep8:296769798385", "module": "em", "auto": false, "uname": "Akie浅辄", "face": "_imgs/face_e91c42e60616.jpg", "like": 3, "message": "求解[给心心]", "raw_message": "求解[给心心]", "images": ["_imgs/img_4c10c414adf7.jpg"], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @点点卡卡西<\/span> 它和阻力积分加起来是零，因为末速度无竖直分量，由动量定理得", "id": "ep8:296769798385:r0"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "这道题其实有个比较简单的做法，来自于我们在课上学到的一个东西，带电荷粒子在纯磁场之中运动的时候向心力完全是洛伦兹力，因此我们计算半径和速度就可以用<span class=\"math\">\\(\\frac{mv^2}{R}=qvB→v=\\frac{qBR}{m}\\)<\/span>且<span class=\"math\">\\(R=\\frac{qBv}{m},\\)<\/span>因此速度会影响半径，半径也会影响速度\n但是我们用另外一种方式，我们使用<span class=\"math\">\\(m\\omega ^2R=q\\omega RB\\)<\/span>——只要使用正确的参考系，这个关系是一定成立的，而且一定能找到这样的参考系，于是我们发现<span class=\"math\">\\(\\omega =\\frac{qB}{m},\\)<\/span>这是一个定值，只要粒子两个性质和磁场一定，这一定是一个定值,因此我们可以用极坐标来进行完成\n也就是说存在一个方程组<span class=\"math\">\\(\nkv=-ma  \\)<\/span>①<span class=\"math\">\\(\n\\omega =const  \\)<\/span>②\n那么我们可以写为：<span class=\"math\">\\(\nk\\omega R=-m\\omega \\frac{dR}{dt}\n\\)<\/span>解这个方程可以得到<span class=\"math\">\\(R(t)=R^\\circ \\exp (-\\frac{kt}{m})\\)<\/span>，也就是这个曲线为<span class=\"math\">\\(\nR(t)=R^\\circ \\exp (-\\frac{kt}{m})\n\\theta (t)=\\frac{qBt}{m}\\)<\/span>", "id": "ep8:296769798385:r1"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "https://www.bilibili.com/read/cv47983846 (点蓝字)。压轴题很爱考这种(除了考配速法的话)", "id": "ep8:296769798385:r2"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 勘误，我没有考虑末速度大小，末并非与<span class=\"math\">\\(v_{0}\\)<\/span>等大反向，而是比<span class=\"math\">\\(v_{0}\\)<\/span>小，所以第二组方程有三个未知数，解不出来。我的方法就当抛砖引玉吧", "id": "ep8:296769798385:r3"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @复古雅典娜<\/span> 动能定理咋列？也能积分吗？", "id": "ep8:296769798385:r4"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @复古雅典娜<\/span> 没阻力的话直接水平竖直动量定理就行，但它有阻力最终<span class=\"math\">\\(v\\)<\/span>不等于<span class=\"math\">\\(v_{0}\\)<\/span>了，相当于多一个未知数，还要再列一个式子", "id": "ep8:296769798385:r5"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @物你学家<\/span> 消<span class=\"math\">\\(v\\)<\/span>，https://www.bilibili.com/read/cv48145131", "id": "ep8:296769798385:r6"}, {"uname": "物你学家", "face": "_imgs/face_a2beefec54a5.jpg", "like": 0, "message": "首先，这道题目超出了高考物理的要求范围哈。要完整地解出，除了@小光会变身 同学列出的动量定理，还要求出速度反向时的速度大小<span class=\"math\">\\(v\\)<\/span>。而要求出<span class=\"math\">\\(v\\)<\/span>来，必须考虑粒子运动时速度方向转动的角速度恒定(想一想，为什么？)来求出运动时间(这一部分是高考的要求)，再结合阻力对粒子动能的影响得到粒子运动速度大小随时间减少的情况(要用微分方程，超纲，不要求！)从而求出<span class=\"math\">\\(v\\)<\/span>。", "id": "ep8:296769798385:r7"}, {"uname": "复古雅典娜", "face": "_imgs/face_5846aa7014ee.jpg", "like": 0, "message": "洛伦兹力分量式", "id": "ep8:296769798385:r8"}, {"uname": "复古雅典娜", "face": "_imgs/face_5846aa7014ee.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 没错👍，就是这种方法。但是考试基本就是列出两个式子，动量定理和动能定理，结果一般很难算！", "id": "ep8:296769798385:r9"}, {"uname": "点点卡卡西", "face": "_imgs/face_f65eadc192bb.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 洛伦兹力竖直方向的动量积分为什么是0", "id": "ep8:296769798385:r10"}]}, {"id": "ep8:296762034081", "module": "em", "auto": false, "uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 0, "message": "这个题的第二问可以用洛伦兹力冲量式或者配速法分解运动。如果第二问选择了洛伦兹力冲量是在第三问只能得到电场力不做功出<span class=\"math\">\\(x\\)<\/span>轴是速度大小不变，怎么得到水平分量不变，竖直方向速度大小相等方向相反，这是可以做到的吗？是不是使用冲量式的局限性无法观看整个运动的整体。没有速度分解使用配速法来的直观。以及我还想问一下这道题的第三问的第二小问求所围成的面积<span class=\"math\">\\(s\\)<\/span>。答案直接由对称性可得。是什么直觉直接导向了对称的结果答案是怎么敢笃定这个对称的。", "raw_message": "这个题的第二问可以用洛伦兹力冲量式或者配速法分解运动。如果第二问选择了洛伦兹力冲量是在第三问只能得到电场力不做功出x轴是速度大小不变，怎么得到水平分量不变，竖直方向速度大小相等方向相反，这是可以做到的吗？是不是使用冲量式的局限性无法观看整个运动的整体。没有速度分解使用配速法来的直观。以及我还想问一下这道题的第三问的第二小问求所围成的面积s。答案直接由对称性可得。是什么直觉直接导向了对称的结果答案是怎么敢笃定这个对称的。", "images": ["_imgs/img_e2712c113709.jpg", "_imgs/img_251dc4182a88.jpg"], "replies": [{"uname": "粒子迷航", "face": "_imgs/face_a58cba8052a5.jpg", "like": 1, "message": "整理来看：电场力做功和为零 洛伦兹力不做功 合速度不变 又水平速度不变 所以竖直速度大小也不变", "id": "ep8:296762034081:r0"}, {"uname": "物你学家", "face": "_imgs/face_a2beefec54a5.jpg", "like": 0, "message": "第三小题第二小问，我能想到的解释是，除了用竖直方向写动量定理之外，水平方向也可以写出，这样就会发现，从第一象限回到<span class=\"math\">\\(x\\)<\/span>轴时，水平方向速度分量不变。又因为洛伦兹力不做功，所以竖直方向上的速度大小也不变，而方向变成竖直向下。所以面积的两倍来自这里，而不是对称性---在第一象限的轨迹我感觉不一定有对称性(没看出来)", "id": "ep8:296762034081:r1"}, {"uname": "粒子迷航", "face": "_imgs/face_a58cba8052a5.jpg", "like": 0, "message": "当然可以 水平方向电场力不做功 由洛伦兹力冲量：<span class=\"math\">\\(qBy=m\\Delta V_{x} \\)<\/span>而<span class=\"math\">\\(y=0 \\)<\/span>故水平动量不变", "id": "ep8:296762034081:r2"}, {"uname": "粒子迷航", "face": "_imgs/face_a58cba8052a5.jpg", "like": 0, "message": "而竖直速度方向显然是向上的", "id": "ep8:296762034081:r3"}]}, {"id": "ep8:296979647553", "module": "em", "auto": false, "uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 0, "message": "我想问一下，这个15题的第二问，我可以判断最小速度的临界情况，就是正离子与<span class=\"math\">\\(Y=2\\)<\/span>分之<span class=\"math\">\\(L\\)<\/span>相切，因为进入磁场一和到<span class=\"math\">\\(Y=2\\)<\/span>分之<span class=\"math\">\\(L\\)<\/span>这一段运动区间水平的速度变化量已知被最小速度<span class=\"math\">\\(V_{2}\\)<\/span>控制，竖直方向位移又已知，就可以通过洛伦兹力的冲量式求解出<span class=\"math\">\\(V_{2}\\)<\/span>，如果从几何的角度去解决这个问题，答案直接设了粒子穿过磁场一的边界时的速度与水平方向的夹角， 我记得咕咕教授曾经说过写出一个物理式子背后是有一个物理情境物理含义的，是什么样的物理情境引导着我去射出一个角度，然后能够求出它的半径", "raw_message": "我想问一下，这个15题的第二问，我可以判断最小速度的临界情况，就是正离子与Y等于2分之L相切，因为进入磁场一和到Y等于2分之L这一段运动区间水平的速度变化量已知被最小速度V2控制，竖直方向位移又已知，就可以通过洛伦兹力的冲量式求解出V2，如果从几何的角度去解决这个问题，答案直接设了粒子穿过磁场一的边界时的速度与水平方向的夹角， 我记得咕咕教授曾经说过写出一个物理式子背后是有一个物理情境物理含义的，是什么样的物理情境引导着我去射出一个角度，然后能够求出它的半径", "images": ["_imgs/img_c367e2439cd9.jpg", "_imgs/img_0e9ff6766e54.jpg"], "replies": []}, {"id": "ep8:299285556768", "module": "thermal", "auto": false, "uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 7, "message": "今天的问题是一个很多人都会踩的坑：研究气态星球里压强随半径变化的规律，只需要写出式子(就按高中物理里微元的写法)，不需要求解。下面由两种说法，谁对谁错？\n甲说：选取半径<span class=\"math\">\\(r\\)<\/span>处的一块长方体薄板，厚度<span class=\"math\">\\(\\Delta r(\\)<\/span>左图) 显然<span class=\"math\">\\( \\Delta p = \\rho g \\Delta r\n\\)<\/span>乙说：选取半径<span class=\"math\">\\(r\\)<\/span>的球壳上的一块(弧面薄板，右图)，内外弧面上向外向内的压力应该是 p(r) A(r)和<span class=\"math\">\\(p(r+\\Delta r) A(r+\\Delta r)\\)<\/span>，重力是<span class=\"math\">\\( \\rho g A(r)\\Delta r\\)<\/span>，所以应该有<span class=\"math\">\\( \\Delta (pA) = \\rho gA \\Delta r\\)<\/span>，可是这里的A也依赖于r (A正比于<span class=\"math\">\\(r^2)\\)<\/span>，不能直接提到<span class=\"math\">\\(\\Delta \\)<\/span>外面来。所以这与甲的结果是不一样的。\n问：到底是<span class=\"math\">\\( \\Delta p/\\Delta r = \\rho g \\)<\/span>还是<span class=\"math\">\\( \\Delta (p r^2) = \\rho g r^2? (\\)<\/span>上面𝜌、<span class=\"math\">\\(g\\)<\/span>都可以是<span class=\"math\">\\(r\\)<\/span>的函数，这不重要)错的那个人错在哪，能不能改对？", "raw_message": "今天的问题是一个很多人都会踩的坑：研究气态星球里压强随半径变化的规律，只需要写出式子（就按高中物理里微元的写法），不需要求解。下面由两种说法，谁对谁错？\n甲说：选取半径r处的一块长方体薄板，厚度∆r（左图） 显然 ∆p = 𝜌g ∆r\n乙说：选取半径r的球壳上的一块（弧面薄板，右图），内外弧面上向外向内的压力应该是 p(r) A(r)和p(r+∆r) A(r+∆r)，重力是 𝜌g A(r)∆r，所以应该有 ∆(pA) = 𝜌gA ∆r，可是这里的A也依赖于r （A正比于r^2），不能直接提到∆外面来。所以这与甲的结果是不一样的。\n问：到底是 ∆p/∆r = 𝜌g 还是 ∆(p r^2) = 𝜌g r^2? （上面𝜌、g都可以是r的函数，这不重要）错的那个人错在哪，能不能改对？", "images": ["_imgs/img_50302bc54170.jpg"], "replies": [{"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 5, "message": "四周侧壁的压力在径向的分量也有贡献", "id": "ep8:299285556768:r0"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 5, "message": "以前算过这个，我没记错的话<span class=\"math\">\\(\\frac{dp}{dr}=\\rho g\\)<\/span>是对的", "id": "ep8:299285556768:r1"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 4, "message": "<span class=\"mention\">回复 @xyz179<\/span> 我想应该是，虚功原理必须追踪封闭的质点系，因此必须保证体积不变。如果我们分析<span class=\"math\">\\(r\\)<\/span>～<span class=\"math\">\\(r+dr\\)<\/span>的球壳层，会得到这样的结论，<span class=\"math\">\\(r^2\\)<\/span>依然在求导外面", "id": "ep8:299285556768:r2"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 1, "message": "<span class=\"mention\">回复 @xyz179<\/span> 😂😂", "id": "ep8:299285556768:r3"}]}, {"id": "ep8:296974866769", "module": "thermal", "auto": false, "uname": "空下去", "face": "_imgs/face_4537839cb640.jpg", "like": 3, "message": "在学习气体压强部分我看到有一个题：\n一个湖中的气泡从湖底飘到湖水面附近，定量求它的压强。题目标题还特意地标上了“易错，容易忽略大气压强”\n但是我想问的是：我们到底为什么要考虑大气压强对水中气泡的影响呢？回到课本的解释：气体分子对某一表面不断地撞击，这个持续撞击的“力”就是压强产生的动因。从这个角度来看，压强似乎是“力”作用的结果。回归到本题，既然压强是力作用的结果，那么应该知道力不会隔山打牛，也就是你推一个固定不动的物体，对物体另一侧的，紧挨着的物体，我们的力不会作用到它身上。那在这里这个“湖水”是不是就像是被大气压强“推着”的物体呢？而这个效果为什么会影响到湖水里的气泡呢？这不是很矛盾吗？\n想看看大家的看法🤔", "raw_message": "在学习气体压强部分我看到有一个题：\n一个湖中的气泡从湖底飘到湖水面附近，定量求它的压强。题目标题还特意地标上了“易错，容易忽略大气压强”\n但是我想问的是：我们到底为什么要考虑大气压强对水中气泡的影响呢？回到课本的解释：气体分子对某一表面不断地撞击，这个持续撞击的“力”就是压强产生的动因。从这个角度来看，压强似乎是“力”作用的结果。回归到本题，既然压强是力作用的结果，那么应该知道力不会隔山打牛，也就是你推一个固定不动的物体，对物体另一侧的，紧挨着的物体，我们的力不会作用到它身上。那在这里这个“湖水”是不是就像是被大气压强“推着”的物体呢？而这个效果为什么会影响到湖水里的气泡呢？这不是很矛盾吗？\n想看看大家的看法[思考]", "images": [], "replies": [{"uname": "xyz179", "face": "_imgs/face_f44efd6d906c.jpg", "like": 2, "message": "记不记得帕斯卡定律？压在液体上的压强都要传递到各处。所以压在水面上的大气压会作用在气泡上。帕斯卡定律忘记了的话，高中生可以通过咕咕很久以前的视频里示范过的“虚功”(即平衡状态附近偏移一点合力做功为零)来推导。", "id": "ep8:296974866769:r0"}, {"uname": "史蒂夫2332", "face": "_imgs/face_c6635238edad.jpg", "like": 0, "message": "你不考虑大气压，也就相当于你不考虑大气层自己的重力🥜", "id": "ep8:296974866769:r1"}]}, {"id": "ep8:296681036961", "module": "thermal", "auto": false, "uname": "槭焰", "face": "_imgs/face_0472628365bc.jpg", "like": 2, "message": "有一个问题：饱和汽压与蒸汽的体积无关，但是为什么饱和汽压与液面的弯曲程度有关？\n我的思路是：本质上是液面张力的缘故，凸液面代表着这个容器不被液体润湿，液面内部对于表面层分子的引力大于外部对于表面层的引力，若有分子从中溢出，则说明溢出的分子自身所具有的分子动能很大，则单位时间内对单位面积的碰撞更多。凹液面则反之。从而凸液面的饱和汽压更大。我的直觉是否正确呢，如果不正确，是哪里出了问题，该怎么修正呢", "raw_message": "有一个问题：饱和汽压与蒸汽的体积无关，但是为什么饱和汽压与液面的弯曲程度有关？\n我的思路是：本质上是液面张力的缘故，凸液面代表着这个容器不被液体润湿，液面内部对于表面层分子的引力大于外部对于表面层的引力，若有分子从中溢出，则说明溢出的分子自身所具有的分子动能很大，则单位时间内对单位面积的碰撞更多。凹液面则反之。从而凸液面的饱和汽压更大。我的直觉是否正确呢，如果不正确，是哪里出了问题，该怎么修正呢", "images": [], "replies": []}, {"id": "ep8:296764575553", "module": "thermal", "auto": false, "uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 1, "message": "我想问一下这道题的第二问，我觉得自己不太敢笃定自己的做法，当环境温度为<span class=\"math\">\\(t_{0}\\)<\/span>时，通入同种部分气体不会影响它的温度，只会影响里面的物质的量进而影响里面的体积压强是通过受力平衡约束的压强不变。再通过等压变化，可以得到通入气体后，在<span class=\"math\">\\(t_{0}\\)<\/span>温度下它的高度，再用后来的体积比上原来的体积可以得到物质的量之比，进而得到质量之比，然后就可以确定充入的气体质量与下部分原有气体的质量。我是这样想的，但是我们老师说遇到这种题目就直接用压强体积去比就好了。设出通入气体质量的压强与体积，然后再利用物质的量之和等于通入的与原来的相加。他说，遇到这种题就无脑套压强和体积以及这个控制关系。我这样想有问题吗？我也凑出来了答案，但我不确定我这样想对不对。", "raw_message": "我想问一下这道题的第二问，我觉得自己不太敢笃定自己的做法，当环境温度为t0时，通入同种部分气体不会影响它的温度，只会影响里面的物质的量进而影响里面的体积压强是通过受力平衡约束的压强不变。再通过等压变化，可以得到通入气体后，在t0温度下它的高度，再用后来的体积比上原来的体积可以得到物质的量之比，进而得到质量之比，然后就可以确定充入的气体质量与下部分原有气体的质量。我是这样想的，但是我们老师说遇到这种题目就直接用压强体积去比就好了。设出通入气体质量的压强与体积，然后再利用物质的量之和等于通入的与原来的相加。他说，遇到这种题就无脑套压强和体积以及这个控制关系。我这样想有问题吗？我也凑出来了答案，但我不确定我这样想对不对。", "images": ["_imgs/img_8e0ee7ac28c8.jpg"], "replies": [{"uname": "粒子迷航", "face": "_imgs/face_a58cba8052a5.jpg", "like": 1, "message": "你和你老师的是一个想法 只不过你是直接跳过了列式环节", "id": "ep8:296764575553:r0"}]}, {"id": "ep8:299563906320", "module": "nuclear", "auto": false, "uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 2, "message": "今天的题目分享", "raw_message": "今天的题目分享", "images": ["_imgs/img_0f103e98e2d9.jpg"], "replies": [{"uname": "粒子迷航", "face": "_imgs/face_a58cba8052a5.jpg", "like": 1, "message": "选D 需要给出氢原子能级公式 不然高中不可做", "id": "ep8:299563906320:r0"}, {"uname": "粒子迷航", "face": "_imgs/face_a58cba8052a5.jpg", "like": 1, "message": "不过其实可以用多普勒效应猜答案 正确选项肯定是大于", "id": "ep8:299563906320:r1"}, {"uname": "粒子迷航", "face": "_imgs/face_a58cba8052a5.jpg", "like": 1, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 我印象里是没学的 这一块课内好像是只要求定性分析 一般题目里都是直接给每个能级的能量让学生计算", "id": "ep8:299563906320:r2"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "D.从第一能级跃迁到第二能级，但是光子有和<span class=\"math\">\\(H\\)<\/span>一样速度的动量，由<span class=\"math\">\\(p=h/\\lambda \\)<\/span>，所以v(频率)会更大？(高中生理解，错了请指出)", "id": "ep8:299563906320:r3"}]}, {"id": "ep8:299391478880", "module": "math", "auto": false, "uname": "高中物理咕咕助教", "face": "_imgs/face_8085b2aab17f.jpg", "like": 10, "message": "我问一个数学问题好了。这应该是一个常见的困惑。\n我们说，抛硬币一般的期望是得到一半正一半反。那么假如我今天抛了10次，全是正面，之后再抛10次是不是应该有更多次反面呢？\n我们学过一点概率论应该会知道，几次抛硬币是独立事件，不应该互相影响，所以之后每次抛得到正反面的概率仍然是一半一半。\n那大家有没有理清楚之前那种错误说法，到底错在哪里？根据概率，难道我不应该期望整体20次实验的结果更趋近于正反对等的概率吗？这不应该自然要求后面10次多出现一些反面来“抵消”之前正面偏多的情况吗？我知道正确答案是什么，但是谁帮我剖析一下，我的分析错在哪了？", "raw_message": "我问一个数学问题好了。这应该是一个常见的困惑。\n我们说，抛硬币一般的期望是得到一半正一半反。那么假如我今天抛了10次，全是正面，之后再抛10次是不是应该有更多次反面呢？\n我们学过一点概率论应该会知道，几次抛硬币是独立事件，不应该互相影响，所以之后每次抛得到正反面的概率仍然是一半一半。\n那大家有没有理清楚之前那种错误说法，到底错在哪里？根据概率，难道我不应该期望整体20次实验的结果更趋近于正反对等的概率吗？这不应该自然要求后面10次多出现一些反面来“抵消”之前正面偏多的情况吗？我知道正确答案是什么，但是谁帮我剖析一下，我的分析错在哪了？", "images": [], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 2, "message": "回归均值的正确含义是：极端结果之后，大概率会出现更接近平均值的结果，而非反向的极端结果。\n前10次全正面是极端结果，接下来抛10次，最可能出现的结果是5正5反(完全符合均值)，而不是“更多反面、少于5次正面”的反向极端。它只是回归到50%的平均概率，而不是要反向偏离来补偿之前的极端。相当于稀释(用期望浓度的溶液稀释，而非水或溶质)", "id": "ep8:299391478880:r0"}, {"uname": "四重吹不散", "face": "_imgs/face_dbb0bd97eb2e.jpg", "like": 1, "message": "我认为问题出在对期望的理解，把数学期望理解成了某种的约束理解成了错误的数量“守恒”，“为了维持<span class=\"math\">\\(\\frac{1}{2}\\)<\/span>的期望之后必然会出现反面”，但是真正的期望改变的是频率而不是绝对的数量差，期望是对总体数据的“指向”，也就是说——是相对的比例，“随着样本数量增多(分母)”淹没了随机性凸显出的确定的规律、方向，我直觉上的感触是这种“约束”是某种“浮现”(约束大方向)，而不是硬性的“守恒”", "id": "ep8:299391478880:r1"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 最终整体看上来趋向期望是因为大量“正确”的期望“稀释”了少数极端案例", "id": "ep8:299391478880:r2"}, {"uname": "Tanga_Ibuki", "face": "_imgs/face_fd8b67741918.jpg", "like": 0, "message": "我谈谈个人的想法：①抛硬币的结果的走向是由自然的概率决定的，而不是随人的主观而转移的，不能说我想让它出现更多反面就能出现的\n②抛出的20枚硬币是个个相互独立的，自然不会记忆之前抛出的结果，所有的讨论必须在“将要抛出的”这些硬币中进行，将过去的结果(10枚正面)纳入到讨论中本身就是错误的——这就好比我一共扔了10000次硬币，其中有5000次正面，我难道要求我接下来抛出的10枚硬币里、抵消掉我抛出的5000次正面吗？——5000已是发生过的事情，是不能被包含在随机实验的样本空间的", "id": "ep8:299391478880:r3"}, {"uname": "Light_dreamer探索者", "face": "_imgs/face_1c37b37eb98b.jpg", "like": 0, "message": "整体20次出现正反相等的概率为50%的含义是说我做这20次抛硬币的行为最终结果为正反相等的“情况的可能性”为50%，是发生这件事的概率，你可能会说：那它不就是“更可能发生”吗？这也是容易有错误认识的点：这个“更可能发生”是打比方说我做了100组抛20次硬币的实验，其中有“将近”(而不一定等于)50组实验是正反相等的；你可能还会有这样一个疑问：可是抛20次硬币出现正的15次反的5次的概率极低，这并不意味着它不可能发生，还拿100组抛20次硬币实验举例：出现正的15次反的5次的组数会比较少\n\n抛20次一定有50%是正的另50%是反与前面对于“概率”的认识与前面是不同的，它意味着这枚神奇的硬币可以从这次或某些结果影响/决定下次结果，同时，它不是在谈事件发生的可能性，而是在说一个确定的事情。\n\n这又有一个问题；前面说的扔100组将近50组是正反相等的结果不也是某种确定吗？怎么它就可以确定了，这不也可以说是硬币有“某种魔法”吗？\n\n写到这里脑子实在是需要休息了，想继续想和写不过要为明天负责", "id": "ep8:299391478880:r4"}]}], "mod_stats": {"mech": {"q": 6, "r": 55, "img": 8}, "energy": {"q": 1, "r": 6, "img": 2}, "em": {"q": 5, "r": 41, "img": 7}, "thermal": {"q": 4, "r": 7, "img": 2}, "nuclear": {"q": 1, "r": 4, "img": 1}, "math": {"q": 1, "r": 5, "img": 0}}, "removed": [["st_Frozen", "@不知称何妙  这里是答案，可以参考参考", "归档时已排除"], ["st_Frozen", "@xyz179", "归档时已排除"], ["四重吹不散", "@st_Frozen 好问题啊，不过我觉得还有一些我没想清楚，这个结果和", "归档时已排除"], ["st_Frozen", "理论力学讲义，刘川 著 @史蒂夫2332", "归档时已排除"], ["史蒂夫2332", "@xyz179 @st_Frozen", "归档时已排除"], ["轩qw", "[生气]", "归档时已排除"], ["AI视频总结", "AI总结喵：\n\n本期视频是高中物理学习者的“思维进阶课”，由ELSA主持", "归档时已排除"]], "ghost_merged": 59, "total_q": 18, "total_r": 118, "total_img": 20, "auto_cnt": 0}, {"key": "ep9", "title": "第9期", "episodeId": "ep1777092338561", "export": "2026-08-25", "comments": [{"id": "ep9:300323223040", "module": "mech", "auto": false, "uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 4, "message": "如题", "raw_message": "如题", "images": ["_imgs/img_1a0c6f456f2e.jpg"], "replies": [{"uname": "物理系咕咕叫兽", "face": "_imgs/face_10ecedff6f3b.jpg", "like": 6, "message": "啊？？我看下面的讨论都看呆了，这问题有这么复杂吗？各位怎么回事？？？怎么还有怀疑结论的？完了完了。这和物体的惯性、物体怎么受力、什么摩擦力啦，和这些有半点儿关系吗？难道不是一句“只要胆敢在有压缩的情况下脱离，由于弹簧轻质，会瞬间赶上”就解决了吗？", "id": "ep9:300323223040:r0"}, {"uname": "佚之森", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 2, "message": "要是不是原长的话不就还受力了吗？", "id": "ep9:300323223040:r1"}, {"uname": "数学和物理都很有趣", "face": "_imgs/face_71bf55804b7f.jpg", "like": 1, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 你这个充要条件有问题，分离是说那一时刻的位置X相同，更简单一点，就是接触面的压力<span class=\"math\">\\(N=0\\)<\/span>，在这个问题里<span class=\"math\">\\(N=0\\)<\/span>的时候弹簧没有受到挤压，当然是原长。🐶再说你那个<span class=\"math\">\\(V\\)<\/span>相同为什么不是分离的要求，我理解的分离的瞬间意思是这一时刻X还相同，但dt(一个接近0的时间间隔)后X就不同了，如果<span class=\"math\">\\(V\\)<\/span>相同的话，再经过dt时刻它们的位置都变成了<span class=\"math\">\\(X+Vdt\\)<\/span>，还是一样的，这不算分离🐶", "id": "ep9:300323223040:r2"}, {"uname": "忧郁de翻斗大街", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 1, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 我没有疑惑😂我很肯定你这个题本身结论就是有问题的。弹力为0只是弹簧本身的弹力为0，但弹簧在恢复到原长弹力为0时本身还具有一个速度，这并不足以充分说明弹簧和物块之间的压力为0，这是两个概念。弹簧和物块之间正压力为0的条件是物块速度即将大于弹簧速度，这也是分离条件(共速、<span class=\"math\">\\(a\\)<\/span>相等、下一刻<span class=\"math\">\\(a\\)<\/span>不再相等)的由来。你可以想象只要弹簧速度能大于物块，那么弹簧就能挤压物块，而现在弹簧受到物块限制使弹簧速度不能大于物块。如果物块质量够小，弹簧质量较大，初始弹力较大，则完全有可能在没恢复到原长前就先把物块弹飞分离", "id": "ep9:300323223040:r3"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "初始的时候弹簧被压缩，两边的两个物块受到弹簧分别集于左右两侧相同大小的力，这非常的对称，假如两个弹簧最终，分离时的速度大小不相同的话，那么弹簧分别给两物块的力所做的功是不同的，但是，为什么会不同呢？如果左边的更大，那么，将视角换为另一侧，不就变成右边的更大了吗？所以有矛盾，故而在两物块恰好分离的时候，其速度大小恰好相同方向恰好相反", "id": "ep9:300323223040:r4"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "我想我明白楼主的意思了，九是物块受到摩擦力的阻力，而弹簧给会给它一个推力，当阻力和推力相同的时候，物块恰好受力平衡，既然此刻平衡，那又为什么会分离呢？", "id": "ep9:300323223040:r5"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "不妨这样想，在弹簧弹力大于摩擦力的之前，5块一直做加速度减小的加速运动，所以物块在弹簧，弹力和摩擦力相等的时候是具有一定速度的，而这个速度会与地面相对运动，然后展现出来的就是加速度在增大的减速运动", "id": "ep9:300323223040:r6"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "前提是在能量能支撑物块分离时....", "id": "ep9:300323223040:r7"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "所以您问的是在弹簧达到原长的时候，在这一时刻，取极小的一段时间内，并且取弹簧末端和物块那一小部分进行细致的观察，就会发现，弹簧似乎跟着物块一起向外面运动了一点，是这样吗？如果是这样的话，可以认为，当弹簧达原长的那一时刻，弹簧末端的速度和物块的速度相同，那么物块它的速度是会减小的这是因为所受摩擦力，而弹簧的这一小部分速度也是减小的，因为它受自身伸长量所限制，那是什么玩意儿使得物快分开，我真的很想说是弹簧的弹力对弹簧的作用更巨大来“敷衍”您，但我想了一下，弹簧它有一小段伸长量，但是它的末端却没有却没有什么东西和它进行固定连接，而物块的速度是向弹簧外的，可以在这时候对弹簧末端分析，所受力是弹簧弹力，那质量<span class=\"math\">\\(m\\)<\/span>呢？没有吗？认为他是无穷小好了，那么在这一瞬间加速度巨大，距离瞬间到达原长，额", "id": "ep9:300323223040:r8"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "是否可以将问题转化为“弹簧向内回向加速度该怎么进行定性求解，并且这还是在弹簧不连接物体的情况”", "id": "ep9:300323223040:r9"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "所以非要严格及其严格来说，物块分离时弹簧不处于原长，但高中物理有一定的以实验为基础，这一很小很小一点差异该如何被观测", "id": "ep9:300323223040:r10"}, {"uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "额，用天文望远镜？", "id": "ep9:300323223040:r11"}, {"uname": "佚之森", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "这个前提不就是弹簧得轻质嘛 要不还有这个结论咩😳对了 你真的会变身吗()", "id": "ep9:300323223040:r12"}, {"uname": "High-explosive", "face": "_imgs/face_d20602747ba5.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 充要条件是错的😂", "id": "ep9:300323223040:r13"}, {"uname": "High-explosive", "face": "_imgs/face_d20602747ba5.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 弹力为0时分离 弹力正比于伸缩量 所以原长时分离", "id": "ep9:300323223040:r14"}, {"uname": "High-explosive", "face": "_imgs/face_d20602747ba5.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 不一定对 没学", "id": "ep9:300323223040:r15"}, {"uname": "High-explosive", "face": "_imgs/face_d20602747ba5.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 没懂意思 所以弹簧不受摩擦力", "id": "ep9:300323223040:r16"}, {"uname": "High-explosive", "face": "_imgs/face_d20602747ba5.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 以弹簧为参考系可以发现在分离前物块一直在远离弹簧中心有一定速度 物块在地面参考系中也会比弹簧速度快 所以应该是先分离后又相撞", "id": "ep9:300323223040:r17"}, {"uname": "High-explosive", "face": "_imgs/face_d20602747ba5.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 我指的是 它不是极短时间内重新接触的", "id": "ep9:300323223040:r18"}, {"uname": "玥然居", "face": "_imgs/face_1e3467d6f87a.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 因为有速度，惯性啊", "id": "ep9:300323223040:r19"}, {"uname": "玥然居", "face": "_imgs/face_1e3467d6f87a.jpg", "like": 0, "message": "<span class=\"mention\">回复 @玥然居<\/span> 而且也不一定吧，要看摩擦力的大小", "id": "ep9:300323223040:r20"}, {"uname": "数学和物理都很有趣", "face": "_imgs/face_71bf55804b7f.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 既然你都说“重新”了，那至少它们曾分开过🐶那至于以后能不能追上就再说了🐶", "id": "ep9:300323223040:r21"}, {"uname": "忧郁de翻斗大街", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "题就不对。由条件可知弹簧中心的左右两侧是完全对称的运动，分离条件是物块与弹簧接触面无挤压，即压力为0，速度相等且下一刻加速度不同。分离前一刻和分离后显然物块只受摩擦力，加速度<span class=\"math\">\\(a=ug\\)<\/span>且与速度<span class=\"math\">\\(v\\)<\/span>方向相反，由此可得，取一半的弹簧来看，应当在弹簧端点(分离前的接触点位置) 的加速度<span class=\"math\">\\(a\\)<\/span>也等于ug且与<span class=\"math\">\\(v\\)<\/span>相反时分离，且由于此时弹簧与物块间压力为0，显然弹簧的加速度完全来自它本身的弹力，那就不可能是处于原长状态，而一定是处于拉伸状态，且具体位置和劲度系数<span class=\"math\">\\(k\\)<\/span>以及弹簧的质量<span class=\"math\">\\(M\\)<\/span>以及物块与地面的摩擦系数<span class=\"math\">\\(u\\)<\/span>有关", "id": "ep9:300323223040:r22"}, {"uname": "忧郁de翻斗大街", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 是按弹簧无摩擦考虑的啊 你看清楚我只说物块受摩擦😂", "id": "ep9:300323223040:r23"}, {"uname": "未酬雨穆", "face": "_imgs/face_72909990189c.jpg", "like": 0, "message": "我猜提问者想问的是，为什么不是<span class=\"math\">\\(x=\\mu mg /k\\)<\/span>？在这个位置的时候，如果假设此时<span class=\"math\">\\(N\\)<\/span>为零的话，物块的<span class=\"math\">\\(a\\)<\/span>应该为<span class=\"math\">\\(-\\mu g\\)<\/span>，但是呢，由于弹簧是轻质的，所以加速度是正无穷，所以弹簧会继续追上物块，使得它俩产生形变，所以还是会有<span class=\"math\">\\(N\\)<\/span>的，因此，只有当弹簧在原长的时候，弹簧中每一段都是恢复到原长，所以每一段受力都是零，所以弹簧是没有加速度的，但是由于端点和物块共速，也在向前运动，位移dx的时候有一个kdx，<span class=\"math\">\\(m=0\\)<\/span>产生极大的加速度，做A趋近于零的简谐振动，使得这个弹簧处在一个“准”静止的状态，弹簧端点的位移远远小于物块的位移，所以会在原长处脱离", "id": "ep9:300323223040:r24"}]}, {"id": "ep9:300289679552", "module": "mech", "auto": false, "uname": "菲艳溪月", "face": "_imgs/face_112e5440880d.jpg", "like": 3, "message": "今天在做题时，偶然了解了线性函数的凹凸性，由此联想到了平均速度公式，比如<span class=\"math\">\\(x-t\\)<\/span>图像如果是上凸，说明加速度为负(减速)，下凸加速度为正(加速)。那平均速度和凹凸性有什么关系呢？比如，对于匀变速直线运动，<span class=\"math\">\\(x-t\\)<\/span>是二次函数，<span class=\"math\">\\(x=V_0t+\\frac{1}{2}at^2\\)<\/span>，这个时候的平均速度<span class=\"math\">\\(v'=x(t_{2})-\\frac{x(t_{1})}{t2}-t_{1}= V_{0}+\\frac{1}{2}a(t_{1}+t_{2})\\)<\/span>，而中间时刻的瞬时速度为<span class=\"math\">\\(v=t_{1}+\\frac{t2}{2}=v_{0}+a\\times (t_{1}+\\frac{t_{2})}{2}\\)<\/span>，这刚好等于平均速度，因此是与线性函数有关，非线性函数凹凸性是否决定着平均速度与瞬时速度的大小关系？第一次参与讨论，可能问题不是很清晰，希望能与大家共同探讨，感谢。(ps：今天下午返校，下周四回来看评论)", "raw_message": "今天在做题时，偶然了解了线性函数的凹凸性，由此联想到了平均速度公式，比如x-t图像如果是上凸，说明加速度为负（减速），下凸加速度为正（加速）。那平均速度和凹凸性有什么关系呢？比如，对于匀变速直线运动，x-t是二次函数，x= V 0 t+1/2 at²，这个时候的平均速度v'=x(t2)-x(t1)/t2-t1= V0+1/2a（t1+t2），而中间时刻的瞬时速度为v=t1+t2/2=v0+a×(t1+t2）/2，这刚好等于平均速度，因此是与线性函数有关，非线性函数凹凸性是否决定着平均速度与瞬时速度的大小关系？第一次参与讨论，可能问题不是很清晰，希望能与大家共同探讨，感谢。（ps：今天下午返校，下周四回来看评论）", "images": [], "replies": []}, {"id": "ep9:298105196817", "module": "mech", "auto": false, "uname": "Yui-喵", "face": "_imgs/face_3966499b315e.jpg", "like": 3, "message": "这道题答案说<span class=\"math\">\\(m_{2}\\)<\/span>的加速度是<span class=\"math\">\\(m_{1}\\)<\/span>的两倍，但是我的理解是，当<span class=\"math\">\\(m_{2}\\)<\/span>向右运动<span class=\"math\">\\(l\\)<\/span>时，动滑轮上方的绳子相应地向右运动<span class=\"math\">\\(l\\)<\/span>，那么由于绳长不变，动滑轮下方绳子也运动<span class=\"math\">\\(l\\)<\/span>，则<span class=\"math\">\\(m_{1}\\)<\/span>运动也是<span class=\"math\">\\(l\\)<\/span>，那么<span class=\"math\">\\(m_{1}\\)<\/span>的加速度应该和<span class=\"math\">\\(m_{2}\\)<\/span>相等。请问这样想有什么问题？", "raw_message": "这道题答案说m2的加速度是m1的两倍，但是我的理解是，当m2向右运动l时，动滑轮上方的绳子相应地向右运动l，那么由于绳长不变，动滑轮下方绳子也运动l，则m1运动也是l，那么m1的加速度应该和m2相等。请问这样想有什么问题？", "images": ["_imgs/img_07535473f7cd.jpg"], "replies": [{"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 0, "message": "设绳长为<span class=\"math\">\\(l\\)<\/span>，<span class=\"math\">\\(m_{1}\\)<\/span>距离左边墙面为<span class=\"math\">\\(x\\)<\/span>，则滑轮前端距离墙面<span class=\"math\">\\((l+\\frac{x)}{2}\\)<\/span>，而<span class=\"math\">\\(v_{2}=\\Delta x/\\Delta t\\)<\/span>，<span class=\"math\">\\(v_{1}=\\Delta (l+\\frac{x)}{2}\\Delta t=\\frac{v2}{2}\\)<\/span>；<span class=\"math\">\\(a_{2}=\\Delta v_{2}/\\Delta t\\)<\/span>，<span class=\"math\">\\(a_{1}=\\Delta (\\frac{v2}{2})/\\Delta t=\\frac{a2}{2}\\)<\/span>", "id": "ep9:298105196817:r0"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 0, "message": "容易看出，<span class=\"math\">\\(m_{1}\\)<\/span>每移动1米，<span class=\"math\">\\(\nm_{2}\\)<\/span>移动2米", "id": "ep9:298105196817:r1"}, {"uname": "佚之森", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "物块1的运动和滑轮是同步的 那么我们来观察左侧的滑轮和2 滑轮往前走<span class=\"math\">\\(x\\)<\/span>的时候 滑轮上端的绳子也多出来相应的x 那么下端的2不仅要和滑轮往前走x 还要因下段绳子缩短而前进x 所以2的位移是2x 而a v x是线性累计关系  所以<span class=\"math\">\\(a\\)<\/span>也相应成2倍关系", "id": "ep9:298105196817:r2"}]}, {"id": "ep9:300915447616", "module": "mech", "auto": false, "uname": "想roll到起飞", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 2, "message": "问一个非常普遍的问题，为什么在角速度增大后，<span class=\"math\">\\(a\\)<\/span>的摩擦力反而减小了，虽然知道拉力的变化量比<span class=\"math\">\\(a\\)<\/span>的摩擦力变化量要大，但是这有些反直觉，因为在这一情境下是<span class=\"math\">\\(a\\)<\/span>的运动趋势导致的<span class=\"math\">\\(a\\)<\/span>的受力情况，但是由推理的角度上貌似是因果倒置了，即由效果力决定<span class=\"math\">\\(a\\)<\/span>的摩擦力大小，是拉力抵消了趋势?但这明显不合理啊趋势是ab同时产生，拉力也是同时产生，而<span class=\"math\">\\(a\\)<\/span>的摩擦力好似有灵性般自动消失了", "raw_message": "问一个非常普遍的问题，为什么在角速度增大后，a的摩擦力反而减小了，虽然知道拉力的变化量比a的摩擦力变化量要大，但是这有些反直觉，因为在这一情境下是a的运动趋势导致的a的受力情况，但是由推理的角度上貌似是因果倒置了，即由效果力决定a的摩擦力大小，是拉力抵消了趋势?但这明显不合理啊趋势是ab同时产生，拉力也是同时产生，而a的摩擦力好似有灵性般自动消失了", "images": ["_imgs/img_575d25604f4b.jpg"], "replies": [{"uname": "Y-Y-Y-Y-W-w", "face": "_imgs/face_ebba4faa03e9.jpg", "like": 0, "message": "假如ab绳子一样长并且转之前绳子没有拉力  那么一开始转  两个人都想往外边跑  这时候摩擦力开始发力不给走  再加速  摩擦力绷不住了  两个人眼看就要动了  结果被绳子拉住  并且两个人需要的力相同(用以维持相同半径相同角速度相同质量的圆周运动)绳子刚好满足了这一要求  此时摩擦力不变\n但本题中b的半径大  需要的向心力更大  于是把<span class=\"math\">\\(a\\)<\/span>拉着跑 a一想跑 (方向和摩擦力一样指向圆心) 摩擦力就减小了\n说到底  绳子没有拉力时 a的运动趋势向外  有拉力时因为b拉太猛了  运动趋势慢慢向内转变  这时原先内向的摩擦力就慢慢变得外向了", "id": "ep9:300915447616:r0"}, {"uname": "Y-Y-Y-Y-W-w", "face": "_imgs/face_ebba4faa03e9.jpg", "like": 0, "message": "<span class=\"mention\">回复 @Y-Y-Y-Y-W-w<\/span> 如果从惯性力的角度看会清晰很多", "id": "ep9:300915447616:r1"}]}, {"id": "ep9:300692432208", "module": "mech", "auto": false, "uname": "枪与她", "face": "_imgs/face_e5ba64cf556b.jpg", "like": 1, "message": "小学时学的一个问题，AB两个半径相同的圆固定A不动B绕A旋转至下部。出现一个反直觉现象(小学我是这样认为的)我的理解分成两个分运动1绕A“平移”2B自身旋转，这样理解对吗，还有一个问题假设A圆心为坐标原点B圆心为(2.0)半径均为1，<span class=\"math\">\\(T\\)<\/span>为起始B下端的点，运动过程中<span class=\"math\">\\(T\\)<\/span>的轨迹怎么求", "raw_message": "小学时学的一个问题，AB两个半径相同的圆固定A不动B绕A旋转至下部。出现一个反直觉现象(小学我是这样认为的)我的理解分成两个分运动1绕A“平移”2B自身旋转，这样理解对吗，还有一个问题假设A圆心为坐标原点B圆心为(2.0)半径均为1，T为起始B下端的点，运动过程中T的轨迹怎么求", "images": ["_imgs/img_9bf721fa595b.jpg"], "replies": [{"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 0, "message": "刚体B的滚动可分解为其圆心的运动叠加自身的转动。设B圆心相对A圆心转角为逆时针的<span class=\"math\">\\(\\theta \\)<\/span>，<span class=\"math\">\\(T\\)<\/span>相对B圆心转角为逆时针的<span class=\"math\">\\(\\varphi \\)<\/span>，纯滚动要求初始时刻<span class=\"math\">\\(T\\)<\/span>点对地的瞬时速度为零，即<span class=\"math\">\\(\\frac{2R\\Delta\\theta}{\\Delta t}-\\frac{R\\Delta\\varphi}{\\Delta t}=0\\)<\/span>，因此<span class=\"math\">\\(\\varphi =2\\theta \\)<\/span>恒成立。有<span class=\"math\">\\(x_B=2Rsin\\theta \\)<\/span>，<span class=\"math\">\\(y_B=2Rcos\\theta \\)<\/span>，<span class=\"math\">\\(x_T=x_B-Rsin\\varphi \\)<\/span>，<span class=\"math\">\\(y_T=y_B-Rcos\\varphi \\)<\/span>，由此得到<span class=\"math\">\\(T\\)<\/span>点轨迹的参数方程：<span class=\"math\">\\(\nx=R(2\\sin \\theta -\\sin 2\\theta )\\)<\/span>，<span class=\"math\">\\(y=R(2\\cos \\theta -\\cos 2\\theta )\\)<\/span>", "id": "ep9:300692432208:r0"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 0, "message": "当然，前提是B做纯滚动，也就是不打滑。可以这样理解：当两个圆之间足够粗糙就不会打滑，二者间的摩擦是静摩擦，所以接触点没有相对滑动，也就是接触点瞬时速度为零，也就是B圆心运动速度<span class=\"math\">\\((2R\\Delta \\theta /\\Delta t )+ T\\)<\/span>点相对B运动速度<span class=\"math\">\\((-R\\Delta \\varphi /\\Delta t) = 0\\)<\/span>", "id": "ep9:300692432208:r1"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 0, "message": "<span class=\"mention\">回复 @枪与她<\/span> 如果按你的文字为标准，B绕A“平移”一般是指箭头方向不动；然后B绕自身转动就是箭头转过的角度，也就是<span class=\"math\">\\(\\varphi \\)<\/span>", "id": "ep9:300692432208:r2"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 0, "message": "<span class=\"mention\">回复 @枪与她<\/span> 所以当<span class=\"math\">\\(\\theta =\\pi \\)<\/span>时<span class=\"math\">\\(\\varphi =2\\pi \\)<\/span>，箭头相对初始方向转了一圈，所以依然向上", "id": "ep9:300692432208:r3"}, {"uname": "bili_38727059351", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "研究AB相对运动，可以在接触点给AB一个相等的速度，这样接触点转到A对面时B也转到它对面，再将得到的图形旋转180度就是了，你在用直觉时看B旋转了的角度时，注意到AB线速度相等，所以B的确旋转了180度，但你忽略了A也在转动，角速度相等，所以A静止时B的角速度变两倍，所以转了360度", "id": "ep9:300692432208:r4"}]}, {"id": "ep9:300180941072", "module": "mech", "auto": false, "uname": "bili_85980118413", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "没有题，但我有一个问题，希望有人能帮我确定一下，就是在跟deepseek聊一道物理题时，他跟我提到了约束这个东西，分为几何约束和运动学约束，他说这个挺重要的，能量和牛二是会在内部调整自己来适应约束，说让我思考问题先思考约束条件。然后我又思考了一下，是不是能量在不停体系中会根据约束来分配，当然都是符合能量守恒和牛二的", "raw_message": "没有题，但我有一个问题，希望有人能帮我确定一下，就是在跟deepseek聊一道物理题时，他跟我提到了约束这个东西，分为几何约束和运动学约束，他说这个挺重要的，能量和牛二是会在内部调整自己来适应约束，说让我思考问题先思考约束条件。然后我又思考了一下，是不是能量在不停体系中会根据约束来分配，当然都是符合能量守恒和牛二的", "images": [], "replies": []}, {"id": "ep9:297533804977", "module": "energy", "auto": false, "uname": "寒蝉月落", "face": "_imgs/face_6c46c27a8d10.jpg", "like": 3, "message": "当一个小球从一个斜坡滚下时，若水平面光滑，它们之间的相对速度，大于当斜坡固定时的相对速度，这其中重力势能转换为速度的“效率”为什么改变了", "raw_message": "当一个小球从一个斜坡滚下时，若水平面光滑，它们之间的相对速度，大于当斜坡固定时的相对速度，这其中重力势能转换为速度的“效率”为什么改变了", "images": ["_imgs/img_a817e97eee70.jpg"], "replies": [{"uname": "e的变化率不是e", "face": "_imgs/face_85ac0420741b.jpg", "like": 1, "message": "不错的问题，基于你应该没学过课外(不然你肯定会换到质心系用柯尼希定理来考虑相对速度)，能够用“相对速度”来统一两个场景，是具备一定的洞察和思考的。\n如何真正实现统一？我们注意到“斜面固定”可看作“斜面质量无穷大”，这样，此问题化为经典的二体系统，用折合质量(看作二体的有效惯性质量)来描述。\n举个例子来理解折合质量：人将一个箱子用绳索拉到自己面前，如果地面变成光滑，拉力过程与第一次一样，但此时人也向前加速，和箱子共同朝中间的质心靠近，箱子相对人两倍速撞来，彷佛质量变小了，加速度变大了一样。", "id": "ep9:297533804977:r0"}, {"uname": "Yeeelsen", "face": "_imgs/face_0da59923c7bb.jpg", "like": 0, "message": "<span class=\"mention\">回复 @寒蝉月落<\/span> 前一种情况中体系的能量全部来自于<span class=\"math\">\\(m\\)<\/span>重力势的减少，这部分减少的重力势能转化为动能分配给<span class=\"math\">\\(m\\)<\/span>和<span class=\"math\">\\(M\\)<\/span>，分配的权重反比于质量(由动量守恒，这是你需要注意到的，<span class=\"math\">\\(E_k=\\frac{p^2}{2m})\\)<\/span>，这样就直接可以写出式子了，转化效率另一位同学已经说得很清楚了", "id": "ep9:297533804977:r1"}, {"uname": "Yeeelsen", "face": "_imgs/face_0da59923c7bb.jpg", "like": 0, "message": "咕咕以前讲过", "id": "ep9:297533804977:r2"}, {"uname": "佚之森", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "斜坡没被固定的时候 重力势能转化成小球动能和斜坡动能 这里物体是以<span class=\"math\">\\(v^2\\)<\/span>的形式获得能量的  被固定的时候 就只有小球单独的动能 转化效率是没变的 相对速度是和二者受力有关系的 斜坡被固定的时候 它会受别的东西限制的力导致小球压他他不能动 从整体来看 一部分应有动量就损失掉了", "id": "ep9:297533804977:r3"}]}, {"id": "ep9:300343808448", "module": "energy", "auto": false, "uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 2, "message": "在一个斜面上进行速度大小一定的两次斜抛运动，恰好落在同一个点，已知其中一次斜抛的，速度方向与斜面的夹角为<span class=\"math\">\\(\\theta \\)<\/span>，那么另一次斜抛的夹角，我该如何简单快捷的计算？呃，当然，斜面与地面的夹角已知，重力加速度为<span class=\"math\">\\(g\\)<\/span>", "raw_message": "在一个斜面上进行速度大小一定的两次斜抛运动，恰好落在同一个点，已知其中一次斜抛的，速度方向与斜面的夹角为theta，那么另一次斜抛的夹角，我该如何简单快捷的计算？呃，当然，斜面与地面的夹角已知，重力加速度为g", "images": [], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "有公式，https://www.bilibili.com/read/cv48215827", "id": "ep9:300343808448:r0"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 如果是平面的话也可以用，阿尔法等于0", "id": "ep9:300343808448:r1"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 推论：在平面上<span class=\"math\">\\(\\theta =45\\)<\/span>度，落点最远\n在斜面上<span class=\"math\">\\(\\theta =45\\)<\/span>度减去二分之阿尔法是，落点最远", "id": "ep9:300343808448:r2"}]}, {"id": "ep9:297698265569", "module": "energy", "auto": false, "uname": "麦克斯韦鸮", "face": "_imgs/face_77e9a9c4506b.jpg", "like": 2, "message": "直接列式能发现半径<span class=\"math\">\\(R\\)<\/span>可消 如何直觉理解呢🤔咕咕咕呱呱", "raw_message": "直接列式能发现半径R可消 如何直觉理解呢🤔咕咕咕呱呱", "images": ["_imgs/img_0ab5e529e504.jpg"], "replies": [{"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 3, "message": "<span class=\"mention\">回复 @麦克斯韦鸮<\/span> 量纲分析和直接计算还是有些本质区别，虽然这题本身计算量不大，看不太出来；可以了解一下白金汉<span class=\"math\">\\(\\pi \\)<\/span>定理，说的是如何通过量纲建立几个物理量的决定关系。对于更复杂甚至难以解析计算的体系(比如流体力学)，这个方法能够跳过具体的方程来从本质上断言几个物理量之间必须满足的关系", "id": "ep9:297698265569:r0"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 2, "message": "可能决定这个系统的要素只有m g R三个物理量，力的单位是<span class=\"math\">\\(kg·\\frac{m}{s}^2\\)<\/span>，只有<span class=\"math\">\\(g\\)<\/span>能提供时间单位<span class=\"math\">\\(s\\)<\/span>，只有<span class=\"math\">\\(m\\)<\/span>能提供质量单位kg，所以只有mg的倍数具有力的量纲，不可能塞得下<span class=\"math\">\\(R\\)<\/span>的位置", "id": "ep9:297698265569:r1"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 0, "message": "<span class=\"mention\">回复 @麦克斯韦鸮<\/span> 是的，不过考虑的是最小的情况，对应<span class=\"math\">\\(v_{0}\\)<\/span>最小的临界，所以不会作为自由变量纳入", "id": "ep9:297698265569:r2"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 0, "message": "<span class=\"mention\">回复 @麦克斯韦鸮<\/span> 本质上它描述了体系的尺度放缩，比如把哪个量扩大<span class=\"math\">\\(k\\)<\/span>倍，结果会扩大<span class=\"math\">\\(k\\)<\/span>的某次方倍这样", "id": "ep9:297698265569:r3"}, {"uname": "佚之森", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 压力不就是和重力一个形式的嘛 它们都是力 而在恰过最高点的情况下 v是受<span class=\"math\">\\(r\\)<\/span>约束的 而计算最低点受力的时候给多少压力是被动的 要看r 这里本质上“约束的方式”是一定的 只是相当于正着走一遍再倒着推回来 不知道你是这个意思吗[惊喜]", "id": "ep9:297698265569:r4"}]}, {"id": "ep9:297481033873", "module": "energy", "auto": false, "uname": "h0122erodb", "face": "_imgs/face_59dcca4df0ae.jpg", "like": 2, "message": "这道题的第二问，按题目的意思，我的第一想法是这个<span class=\"math\">\\(S\\)<\/span>是如何约束最小速度的，我知道机器狗停下的位置是确定的，我就移动这个间距，看看对速度有什么要求，然后我就不会了，我看答案，看的懂，但不明白是怎么想到这样控制的，他说斜抛运动的轨迹恰好过障碍物的左右边缘，然后从上面运动去分析，", "raw_message": "这道题的第二问，按题目的意思，我的第一想法是这个S是如何约束最小速度的，我知道机器狗停下的位置是确定的，我就移动这个间距，看看对速度有什么要求，然后我就不会了，我看答案，看的懂，但不明白是怎么想到这样控制的，他说斜抛运动的轨迹恰好过障碍物的左右边缘，然后从上面运动去分析，", "images": ["_imgs/img_26d70c4d4fc8.jpg"], "replies": [{"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 2, "message": "说白了，这个问题就是一个包装，你可以等价的思考：若我在<span class=\"math\">\\(y=h\\)<\/span>处以初速度<span class=\"math\">\\(v_{1}=\\)<\/span>根号<span class=\"math\">\\((v_{0}^2-2gh)\\)<\/span>抛射一个物体，并要求它下一次通过<span class=\"math\">\\(y=h\\)<\/span>时，<span class=\"math\">\\(x\\)<\/span>方向位移不小于<span class=\"math\">\\(l\\)<\/span>，那么<span class=\"math\">\\(v_{0}\\)<\/span>至少要多少？", "id": "ep9:297481033873:r0"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 1, "message": "假设起跳速度是<span class=\"math\">\\(v_{0}\\)<\/span>，狗到达高度<span class=\"math\">\\(h\\)<\/span>时的速度<span class=\"math\">\\(v_{1}=\\)<\/span>根号<span class=\"math\">\\((v_{0}^2-2gh)\\)<\/span>，所以狗能跳过物块就相当于说：根号<span class=\"math\">\\((v_{0}^2-2gh)\\)<\/span>的抛射初速度产生的水平射程不小于<span class=\"math\">\\(l\\)<\/span>。所以临界情况自然就是，这个水平射程恰好为<span class=\"math\">\\(l\\)<\/span>，也就是狗必须从物块左边缘以根号<span class=\"math\">\\((v_{0}^2-2gh)\\)<\/span>的初速度<span class=\"math\">\\(45^\\circ \\)<\/span>发射，然后通过右边缘。你再把这个曲线左右端延伸到地面，就是真实的运动。再依次反向求出<span class=\"math\">\\(s\\)<\/span>即可", "id": "ep9:297481033873:r1"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 0, "message": "<span class=\"mention\">回复 @h0122erodb<\/span> 因为要求速度尽可能小", "id": "ep9:297481033873:r2"}, {"uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 0, "message": "<span class=\"mention\">回复 @h0122erodb<\/span> 同速度下<span class=\"math\">\\(45^\\circ \\)<\/span>对应的射程最远", "id": "ep9:297481033873:r3"}]}, {"id": "ep9:300343644544", "module": "energy", "auto": false, "uname": "日常干饭干饭", "face": "_imgs/face_0e41c09d6c32.jpg", "like": 0, "message": "已知在水平地面上进行斜抛运动，当可以视为质点的物块速度与该地面平行的时候，其位置投影在地面上，恰好位于位移终点，并且时间是整个运动时间的一半，那么在一个斜面上进行斜抛运动，该结论也成立吗？为什么？", "raw_message": "已知在水平地面上进行斜抛运动，当可以视为质点的物块速度与该地面平行的时候，其位置投影在地面上，恰好位于位移终点，并且时间是整个运动时间的一半，那么在一个斜面上进行斜抛运动，该结论也成立吗？为什么？", "images": [], "replies": [{"uname": "Y-Y-Y-Y-W-w", "face": "_imgs/face_ebba4faa03e9.jpg", "like": 0, "message": "平地上 可以从最高点一切两半 向左和向右是完全一致的平抛 因而轨迹 时间都一样 \n但斜坡上 一个冲着墙上撞 一个往悬崖下跳 自然不一样", "id": "ep9:300343644544:r0"}]}, {"id": "ep9:301037586736", "module": "energy", "auto": false, "uname": "鹤鸽鹤鸽", "face": "_imgs/face_712017ed6c31.jpg", "like": 0, "message": "一个物块以初速度<span class=\"math\">\\(v\\)<\/span>放上以速度<span class=\"math\">\\(v\\)<\/span>正在转动的传送带，二者相对静止。传送带与物块之间最大静摩擦力为<span class=\"math\">\\(f\\)<\/span>现在以外力大小恒为<span class=\"math\">\\(f\\)<\/span>，以相反的方向拉着物块，使得物块静止而传带向前，电动机对传送带多做功多少？", "raw_message": "一个物块以初速度v放上以速度v正在转动的传送带，二者相对静止。传送带与物块之间最大静摩擦力为f现在以外力大小恒为f，以相反的方向拉着物块，使得物块静止而传带向前，电动机对传送带多做功多少？", "images": [], "replies": [{"uname": "Chairman_Lam", "face": "_imgs/face_f9c11ff1b4dc.jpg", "like": 0, "message": "如果你只是施加了大小等于最大静摩擦力的反向力 ，物块将保持速度匀速运动，<span class=\"math\">\\(a=0\\)<\/span>，不会静止吧。", "id": "ep9:301037586736:r0"}]}, {"id": "ep9:300467207008", "module": "momentum", "auto": false, "uname": "st_Frozen", "face": "_imgs/face_a03b05214d65.jpg", "like": 4, "message": "分享一道题目", "raw_message": "分享一道题目", "images": ["_imgs/img_e286d171a53a.jpg"], "replies": [{"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "AC.\n对B，<span class=\"math\">\\(\\tan \\theta_{1}\\)<\/span>和<span class=\"math\">\\(\\tan \\theta_{2}\\)<\/span>的算术平均值不等于<span class=\"math\">\\(\\tan (\\theta \\frac{1}{2}+\\theta \\frac{2}{2})\n\\)<\/span>对C，速度大的初始应在前侧，否则会因为永远追不上而不发生碰撞(即使被更后者以更快的速度碰而得到比前者快的速度，那也会让更后者少一次碰撞的机会，相当于把少的一次碰撞让更后者承担)故速度从前到后应该一次增大，这样在后面的小球都能和所有前面的球发生一次“碰撞”，这些“碰撞”只有一次是后者真实碰撞，之后通过传递实现“碰撞”，故一共<span class=\"math\">\\(C_{42}=6(\\)<\/span>组合数，6个球两两相碰为一组)\n对D，相对速度不变，同C", "id": "ep9:300467207008:r0"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @小光会变身<\/span> cd不知道怎么用简单的语言描述(也可能是错的)，欢迎各位用更清晰的语言解释", "id": "ep9:300467207008:r1"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 1, "message": "<span class=\"mention\">回复 @st_Frozen<\/span> 这也太巧妙了🙂", "id": "ep9:300467207008:r2"}, {"uname": "家是本-湖湘总督", "face": "_imgs/face_704d0bbf909a.jpg", "like": 0, "message": "不错啊，好题好题", "id": "ep9:300467207008:r3"}, {"uname": "青御雪安_Falcons", "face": "_imgs/face_50cff7e73d4f.jpg", "like": 0, "message": "<span class=\"mention\">回复 @小光会变身<\/span> 冒泡排序，最大次数。假设初始为完全逆序", "id": "ep9:300467207008:r4"}, {"uname": "醉墨凌篱", "face": "_imgs/face_3ce06504a2e5.jpg", "like": 0, "message": "爽", "id": "ep9:300467207008:r5"}]}, {"id": "ep9:300277230112", "module": "optics", "auto": false, "uname": "高中物理咕咕助教", "face": "_imgs/face_8085b2aab17f.jpg", "like": 8, "message": "大家学会怎么解答别人的困惑了吗？对于下面这个网上讨论热闹的现象，大家会如何解释呢？这次你能不能抓住“觉得困惑的人到底是哪里偷换了概念”呢？\n【镜子怎么知道书后面有火？】 https://www.bilibili.com/video/BV141Pkz4Eeu/?share_source=copy_web&amp;vd_source=9d9798f66ca7844820f217d88e126ecd", "raw_message": "大家学会怎么解答别人的困惑了吗？对于下面这个网上讨论热闹的现象，大家会如何解释呢？这次你能不能抓住“觉得困惑的人到底是哪里偷换了概念”呢？\n【镜子怎么知道书后面有火？】 https://www.bilibili.com/video/BV141Pkz4Eeu/?share_source=copy_web&vd_source=9d9798f66ca7844820f217d88e126ecd", "images": [], "replies": [{"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 2, "message": "被挡住的那块镜子上面的确没有火焰的像，呈现出火焰的镜子并不是被书本挡住的那部分镜子，它把这两块镜子搞混了。火焰的像实际上是在书本旁边那一块没被挡住的镜子上，人眼对这部分光反向延长，看起来就像是火焰真的出现在了被挡住的那块镜子上面。类似的一个例子就是水中硬币看上去好像没有在杯子底部，这是人眼对折射出来的光线反向延长，得到的像，实际上硬币就在杯子底部。", "id": "ep9:300277230112:r0"}, {"uname": "e的变化率不是e", "face": "_imgs/face_85ac0420741b.jpg", "like": 1, "message": "只要镜子大小、遮挡物大小、光源位置三个量控制合适，保证光线能到达镜子，光源反射、虚像存在就成了客观事实；虚像存在但光的直线传播决定了其观测范围。困惑的人将主观视角赋予客观情景，“正面看看不到”，被遮住的不是光源，而是特定角度下的人眼。随着主观视角的转移，若观测者遍历整个场景，那么能够“看到”(反射光进入人眼)将成为必然事件。\n“只在此山中，云深不知处”，这句话道出了存在性与主观视角的深刻内涵。", "id": "ep9:300277230112:r1"}, {"uname": "Chairman_Lam", "face": "_imgs/face_f9c11ff1b4dc.jpg", "like": 0, "message": "火的光线会通过漫反射、直射，绕过书的边缘/缝隙传到镜子，再反射进你的眼睛，你就看到了火。不是镜子“感知”到书后有火(这有点打破初中光沿直线传播的初步认知)", "id": "ep9:300277230112:r2"}]}, {"id": "ep9:300155270720", "module": "optics", "auto": false, "uname": "账号已注销35058", "face": "_imgs/face_c47c155e4ae3.jpg", "like": 0, "message": "这个是什么寓意呢 刚学习光学 问了下 ai 解释十分抽象 是不是蕴含了什么简单的规律呀", "raw_message": "这个是什么寓意呢 刚学习光学 问了下 ai 解释十分抽象 是不是蕴含了什么简单的规律呀", "images": ["_imgs/img_50e97ff5d388.jpg"], "replies": [{"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 2, "message": "光在两点之间永远走的是时间最短的路径。最开始是费马类比猜出来的。光的镜面反射过程中，出射角始终等于入射角，这件事等价于反射光是从光源在镜子中的像发出来的。这条路径刚好是直线，两点之间，线段最短，所需要的时间也是最少的。所以他猜测，光从一个介质进入到另一个介质中，之所以发生折射，是因为光要走花费时间最短的那条路径。在数学上是可以推导出来的(高中的知识水平就能推了)，推出来的就是折射定律。", "id": "ep9:300155270720:r0"}, {"uname": "愿你Happy每一天", "face": "_imgs/face_8cc8e44645ef.jpg", "like": 2, "message": "从物理本质上讲，真空角是光线**“横向动量”**的几何表现。\n• 当光从一种介质进入另一种介质时，它在平行于界面方向上的动量分量 Px 是保持不变的。\n• 而<span class=\"math\">\\( \\sin \\)<\/span>真空角<span class=\"math\">\\(=n\\,\\,\\sin  x \\)<\/span>正好正比于这个横向动量。\n• 因此，真空角是一个守恒量。只要界面是平行的，无论光经过多少层不同的介质，它的真空角始终保持不变。", "id": "ep9:300155270720:r1"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "<span class=\"math\">\\(1\\sin\\theta \\)<\/span>真空<span class=\"math\">\\(=n_{1}\\sin \\theta_{1}\\)<\/span>介质<span class=\"math\">\\(1=n_{2}\\sin \\theta_{2}\\)<\/span>介质2……。同一束光<span class=\"math\">\\(\\sin \\theta \\)<\/span>真空永不变，当你知道其在一个介质的<span class=\"math\">\\(\\sin \\theta \\)<\/span>和<span class=\"math\">\\(n\\)<\/span>后，就可以求其他介质的<span class=\"math\">\\(n\\)<\/span>或<span class=\"math\">\\(\\sin \\theta \\)<\/span>。这就是<span class=\"math\">\\(n_{1}\\sin \\theta_{1}=n_{2}\\sin \\theta_{2}\\)<\/span>的推导过程。", "id": "ep9:300155270720:r2"}, {"uname": "小光会变身", "face": "_imgs/face_d41f881e1dd7.jpg", "like": 0, "message": "ai是反推的这个结论", "id": "ep9:300155270720:r3"}, {"uname": "Atomphysics", "face": "_imgs/face_19704788688b.jpg", "like": 0, "message": "没太看懂这个地方 没描述清楚问题 假若我们要从更加严谨的物理学知识来讲的话 光是电磁波 折射定律就是在不同的介质之间电磁波需要满足的条件推导出来的", "id": "ep9:300155270720:r4"}]}, {"id": "ep9:297402318033", "module": "esfield", "auto": false, "uname": "e的变化率不是e", "face": "_imgs/face_85ac0420741b.jpg", "like": 1, "message": "分享一道题，第一问大家不要用数学作形式上的推导，而是用物理理解直接讲通它，就像咕咕所强调的“讲出这个故事”；第二问纯属娱乐，远超高中能解的范围，但大家可以定性思考一下第二问，其实题干有一处是不严谨的，并且可能直接导致物理情形的改变，请问要对哪一处条件进行微调(限制)？", "raw_message": "分享一道题，第一问大家不要用数学作形式上的推导，而是用物理理解直接讲通它，就像咕咕所强调的“讲出这个故事”；第二问纯属娱乐，远超高中能解的范围，但大家可以定性思考一下第二问，其实题干有一处是不严谨的，并且可能直接导致物理情形的改变，请问要对哪一处条件进行微调（限制）？", "images": ["_imgs/img_7fd6be71a3a3.jpg", "_imgs/img_1be71490a976.jpg"], "replies": [{"uname": "不要伤害我鹅子", "face": "_imgs/face_1d0bd6bbced4.jpg", "like": 1, "message": "<span class=\"mention\">回复 @日常干饭干饭<\/span> 第一问，电场力的合力必须垂直圆周运动的平面。否则，便会产生平行于圆周运动平面的分量，去干扰向心力的大小，向心力的大小不稳定
