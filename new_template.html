<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物理系咕咕叫兽 · 好题精选（第1-10期）</title>
<style>
:root{--bg:#f5f6f7;--card:#fff;--line:#d8dce1;--txt:#1a1f24;--sub:#6b7480;--accent:#1f4e79;--accent2:#2e6da4;--nav-w:248px}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Songti SC","Noto Serif SC","STSong","SimSun",Georgia,"Times New Roman",serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.75}
a{color:#1a5276;text-decoration:none}a:hover{text-decoration:underline}

/* ---------- 顶栏（常驻浮动） ---------- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 18px;flex-wrap:wrap}
.sb-toggle{flex:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:17px;color:var(--accent);display:flex;align-items:center;justify-content:center;transition:.15s}
.sb-toggle:hover{border-color:var(--accent)}
.topbar .searchbox{flex:1;min-width:200px;position:relative}
.topbar .searchbox input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;outline:none;transition:.15s}
.topbar .searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,78,121,.12)}
.topbar .searchbox .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:15px}
.topbar .scope{flex:none;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px;color:var(--txt);outline:none;cursor:pointer}
.topbar .scope:focus{border-color:var(--accent)}
.topbar .tbtn{flex:none;font-size:13px;color:var(--txt);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer;transition:.15s;white-space:nowrap}
.topbar .tbtn:hover{border-color:var(--accent);color:var(--accent2)}
.topbar .tbtn.on{background:#e8eef5;border-color:var(--accent);color:var(--accent2);font-weight:600}

/* ---------- 布局 ---------- */
.layout{display:flex;min-height:100vh;align-items:flex-start}
.sidebar{width:var(--nav-w);flex:none;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:16px 14px 30px;z-index:30;transition:width .2s, padding .2s, opacity .2s}
body.sb-collapsed .sidebar{width:0;padding:0;opacity:0;overflow:hidden;border:none;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 12px}
.brand .logo{width:34px;height:34px;border-radius:4px;background:#1f4e79;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:700;font-family:Georgia,serif;flex:none}
.brand .t1{font-size:14.5px;font-weight:700;line-height:1.3}
.brand .t2{font-size:11px;color:var(--sub)}

.fgroup{margin-top:14px}
.fgroup .fg-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sub);margin:4px 4px 7px;letter-spacing:.5px}
.fgroup .fg-head .acts{display:flex;gap:8px}
.fgroup .fg-head a{font-size:11px;color:var(--accent2);cursor:pointer}
.fgroup .fg-head a:hover{text-decoration:underline}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:4px 9px;cursor:pointer;user-select:none;transition:.12s}
.fchip:hover{border-color:#b9c0c8}
.fchip .box{width:13px;height:13px;border:1.5px solid #b9c0c8;border-radius:3px;flex:none;position:relative;transition:.12s}
.fchip .mdot{width:9px;height:9px;border-radius:2px;flex:none}
.fchip .cnt{font-size:11px;color:var(--sub)}
.fchip.on{border-color:var(--accent);background:#eef3f8;color:var(--accent2);font-weight:600}
.fchip.on .box{background:var(--accent);border-color:var(--accent)}
.fchip.on .box::after{content:'';position:absolute;left:3.5px;top:0.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.fchip.on .cnt{color:var(--accent2)}

.side-sep{height:1px;background:var(--line);margin:16px 4px}

/* 着色开关 */
.switch{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer;margin-top:4px;user-select:none}
.switch .track{width:40px;height:22px;border-radius:11px;background:#cfd4da;position:relative;transition:.18s;flex:none}
.switch .track::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on .track{background:var(--accent)}
.switch.on .track::after{left:20px}
.switch .lab{color:var(--txt)}
.legend{margin-top:10px;font-size:11.5px;color:var(--sub);line-height:1.9;display:none}
.legend.show{display:block}
.legend .row{display:flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:none}
.side-foot{margin-top:18px;padding:12px 8px 0;border-top:1px solid var(--line);font-size:11px;color:var(--sub)}

.main{flex:1;min-width:0;max-width:1080px;margin:0 auto;padding:0 28px 60px}

.hero{padding:22px 0 6px}
.hero h1{font-size:22px;font-weight:700;letter-spacing:.3px}
.hero .sub{color:var(--sub);margin-top:5px;font-size:13px}

/* 期横幅 */
.ep-banner{display:flex;align-items:center;gap:12px;margin:26px 0 10px;padding:11px 18px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;scroll-margin-top:70px}
.ep-banner .badge{background:var(--accent);color:#fff;font-weight:700;border-radius:8px;padding:3px 12px;font-size:14px}
.ep-banner .meta{color:var(--sub);font-size:12px}

.c-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--card-accent,#cbd2d9);border-radius:5px;padding:15px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.c-card.op{background:#fffaf0;border-left:4px solid #d4a017}
.c-top{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:#e8eaf0;border:2px solid var(--avatar-accent,#cbd2d9);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#6b7076;font-weight:600}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.uname{font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;flex-wrap:wrap;gap:5px}
.tag{font-size:10.5px;color:var(--accent2);border:1px solid #b8c9dc;background:#eef3f8;border-radius:4px;padding:0 5px}
.tag.op{color:#8a6d00;border-color:#e6cf8b;background:#fbeecb}
.like{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--sub);font-size:12.5px;flex:none}
.like .h{color:#2e6da4;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px;width:100%;margin-top:5px}
.chip{font-size:11px;border-radius:6px;padding:1px 7px}
.chip.ep{background:#eef3f8;color:var(--accent2);border:1px solid #cfe0ef}
.chip.mod{color:#fff}
.c-msg{margin:10px 2px 0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.c-msg .mention{color:#61666d}
.c-msg a{word-break:break-all}
.math{background:rgba(46,109,164,.09);padding:1px 4px;border-radius:3px;margin:0 1px}
mark.hl,.c-msg mark.hl{background:#ffe066;color:inherit;padding:0 .5px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.c-actions{display:flex;gap:6px;flex:none}
.c-btn{font-size:12px;color:var(--sub);background:#f4f5f7;border:1px solid var(--line);border-radius:8px;padding:2px 8px;cursor:pointer;transition:.15s;white-space:nowrap}
.c-btn:hover{border-color:var(--accent);color:var(--accent2)}
.c-btn.faved{color:#a08000;border-color:#a08000;background:#fbf7ec}

.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.img-grid img{width:100%;height:150px;object-fit:cover;border-radius:6px;cursor:zoom-in;background:#f4f5f7;border:1px solid var(--line);transition:.15s}
.img-grid img:hover{transform:scale(1.02);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.img-grid.one img{height:auto;max-height:420px;object-fit:contain}
.img-miss{grid-column:1/-1;font-size:12px;color:#b8bcc2;background:#f8f9fb;border:1px dashed var(--line);border-radius:6px;padding:10px;text-align:center}

.replies{margin-top:14px;border-top:1px solid var(--line);border-left:3px solid #e2e6ea;background:#fafbfc;padding:6px 12px 8px;border-radius:0 4px 4px 0}
.replies-head{font-size:12px;color:var(--sub);margin:4px 0 8px;display:flex;align-items:center;gap:6px}
.replies-head .count{font-weight:600;color:#2e6da4}
.r-item{display:flex;gap:9px;padding:9px 8px;border-radius:6px}
.r-item:hover{background:#f1f3f5}
.r-item .avatar{width:30px;height:30px;border:1.5px solid #cbd2d9}
.r-box{flex:1;min-width:0}
.r-top{display:flex;align-items:center;gap:6px}
.r-top .uname{font-size:12.5px}
.r-like{margin-left:auto;font-size:11.5px;color:var(--sub);flex:none}
.r-like .h{color:#2e6da4}
.r-msg{margin-top:3px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.r-msg .mention{color:#61666d}

/* 着色方案 */
.vc-var{color:#1f6f9c}
.vc-num{color:#b5651d}
.vc-law{color:#7d3c98;font-weight:600}
.vc-at{color:#c0392b;font-weight:600}
.mention .vc-at{color:#c0392b}

#empty{display:none;text-align:center;color:var(--sub);padding:60px 0;font-size:15px}

/* 分页 */
.pager{display:flex;align-items:center;justify-content:center;gap:7px;margin:26px 0 6px;flex-wrap:wrap}
.pager .pginfo{font-size:12.5px;color:var(--sub);margin-right:6px}
.pager .pg{min-width:34px;height:34px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;cursor:pointer;color:var(--txt);transition:.15s}
.pager .pg:hover:not(:disabled){border-color:var(--accent);color:var(--accent2)}
.pager .pg:disabled{opacity:.4;cursor:not-allowed}
.pager .pg.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pager .pellipsis{color:var(--sub);padding:0 2px}

.report{margin-top:36px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.report summary{cursor:pointer;font-size:14.5px;font-weight:600;outline:none}
.report summary::marker{color:var(--accent)}
.report ul{margin:12px 0 0 20px;font-size:12.8px;color:#5b6066}
.report li{margin-bottom:4px}
.report .why{color:#2e6da4}

/* 灯箱 */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column;padding:30px;overflow:hidden}
.lightbox.open{display:flex}
.lb-stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:grab}
.lb-stage.grabbing{cursor:grabbing}
.lb-stage img{max-width:92vw;max-height:82vh;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.5);transform-origin:center center;user-select:none;-webkit-user-drag:none}
.lb-info{color:#ccc;font-size:13px;margin-top:10px}
.lb-toolbar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:rgba(30,30,30,.75);border-radius:22px;padding:8px 14px;backdrop-filter:blur(6px)}
.lb-toolbar button{background:transparent;border:none;color:#fff;font-size:16px;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-toolbar button:hover{background:rgba(255,255,255,.18)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:60px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;cursor:pointer;background:rgba(255,255,255,.08);border-radius:10px;user-select:none;z-index:2}
.lb-nav:hover{background:rgba(255,255,255,.2)}
.lb-nav.prev{left:22px}.lb-nav.next{right:22px}
.lb-close{position:absolute;top:16px;right:24px;color:#fff;font-size:30px;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.1);z-index:2}
.lb-close:hover{background:rgba(255,255,255,.25)}
.lb-orig{margin-top:6px;font-size:12px;color:#999}

/* 已阅历史 modal */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:120;display:none;align-items:center;justify-content:center;padding:24px}
.modal-mask.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 12px 50px rgba(0,0,0,.25)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head b{font-size:15px}
.modal-close{cursor:pointer;font-size:22px;color:var(--sub)}
.modal-body{overflow-y:auto;padding:12px 20px;flex:1}
.seen-item{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid #f2f3f5}
.seen-item .t{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seen-item .ep{font-size:11px;color:var(--sub);flex:none}
.seen-item button{font-size:12px;color:#1a5276;background:none;border:none;cursor:pointer;flex:none}
.modal-empty{color:var(--sub);text-align:center;padding:40px 0;font-size:13px}
.katex{font-size:1.02em}

@media (max-width:900px){
  .main{padding:0 14px 50px}
  .sidebar{top:54px;height:calc(100vh - 54px)}
  .img-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}
</style>

</head>
<body>
<div class="topbar">
  <button class="sb-toggle" id="sbToggle" title="收起/展开侧栏（宽屏模式）">☰</button>
  <div class="searchbox">
    <span class="ico">⌕</span>
    <input id="search" type="text" placeholder="搜索全部题目与回复关键词（跨页搜索）…">
  </div>
  <select class="scope" id="scopeSel" title="搜索范围">
    <option value="filter">当前筛选范围</option>
    <option value="all">全部范围（忽略筛选）</option>
  </select>
  <button class="tbtn" id="favBtn">★ 收藏夹 <span id="favCount">0</span></button>
  <button class="tbtn" id="seenBtn">☑ 已阅 <span id="seenCount">0</span></button>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">Φ</div>
      <div><div class="t1">好题精选</div><div class="t2">第1-10期 · 物理系咕咕叫兽</div></div>
    </div>

    <div class="fgroup">
      <div class="fg-head"><span>期数（可多选）</span><span class="acts"><a id="epAll">全选</a><a id="epNone">清空</a></span></div>
      <div class="filters" id="epFilters"></div>
    </div>

    <div class="fgroup">
      <div class="fg-head"><span>知识点（可多选）</span><span class="acts"><a id="modAll">全选</a><a id="modNone">清空</a></span></div>
      <div class="filters" id="modFilters"></div>
    </div>

    <div class="side-sep"></div>

    <div class="switch" id="colorSwitch">
      <div class="track"></div>
      <div class="lab">着色（字母/数字/定理/@/UP主）</div>
    </div>
    <div class="legend" id="legend">
      <div class="row"><span class="sw" style="background:#1f6f9c"></span>字母（变量）</div>
      <div class="row"><span class="sw" style="background:#b5651d"></span>数字</div>
      <div class="row"><span class="sw" style="background:#7d3c98"></span>定理 / 定律名</div>
      <div class="row"><span class="sw" style="background:#c0392b"></span>@ 提及对象</div>
      <div class="row"><span class="sw" style="background:#d4a017"></span>UP主本人发布</div>
    </div>

    <div class="side-sep"></div>
    <div class="fgroup">
      <div class="fg-head"><a id="resetFilter">↺ 重置全部筛选</a></div>
    </div>

    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main class="main">
    <header class="hero">
      <h1 id="heroTitle">全部期数 · 所有模块</h1>
      <div class="sub" id="heroSub"></div>
    </header>

    <div id="sections"></div>
    <div id="empty">没有匹配的结果，换个筛选或关键词试试～</div>
    <div class="pager" id="pager"></div>

    <details class="report">
      <summary id="reportSummary">过滤说明</summary>
      <ul id="reportList"></ul>
    </details>
    <div style="height:24px"></div>
  </main>
</div>

<div class="lightbox" id="lightbox">
  <div class="lb-close" id="lbClose">×</div>
  <div class="lb-nav prev" id="lbPrev">‹</div>
  <div class="lb-stage" id="lbStage"><img id="lbImg" src="" alt=""></div>
  <div class="lb-toolbar" id="lbToolbar">
    <button id="lbZoomIn" title="放大">＋</button>
    <button id="lbZoomOut" title="缩小">－</button>
    <button id="lbReset" title="重置">1:1</button>
    <button id="lbRotL" title="逆时针旋转">⟲</button>
    <button id="lbRotR" title="顺时针旋转">⟳</button>
    <button id="lbDl" title="下载原图">⭳</button>
  </div>
  <div class="lb-info" id="lbInfo"></div>
  <a class="lb-orig" id="lbOrig" target="_blank" rel="noopener">在新窗口查看原图 ↗</a>
  <div class="lb-nav next" id="lbNext">›</div>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-head"><b id="modalTitle">已阅历史</b><span class="modal-close" id="modalClose">×</span></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const DATA = __DATA__;
const UP_NAME = '物理系咕咕叫兽';
const MODMAP = {}; DATA.modules.forEach(m => MODMAP[m.key] = m);

/* ---------- 状态 ---------- */
let selEps = new Set();
let selMods = new Set();
let scopeMode = 'filter';   // 'filter' | 'all'
let favOnly = false;
let colorOn = false;
let page = 1;
const PAGE_SIZE = 12;
let ALL = [];
let lbList = [], lbIdx = 0, lbScale = 1, lbRot = 0, lbTx = 0, lbTy = 0;

/* ---------- localStorage: 收藏 / 已阅 ---------- */
const LS_FAV = 'wb_phys_fav', LS_SEEN = 'wb_phys_seen';
function getLS(k){ try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e){ return []; } }
function setLS(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
let favIds = getLS(LS_FAV), seenIds = getLS(LS_SEEN);

/* ---------- 预构建扁平列表 ---------- */
function buildAll(){
  ALL = [];
  DATA.episodes.forEach(e => {
    e.comments.forEach(c => {
      const replyText = c.replies.map(r => r.message.replace(/<[^>]+>/g, '')).join(' ');
      const searchKey = (c.uname + ' ' + c.raw_message + ' ' + replyText).toLowerCase();
      ALL.push({ epKey: e.key, epTitle: e.title, c, searchKey });
    });
  });
}

/* ---------- 侧栏筛选 ---------- */
function buildSidebar(){
  const epWrap = document.getElementById('epFilters');
  epWrap.innerHTML = '';
  DATA.episodes.forEach(e => epWrap.appendChild(makeChip(e.key, e.title, e.comments.length, selEps, null)));
  const modWrap = document.getElementById('modFilters');
  modWrap.innerHTML = '';
  const modCount = {};
  ALL.forEach(o => modCount[o.c.module] = (modCount[o.c.module] || 0) + 1);
  DATA.modules.forEach(m => { if (modCount[m.key]) modWrap.appendChild(makeChip(m.key, m.name, modCount[m.key], selMods, m.color)); });
}
function makeChip(key, label, cnt, setObj, color){
  const el = document.createElement('label');
  el.className = 'fchip' + (setObj.has(key) ? ' on' : '');
  el.innerHTML = (color ? `<span class="mdot" style="background:${color}"></span>` : '<span class="box"></span>')
    + `${label}<span class="cnt">${cnt}</span>`;
  el.onclick = () => { if (setObj.has(key)) setObj.delete(key); else setObj.add(key); el.classList.toggle('on'); page = 1; render(); };
  return el;
}

/* ---------- 候选集（筛选 + 收藏 + 已阅） ---------- */
function getCandidate(){
  let arr = ALL.filter(o => !seenIds.includes(o.c.id));
  if (favOnly) arr = arr.filter(o => favIds.includes(o.c.id));
  if (scopeMode !== 'all') {
    arr = arr.filter(o => (selEps.size === 0 || selEps.has(o.epKey)) && (selMods.size === 0 || selMods.has(o.c.module)));
  }
  return arr;
}

function epTitleOf(k){ const e = DATA.episodes.find(x => x.key === k); return e ? e.title : k; }
function heroTitleText(){
  if (scopeMode === 'all') return '全库搜索范围';
  const eps = selEps.size ? [...selEps].sort().map(epTitleOf).join('、') : '全部期数';
  const mods = selMods.size ? [...selMods].map(k => MODMAP[k].name).join('、') : '所有模块';
  return eps + ' · ' + mods;
}

/* ---------- 文本渲染（无展开/收起） ---------- */
function makeMsg(wrap, text){
  wrap.className = wrap.classList.contains('r-msg') ? 'r-msg' : 'c-msg';
  wrap.innerHTML = text;
}

function renderCommentCard(c, modColor, epTitle, modName){
  const card = document.createElement('div');
  card.className = 'c-card';
  card.style.setProperty('--card-accent', modColor);
  card.style.setProperty('--avatar-accent', modColor);
  if (colorOn && c.uname === UP_NAME) card.classList.add('op');
  card.dataset.id = c.id;
  const top = document.createElement('div');
  top.className = 'c-top';
  const av = document.createElement('div');
  av.className = 'avatar';
  if (c.face) {
    const img = document.createElement('img');
    img.src = c.face; img.loading = 'lazy';
    img.onerror = () => { av.textContent = c.uname[0] || '?'; };
    av.appendChild(img);
  } else av.textContent = c.uname[0] || '?';
  top.appendChild(av);
  const un = document.createElement('div');
  un.style.flex = '1'; un.style.minWidth = '0';
  let unHtml = `<div class="uname">${c.uname}`;
  if (c.auto) unHtml += '<span class="tag">自动分类</span>';
  if (c.uname === UP_NAME) unHtml += '<span class="tag op">UP主</span>';
  unHtml += '</div>';
  un.innerHTML = unHtml;
  const chips = document.createElement('div');
  chips.className = 'chips';
  chips.innerHTML = `<span class="chip ep">${epTitle}</span><span class="chip mod" style="background:${modColor}">${modName}</span>`;
  un.appendChild(chips);
  top.appendChild(un);
  const like = document.createElement('div');
  like.className = 'like';
  like.innerHTML = `<span class="h">♥</span>${c.like}`;
  top.appendChild(like);
  const act = document.createElement('div');
  act.className = 'c-actions';
  const favBtn = document.createElement('span');
  favBtn.className = 'c-btn' + (favIds.includes(c.id) ? ' faved' : '');
  favBtn.textContent = favIds.includes(c.id) ? '★ 已收藏' : '☆ 收藏';
  favBtn.onclick = (e) => { e.stopPropagation(); toggleFav(c.id); };
  const seenBtn = document.createElement('span');
  seenBtn.className = 'c-btn';
  seenBtn.textContent = '☑ 已阅';
  seenBtn.onclick = (e) => { e.stopPropagation(); markSeen(c.id); };
  act.appendChild(favBtn); act.appendChild(seenBtn);
  top.appendChild(act);
  card.appendChild(top);
  const msg = document.createElement('div');
  makeMsg(msg, c.message);
  card.appendChild(msg);
  if (c.images.length) {
    const grid = document.createElement('div');
    grid.className = 'img-grid' + (c.images.length === 1 ? ' one' : '');
    c.images.forEach((u, i) => {
      if (/^_imgs\//.test(u)) {
        const im = document.createElement('img');
        im.src = u; im.loading = 'lazy'; im.alt = '题图 ' + (i + 1);
        im.onerror = () => { im.style.display = 'none'; };
        im.onclick = () => openLightbox(c.images, i);
        grid.appendChild(im);
      } else {
        const miss = document.createElement('div');
        miss.className = 'img-miss';
        miss.textContent = '⚠ 题图未能下载到本地（' + (i + 1) + '）';
        grid.appendChild(miss);
      }
    });
    card.appendChild(grid);
  }
  if (c.replies.length) {
    const rw = document.createElement('div');
    rw.className = 'replies';
    const rh = document.createElement('div');
    rh.className = 'replies-head';
    rh.innerHTML = `<span class="count">${c.replies.length}</span> 条回复`;
    rw.appendChild(rh);
    c.replies.forEach(r => {
      const item = document.createElement('div');
      item.className = 'r-item';
      const rav = document.createElement('div');
      rav.className = 'avatar';
      if (r.face) {
        const img = document.createElement('img');
        img.src = r.face; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
        img.onerror = () => { rav.textContent = r.uname[0] || '?'; };
        rav.appendChild(img);
      } else rav.textContent = r.uname[0] || '?';
      item.appendChild(rav);
      const box = document.createElement('div');
      box.className = 'r-box';
      const rtop = document.createElement('div');
      rtop.className = 'r-top';
      rtop.innerHTML = `<div class="uname">${r.uname}</div><div class="r-like"><span class="h">♥</span>${r.like}</div>`;
      box.appendChild(rtop);
      const rmsg = document.createElement('div');
      makeMsg(rmsg, r.message);
      box.appendChild(rmsg);
      item.appendChild(box);
      rw.appendChild(item);
    });
    card.appendChild(rw);
  }
  return card;
}

/* ---------- 主渲染 ---------- */
function render(){
  const sectionsEl = document.getElementById('sections');
  sectionsEl.innerHTML = '';
  document.getElementById('heroTitle').textContent = heroTitleText();

  let list = getCandidate();
  const q = document.getElementById('search').value.trim().toLowerCase();
  if (q) list = list.filter(o => o.searchKey.includes(q));
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (page > pages) page = pages;
  const start = (page - 1) * PAGE_SIZE;
  const slice = list.slice(start, start + PAGE_SIZE);

  let lastEp = null;
  slice.forEach(o => {
    if (o.epKey !== lastEp) {
      lastEp = o.epKey;
      const n = slice.filter(x => x.epKey === o.epKey).length;
      const b = document.createElement('div');
      b.className = 'ep-banner';
      b.id = 'ep-' + o.epKey;
      b.innerHTML = `<span class="badge">${o.epTitle}</span><span class="meta">${o.epKey.toUpperCase()} · 本页该期 ${n} 条</span>`;
      sectionsEl.appendChild(b);
    }
    const mod = MODMAP[o.c.module];
    sectionsEl.appendChild(renderCommentCard(o.c, mod.color, o.epTitle, mod.name));
  });

  document.getElementById('empty').style.display = total ? 'none' : 'block';
  document.getElementById('heroSub').textContent = `共 ${total} 条匹配 · 第 ${page} / ${pages} 页`;
  document.getElementById('sideFoot').textContent = `共 ${ALL.length} 问 · ${favIds.length} 收藏 · ${seenIds.length} 已阅`;
  document.getElementById('favCount').textContent = favIds.length;
  document.getElementById('seenCount').textContent = seenIds.length;
  document.getElementById('favBtn').classList.toggle('on', favOnly);
  document.getElementById('scopeSel').value = scopeMode;

  buildPager(pages, total);

  if (window.renderMathInElement) {
    try { renderMathInElement(sectionsEl, { delimiters: [{ left: '\\(', right: '\\)', display: false }], throwOnError: false }); } catch (e) {}
  }
  if (q) highlightWalk(sectionsEl, q);
  if (colorOn) colorizeWalk(sectionsEl);
}

/* ---------- 分页 ---------- */
function pageNums(cur, total){
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  const res = [1];
  if (cur > 3) res.push('...');
  for (let n = Math.max(2, cur - 1); n <= Math.min(total - 1, cur + 1); n++) res.push(n);
  if (cur < total - 2) res.push('...');
  res.push(total);
  return res;
}
function buildPager(pages, total){
  const p = document.getElementById('pager');
  p.innerHTML = '';
  const info = document.createElement('span');
  info.className = 'pginfo';
  info.textContent = `共 ${total} 条 · 第 ${page} / ${pages} 页`;
  p.appendChild(info);
  const mk = (label, pg, dis) => {
    const b = document.createElement('button');
    b.className = 'pg' + (pg === page ? ' active' : '');
    b.textContent = label; b.disabled = dis;
    b.onclick = () => { page = pg; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    p.appendChild(b);
  };
  mk('‹ 上一页', page - 1, page <= 1);
  pageNums(page, pages).forEach(n => {
    if (n === '...') { const s = document.createElement('span'); s.className = 'pellipsis'; s.textContent = '…'; p.appendChild(s); }
    else mk(String(n), n, false);
  });
  mk('下一页 ›', page + 1, page >= pages);
}

/* ---------- 着色 ---------- */
const LAWS = ['基尔霍夫电流定律','基尔霍夫电压定律','基尔霍夫定律','欧姆定律','戴维南定理','柯尼希定理','楞次定律','法拉第电磁感应定律','安培定律','库仑定律','动量守恒定律','能量守恒定律','机械能守恒定律','万有引力定律','胡克定律','伯努利方程','叠加原理','牛顿第二定律','牛顿第三定律','开普勒第三定律','开普勒定律','热力学第一定律','热力学第二定律','阿基米德原理'];
const lawAlt = LAWS.slice().sort((a, b) => b.length - a.length).map(s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
const TOKEN = new RegExp('(' + lawAlt + ')|@([\\u4e00-\\u9fff\\w]{1,30})|([A-Za-z]+)|([0-9]+)', 'g');
function esc(s){ return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function colorizeStr(s){
  let out = '', last = 0, m;
  TOKEN.lastIndex = 0;
  while ((m = TOKEN.exec(s))) {
    out += esc(s.slice(last, m.index));
    if (m[1] !== undefined) out += '<span class="vc-law">' + esc(m[1]) + '</span>';
    else if (m[2] !== undefined) out += '<span class="vc-at">@' + esc(m[2]) + '</span>';
    else if (m[3] !== undefined) out += '<span class="vc-var">' + esc(m[3]) + '</span>';
    else if (m[4] !== undefined) out += '<span class="vc-num">' + esc(m[4]) + '</span>';
    last = m.index + m[0].length;
  }
  out += esc(s.slice(last));
  return out;
}
function colorizeWalk(container){
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      let p = n.parentNode;
      while (p && p !== container){
        if (p.classList && (p.classList.contains('math') || p.classList.contains('katex'))) return NodeFilter.FILTER_REJECT;
        if (p.tagName === 'A' || p.tagName === 'SCRIPT' || p.tagName === 'STYLE') return NodeFilter.FILTER_REJECT;
        p = p.parentNode;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const html = colorizeStr(n.nodeValue);
    if (html === esc(n.nodeValue)) return;
    const tmp = document.createElement('span');
    tmp.innerHTML = html;
    const frag = document.createDocumentFragment();
    while (tmp.firstChild) frag.appendChild(tmp.firstChild);
    n.parentNode.replaceChild(frag, n);
  });
}
/* ---------- 搜索高亮（在 KaTeX 渲染后、着色前执行）---------- */
function highlightWalk(root, q){
  const skipTags = new Set(['A','SCRIPT','STYLE','IMG']);
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if (!n.nodeValue) return NodeFilter.FILTER_REJECT;
      if (n.nodeValue.toLowerCase().indexOf(q) === -1) return NodeFilter.FILTER_REJECT;
      let p = n.parentNode;
      while (p && p !== root){
        if (p.classList && (p.classList.contains('math') || p.classList.contains('katex'))) return NodeFilter.FILTER_REJECT;
        if (skipTags.has(p.tagName)) return NodeFilter.FILTER_REJECT;
        p = p.parentNode;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  let t; while (t = walker.nextNode()) nodes.push(t);
  nodes.forEach(n => {
    const text = n.nodeValue, low = text.toLowerCase();
    const frag = document.createDocumentFragment();
    let last = 0, idx;
    while ((idx = low.indexOf(q, last)) !== -1){
      if (idx > last) frag.appendChild(document.createTextNode(text.slice(last, idx)));
      const m = document.createElement('mark');
      m.className = 'hl';
      m.textContent = text.slice(idx, idx + q.length);
      frag.appendChild(m);
      last = idx + q.length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });
}

/* ---------- 灯箱 ---------- */
function openLightbox(list, i){
  lbList = list; lbIdx = i; lbScale = 1; lbRot = 0; lbTx = 0; lbTy = 0; updateLightbox();
  document.getElementById('lightbox').classList.add('open');
}
function applyTransform(){ document.getElementById('lbImg').style.transform = `translate(${lbTx}px,${lbTy}px) rotate(${lbRot}deg) scale(${lbScale})`; }
function updateLightbox(){
  const u = lbList[lbIdx];
  document.getElementById('lbImg').src = u;
  document.getElementById('lbInfo').textContent = (lbIdx + 1) + ' / ' + lbList.length + '　滚轮缩放 · 拖动平移';
  document.getElementById('lbOrig').href = u;
  document.getElementById('lbDl').onclick = () => { const a = document.createElement('a'); a.href = u; a.download = u.split('/').pop(); document.body.appendChild(a); a.click(); a.remove(); };
  applyTransform();
}
const lbBox = document.getElementById('lightbox');
document.getElementById('lbClose').onclick = () => lbBox.classList.remove('open');
document.getElementById('lbPrev').onclick = e => { e.stopPropagation(); lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; lbScale = 1; lbRot = 0; lbTx = 0; lbTy = 0; updateLightbox(); };
document.getElementById('lbNext').onclick = e => { e.stopPropagation(); lbIdx = (lbIdx + 1) % lbList.length; lbScale = 1; lbRot = 0; lbTx = 0; lbTy = 0; updateLightbox(); };
document.getElementById('lbZoomIn').onclick = () => { lbScale *= 1.25; applyTransform(); };
document.getElementById('lbZoomOut').onclick = () => { lbScale /= 1.25; applyTransform(); };
document.getElementById('lbReset').onclick = () => { lbScale = 1; lbRot = 0; lbTx = 0; lbTy = 0; applyTransform(); };
document.getElementById('lbRotL').onclick = () => { lbRot -= 90; applyTransform(); };
document.getElementById('lbRotR').onclick = () => { lbRot += 90; applyTransform(); };
const lbStage = document.getElementById('lbStage');
lbStage.addEventListener('wheel', e => { e.preventDefault(); lbScale *= (e.deltaY < 0 ? 1.15 : 1 / 1.15); lbScale = Math.min(8, Math.max(0.1, lbScale)); applyTransform(); }, { passive: false });
let dragging = false, sx = 0, sy = 0;
lbStage.addEventListener('mousedown', e => { if (e.target.tagName === 'IMG') { dragging = true; sx = e.clientX - lbTx; sy = e.clientY - lbTy; lbStage.classList.add('grabbing'); } });
window.addEventListener('mousemove', e => { if (dragging) { lbTx = e.clientX - sx; lbTy = e.clientY - sy; applyTransform(); } });
window.addEventListener('mouseup', () => { dragging = false; lbStage.classList.remove('grabbing'); });
lbBox.addEventListener('click', e => { if (e.target.id === 'lightbox') lbBox.classList.remove('open'); });
document.addEventListener('keydown', e => {
  if (!lbBox.classList.contains('open')) return;
  if (e.key === 'Escape') lbBox.classList.remove('open');
  if (e.key === 'ArrowLeft') { lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; lbScale = 1; lbRot = 0; lbTx = 0; lbTy = 0; updateLightbox(); }
  if (e.key === 'ArrowRight') { lbIdx = (lbIdx + 1) % lbList.length; lbScale = 1; lbRot = 0; lbTx = 0; lbTy = 0; updateLightbox(); }
  if (e.key === '+' || e.key === '=') { lbScale *= 1.25; applyTransform(); }
  if (e.key === '-') { lbScale /= 1.25; applyTransform(); }
  if (e.key === '0') { lbScale = 1; lbRot = 0; lbTx = 0; lbTy = 0; applyTransform(); }
});

/* ---------- 收藏 / 已阅 ---------- */
function toggleFav(id){
  const i = favIds.indexOf(id);
  if (i >= 0) favIds.splice(i, 1); else favIds.push(id);
  setLS(LS_FAV, favIds);
  if (favOnly) render(); else updateCardButtons();
}
function markSeen(id){
  if (!seenIds.includes(id)) seenIds.push(id);
  setLS(LS_SEEN, seenIds);
  render();
}
function updateCardButtons(){
  document.querySelectorAll('.c-card').forEach(card => {
    const id = card.dataset.id;
    const btn = card.querySelector('.c-btn');
    if (btn) { const on = favIds.includes(id); btn.classList.toggle('faved', on); btn.textContent = on ? '★ 已收藏' : '☆ 收藏'; }
  });
  document.getElementById('favCount').textContent = favIds.length;
}
document.getElementById('favBtn').onclick = () => { favOnly = !favOnly; page = 1; render(); };
document.getElementById('seenBtn').onclick = () => openSeenModal();

function openSeenModal(){
  const body = document.getElementById('modalBody');
  document.getElementById('modalTitle').textContent = '已阅历史（' + seenIds.length + '）';
  body.innerHTML = '';
  if (!seenIds.length) {
    body.innerHTML = '<div class="modal-empty">还没有标记已阅的题目。</div>';
  } else {
    const byId = {};
    DATA.episodes.forEach(e => e.comments.forEach(c => byId[c.id] = { ep: e.title, c }));
    seenIds.forEach(id => {
      const o = byId[id];
      const it = document.createElement('div');
      it.className = 'seen-item';
      const t = document.createElement('div');
      t.className = 't';
      t.textContent = o ? o.c.uname + '：' + o.c.raw_message.slice(0, 60) : id;
      it.appendChild(t);
      const ep = document.createElement('span');
      ep.className = 'ep';
      ep.textContent = o ? o.ep : '';
      it.appendChild(ep);
      const btn = document.createElement('button');
      btn.textContent = '恢复显示';
      btn.onclick = () => { seenIds = seenIds.filter(x => x !== id); setLS(LS_SEEN, seenIds); openSeenModal(); render(); };
      it.appendChild(btn);
      body.appendChild(it);
    });
  }
  document.getElementById('modalMask').classList.add('open');
}
document.getElementById('modalClose').onclick = () => document.getElementById('modalMask').classList.remove('open');
document.getElementById('modalMask').addEventListener('click', e => { if (e.target.id === 'modalMask') document.getElementById('modalMask').classList.remove('open'); });

/* ---------- 顶栏 / 侧栏交互 ---------- */
document.getElementById('sbToggle').onclick = () => document.body.classList.toggle('sb-collapsed');
document.getElementById('search').addEventListener('input', () => { page = 1; render(); });
document.getElementById('scopeSel').onchange = (e) => { scopeMode = e.target.value; page = 1; render(); };
document.getElementById('colorSwitch').onclick = function(){ colorOn = !colorOn; this.classList.toggle('on', colorOn); document.getElementById('legend').classList.toggle('show', colorOn); render(); };

function selectAllEps(){ selEps = new Set(DATA.episodes.map(e => e.key)); page = 1; buildSidebar(); render(); }
function selectNoneEps(){ selEps = new Set(); page = 1; buildSidebar(); render(); }
function selectAllMods(){ selMods = new Set(DATA.modules.filter(m => ALL.some(o => o.c.module === m.key)).map(m => m.key)); page = 1; buildSidebar(); render(); }
function selectNoneMods(){ selMods = new Set(); page = 1; buildSidebar(); render(); }
document.getElementById('epAll').onclick = selectAllEps;
document.getElementById('epNone').onclick = selectNoneEps;
document.getElementById('modAll').onclick = selectAllMods;
document.getElementById('modNone').onclick = selectNoneMods;
document.getElementById('resetFilter').onclick = () => { selEps = new Set(); selMods = new Set(); scopeMode = 'filter'; favOnly = false; page = 1; document.getElementById('search').value = ''; buildSidebar(); render(); };

/* ---------- 过滤说明 ---------- */
(function buildReport(){
  const ul = document.getElementById('reportList');
  const removedTotal = DATA.episodes.reduce((s, e) => s + e.removed.length, 0);
  const ghostTotal = DATA.episodes.reduce((s, e) => s + e.ghost_merged, 0);
  document.getElementById('reportSummary').textContent = `过滤说明（共移除 ${removedTotal} 条占楼/闲聊/归档排除项；${ghostTotal} 条"纯回复"条目已并入所属主题）`;
  const li = document.createElement('li');
  li.innerHTML = '<span class="why">移除内容：</span>' + DATA.episodes.map(e => {
    const lines = e.removed.slice(0, 6).map(r => `${r[0]}「${r[1]}」`).join('、');
    const more = e.removed.length > 6 ? ` 等共 ${e.removed.length} 条` : '';
    return `${e.title}：${lines}${more}`;
  }).join('；');
  ul.appendChild(li);
  const li2 = document.createElement('li');
  li2.innerHTML = '<span class="why">分类说明：</span>全部 ' + DATA.episodes.length + ' 期的 ' + DATA.total_q + ' 条问题均已逐条人工通读分类（含回复上下文），仅个别内容完全在题图中的归入"其他·待定"。';
  ul.appendChild(li2);
  const li3 = document.createElement('li');
  li3.innerHTML = '<span class="why">结构说明：</span>题图与头像已本地化到 _imgs/ 文件夹（B 站防盗链，浏览器直链无法显示），公式由 KaTeX 本地渲染；请保持 HTML 与 _imgs/、assets/ 目录完整。';
  ul.appendChild(li3);
})();

buildAll();
